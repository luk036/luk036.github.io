name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Build and verify generated files are up to date
        run: |
          npm run build
          git diff --exit-code

      - name: Check links
        run: npm run check-links

  external-links:
    runs-on: ubuntu-latest
    # External sites can be flaky or slow; keep this non-blocking until the
    # backlog is clean, then remove continue-on-error.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress --exclude-path node_modules './**/*.html' './**/*.md'
          fail: true
