### 📏 What We Measure — and Why `niter` Is the Truth

These solvers cost $O(\texttt{niter} \times n^2)$. So the *only* number that matters is the iteration count. 📐

$$ T_{\text{total}} \;=\; \underbrace{\texttt{niter}}_{\text{deterministic}} \;\times\; \underbrace{O(n^2)}_{\text{per-iteration}} \;+\; \underbrace{\text{startup}}_{\text{noise}} $$

**The protocol** 🧪
- Report **iteration counts first** — deterministic, machine-independent ✅
- Take **min of 3** for wall time; never trust a single run 🔁
- Use the **same generated polynomial** across languages so the *shape* of the failure is comparable 🌍

**Why this matters here:** 🔍

A change that pushes `niter` from 7 to 2000 is a **285× regression** that a wall-clock-only benchmark can hide behind a fast machine. 🫥

> Wall time tells you *something* changed. `niter` tells you **what**. ✅

## 🐛 Part 2 — An Unreachable Tolerance

---

### 😳 2000 Iterations, and the Roots Were Already Correct

The degree-16 case ran to `max_iters` and reported **failure** — but its roots were accurate to $4.7 \times 10^{-14}$. 🤨

.pull-left[
.font-sm[
| degree | $\max_k \lvert a_k \rvert$ | niter | converged | relative residual |
|:-------|---------------------------:|--------:|:---------:|------------------:|
| 8 | $1.7 \times 10^{2}$ | 7 | ✅ | $3.6 \times 10^{-15}$ |
| 16 | $1.7 \times 10^{4}$ | **2000** | ❌ | **$4.7 \times 10^{-14}$** |
| 32 | $1.9 \times 10^{10}$ | **2000** | ❌ | $2.0 \times 10^{-10}$ |
]
]
.pull-right[
Read the last column again. At degree 16 the answer is **better than the requested tolerance** — and the solver says `converged = False`. 😵

- At degree 32 the absolute residual plateaus at $3.67$ — a number that means nothing without a scale 📉
- Division by the leading coefficient makes it $2 \times 10^{-10}$ — small, but a different story 📐

> The roots were right. The **stopping rule** was wrong. 🎯
]

---

### 🧮 Why: An Absolute Test on a Scale-Dependent Residual

Both solvers compared an **absolute** residual against a **fixed** `tolerance = 1e-12`:

```python
tol_i = abs(p_eval)                       # Aberth
tol_i = max(abs(vA.x), abs(vA.y))         # Bairstow
if tolerance &lt; options.tolerance: ...     # 1e-12, absolute
```

But the residual is **not** scale-free. For a polynomial with coefficients $a_k$:

$$ R(z) \;=\; \frac{\lvert P(z) \rvert}{\lVert a \rVert_\infty} \quad\text{is meaningful, while}\quad \lvert P(z) \rvert \quad\text{is not} $$

At any root, $\lvert P(z) \rvert$ has a **floating-point floor** proportional to the coefficient magnitudes:

$$ \min_z \lvert P(z) \rvert \;\gtrsim\; \epsilon_{\text{mach}} \cdot \max_k \lvert a_k \rvert \;\approx\; {\color{#bf616a}2.2 \times 10^{-16}} \max_k \lvert a_k \rvert $$

$$ \text{degree 16: } {\color{#bf616a}2.2\times10^{-16}} \times {\color{#5e81ac}1.7\times10^{4}} \;\approx\; {\color{#bf616a}4 \times 10^{-12}} \;>\; {\color{#5e81ac}10^{-12}} $$

> The threshold was **mathematically unreachable**. Not hard — impossible. 💣

### ✅ The Fix: Normalise the Polynomial

Divide the coefficients by a scale factor. **The roots do not move** — only the residual's units change. 🪄

$$ s \;=\; \max\!\Bigl({\color{#5e81ac}1.0},\; \max_k \lvert a_k \rvert\Bigr), \qquad P_{\text{scaled}} \;=\; \frac{P}{s} $$

```python
def residual_scale(coeffs):
    return max(1.0, max(abs(c) for c in coeffs))
```

And the iteration is **scale-equivariant**, so the *trajectory* is untouched:

$$ \text{Aberth:}\quad \frac{P/s}{P'/s} = \frac{P}{P'} \qquad\qquad \text{Bairstow:}\quad \Delta \;=\; \frac{\operatorname{adj}(J)\,{\color{#bf616a}vA}}{\det(J)} \;\longrightarrow\; \frac{(1/s^2)\,\cdot}{(1/s^2)\,\cdot} \;=\; \text{invariant} $$

The Bairstow numerator **and** denominator both scale as $1/s^2$ — the correction $\Delta$ is unchanged. 🎯

> Same path, same roots, same `niter` — but now `tolerance` means something **relative**. ✅

---

### ⚖️ The `max(1.0, ...)` Decision

Why floor the scale at $1.0$? Because the bug only makes the test **too strict**, never too loose. 🧭

| coefficient scale | $s$ | effect on the test |
|:------------------|----:|:-------------------|
| $\max_k \lvert a_k \rvert > 1$ | $\max_k \lvert a_k \rvert$ | **loosens** it — fixes the unreachable case ✅ |
| $\max_k \lvert a_k \rvert \le 1$ | $1.0$ | **unchanged** — historical behaviour preserved 🔒 |

- For a polynomial like the FIR test vector ($\max_k \lvert a_k \rvert = 0.15$), $s = 1$ → **bit-for-bit the same as before** ✅
- No test bound had to be relaxed to accommodate the change 🧪
- Both branches are pinned by doctests: `residual_scale([10, 150, 10]) == 150` and `residual_scale([0.1, 0.2]) == 1.0` 📌

> A fix that only ever *loosens* an impossible test cannot break a passing one. 🔐

## ⚠️ Part 3 — The Python-Specific Trap

---

### 🐌 Threads That Make It Slower

`jacobi_mt_run` submits `n` futures per iteration to a `ThreadPoolExecutor`. The work is pure-Python complex arithmetic that **never releases the GIL**. 🧵

.font-sm[
| degree | aberth | aberth_mt | ratio |
|-------:|---------:|------------:|:------|
| 8 | 1.00 ms | 7.55 ms | **7.5× slower** 🐌 |
| 16 | 876 ms | 2749 ms | **3.1× slower** 🐌 |
| 32 | 3181 ms | 6513 ms | **2.1× slower** 🐌 |
]

And the facade **auto-selected it**:

```python
should_parallelize(num_roots) -&gt; num_roots &gt; PARALLEL_THRESHOLD   # = 4
```

So every realistic input got the slower path **by default**. 🤦

> `should_parallelize` describes how many roots there are. It does not describe whether **threads help**. 🎯

---

### ✅ Fix: `AUTOMATIC` Means Sequential

The C++/Rust siblings keep the auto-dispatch — **real threads really do parallelize there**. Python is different. ⚖️

```python
class SolveMode(Enum):
    AUTOMATIC = "automatic"        # -&gt; sequential: the jobs never release the GIL
    SEQUENTIAL = "sequential"
    MULTI_THREADED = "multi_threaded"   # kept: API parity with ginger-cpp
```

- `AUTOMATIC` and `SEQUENTIAL` now both take the single-threaded path ✅
- `MULTI_THREADED` stays available for callers who supply **GIL-releasing** work 🔓
- `should_parallelize` is unchanged — it is public API and still tested 📌
- `solve_pbairstow_even` / `solve_pbairstow_autocorr` already ignored `mode`; now Aberth agrees 🤝

> The thread pool was never fast. It was just **available**. 🧵

## ⚡ Part 4 — The Constant Factors

---

### 🔥 Fused Horner: One Pass, Not Two

.pull-left[
`aberth_job` evaluated $P$ and $P'$ with **two** `accumulate` calls, each allocating a full intermediate list. 🗑️


```python
def horner_eval_pp(coeffs, z):
    p = dp = 0.0
    for c in coeffs:
        dp = dp * z + p
        p = p * z + c
    return p, dp
```

This computes both values in a **single pass** — no lambda, no intermediate list:

$$ p' \leftarrow p' z + p, \qquad p \leftarrow p z + c_k $$

> Removing a per-element **lambda call** beat every arithmetic trick we tried. 🎯

]
.pull-right[

| | before | after |
|:--|-------:|------:|
| `horner_eval` calls (deg 32) | 128,000 | **64,000** |
| `accumulate` lambda calls | 4,032,000 | **0** ✅ |
| total profiled calls | 4,418,003 | **324,313** · 13.6× fewer 🚀 |
| wall time (deg 32, 2000 iters) | 3181 ms | 2263 ms · 1.46× |

]

```

## 📐 Part 5 — `leja_order`

---

### 🐛 A Comment That Lied

`leja_order` is used by `poly_from_roots` for numerical stability. Its comment claimed:

```python
# Greedy Leja ordering (O(n^2)):
#   start with the smallest-magnitude point
#   each subsequent point maximizes the MIN distance to ALL selected points
```

The **second** line is the problem. "MIN distance to ALL selected" is inside a `for`: 🌀

$$ \underbrace{n}_{\text{outer}} \times \underbrace{n}_{\text{candidates}} \times \underbrace{n}_{\text{selected}} \;=\; {\color{#bf616a}O(n^3)} $$

Measured scaling — a clean factor of **~8× per doubling** ($2^3$): 📉

| $n$ | 50 | 100 | 200 | 400 |
|:----|----:|----:|----:|----:|
| time | 0.34 ms | 2.33 ms | 18.3 ms | 146.8 ms |

> The comment was **wrong**, and it hid the bug for exactly as long as nobody read it. 📝

---

### 🪄 Incremental Minimum Distances

The naive form recomputes $\min_q \lvert p - q \rvert$ from scratch. But it only ever **decreases** — so keep it. 🧠

$$ d_i \;\leftarrow\; \min\Bigl(d_i,\; \lvert p_i - {\color{#5e81ac}\text{chosen}} \rvert\Bigr) \quad\text{after each selection} $$

```rust
let mut dists: Vec&lt;f64&gt; = points.iter().map(|p| (*p - result[0]).norm()).collect();
while !points.is_empty() {
    let chosen = points[best_idx];
    points.remove(best_idx);
    dists.remove(best_idx);
    result.push(chosen);
    for (d, p) in dists.iter_mut().zip(points.iter()) {
        let nd = (*p - chosen).norm();
        if nd &lt; *d { *d = nd; }          // running minimum — the whole trick
    }
}
```

$$ \underbrace{O(n^3)}_{\text{rescan}} \;\longrightarrow\; \underbrace{O(n^2)}_{\text{one update per pair}} \qquad\text{with} \quad \min \text{ exact} \;\Rightarrow\; \text{bit-identical} ✅ $$

> `min` of floating-point values is exact — so the reordering **cannot** change the output. 🔐

---

### ✅ Bit-Identical, and Much Faster

Because the running minimum is computed over exactly the same values, the result is **bit-for-bit** the naive ordering. 🎯

## 🌍 Part 6 — Porting the Fixes

---

### ⚙️ C++: Same Bug — and the Same Allocation Trap

The C++ port had the **identical** absolute-residual defect, in `execution_policy.hpp`: 🐛

```cpp
auto vA = horner(local_coeffs, degree, vri);
const auto tol_i = std::max(std::abs(vA.x()), std::abs(vA.y()));   // absolute!
if (tol_i &lt; options.tol_ind) return 0.0;
```

The fix centralises scaling in the **step constructors**, so all 12 call sites keep working:

```cpp
struct even_bairstow_step {
    std::vector&lt;double&gt; coeffs;          // scaled — makes tolerance relative
    std::size_t degree;
    const Options& options;
    even_bairstow_step(const std::vector&lt;double&gt;& raw, const Options& opts)
        : coeffs(scaled_coeffs(raw)), degree(raw.size() - 1), options(opts) {}
};
```

### 🦀 Rust: `rayon` Changes the Answer

Rust uses **rayon**, not a GIL-bound thread pool — so the Python threading finding **does not transfer**.

.font-sm[

```rust
pub fn aberth_mt(coeffs: &[f64], zs: &mut [Complex&lt;f64&gt;], options: &Options) -&gt; (usize, bool) {
    let scaled = scaled_coeffs(coeffs);          // the bug fix DOES transfer
    let coeffs1 = derivative_coeffs(&scaled);    // also de-duplicates 4 copies
    let step = AberthStep { coeffs: &scaled, coeffs1: &coeffs1 };
    jacobi_mt_run(zs, options, &step)            // ...but this stays
}
```

]

> The same bug, three languages. The same *cause* — but only Python had the threading pathology. 🎯

### 🧠 Lessons

.pull-left[
**Performance** ⚡
- Report **`niter` first** — it is deterministic; wall time is not 📏
- An absolute tolerance on a scale-dependent residual is a **latent bug**, not a tuning knob 💣
- Match the fix to the **runtime**: Python → remove dispatch; C++ → stop allocating; Rust → already fine 🔧
- Measure your own ideas — **3 of 4** "obvious" optimizations were noise 🎯
]
.pull-right[
**Correctness** ✅
- The roots were **already correct** while the solver reported failure 😳
- **Bit-identical** is a feature: it proves you changed the cost, not the math 🔐
- `min` of floats is exact → reordering is provably safe 📐
- A wrong **comment** hid an $O(n^3)$ algorithm in all three codebases 📝

]

**Process** 🔁
- Port the **cause**, not the fix — the GIL finding is Python-only 🧩
- "Same bug in three languages" means the bug is in the **mathematics** 🌍
- Profile the **scaled** quantity — my first reading was off by 4× because I measured a different polynomial 🔬
