## 🧭 Part 1 — The Setup

---

### 🎛️ What Is "Multiplierless"?

A **multiplierless FIR filter** replaces every multiply by **shift + add**, using the
**Canonical Signed Digit (CSD)** representation. 🪄

.mermaid[

<pre>
graph LR
    SPEC["Filter spec\nN, wpass, wstop"]
    OPT["Ellipsoid optimizer\ncutting-plane"]
    SF["Spectral factor\nR(w) → h"]
    CSD["CSD quantize\nh → ±2^k"]
    VER["Verilog\nshift + add"]
    SPEC --> OPT
    OPT -->|"feasible r"| SF
    SF --> CSD
    CSD -->|"residual cut"| OPT
    CSD --> VER
    style SPEC fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style OPT fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style SF fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style CSD fill:#f8bbd0,stroke:#c2185b,stroke-width:3px
    style VER fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
</pre>

]

> The output is an **intermediate step** in an iterative design loop. 🔁

---

### 🧮 The Optimization Problem

Minimize the worst stopband response, subject to passband bounds:

$$ \min_{\gamma} \; \gamma \quad \text{s.t.} \quad
{\color{green} L^2 \le R(\omega) \le U^2},\; \omega \in \Omega_p,
\quad {\color{red} R(\omega) \le \gamma},\; \omega \in \Omega_s $$

where the squared-magnitude response is a cosine series in the autocorrelation $r$:

$$ R(\omega) \;=\; r_0 \;+\; 2\sum_{k=1}^{N-1} r_k \cos(k\omega)
   \;=\; {\color{#1565c0} A(\omega)\, r} $$

> Every ellipsoid iteration asks the oracle: **"is this $r$ feasible? if not, give me a cut."** ✂️

### 🐌 The Offending Loop

```python
def _scan_constraints(rr, count, x, spectrum, check):
    for _ in range(count):              # up to 480 rows
        k = rr.next()
        col_k = spectrum[k]
        v = col_k.dot(x)                # 553 912 calls!
        if cut := check(k, col_k, v):
            return cut
    return None
```

- `assess_feas` calls it **3×** per iteration (passband, stopband, transition)
- Each dot is length $N = 32$ — **pure Python dispatch overhead** dominates
- 4 217 scan calls, **553 912** dot calls total 🐢

---

### 💡 The Insight: Compute Once, Mask Once

Instead of ~400 tiny dots, do **one** matrix–vector product and test bounds with masks:

$$ v = {\color{#1565c0} A}\, x, \qquad
   v_i = \sum_{j} A_{ij} x_j $$

### 🧩 The Vectorized `assess_feas`

```python
def assess_feas(self, x):
    v = self.spectrum @ x                       # one BLAS matvec

    seg = v[:nwpass]                            # passband
    mask = (seg > self.up_sq) | (seg < self.lp_sq)
    k = _first_true_cyclic(mask, _peek(self.idx1, 0, nwpass), 0, nwpass)
    if k >= 0:
        self.idx1._cur = k                      # preserve round-robin cursor
        ...
```

- **Same cut selection**, same cursor state
- `_first_true_cyclic` picks the first violation in **cyclic order** from the cursor 🔄

### 🔄 Preserving Round-Robin Semantics

The round-robin cursor is what stops the ellipsoid from re-adding the same cut. It must survive.

### 🤔 Why? Early Exit Beats a Full Matvec

In C++ the per-row dot is **already compiled** — and the scan **stops at the first violation**.

$$ \underbrace{\textstyle\sum_{\text{scanned}} \|\text{row}\|}_{\text{early exit:} \approx \tfrac{1}{2}m}
   \;<\; \underbrace{\textstyle\sum_{i=1}^{m} \|\text{row}\|}_{\text{full matvec: } m} $$

- Python's win came from killing **interpreter overhead**, not from FLOPs 🐍
- C++ has no interpreter overhead to kill
- Computing every row when half suffice = **2× the work** 🔁

> The lesson: port the *measurement*, not the *conclusion*. 🔬

---

### 🎯 The Real Win: Raw Pointer Access

`mat(row, j)` hides `_data[row*cols + j]`. Exposing pointers lets the compiler vectorize.

```cpp
auto dot_row(const Arr& mat, std::size_t row, const Arr& x) -> double {
    const double* row_data = mat.data() + row * mat.cols();
    const double* x_data = x.data();
    const auto n = x.size();
    double sum = 0.0;
    for (std::size_t j = 0; j < n; ++j) sum += row_data[j] * x_data[j];
    return sum;
}
```

### 🩹 The Temporary Shim

I deduced the type from the function signature — build-system agnostic.

```cpp
template <typename R, typename C1, typename C2, typename C3>
auto options_type(R (*)(C1, C2, C3)) -> std::remove_cvref_t<C3>;

using OptionsT = decltype(options_type(&aberth_autocorr));
```

- ✅ Both CMake and xmake compiled
- ⚠️ But it was a **workaround**, not a fix
- 🎯 The real fix: **release a ginger with `ginger::Options`** and pin it

### 🧠 Key Takeaways

.pull-left[

**Performance** ⚡
- **Profile first** — the bottleneck is rarely where you guess
- Python's win was *interpreter overhead*, not FLOPs
- Port the **measurement**, not the conclusion
- Early exit can beat vectorization in compiled code
- Raw pointers + alias info enable the optimizer 🎯

]
.pull-right[

**Engineering** 🛠️
- A workaround shim is a signal, not a solution
- Version skew across build systems is a real bug class
- Ship the fix, then delete the shim
- Verify **both** build systems, both trees ✅
- Small, honest changes; no force-push 🧯
