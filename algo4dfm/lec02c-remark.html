# Introduction to Convex Programming 🎯

@luk036 👨‍💻 · 2026 📅

---

## Abstract 📝

This lecture introduces convex programming and covers various optimization aspects. It commences with an optimization overview, including linear and nonlinear programming, duality, convexity, and approximation techniques. The lecture then proceeds with specific topics within continuous optimization, such as linear programming problems and their standard form, standard form transformations, and duality. The lecture covers nonlinear programming, examining the standard format of an NLPP (nonlinear programming problem) and the essential optimality requirements referred to as the Karush-Kuhn-Tucker (KKT) conditions. It also delves into the topic of convexity, defining convex functions and their characteristics. Moreover, the lecture covers the duality of convex optimization problems and their value in computation. Finally, the document discusses several optimization techniques, including unconstrained optimization, descent methods, and approximation methods when working with constraints.

### Linear Programming Problem 🧮

-   An LPP in standard form is:
    $$\min\{ {\color{coral}c}^\mathsf{T} {\color{green}x} \mid {\color{coral}A} {\color{green}x} = {\color{coral}b}, {\color{green}x} \ge 0\}.$$
-   The ingredients of LPP are:
  -   An ${\color{coral}m} \times {\color{coral}n}$ matrix ${\color{coral}A}$, with ${\color{coral}n} > {\color{coral}m}$
  -   A vector ${\color{coral}b} \in \mathbb{R}^{{\color{coral}m}}$
  -   A vector ${\color{coral}c} \in \mathbb{R}^{{\color{coral}n}}$

---

### Example 📚

$$\begin{array}{lll}
  \text{minimize} & 0.4 {\color{green}x_1} + 3.4 {\color{green}x_2} - 3.4 {\color{green}x_3} \\
  \text{subject to} & 0.5 {\color{green}x_1} + 0.5 {\color{green}x_2} & = 3.5 \\
  & 0.3 {\color{green}x_1} - 0.8 {\color{green}x_2} + 8.4 {\color{green}x_2} & = 4.5 \\
  & {\color{green}x_1}, {\color{green}x_2}, {\color{green}x_3} \ge 0
\end{array}$$

---

### Transform to Standard Form 🔄

-   **Theorem**: Any LPP can be transformed into the standard form.
-   Variables not restricted in sign:
  -   Decompose ${\color{green}x}$ to two new variables
        ${\color{green}x} = {\color{green}x_1} - {\color{green}x_2}, {\color{green}x_1}, {\color{green}x_2} \geq 0$
-   Transforming inequalities into equalities:
  -   By putting slack variable ${\color{green}y} = {\color{coral}b} - {\color{coral}A} {\color{green}x} \geq 0$
  -   Set ${\color{green}x'} = ({\color{green}x}, {\color{green}y}), {\color{coral}A'} = ({\color{coral}A}, 1)$
-   Transforming a max into a min
  -   max(expression) = min($-$expression);

---

### Linearize the non-linear's 🔄

**Original Problem:**
$$({\color{coral}a} + {\color{coral}b} \cdot {\color{red} y}) {\color{green}x} \leq 0, \; {\color{green}x} > 0$$

**Transformation:**
Let ${\color{green}z} = {\color{red}y} \cdot {\color{green}x}$. The problem becomes:
$${\color{coral}a} \cdot {\color{green}x} + {\color{coral}b} \cdot {\color{green} z} \leq 0, \; {\color{green}x} > 0$$

**Post-proccessing:**
$${\color{red}y_\text{opt}} = {\color{green}z_\text{opt}} {\color{green}x}^{-1}_\text{opt}$$

---

### Logarithmic Transformation 🔢

**Original Problem:**

$${\color{coral}\pi} \leq {\color{red} x / y} \leq {\color{coral}\phi}, \; {\color{red}x} > 0, {\color{red}y} > 0$$

**Transformation:**
Let ${\color{green}z'} = \log({\color{red}z})$. The problem becomes:

$${\color{coral}\pi'} \leq {\color{green} x' - y'} \leq {\color{coral}\phi'}$$

**Post-proccessing:**

$${\color{red}z_\text{opt}} = \exp({\color{green}z'_\text{opt}}).$$

---

### Duality of LPP ⚖️

-   If the primal problem of the LPP:
    $\min\{ {\color{coral}c}^\mathsf{T} {\color{green}x} \mid {\color{coral}A} {\color{green}x} \ge {\color{coral}b}, {\color{green}x} \ge 0\}$.
-   Its dual is:
    $\max\{ {\color{firebrick}y}^\mathsf{T} {\color{coral}b} \mid {\color{coral}A}^\mathsf{T} {\color{firebrick}y} \leq {\color{coral}c}, {\color{firebrick}y} \ge 0\}$.
-   If the primal problem is:
    $\min\{ {\color{coral}c}^\mathsf{T} {\color{green}x} \mid {\color{coral}A} {\color{green}x} = {\color{coral}b}, {\color{green}x} \ge 0\}$.
-   Its dual is:     $\max\{ {\color{firebrick}y}^\mathsf{T} {\color{coral}b} \mid {\color{coral}A}^\mathsf{T} {\color{firebrick}y} \leq {\color{coral}c}\}$.

---

### Nonlinear Programming 📈

-   The standard form of an NLPP is
    $$\min\{{\color{purple}f}({\color{green}x}) \mid {\color{purple}g}({\color{green}x}) \leq 0, {\color{purple}h}({\color{green}x})=0 \}.$$
-   Necessary conditions of optimality, Karush- Kuhn-Tucker (KKT) conditions:
  -   **Gradient Condition**: ∇f(x) + µ∇g(x) + λ∇h(x) = 0
  -   **Complementary Slackness Condition**: µg(x) = 0
  -   **Feasibility Condition**: µ ≥ 0, g(x) ≤ 0, h(x) = 0

---

### What is Convex Optimization? 🏔️

-   Convex optimization is a subfield of mathematical optimization that deals with problems where the objective function and the feasible region are both convex.

-   A function ${\color{purple}f}$: ${\color{steelblue}K} \subseteq \mathbb{R}^{\color{coral}n} \mapsto R$ is convex if ${\color{steelblue}K}$ is a convex set and ${\color{purple}f}({\color{green}y}) \ge {\color{purple}f}({\color{green}x}) + \nabla {\color{purple}f}({\color{green}x}) ({\color{green}y} - {\color{green}x}), \; {\color{green}y},{\color{green}x} \in {\color{steelblue}K}$.

-   A problem is convex if the objective function ${\color{purple}f}({\color{green}x})$ is convex and the feasible set defined by the constraints is a convex set.

-   **Theorem**: Assume that ${\color{purple}f}$ and ${\color{purple}g}$ are convex differentiable functions. If the pair $({\color{green}x}, {\color{firebrick}m})$ satisfies the KKT conditions above, ${\color{green}x}$ is an optimal solution of the problem. If in addition, ${\color{purple}f}$ is strictly convex, ${\color{green}x}$ is the only solution of the problem.

---

### Basic Formulation 📐

A standard convex optimization problem can be formulated as:

$$
\begin{array}{ll}
    \text{minimize} & \quad {\color{purple}f}({\color{green}x}) \\
    \text{subject to} & \quad {\color{purple}g_i}({\color{green}x}) \leq 0, \quad i = 1, \ldots, m \\
        & \quad {\color{green}h_j}({\color{green}x}) = 0, \quad j = 1, \ldots, p
\end{array}
$$

where ${\color{purple}f}({\color{green}x})$ is convex, ${\color{purple}g_i}({\color{green}x})$ are convex inequality constraints, and ${\color{green}h_j}({\color{green}x})$ are affine equality constraints.

---

### What is Quasi-convex Programming? 🔄

-   An extension of convex optimization

-   Deals with quasi-convex functions and sets

-   Bridges the gap between convex and non-convex optimization

---

### Example of Quasi-Convex Functions 📚

-   $\sqrt{|{\color{green}y}|}$ is quasi-convex on $\mathbb{R}$

-   $\log({\color{green}y})$ is quasi-linear on $\mathbb{R}_{++}$

-   ${\color{purple}f}({\color{green}x}, {\color{green}y}) = {\color{green}x} {\color{green}y}$ is quasi-concave on $\mathbb{R}_{++}^2$

-   Linear-fractional function:

  -   ${\color{purple}f}({\color{green}x})$ = $({\color{coral}a}^\mathsf{T} {\color{green}x} + {\color{coral}b})/({\color{coral}c}^\mathsf{T} {\color{green}x} + {\color{coral}d})$

  -   dom ${\color{purple}f}$ = $\{{\color{green}x} \,|\, {\color{coral}c}^\mathsf{T} {\color{green}x} + {\color{coral}d} > 0 \}$

-   Distance ratio function:

  -   ${\color{purple}f}({\color{green}x})$ = $\| {\color{green}x} - {\color{coral}a}\|_2 / \| {\color{green}x} - {\color{coral}b} \|_2$

---

### 0-Sublevel Set 📉

If ${\color{purple}f}$ is quasi-convex, there exists a family of functions ${\color{purple}\Phi}_{\color{coral}\gamma}$ such that:

-   ${\color{purple}\Phi}_{\color{coral}\gamma}({\color{darkblack}x})$ is convex w.r.t. ${\color{darkblack}x}$ for fixed ${\color{coral}\gamma}$ 📈

-   ${\color{purple}\Phi}_{\color{coral}\gamma}({\color{darkblack}x})$ is non-increasing w.r.t. ${\color{coral}\gamma}$ for fixed ${\color{darkblack}z}$

-   ${\color{coral}\gamma}$-sublevel set of ${\color{purple}f}$ is $0$-sublevel set of ${\color{purple}\Phi}_{\color{coral}\gamma}$,

  -   i.e., ${\color{purple}f}({\color{darkblack}x}) \le {\color{coral}\gamma}$ iff ${\color{purple}\Phi}_{\color{coral}\gamma}({\color{darkblack}x}) \le 0$ ↔️

For example:

-   ${\color{purple}f}({\color{darkblack}x}) = {\color{purple}p}({\color{darkblack}x})/{\color{purple}q}({\color{darkblack}x})$ with ${\color{purple}p}$ convex, ${\color{purple}q}$ concave ${\color{purple}p}({\color{darkblack}x}) \ge 0$, ${\color{purple}q}({\color{darkblack}x}) > 0$ on dom ${\color{purple}f}$,

-   can take ${\color{purple}\Phi}_{\color{coral}\gamma}({\color{darkblack}x})$ = ${\color{purple}p}({\color{darkblack}x}) - {\color{coral}\gamma} \cdot {\color{purple}q}({\color{darkblack}x})$

---

### Transform to Feasibility Problem 🔄

Consider a convex feasibility problem:
$$
  \begin{array}{ll}
      \text{find} & {\color{darkblack}x}, \\
      \text{s. t.} & {\color{purple}\Phi}_{\color{coral}\gamma}({\color{darkblack}x}) \le 0, \\
      & {\color{purple}g_i}({\color{darkblack}x}) \leq 0, \quad i = 1, \ldots, m \\
      & {\color{green}h_j}({\color{darkblack}x}) = 0, \quad j = 1, \ldots, p
  \end{array}
$$

-   If feasible, we conclude that ${\color{coral}\gamma} \ge {\color{coral}p^*}$; ✅
-   If infeasible, ${\color{coral}\gamma} < {\color{coral}p^*}$. ❌

Binary search on ${\color{coral}\gamma}$ can be used for obtaining ${\color{coral}p^*}$. 🔍

## Convexify the Non-convex's 🔄

---

### Example: Convexifying a Simple Non-Convex Function 📚

Consider the non-convex function:
$${\color{purple}f}({\color{green}x}) = {\color{green}x}^4 - 4{\color{green}x}^2 + 4$$

**Transformation:**
Let ${\color{green}y} = {\color{green}x}^2$. The problem becomes:
$${\color{purple}f}({\color{green}y}) = {\color{green}y}^2 - 4{\color{green}y} + 4, \; {\color{green}y} \geq 0$$

**Post-proccessing:**
$${\color{red}x_\text{opt}} = \pm\sqrt{{\color{green}y_\text{opt}} }$$

---

### Change of curvature: square 🔄

**Original Problem:**
$${\color{red} x^2 } + {\color{red} y^2 } \geq 0.16 \quad \text{(non-convex)}$$

**Transformation:**
Let ${\color{green}x'} = {\color{red}x}^2$, ${\color{green}y'} = {\color{red}y}^2$. The problem becomes:
$${\color{green} x'} + {\color{green} y'} \geq 0.16, \quad {\color{green}x'}, {\color{green}y'} \geq 0$$

**Post-proccessing:**
$${\color{red}x_\text{opt}} = \pm\sqrt{{\color{green}x'_\text{opt}} }, \quad {\color{red}y_\text{opt}} = \pm\sqrt{{\color{green}y'_\text{opt}} }.$$

**Generalization:**

-   Quadratically Constrainted Quadratic Programming (QCQP)

---

### Change of curvature: sine 🔄

**Original Problem:**
$${\color{red} \sin^2{x} } \leq 0.4, \quad 0 \leq {\color{red}x} \leq \pi/2$$

**Transformation:**
$${\color{green} y} \leq 0.4, \quad 0 \leq {\color{green}y} \leq 1$$

**Post-proccessing:**
$${\color{red}x_\text{opt}} = \sin^{-1}(\sqrt{{\color{green}y_\text{opt}} }).$$

👉 Note that $\sin(\cdot)$ are monotonic concave functions in $(0, \pi/2)$.

---

### Change of curvature: square 🔄

**Original Problem:**
$$0.3 \leq {\color{red} \sqrt{x} } \leq 0.4$$

**Transformation:**
$$0.09 \leq {\color{green} x} \leq 0.16 \, .$$

👉 Note that $\sqrt{\cdot}$ are **monotonic** **concave** functions in $(0, +\infty)$.

**Generalization:**

-   Consider $|H({\color{green}\omega})|^2$ (power) instead of $|H({\color{green}\omega})|$ (magnitude).
-   Square root → Spectral factorization

---

### Logarithmic Transformation 🔢

**Original Problem:**

$${\color{red} 1 / x + 1 / y} \leq 1, \; {\color{red}x} > 0, {\color{red}y} > 0$$

**Transformation:**
Let ${\color{green}z'} = \log({\color{red}z})$. The problem becomes:

$${\color{green} \log(\exp(-x') + \exp(-y'))} \leq 0$$

**Post-proccessing:**

$${\color{red}z_\text{opt}} = \exp({\color{green}z'_\text{opt}}).$$

**Generalization:**

-   Geometric programming

---

### Reciprocal Transformation 🔄

**Original Problem:**
$${\color{red} \log(x)} + 0.4 \leq 0, \; {\color{red}x} > 0$$

**Transformation:**
Let ${\color{green}y} = 1 / {\color{red}x}$. The problem becomes:
$${\color{green} -\log(y)} + 0.4 \leq 0, \; {\color{green}y} > 0 \, .$$

**Post-proccessing:**
$${\color{red}x_\text{opt}} = {\color{green}y^{-1}_\text{opt}}.$$

👉 Note that $\sqrt{\cdot}$, $\log(\cdot)$, and $(\cdot)^{-1}$ are monotonic functions.

---

### 🧮 Generalize to Matrix Inequalities 📊

**Original Problem:**

$${\color{red} \log(\det X)} + \text{Tr}({\color{red}X}^{-1} {\color{coral}C}) \leq 0.3, \; {\color{red}X} \succ 0$$

**Transformation:**
Let ${\color{green}Y} = {\color{red}X}^{-1}$. The problem becomes:
$${\color{green} -\log(\det Y)} + \text{Tr}({\color{green}Y} \cdot {\color{coral}C}) \leq 0.3, \; {\color{green}Y} \succ 0$$

**Post-proccessing:**
$${\color{red}X_\text{opt}} = {\color{green}Y^{-1}_\text{opt}}.$$

---

### 🔀 Change of variables

**Original Problem:**
$$({\color{coral}a} + {\color{coral}b} \cdot {\color{red} y}) {\color{green}x} \leq 0, \; {\color{green}x} > 0$$

**Transformation:**
Let ${\color{green}z} = {\color{red}y} \cdot {\color{green}x}$. The problem becomes:
$${\color{coral}a} \cdot {\color{green}x} + {\color{coral}b} \cdot {\color{green} z} \leq 0, \; {\color{green}x} > 0$$

**Post-proccessing:**
$${\color{red}y_\text{opt}} = {\color{green}z_\text{opt}} {\color{green}x}^{-1}_\text{opt}$$

---

### 🧮 Generalize to Matrix Inequalities

**Original Problem:**
$$({\color{coral}A} + {\color{coral}B} \cdot {\color{red} Y}) {\color{green}X} + {\color{green}X} ({\color{coral}A} + {\color{coral}B} \cdot {\color{red} Y})^T \prec 0, \; {\color{green}X} \succ 0$$

**Transformation:**
Let ${\color{green}Z} = {\color{red}Y} \cdot {\color{green}X}$. The problem becomes:
$${\color{coral}A} \cdot {\color{green}X} + {\color{green}X} \cdot {\color{coral}A}^T + {\color{coral}B} \cdot {\color{green} Z} + {\color{green} Z}^T \cdot {\color{coral}B}^T \prec 0, \; {\color{green}X} \succ 0$$

**Post-proccessing:**
$${\color{red}Y_\text{opt}} = {\color{green}Z_\text{opt}} {\color{green}X}^{-1}_\text{opt}$$

### 🛠️ Unconstraint Techniques

-   Line search methods
-   Fixed or variable step size

### ⬇️ General Descent Method

1. **Input**: a starting ${\color{green}x} \in$ dom ${\color{purple}f}$ 🏁
2. **Output**: ${\color{green}x^*}$ 🎯
3. **repeat**
    1. Determine a descent direction ${\color{green}p}$. 🔽
    2. Line search. Choose a step size ${\color{coral}\alpha} > 0$. 📏
    3. Update. ${\color{green}x} := {\color{green}x} + {\color{coral}\alpha} \cdot {\color{green}p}$ 🔄
4. **until** a stopping criterion is satisfied. 🛑

---

### Common Descent Directions 🧭

-   Gradient descent: ${\color{green}p} = -\nabla {\color{purple}f}({\color{green}x})^\mathsf{T}$
-   Steepest descent:
  -   ${\color{green}\triangle x_{nsd}}$ =
        argmin$\{\nabla {\color{purple}f}({\color{green}x})^\mathsf{T} {\color{green}v} \mid \|{\color{green}v}\|=1 \}$ 🏔️
  -   ${\color{green}\triangle x}$ = $\|\nabla {\color{purple}f}({\color{green}x})\| {\color{green}\triangle x_{nsd}}$
        (un-normalized) 📏
-   Newton's method:
  -   ${\color{green}p} = -\nabla^2 {\color{purple}f}({\color{green}x})^{-1} \nabla {\color{purple}f}({\color{green}x})$ 🧮
-   Levenberg-Marquardt:
  -   Hybrid of Newton and Gradient Descent 🔀
  -   ${\color{green}p} = -(\nabla^2 {\color{purple}f}({\color{green}x}) + {\color{coral}\lambda} I)^{-1} \nabla {\color{purple}f}({\color{green}x})$ ⚖️
-   Conjugate gradient method:
  -   ${\color{green}p}$ is "orthogonal" to all previous ${\color{green}p}$'s ↔️
-   Stochastic subgradient method:
  -   ${\color{green}p}$ is calculated from a set of sample data (instead of using
        all data) 🎲
-   Network-flow algorithms:
  -   ${\color{green}p}$ is given by a "negative cycle" (or "negative cut")

---

### Common Types of Line Search 🔍

-   Exact line search: ${\color{green}t}$ = argmin$_{{\color{green}t}>0} {\color{purple}f}({\color{green}x} + {\color{green}t}{\color{green}\triangle x})$ 🎯
-   Backtracking line search (with parameters ${\color{coral}\alpha} \in (0,1/2), {\color{coral}\beta} \in (0,1)$) ↩️
  -   starting from ${\color{green}t} = 1$, repeat ${\color{green}t} := {\color{coral}\beta} \cdot {\color{green}t}$ until
        $${\color{purple}f}({\color{green}x} + {\color{green}t}{\color{green}\triangle x}) \le {\color{purple}f}({\color{green}x}) + {\color{coral}\alpha} {\color{green}t} \nabla {\color{purple}f}({\color{green}x})^\mathsf{T} {\color{green}\triangle x}$$
  -   graphical interpretation: backtrack until ${\color{green}t} \leq {\color{green}t_0}$

### ⚖️ Approximation Under Constraints

-   Penalization and barriers
-   Dual method
-   Interior Point method
-   Augmented Lagrangian method

---

### 💡 A Simple Example

-   Consider a convex problem with a linear inequality constraint:

$$
\begin{array}{ll}
  \text{min} & {\color{purple}f}({\color{green}x}) \\
  \text{s. t.} & {\color{coral}s}^\mathsf{T} {\color{green}x} \leq {\color{coral}\gamma} \\
\end{array}
$$

-   Approximation via logarithmic barrier:

$$
\begin{array}{ll}
  \text{min} & {\color{purple}f}({\color{green}x}) + (1/{\color{green}t}) {\color{purple}\phi}({\color{green}x})
\end{array}
$$

-   where ${\color{purple}\phi}({\color{green}x}) = -\log ({\color{coral}\gamma} - {\color{coral}s}^\mathsf{T} {\color{green}x})$
-   Approximation improves as ${\color{green}t} \rightarrow \infty$
-   Here, $\nabla {\color{purple}\phi}({\color{green}x}) = {\color{coral}s} / ({\color{coral}\gamma} - {\color{coral}s}^\mathsf{T} {\color{green}x})$

---

### Barrier Method ⚙️

-   **Input**: a feasible ${\color{green}x}$, ${\color{green}t} := {\color{green}t^{(0)}}$, ${\color{coral}\mu} > 1$, tolerance ${\color{coral}\varepsilon} > 0$ 🏁
-   **Output**: ${\color{green}x^*}$ 🎯
-   **repeat**
    1. Centering step. Compute ${\color{green}x^*}({\color{green}t})$ by minimizing ${\color{green}t}\,{\color{purple}f} + {\color{purple}\phi}$ ⚖️
    2. Update ${\color{green}x} := {\color{green}x^*}({\color{green}t})$. 🔄
    3. Increase ${\color{green}t}$. ${\color{green}t} := {\color{coral}\mu} {\color{green}t}$ 📈
-   **until** $1/{\color{green}t} < {\color{coral}\varepsilon}$. 🛑

👉 Note: Centering is usually done by Newton's method in general. 🧮

### Conclusion 🎯

Convex programming provides a powerful framework for solving a wide range of optimization problems characterized by convex objective functions and convex feasible sets. The fundamental property that every local optimum is a global optimum, coupled with the existence of efficient solution algorithms, makes convex optimization a cornerstone in many scientific and engineering disciplines. This introduction has covered the basics of linear and nonlinear programming, the definition and key characteristics of convex optimization, the concept of quasi-convex programming, various transformation techniques to potentially convert non-convex problems into convex ones, fundamental unconstrained optimization methods, and approaches for handling constraints. The availability of robust software tools and comprehensive resources further enhances the practical utility of convex programming. Understanding these core concepts is essential for anyone seeking to tackle optimization problems in a rigorous and effective manner.
