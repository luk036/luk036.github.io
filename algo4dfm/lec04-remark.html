# ⚙️ Lecture 4: Robust Analog Circuit Sizing Under Process Variations

@luk036

2025-10-22 📅

## Abstract 📝

This lecture focuses on robust sizing of analog circuits under process variations at advanced nodes. Key topics include:

-   Challenges in 20nm analog design (double-patterning, layout effects, FinFET/GAA transistors) 🏗️
-   Designing for robustness against process variations 🛡️
-   Analog circuit sizing problem formulation ⚙️
-   Emerging CAD approaches:
  -   Knowledge-based methods
  -   Optimization-based techniques 📈
-   Robust geometric programming using:
  -   Affine arithmetic ➕
  -   Ellipsoid method 🧮
-   CMOS two-stage op-amp design case study 🔌

## Geometric Programming

---

### 📐 Geometric Programming (GP)

Emerging technique for analog design:

-   Solves robust GP problems using:
  -   Ellipsoid method 🫒
  -   Affine arithmetic ➕
-   Provides mathematical guarantees
-   Enables formal optimization

---

### Circuit Sizing for Op Amp 🏗️

**Methodology**:

1. Geometric Programming formulation
2. Min-max convex programming under PVT variations
3. Ellipsoid Method optimization

---

### Robust Optimization Formulation

-   Consider $$\begin{array}{ll}
        \text{minimize} & \sup_{{\color{coral}q} \in \mathbb{Q} } {\color{purple}f_0}({\color{darkblack}x},{\color{coral}q}), \\
        \text{subject to} & {\color{purple}f_j}({\color{darkblack}x},{\color{coral}q}) \leq 0 \qquad \\
        & \forall {\color{coral}q} \in \mathbb{Q} \; \text{and} \; j = 1,2,\cdots,m, \\
      \end{array}$$ where
  -   ${\color{darkblack}x} \in \mathbb{R}^n$ represents a set of design variables
        (such as ${\color{darkblack}L}$, ${\color{darkblack}W}$),
  -   ${\color{coral}q}$ represents a set of varying parameters (such as ${\color{coral}T_{OX}}$)
  -   ${\color{purple}f_j} \leq 0$ represents the $j$th specification requirement (such
        as phase margin $\geq 60^\circ$).

---

### GP in Standard Form 📜

-   We further assume that ${\color{purple}f_i}({\color{darkblack}x},{\color{coral}q})$'s are convex for all ${\color{coral}q} \in \mathbb{Q}$.
-   Geometric programming is an optimization problem that takes the following standard form:
    $$\begin{array}{lll}
        \text{minimize} & {\color{olive}p_0}({\color{darkblack}y}) & \\
        \text{subject to} & {\color{olive}p_i}({\color{darkblack}y}) \leq 1, & i=1,\ldots,l \\
          & {\color{firebrick}g_j}({\color{darkblack}y}) = 1, & j=1,\ldots,m \\
          & {\color{darkblack}y}_k > 0,& k=1,\ldots,n ,
      \end{array}$$
    where
  -   ${\color{olive}p_i}$'s are posynomial functions and ${\color{firebrick}g_j}$'s are monomial functions.

---

### Posynomial and Monomial Functions

-   A monomial function is simply:
    $${\color{firebrick}g}({\color{darkblack}y}_1,\ldots,{\color{darkblack}y}_n) = {\color{coral}c} {\color{darkblack}y}_1^{ {\color{coral}\alpha}_{1} } {\color{darkblack}y}_2^{ {\color{coral}\alpha}_{2} } \cdots {\color{darkblack}y}_n^{ {\color{coral}\alpha}_{n} }, \quad {\color{darkblack}y}_k > 0.$$
    where
  -   ${\color{coral}c}$ is non-negative and ${\color{coral}\alpha}_{k}\in {\mathbb{R} }$.
-   A posynomial function is a sum of monomial functions:
    $${\color{olive}p}({\color{darkblack}y}_1,\ldots,{\color{darkblack}y}_n) = \sum_{s=1}^{T}{{\color{coral}c_s} {\color{darkblack}y}_1^{ {\color{coral}\alpha}_{1,s} } {\color{darkblack}y}_2^{ {\color{coral}\alpha}_{2,s} } \cdots {\color{darkblack}y}_n^{ {\color{coral}\alpha}_{n,s} } }, \quad {\color{darkblack}y}_k > 0 ,$$
-   A monomial can also be viewed as a special case of posynomial where there is only one term of the sum.

---

### GP in Convex Form

-   Many engineering problems can be formulated as a GP 🤔.
-   On Boyd's website there is a Matlab package "GGPLAB" and an excellent tutorial material 📚.
-   GP can be converted into a convex form by changing the variables ${\color{darkblack}x}_k = \log({\color{darkblack}y}_k)$ and replacing ${\color{olive}p_i}$ with $\log {\color{olive}p_i}$:
    $$\begin{array}{lll}
          \text{minimize} & \log {\color{olive}p_0}(\exp({\color{darkblack}x})) & \\
          \text{subject to} & \log {\color{olive}p_i}(\exp({\color{darkblack}x})) \leq 0, & i=1,\ldots,l \\
          & {\color{coral}a_j}^\mathsf{T} {\color{darkblack}x} + {\color{coral}b_j} = 0, & j=1,\ldots,m
      \end{array}$$
    where
  -   $\exp({\color{darkblack}x}) = (e^{ {\color{darkblack}x}_1}, e^{ {\color{darkblack}x}_2}, \cdots, e^{ {\color{darkblack}x}_n})$
  -   ${\color{coral}a}_j = ({\color{coral}\alpha}_{1,j}, \cdots, {\color{coral}\alpha}_{n,j})$
  -   ${\color{coral}b}_j = \log({\color{coral}c}_j)$

---

### Robust GP 🛠️

.pull-left[

-   GP in the convex form can be solved efficiently by interior-point methods 📈.
-   In robust version, coefficients ${\color{coral}c}_s$ are functions of ${\color{coral}q}$ 🔄.
-   The robust problem is still convex. Moreover, there is an infinite number of constraints 🔁.
-   Alternative approach: Ellipsoid Method 🫒.

] .pull-right[

## Affine Arithmetic

---

### Example: Triangle Area 🔺

-   Points ${\color{coral}p}$, ${\color{coral}q}$, and ${\color{coral}r}$ vary within 3 given rectangular regions
-   **Q**: What are the upper/lower bounds of $\triangle {\color{coral}p}{\color{coral}q}{\color{coral}r}$ area?

![triangle](lec04.files/triangle.svg)

---

### Method 1: Corner-based Approach

-   Calculate areas for all corner combinations
-   **Issues**:
  -   Combinatorial explosion with many variables 🧩
  -   Worst-case may not occur at corners ⚠️
  -   Computationally expensive for high dimensions ⏳

---

### Method 2: Monte Carlo Simulation 🎰

-   Randomly sample points within variation ranges 🎲
-   Calculate area for each sample
-   **Pros**:
  -   More accurate with more samples
-   **Cons**:
  -   Time-consuming ⏱️
  -   No guarantees of finding true bounds

---

## Interval vs. Affine Arithmetic

---

### 🧮 Method 3: Interval Arithmetic (IA)

**Example Calculation**:

-   px = [2, 3], py = [3, 4]
-   qx = [-5, -4], qy = [-6, -5]
-   rx = [6, 7], ry = [-5, -4]

**Area Calculation**:

-   ((qx - px)(ry - py) - (qy - py)(rx - px)) / 2
-   IA result: [33..61] (Actual: [36.5..56.5])

**Limitation**:
Cannot handle variable correlations ❌

---

### Method 4: Affine Arithmetic (AA) ➕

**Advantages**:

-   Handles first-order correlations ✅
-   More accurate than IA (e.g., [35..57] in example) 🎯
-   Faster than Monte Carlo for small variations ⚡

**Implementation**:

-   Public library: `libaffa.a`/YALAA
-   Supports: +, -, *, /, sin(), cos(), pow(), etc.

---

### What is Affine Arithmetic? 📚

**Affine Form**:
  $${\color{darkblack}\hat{x}} = {\color{darkblack}x_0} + {\color{darkblack}x_1} {\color{coral}\epsilon}_1 + \ldots + {\color{darkblack}x_n} {\color{coral}\epsilon}_n$$
where:

-   ${\color{coral}\epsilon}_i \in [-1, 1]$ (noise symbols)
-   ${\color{darkblack}x}_0$: central value
-   ${\color{darkblack}x}_i$: partial deviations

**Example Conversion**:
IA [3..4] → $3.5 + 0.5 {\color{coral}\epsilon}_1$

---

### Geometry of AA 📐

.pull-left70[

-   Affine forms that share noise symbols are dependent:
  -   ${\color{darkblack}\hat{x}} = {\color{darkblack}x_0} + {\color{darkblack}x_1} {\color{coral}\epsilon}_1 + \ldots + {\color{darkblack}x_n} {\color{coral}\epsilon}_n$
  -   ${\color{darkblack}\hat{y}} = {\color{darkblack}y_0} + {\color{darkblack}y_1} {\color{coral}\epsilon}_1 + \ldots + {\color{darkblack}y_m} {\color{coral}\epsilon}_m$
-   The region containing (x, y) is:
  -   ${\color{darkblack}Z} = \{({\color{darkblack}x}, {\color{darkblack}y}) : {\color{coral}\epsilon}_i \in [-1, 1]\}$
  -   This region is a centrally symmetric convex polygon called "zonotope".
]
.pull-right30[

![zonotope](lec04.files/zonotope.svg)

]

---

### Enabling Technologies 💻

**C++ Template Metaprogramming**:

```cpp
template <typename Tp>
Tp area(const Tp& px, const Tp& qx, const Tp& rx,
        const Tp& py, const Tp& qy, const Tp& ry) {
    return ((qx-px)*(ry-py) - (qy-py)*(rx-px)) / 2;
}
```

-   Same code works for both `double` and `AAF` types
-   Enables code reuse with minimal modifications

---

### Open-Loop Gain Example 📈

-   Open-loop gain ${\color{firebrick}A_v}$ can be approximated as a monomial function:

    $${\color{firebrick}A_v} = \frac{2 {\color{coral}C_{ox}} }{({\color{coral}\lambda_n} + {\color{coral}\lambda_p})^2} \sqrt{{\color{coral}\mu_n} {\color{coral}\mu_p} \frac{{\color{darkblack}W_1} {\color{darkblack}W_6}}{{\color{darkblack}L_1} {\color{darkblack}L_6} {\color{firebrick}I_1} {\color{firebrick}I_6} } }$$

    where ${\color{firebrick}I_1}$ and ${\color{firebrick}I_6}$ are monomial functions.

-   Corresponding C++ code fragment:

    ```cpp
    // Open Loop Gain
    monomial<aaf> OLG = 2*COX/square(LAMBDAN+LAMBDAP)*
         sqrt(KP*KN*W[1]/L[1]*W[6]/L[6]/I1/I6);
    ```

### Applications of AA 🛠️

-   Analog Circuit Sizing 🎛️
-   Worst-Case Timing Analysis ⏱️
-   Statistical Static Timing Analysis
-   Parameter Variation Interconnect Modeling [CMU02] 🔌
-   Clock Skew Analysis ⏰
-   Bounded Skew Clock Tree Synthesis 🕰️

---

### Limitations of AA ⚠️

**Functional Limitations**:

-   No iterative methods (no fixed point in AA) 🔄
-   No multiplicative inverse (no LU decomposition) ➗
-   No total ordering (can't sort) 🔢

**Mathematical Limitations**:

-   Only handles linear correlations
-   Poor approximation of `abs(x)` near zero ❌

Fortunately the ellipsoid method is one of the few algorithms that works with AA ✅

---

### Affine Arithmetic

How to find $\sup_{{\color{coral}q} \in {\mathbb{Q} } } {\color{purple}f_j}({\color{darkblack}x},{\color{coral}q})$ efficiently?

-   $\sup_{{\color{coral}q} \in {\mathbb{Q} } } {\color{purple}f_j}({\color{darkblack}x},{\color{coral}q})$ is in general difficult to obtain.
-   Provided that variations are small or nearly linear, we propose using Affine Arithmetic (AA) to solve this problem.
-   Features of AA:
  -   Handle correlation of variations by sharing *noise symbols*.
  -   Enabling technology: template and operator overloading features of C++.
  -   A C++ package "YALAA" is publicly available.

---

### AA for Worst Case Analysis 🔍

-   An uncertain quantity is represented in an affine form (AAF):
    $${\color{coral}\hat{a}} = {\color{darkblack}a_0} + {\color{darkblack}a_1} {\color{coral}\varepsilon}_1 + {\color{darkblack}a_2} {\color{coral}\varepsilon}_2 +
      \cdots + {\color{darkblack}a_k} {\color{coral}\varepsilon}_k = {\color{darkblack}a_0} + \sum_{i=1}^{k} {\color{darkblack}a_i} {\color{coral}\varepsilon}_i,$$
    where
  -   ${\color{coral}\varepsilon}_i \in [-1, 1]$ is called *noise symbol*.
-   Exact results for affine operations (${\color{coral}\hat{a}}+{\color{coral}\hat{b}}$,
    ${\color{coral}\hat{a}}-{\color{coral}\hat{b}}$ and ${\color{coral}\alpha} \cdot {\color{coral}\hat{a}}$)
-   Results of non-affine operations (such as ${\color{coral}\hat{a}} \cdot {\color{coral}\hat{b}}$, ${\color{coral}\hat{a}}/{\color{coral}\hat{b}}$, $\max({\color{coral}\hat{a}}, {\color{coral}\hat{b}}), \log({\color{coral}\hat{a}})$) are *approximated* in an affine form.
-   AA has been applied to a wide range of applications recently when process variations are considered.

---

### AA for Optimization ⚙️

In our robust GP problem:

AA is used in worst-case scenario analysis to determine the maximum and minimum values of a function subject to variations in its inputs.
First, represent every elements in ${\color{coral}q}$ in affine forms.
For each ellipsoid iteration, ${\color{purple}f}({\color{darkblack}x}_c,{\color{coral}q})$ is obtained by *approximating* ${\color{purple}f}({\color{darkblack}x}_c,{\color{coral}\hat{q}})$ in an affine form:

$${\color{purple}\hat{f}} = {\color{darkblack}f_0} + {\color{darkblack}f_1} {\color{coral}\varepsilon}_1 + {\color{darkblack}f_2} {\color{coral}\varepsilon}_2 + \cdots + {\color{darkblack}f_k} {\color{coral}\varepsilon}_k.$$

Then the maximum of $\hat{f}$ is determined by:

$${\color{coral}\varepsilon}_j = \left\{ \begin{array}{ll}
              +1 & \qquad \text{if} \; {\color{purple}f}_j > 0 \\
              -1 & \qquad \text{if} \; {\color{purple}f}_j < 0
            \end{array}
  \right. \quad j=1, \cdots, k.$$

### Conclusions 🎯

-   Fast computation (<1 sec on 3GHz CPU) ⚡
-   Guaranteed worst-case performance 🛡️
-   Robust GP formulation handles variations 📈
-   Ellipsoid method provides reliable solutions 🏗️

---

### Final Comments 💭

-   AA excels for small/near-linear variations ➕
-   Combines well with zonotope geometry 🧩
-   Not universal - incompatible with:
  -   Iterative methods 🔄
  -   Matrix inversions ➗
-   Best combined with other methods (Monte Carlo) 🔄
