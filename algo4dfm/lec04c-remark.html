## 🔺 A Simple Example: Triangle Area Calculation

---

### 📏 A Simple Area Problem

- Points ${\color{coral}p}$, ${\color{coral}q}$, and ${\color{coral}r}$ vary within 3 given rectangular regions
- **Q**: What are the upper/lower bounds of ${\color{salmon}\triangle pqr}$ area?

![triangle](lec04.files/triangle.svg)

---

### 🔳 Method 1: Corner-based Approach

- Calculate areas for all corner combinations
- **Issues**:
  - 🧩 Combinatorial explosion with many variables
  - ⚠️ Worst-case may not occur at corners
  - ⏳ Computationally expensive for high dimensions

---

### 🎰 Method 2: Monte Carlo Simulation

- Randomly sample points within variation ranges
- Calculate area for each sample
- **Pros**:
  - 📊 More accurate with more samples
- **Cons**:
  - ⏱️ Time-consuming
  - No guarantees of finding true bounds

---

---

### 🧮 Method 3: Interval Arithmetic (IA)

**Example Calculation**:
- px = [2, 3], py = [3, 4]
- qx = [-5, -4], qy = [-6, -5]
- rx = [6, 7], ry = [-5, -4]

**Area Calculation**:
- ((qx-px)(ry-py) - (qy-py)(rx-px))/2
- IA result: [33..61] (Actual: [36.5..56.5])

**Limitation**:
❌ Cannot handle variable correlations

---

### ➕ Method 4: Affine Arithmetic (AA)

**Advantages**:
- ✅ Handles first-order correlations
- 🎯 More accurate than IA (e.g., [35..57] in example)
- ⚡ Faster than Monte Carlo for small variations

**Implementation**:
- Public library: `libaffa.a`/YALAA
- Supports: +, -, *, /, sin(), cos(), pow(), etc.

---

### 🔌 Analog Circuit Example

**Unit Gain Bandwidth**:

`GBW = sqrt(A*Kp*Ib*(W2/L2)/(2*pi*Cc)`
where parameters have manufacturing variations

---

### 💻 Enabling Technologies

**C++ Template Metaprogramming**:
```cpp
template <typename Tp>
Tp area(const Tp& px, const Tp& qx, const Tp& rx,
        const Tp& py, const Tp& qy, const Tp& ry) {
    return ((qx-px)*(ry-py) - (qy-py)*(rx-px)) / 2;
}
```
- Same code works for both `double` and `AAF` types
- Enables code reuse with minimal modifications

---

### 🛠️ Applications of AA

- 🎛️ Analog Circuit Sizing
- ⏱️ Worst-Case Timing Analysis
- 📊 Statistical Static Timing Analysis
- 🔌 Parameter Variation Interconnect Modeling [CMU02]
- ⏰ Clock Skew Analysis
- 🕰️ Bounded Skew Clock Tree Synthesis

---

### ⚠️ Limitations of AA

**Functional Limitations**:
- 🔄 No iterative methods (no fixed point in AA)
- ➗ No multiplicative inverse (no LU decomposition)
- 🔢 No total ordering (can't sort)

**Mathematical Limitations**:
- 📉 Only handles linear correlations
- ❌ Poor approximation of `abs(x)` near zero

✅ Fortunately the ellipsoid method is one of the few algorithms that works with AA.
---

### 🏗️ Circuit Sizing for Op Amp

**Methodology**:
1. Geometric Programming formulation
2. Min-max convex programming under PVT variations
3. Ellipsoid Method optimization

## 📚 Affine Arithmetic Theory

---

### 📚 What is Affine Arithmetic?

**Affine Form**:
  $${\color{darkblack}\hat{x}} = {\color{orange}x_0} + {\color{darkblack}x_1} {\color{blue}\epsilon_1} + \ldots + {\color{darkblack}x_n} {\color{blue}\epsilon_n}$$
where:
- ${\color{blue}\epsilon_i} \in [-1, 1]$ (noise symbols)
- ${\color{orange}x_0}$: central value
- ${\color{darkblack}x_i}$: partial deviations

**Example Conversion**:
IA [3..4] → $3.5 + 0.5 {\color{blue}\epsilon_1}$

---

### 📐 Geometry of AA

.pull-left70[

-   Affine forms that share noise symbols are dependent:
    -   ${\color{darkblack}\hat{x}} = {\color{orange}x_0} + {\color{darkblack}x_1} {\color{blue}\epsilon_1} + \ldots + {\color{darkblack}x_n} {\color{blue}\epsilon_n}$
    -   ${\color{darkblack}\hat{y}} = {\color{orange}y_0} + {\color{darkblack}y_1} {\color{blue}\epsilon_1} + \ldots + {\color{darkblack}y_m} {\color{blue}\epsilon_m}$
-   The region containing (x, y) is:
    -   ${\color{salmon}Z} = \{({\color{darkblack}x}, {\color{darkblack}y}) : {\color{blue}\epsilon_i} \in [-1, 1]\}$
    -   This region is a centrally symmetric convex polygon called "zonotope".
]
.pull-right30[

![zonotope](lec04.files/zonotope.svg)

]

---

### ➕ Affine Arithmetic

How to find $\sup_{{\color{coral}q} \in {\color{salmon}\mathbb{Q} } } f_j({\color{green}x},{\color{coral}q})$ efficiently?

-   $\sup_{{\color{coral}q} \in {\color{salmon}\mathbb{Q} } } f_j({\color{green}x},{\color{coral}q})$ is in general difficult to obtain.
-   Provided that variations are small or nearly linear, we propose using Affine Arithmetic (AA) to solve this problem.
-   Features of AA:
    -   Handle correlation of variations by sharing *noise symbols*.
    -   Enabling technology: template and operator overloading features of C++.
    -   A C++ package "YALAA" is publicly available.

---

### 🔍 AA for Worst Case Analysis

-   An uncertain quantity is represented in an affine form (AAF):
    $${\color{darkblack}\hat{a}} = {\color{orange}a_0} + {\color{darkblack}a_1} {\color{blue}\varepsilon_1} + {\color{darkblack}a_2} {\color{blue}\varepsilon_2} +
      \cdots +  {\color{darkblack}a_k} {\color{blue}\varepsilon_k} = {\color{orange}a_0} + \sum_{i=1}^{{\color{coral}k} } {\color{darkblack}a_i} {\color{blue}\varepsilon_i},$$
    where
    -   ${\color{blue}\varepsilon_i} \in [-1, 1]$ is called *noise symbol*.
-   Exact results for affine operations (${\color{darkblack}\hat{a}}+{\color{darkblack}\hat{b}}$,
    ${\color{darkblack}\hat{a}}-{\color{darkblack}\hat{b}}$ and ${\color{coral}\alpha} \cdot {\color{darkblack}\hat{a}}$)
-   Results of non-affine operations (such as ${\color{darkblack}\hat{a}} \cdot {\color{darkblack}\hat{b}}$, ${\color{darkblack}\hat{a}}/{\color{darkblack}\hat{b}}$, $\max({\color{darkblack}\hat{a}}, {\color{darkblack}\hat{b}}), \log({\color{darkblack}\hat{a}})$) are *approximated* in an affine form.
-   AA has been applied to a wide range of applications recently when process variations are considered.

---

### ⚙️ AA for Optimization

In our robust GP problem:

AA is used in worst-case scenario analysis to determine the maximum and minimum values of a function subject to variations in its inputs.
First, represent every elements in ${\color{coral}q}$ in affine forms.
For each ellipsoid iteration, $f({\color{green}x_c},{\color{coral}q})$ is obtained by *approximating* $f({\color{green}x_c},{\color{darkblack}\hat{q}})$ in an affine form:

$${\color{darkblack}\hat{f}} = {\color{orange}f_0} + {\color{darkblack}f_1} {\color{blue}\varepsilon_1} + {\color{darkblack}f_2} {\color{blue}\varepsilon_2} + \cdots +  {\color{darkblack}f_k} {\color{blue}\varepsilon_k}.$$

Then the maximum of ${\color{darkblack}\hat{f}}$ is determined by:

$${\color{blue}\varepsilon_j} = \left\{ \begin{array}{ll}
              +1 & \qquad \text{if} \; {\color{darkblack}f_j} > 0 \\
              -1 & \qquad \text{if} \; {\color{darkblack}f_j} < 0
            \end{array}
  \right.   \quad j=1, \cdots, {\color{coral}k}.$$

### 📈 Open-Loop Gain Example

-   Open-loop gain ${\color{coral}A_v}$ can be approximated as a monomial function:

    $${\color{coral}A_v} =  \frac{2 {\color{orange}C_{ox}} }{({\color{orange}\lambda_n} + {\color{orange}\lambda_p})^2} \sqrt{{\color{orange}\mu_n} {\color{orange}\mu_p} \frac{{\color{green}W_1} {\color{green}W_6}}{{\color{green}L_1} {\color{green}L_6} {\color{coral}I_1} {\color{coral}I_6} }$$

    where ${\color{coral}I_1}$ and ${\color{coral}I_6}$ are monomial functions.

-   Corresponding C++ code fragment:

    ```cpp
    // Open Loop Gain
    monomial<aaf> OLG = 2*COX/square(LAMBDAN+LAMBDAP)*
         sqrt(KP*KN*W[1]/L[1]*W[6]/L[6]/I1/I6);
    ```

### 🎯 Conclusions

- ⚡ Fast computation (<1 sec on 3GHz CPU)
- 🛡️ Guaranteed worst-case performance
- 📈 Robust GP formulation handles variations
- 🏗️ Ellipsoid method provides reliable solutions

---

### 💭 Final Comments

- ➕ AA excels for small/near-linear variations
- 🧩 Combines well with zonotope geometry
- ⚠️ Not universal - incompatible with:
  - 🔄 Iterative methods
  - ➗ Matrix inversions
- 🔄 Best combined with other methods (Monte Carlo)
