# 👋 Introduction

---

### 🏛️ Some History of Ellipsoid Method

- Introduced by Shor and Yudin and Nemirovskii in 1976

- Used to show that linear programming (LP) is polynomial-time
    solvable (Kachiyan 1979), settled the long-standing problem of
    determining the theoretically complexity of LP.

- In practice, however, the simplex method runs much faster than the
    method, although its worst-case complexity is exponential.

---

### 👀 Common Perspective of Ellipsoid Method

- It is commonly believed that it is inefficient in practice for
    large-scale problems.

  - The convergent rate is slow, even with the use of deep cuts.

  - Cannot exploit sparsity.

- Since then, it was supplanted by interior-point methods.

- Only treated as a theoretical tool for proving the polynomial-time
    solvability of combinatorial optimization problems.

---

### But...🤔

- The ellipsoid method works very differently compared with the
    interior point method.

- Only require a cutting-plane oracle. Can play nicely with
    other techniques.

- The oracle can exploit sparsity.

---

### Consider Ellipsoid Method When...🤔

- The number of optimization variables is moderate, e.g. ECO flow,
    analog circuit sizing, parametric problems

- The number of constraints is large, or even infinite

- Oracle can be implemented efficiently.

# 🥥 Cutting-plane Method Revisited

---

### Basic Idea 🥚

.pull-left[

- Let $\mathcal{\color{steelblue}K} \subseteq \mathbb{R}^n$ be a convex set.
- Consider the feasibility problem:
  - Find a point ${\color{darkblack}x}^* \in \mathbb{R}^n$ in $\mathcal{\color{steelblue}K}$,
  - or determine that $\mathcal{\color{steelblue}K}$ is empty (i.e., no
        feasible sol'n)

]
.pull-right[

![](lec06.files/region.svg)

]

---

### 🥥 Cutting-plane Oracle

.pull-left70[

- When cutting-plane oracle $\Omega$ is *queried* at ${\color{darkblack}x}_0$, it either
  - asserts that ${\color{darkblack}x_0} \in \mathcal{\color{steelblue}K}$, or
  - returns a separating hyperplane between ${\color{darkblack}x}_0$ and $\mathcal{\color{steelblue}K}$:
        $${\color{darkcyan} g^\mathsf{T} } ({\color{darkblack}x} - {\color{darkblack}x_0}) + {\color{green} h} \leq 0, {\color{green} h} \geq 0, {\color{darkcyan} g} \neq 0, \;
          \forall {\color{darkblack}x} \in \mathcal{\color{steelblue}K}$$

]
.pull-right30[

![](lec06.files/cut.svg)

]


---

### 🥥 Cutting-plane oracle (cont'd)

- $({\color{darkcyan} g},{\color{green} h})$ called a *cutting-plane*, or cut, since it eliminates the
    halfspace $\{{\color{darkblack}x} \mid {\color{darkcyan} g^\mathsf{T} } ({\color{darkblack}x} - {\color{darkblack}x_0}) + {\color{green} h} > 0\}$ from our search.

- If ${\color{green} h}=0$ (${\color{darkblack}x}_0$ is on boundary of halfspace that is cut),
    cutting-plane is called *neutral cut*.

- If ${\color{green} h}>0$ (${\color{darkblack}x}_0$ lies in interior of halfspace that is cut),
    cutting-plane is called *deep cut*.

---

### Subgradient 📉

- $\mathcal{\color{steelblue}K}$ is usually given by a set of inequalities
    ${\color{purple}f}_j({\color{darkblack}x}) \le 0$ or ${\color{purple}f}_j({\color{darkblack}x}) < 0$ for $j = 1 \cdots m$, where ${\color{purple}f}_j({\color{darkblack}x})$
    is a convex function.
- A vector ${\color{darkcyan} g} \equiv \partial {\color{purple}f}({\color{darkblack}x_0})$ is called a subgradient of a
    convex function ${\color{purple}f}$ at ${\color{darkblack}x}_0$ if
    ${\color{purple}f}({\color{darkblack}z}) \geq {\color{purple}f}({\color{darkblack}x_0}) + {\color{darkcyan} g^\mathsf{T} } ({\color{darkblack}z} - {\color{darkblack}x_0})$.
- Hence, the cut $({\color{darkcyan} g},{\color{green} h})$ is given by $(\partial {\color{purple}f}({\color{darkblack}x_0}), {\color{purple}f}({\color{darkblack}x_0}))$

Remarks:

- If ${\color{purple}f}({\color{darkblack}x})$ is differentiable, we can simply take
    $\partial {\color{purple}f}({\color{darkblack}x_0}) = \nabla {\color{purple}f}({\color{darkblack}x_0})$

---

### Key components of Cutting-plane method 🗝️

- Cutting plane oracle $\Omega$
- A search space ${\color{red}\mathcal{S} }$ initially big enough to cover $\mathcal{\color{steelblue}K}$, e.g.
  - Polyhedron ${\color{red}\mathcal{P} }$ = $\{{\color{darkblack}z} \mid {\color{royalblue}C} {\color{darkblack}z} \preceq {\color{royalblue}d} \}$
  - Interval ${\color{red}\mathcal{I} }$ = $[{\color{royalblue}l}, {\color{royalblue}u}]$ (for one-dimensional problem)
  - Ellipsoid ${\color{red}\mathcal{E} }$ = $\{{\color{darkblack}z} \mid ({\color{darkblack}z}-{\color{orange}x_c}){\color{red}P}^{-1}({\color{darkblack}z}-{\color{orange}x_c}) \leq 1 \}$

---

### ⚙️ Generic Cutting-plane method

- **Given** initial ${\color{red}\mathcal{S} }$ known to contain $\mathcal{\color{steelblue}K}$.
- **Repeat**
  1. Choose a point ${\color{darkblack}x}_0$ in ${\color{red}\mathcal{S} }$
  2. Query the cutting-plane oracle at ${\color{darkblack}x}_0$
  3. **If** ${\color{darkblack}x_0} \in \mathcal{\color{steelblue}K}$, quit
4. **Else**, update ${\color{red}\mathcal{S} }$ to a smaller set that covers:
        $${\color{violet}\mathcal{S}^+} = {\color{red}\mathcal{S} } \cap \{{\color{darkblack}z} \mid {\color{darkcyan} g^\mathsf{T} } ({\color{darkblack}z} - {\color{darkblack}x_0}) + {\color{green} h} \leq 0\}$$
5. **If** ${\color{violet}\mathcal{S}^+} = \emptyset$ or it is small enough, quit.

---

### 🐍 Python code

```python
def cutting_plane_fea(assess, S, t, max_it, tol):
    flag = 0
    for iter in range(max_it):
        g, h, t1 = assess(S.xc, t)
        if t != t1: # feasible sol'n obtained
            flag = 1
            break
        status, tau = S.update(g, h)
        if status == 1: break
        if tau < tol:
            status = 2
            break
    return S.xc, iter, flag, status
```

### 🥚 Convex Optimization Problem (I)

$$\begin{array}{ll}
    \text{minimize}     & {\color{purple}f}_0({\color{darkblack}x}), \\
    \text{subject to}   & {\color{darkblack}x} \in \mathcal{\color{steelblue}K}
\end{array}$$

- The optimization problem is treated as a feasibility problem with an
    additional constraint ${\color{purple}f}_0({\color{darkblack}x}) < {\color{royalblue}t}$

- ${\color{purple}f}_0({\color{darkblack}x})$ could be a convex function or a quasiconvex function.

- ${\color{royalblue}t}$ is the best-so-far value of ${\color{purple}f}_0({\color{darkblack}x})$.

---

### 🥚 Convex Optimization Problem (II)

- Problem formulation:
    $$\begin{array}{ll}
              \text{find}         & {\color{darkblack}x}, \\
              \text{subject to}   & {\color{purple}\Phi}_{\color{royalblue}t}({\color{darkblack}x}) < 0 \\
                                  & {\color{darkblack}x} \in \mathcal{\color{steelblue}K}
    \end{array}$$ where ${\color{purple}\Phi}_{\color{royalblue}t}({\color{darkblack}x}) < 0$ is the ${\color{royalblue}t}$-sublevel set of ${\color{purple}f}_0({\color{darkblack}x})$.
- 👉 Note: $\mathcal{\color{steelblue}K}_{\color{royalblue}t} \subseteq \mathcal{\color{steelblue}K}_{\color{royalblue}u}$ if and only if
    ${\color{royalblue}t} \leq {\color{royalblue}u}$ (monotonicity)

---

### 🥚 Convex Optimization Problem (III)

- One easy way to solve the optimization problem is to apply the binary
    search on ${\color{royalblue}t}$.
- Another possible way is, to update the best-so-far ${\color{royalblue}t}$ whenever a
    feasible sol'n ${\color{darkblack}x}_0$ is found such that ${\color{purple}\Phi}_{\color{royalblue}t}({\color{darkblack}x_0}) = 0$.
- We assume that the oracle takes the responsbility for that.

---

### ⚙️ Generic Cutting-plane method (Optim)

- **Given** initial ${\color{red}\mathcal{S} }$ known to contain $\mathcal{\color{steelblue}K}_{\color{royalblue}t}$.
- **Repeat**
  1. Choose a point ${\color{darkblack}x}_0$ in ${\color{red}\mathcal{S} }$
  2. Query the cutting-plane oracle at ${\color{darkblack}x}_0$
  3. **If** ${\color{darkblack}x_0} \in \mathcal{\color{steelblue}K}_{\color{royalblue}t}$, update ${\color{royalblue}t}$ such that
        ${\color{purple}\Phi}_{\color{royalblue}t}({\color{darkblack}x_0}) = 0$.
  4. Update ${\color{red}\mathcal{S} }$ to a smaller set that covers:
        $${\color{violet}\mathcal{S}^+} = {\color{red}\mathcal{S} } \cap \{{\color{darkblack}z} \mid {\color{darkcyan} g^\mathsf{T} } ({\color{darkblack}z} - {\color{darkblack}x_0}) + {\color{green} h} \leq 0\} $$
  5. **If** ${\color{violet}\mathcal{S}^+} = \emptyset$ or it is small enough, quit.

---

### 🐍 Python code (II)

```python
import numpy as np

def cutting_plane_dc(assess, S, t, max_it, tol):
    flag = 0 # no sol'n
    for iter in range(max_it):
        g, h, t1 = assess(S.xc, t)
        if t != t1: # best t obtained
            flag, t = 1, t1
            x_best = np.array(S.xc)
        status, tau = S.update(g, h)
        if status == 1: break
        if tau < tol:
            status = 2
            break
    return x_best, t, iter, flag, status
```

### 📚 Example: Profit Maximization Problem

$$\begin{array}{ll}
   \text{maximize} & {\color{royalblue}p}({\color{royalblue}A} {\color{darkblack}x}_1^{\color{royalblue}\alpha} {\color{darkblack}x}_2^{\color{royalblue}\beta}) - {\color{royalblue}v_1} {\color{darkblack}x}_1 - {\color{royalblue}v_2} {\color{darkblack}x}_2 \\
   \text{subject to}& {\color{darkblack}x}_1 \le {\color{royalblue}k}.
\end{array}$$

- ${\color{royalblue}p}({\color{royalblue}A} {\color{darkblack}x}_1^{\color{royalblue}\alpha} {\color{darkblack}x}_2^{\color{royalblue}\beta})$ : Cobb-Douglas production function
- ${\color{royalblue}p}$: the market price per unit
- ${\color{royalblue}A}$: the scale of production
- ${\color{royalblue}\alpha}, {\color{royalblue}\beta}$: the output elasticities
- ${\color{darkblack}x}$: input quantity
- ${\color{royalblue}v}$: output price
- ${\color{royalblue}k}$: a given constant that restricts the quantity of ${\color{darkblack}x}_1$

---

### 📚 Example: Profit maximization (cont'd)

- The formulation is not in the convex form.
- Rewrite the problem in the following form:
    $$\begin{array}{ll}
    \text{maximize} & {\color{royalblue}t} \\
    \text{subject to} & {\color{royalblue}t}  + {\color{royalblue}v_1} {\color{darkblack}x}_1  + {\color{royalblue}v_2} {\color{darkblack}x}_2 < {\color{royalblue}p} {\color{royalblue}A} {\color{darkblack}x}_1^{\color{royalblue}\alpha} {\color{darkblack}x}_2^{\color{royalblue}\beta}\\
                  & {\color{darkblack}x}_1 \le {\color{royalblue}k}.
    \end{array}$$

---

### 💰 Profit maximization in Convex Form

- Change variables to:

  - ${\color{darkblack}y_1} = \log {\color{darkblack}x}_1$, ${\color{darkblack}y_2} = \log {\color{darkblack}x}_2$.

and take logarithm of cost and constraints.

- We have the problem in a convex form:
    $$\begin{array}{ll}
    \text{max}  & {\color{royalblue}t} \\
    \text{s.t.} & \log({\color{royalblue}t} + {\color{royalblue}v_1} e^{{\color{darkblack}y_1}} + {\color{royalblue}v_2} e^{{\color{darkblack}y_2}}) - ({\color{royalblue}\alpha} {\color{darkblack}y_1} + {\color{royalblue}\beta} {\color{darkblack}y_2}) < \log({\color{royalblue}p}{\color{royalblue}A})  \\
                  & {\color{darkblack}y_1} \le \log {\color{royalblue}k} ,
    \end{array}$$

---

### 🐍 Python code (Profit oracle)

```python
import numpy as np
class: profit_oracle:
    def __init__(self, p, A, alpha, beta, v1, v2, k):...
    def assess_optim(self, y, t):
        fj = y[0] - self.log_k; # constraint
        if fj > 0.0:
            g = np.array([1.0, 0.0])
            return g, fj, t
        log_Cobb = self.log_pA + np.dot(self.a, y)
        x = np.exp(y)
        vx = np.dot(self.v, x)
        te = t + vx
        fj = np.log(te) - log_Cobb
        if fj < 0.0:
            t = np.exp(log_Cobb) - vx
            te = t + vx
            fj = 0.0
        g = (self.v * x)/te - self.a
        return g, fj, t
```

# 🛡️ Robust Convex Optimization

---

### 🛡️ Robust Optimization Formulation

- Consider:
    $$\begin{array}{ll}
      \text{minimize}   & \sup_{{\color{royalblue}q} \in {\mathbb{Q} } } {\color{purple}f_0}({\color{darkblack}x},{\color{royalblue}q}) \\
      \text{subject to} & {\color{purple}f_j}({\color{darkblack}x},{\color{royalblue}q}) \leq 0 \qquad \\
      & \forall {\color{royalblue}q} \in {\mathbb{Q} } \; \text{and} \; j = 1,2,\cdots,m,
    \end{array}$$ where ${\color{royalblue}q}$ represents a set of varying parameters.

- The problem can be reformulated as:
    $$\begin{array}{ll}
      \text{minimize}   & {\color{royalblue}t} \\
      \text{subject to} & {\color{purple}f_0}({\color{darkblack}x},{\color{royalblue}q}) < {\color{royalblue}t}  \\
      & {\color{purple}f_j}({\color{darkblack}x},{\color{royalblue}q}) \leq 0 \\
      & \forall {\color{royalblue}q} \in {\mathbb{Q} } \; \text{and} \; j = 1,2,\cdots,m,
    \end{array}$$

---

### 🔮 Oracle in Robust Optimization Formulation

- The oracle only needs to determine:
    - If ${\color{purple}f_j}({\color{darkblack}x}_0, {\color{royalblue}q}) > 0$ for some $j$ and ${\color{royalblue}q} = {\color{royalblue}q}_0$, then
        - the cut $({\color{darkcyan} g},{\color{green} h})$ = $(\partial {\color{purple}f_j}({\color{darkblack}x}_0, {\color{royalblue}q}_0), {\color{purple}f_j}({\color{darkblack}x}_0, {\color{royalblue}q}_0))$
    - If ${\color{purple}f_0}({\color{darkblack}x}_0, {\color{royalblue}q}) \geq {\color{royalblue}t}$ for some ${\color{royalblue}q} = {\color{royalblue}q}_0$, then
        - the cut $({\color{darkcyan} g},{\color{green} h})$ = $(\partial {\color{purple}f_0}({\color{darkblack}x}_0, {\color{royalblue}q}_0), {\color{purple}f_0}({\color{darkblack}x}_0, {\color{royalblue}q}_0) - {\color{royalblue}t})$
    - Otherwise, ${\color{darkblack}x}_0$ is feasible, then
        - Let ${\color{royalblue}q}_{\max} = \argmax_{{\color{royalblue}q} \in {\mathbb{Q} } } {\color{purple}f_0}({\color{darkblack}x}_0, {\color{royalblue}q})$.
        - ${\color{royalblue}t} := {\color{purple}f_0}({\color{darkblack}x}_0, {\color{royalblue}q}_{\max})$.
        - The cut $({\color{darkcyan} g},{\color{green} h})$ = $(\partial {\color{purple}f_0}({\color{darkblack}x}_0, {\color{royalblue}q}_{\max}), 0)$

---

### 📚 Example: Profit Maximization Problem (convex)

$$\begin{array}{ll}
\text{max}  & {\color{royalblue}t} \\
\text{s.t.} & \log({\color{royalblue}t} + {\color{royalblue}\hat{v}}_1 e^{{\color{darkblack}y}_1} + {\color{royalblue}\hat{v}}_2 e^{{\color{darkblack}y}_2}) - ({\color{royalblue}\hat{\alpha}} {\color{darkblack}y}_1 + {\color{royalblue}\hat{\beta}} {\color{darkblack}y}_2) \le \log({\color{royalblue}\hat{p}}\,{\color{royalblue}A})  \\
                  & {\color{darkblack}y}_1 \le \log {\color{royalblue}\hat{k}} ,
\end{array}$$

- Now assume that:
  - ${\color{royalblue}\hat{\alpha}}$ and ${\color{royalblue}\hat{\beta}}$ vary ${\color{royalblue}\bar{\alpha}} \pm {\color{royalblue}e}_1$ and
        ${\color{royalblue}\bar{\beta}} \pm {\color{royalblue}e}_2$ respectively.
  - ${\color{royalblue}\hat{p}}$, ${\color{royalblue}\hat{k}}$, ${\color{royalblue}\hat{v}}_1$, and ${\color{royalblue}\hat{v}}_2$ all vary
        $\pm {\color{royalblue}e}_3$.

---

### 📚 Example: Profit Maximization Problem (oracle)

By detail analysis, the worst case happens when:

- ${\color{royalblue}p} = {\color{royalblue}\bar{p}} + {\color{royalblue}e}_3$, ${\color{royalblue}k} = {\color{royalblue}\bar{k}} + {\color{royalblue}e}_3$
- ${\color{royalblue}v}_1 = {\color{royalblue}\bar{v}}_1 - {\color{royalblue}e}_3$, ${\color{royalblue}v}_2 = {\color{royalblue}\bar{v}}_2 - {\color{royalblue}e}_3$,
- if ${\color{darkblack}y}_1 > 0$, ${\color{royalblue}\alpha} = {\color{royalblue}\bar{\alpha}} - {\color{royalblue}e}_1$, else
    ${\color{royalblue}\alpha} = {\color{royalblue}\bar{\alpha}} + {\color{royalblue}e}_1$
- if ${\color{darkblack}y}_2 > 0$, ${\color{royalblue}\beta} = {\color{royalblue}\bar{\beta}} - {\color{royalblue}e}_2$, else
    ${\color{royalblue}\beta} = {\color{royalblue}\bar{\beta}} + {\color{royalblue}e}_2$

> **Remark**: for more complicated problems, affine arithmetic could be
> used.

---

### 🐍 Python code (profit_rb_oracle)

```python
class: profit_rb_oracle:
    def __init__(self, p, A, alpha, beta, v1, v2, k, ui, e1, e2, e3):...
    def assess_optim(self, y, t):
        fj = y[0] - self.log_k; # constraint
        if fj > 0.0:
            g = np.array([1.0, 0.0])
            return g, fj, t
        a_rb = np.array(self.a)
        a_rb[0] += self.uie1 * (+1.0 if y[0] <= 0.0 else -1.0)
        a_rb[1] += self.uie2 * (+1.0 if y[1] <= 0.0 else -1.0)
        log_Cobb = self.log_pA + np.dot(a_rb, y)
        x = np.exp(y)
        vx = np.dot(self.v, x)
        te = t + vx
        fj = np.log(te) - log_Cobb
        if fj < 0.0:
            t = np.exp(log_Cobb) - vx
            te = t + vx
            fj = 0.0
        g = (self.v * x)/te - a_rb
        return g, fj, t
```

# Parametric Network Potential Problem

---

### 🌐 Parametric Network Potential Problem

Given a network represented by a graph $G = ({\color{salmon}V}, {\color{lime}E})$. Consider

$$\begin{array}{ll}
    \text{minimize} & {\color{purple}f_0}({\color{darkblack}x}) \\
    \text{subject to} & {\color{darkblack}u_i} - {\color{darkblack}u_j} \le {\color{purple}h}_{ij}({\color{darkblack}x}), \; \forall (i, j) \in {\color{lime}E} ,\\
    \text{variables} &{\color{darkblack}x}, {\color{darkblack}u} ,
   \end{array}$$

- ${\color{purple}h}_{ij}({\color{darkblack}x})$ is the weight function of edge $(i,j)$,

- Assume: network is large but the number of parameters is small.


---

### 🌐 Network Potential Problem (cont'd)

Given ${\color{darkblack}x}_0$, the problem has a feasible solution if and only if $G$
contains no negative cycle. Let ${\color{lime}\mathcal{C} }$ be a set of all cycles of
$G$.

$$\begin{array}{ll}
    \text{minimize} & {\color{purple}f_0}({\color{darkblack}x}) \\
    \text{subject to} & {\color{purple}W}_k({\color{darkblack}x}) \ge 0, \forall {\color{lime}C}_k \in {\color{lime}C} ,\\
       \text{variables} & {\color{darkblack}x}
   \end{array}$$

- ${\color{lime}C}_k$ is a cycle of $G$

- ${\color{purple}W}_k({\color{darkblack}x}) = \sum_{ (i,j)\in {\color{lime}C}_k} {\color{purple}h}_{ij}({\color{darkblack}x})$.


---

### 🔮 Oracle in Network Potential Problem

- The oracle only needs to determine:
    - If there exists a negative cycle ${\color{lime}C}_k$ under ${\color{darkblack}x}_0$, then
        - the cut $({\color{darkcyan} g},{\color{green} h})$ = $(-\partial {\color{purple}W}_k({\color{darkblack}x}_0), -{\color{purple}W}_k({\color{darkblack}x}_0))$
    - If ${\color{purple}f_0}({\color{darkblack}x}_0) \geq {\color{royalblue}t}$, then
        - the cut $({\color{darkcyan} g},{\color{green} h})$ = $(\partial {\color{purple}f_0}({\color{darkblack}x}_0), {\color{purple}f_0}({\color{darkblack}x}_0) - {\color{royalblue}t})$
    - Otherwise, ${\color{darkblack}x}_0$ is feasible, then
        - ${\color{royalblue}t} := {\color{purple}f_0}({\color{darkblack}x}_0)$.
        - The cut $({\color{darkcyan} g},{\color{green} h})$ = $(\partial {\color{purple}f_0}({\color{darkblack}x}_0), 0)$


---

### 📚 Example: Optimal Matrix Scaling

- Given a sparse matrix ${\color{royalblue}A} = [{\color{royalblue}a}_{ij}] \in \mathbb{R}^{N\times N}$.

- Find another matrix ${\color{royalblue}B} = {\color{darkblack}U} {\color{royalblue}A} {\color{darkblack}U}^{-1}$ where ${\color{darkblack}U}$ is a nonnegative
    diagonal matrix, such that the ratio of any two elements of $B$ in
    absolute value is as close to 1 as possible.

- Let ${\color{darkblack}U} = \mathrm{diag}([{\color{darkblack}u}_1, {\color{darkblack}u}_2, \ldots, {\color{darkblack}u}_N])$. Under the
    min-max-ratio criterion, the problem can be formulated as:

$$\begin{array}{ll}
  \text{minimize}   &   {\color{darkblack}\pi}/{\color{darkblack}\psi}  \\
  \text{subject to} &   {\color{darkblack}\psi} \leq {\color{darkblack}u}_i |{\color{royalblue}a}_{ij}| {\color{darkblack}u}_j^{-1} \leq {\color{darkblack}\pi}, \; \forall {\color{royalblue}a}_{ij} \neq 0 , \\
                    &   {\color{darkblack}\pi}, \, {\color{darkblack}\psi}, {\color{darkblack}u}, \text{positive} \\
  \text{variables}  &   {\color{darkblack}\pi}, {\color{darkblack}\psi}, {\color{darkblack}u} \, .
  \end{array}$$

---

### 🔢 Optimal Matrix Scaling (cont'd)

By taking logarithms of variables, the above problem can be transformed
into:

$$\begin{array}{ll}
  \text{minimize}   &   {\color{darkblack}\pi}' - {\color{darkblack}\psi}'  \\
  \text{subject to} &   {\color{darkblack}u}_i' -  {\color{darkblack}u}_j'  \leq {\color{darkblack}\pi}' - {\color{royalblue}a}_{ij}', \; \forall {\color{royalblue}a}_{ij} \neq 0 \,, \\
                    &   {\color{darkblack}u}_j' -  {\color{darkblack}u}_i' \leq {\color{royalblue}a}_{ij}' - {\color{darkblack}\psi}', \; \forall {\color{royalblue}a}_{ij} \neq 0 \,, \\
  \text{variables}  &   {\color{darkblack}\pi}', {\color{darkblack}\psi}', {\color{darkblack}u}' \, .
  \end{array}$$

where ${\color{royalblue}k}'$ denotes $\log( | {\color{royalblue}k} | )$ and
${\color{darkblack}x} = ({\color{darkblack}\pi}', {\color{darkblack}\psi}' )^{ \mathrm{ T } }$.

---

### 📚 Example: clock period & yield-driven co-optimization

$$\begin{array}{cll}
   \text{minimize} &{\color{darkblack}T_\text{CP}} - {\color{royalblue}w_{\beta}}{\color{darkblack}\beta} \\
   \text{subject to} & {\color{darkblack}u_i} - {\color{darkblack}u_j} \le {\color{darkblack}T_\text{CP}} + {\color{purple}F}_{ij}^{-1}(1-{\color{darkblack}\beta}), & \forall (i,j) \in {\color{lime}E}_s \,,\\
                     & {\color{darkblack}u_j} - {\color{darkblack}u_i} \le {\color{purple}F}_{ij}^{-1}(1-{\color{darkblack}\beta}), & \forall (j,i) \in {\color{lime}E}_h \,, \\
                     & {\color{darkblack}T_\text{CP}} \ge 0, \, 0 \le {\color{darkblack}\beta} \le 1 \, , \\
    \text{variables} &{\color{darkblack}T_\text{CP}},{\color{darkblack}\beta}, {\color{darkblack}u}.
   \end{array}$$

- ❗Note that ${\color{purple}F}_{ij}^{-1}({\color{darkblack}x})$ is not concave in general in $[0,1]$.
- Fortunately, we are most likely interested in optimizing circuits
    for high yield rather than the low one in practice.
- Therefore, by imposing an additional constraint to ${\color{darkblack}\beta}$, say
    ${\color{darkblack}\beta} \geq 0.8$, the problem becomes convex.

### 🧮 Problems With Matrix Inequalities

Consider the following problem:

$$\begin{array}{ll}
    \text{minimize}    & {\color{purple}f_0}({\color{darkblack}x}), \\
    \text{subject to}  & {\color{purple}F}({\color{darkblack}x}) \succeq 0,
\end{array}$$

- ${\color{purple}F}({\color{darkblack}x})$: a matrix-valued function
- ${\color{royalblue}A} \succeq 0$ denotes ${\color{royalblue}A}$ is positive semidefinite.


---

### 🧮 Problems With Matrix Inequalities

- Recall that a matrix ${\color{royalblue}A}$ is positive semidefinite if and only if
    ${\color{darkblack}v}^\mathsf{T} {\color{royalblue}A} {\color{darkblack}v} \ge 0$ for all ${\color{darkblack}v} \in \mathbb{R}^n$.
- The problem can be transformed into:
    $$\begin{array}{ll}
            \text{minimize}      & {\color{purple}f_0}({\color{darkblack}x}), \\
            \text{subject to}    & {\color{darkblack}v}^\mathsf{T} {\color{purple}F}({\color{darkblack}x}) {\color{darkblack}v} \ge 0, \; \forall {\color{darkblack}v} \in \mathbb{R}^n
    \end{array}$$
- Consider ${\color{darkblack}v}^\mathsf{T} {\color{purple}F}({\color{darkblack}x}) {\color{darkblack}v}$ is concave for all ${\color{darkblack}v} \in \mathbb{R}^n$ w.r.t.
    ${\color{darkblack}x}$, then the above problem is a convex programming.
- Reduce to *semidefinite programming* if ${\color{purple}f_0}({\color{darkblack}x})$ and ${\color{purple}F}({\color{darkblack}x})$
    are linear, i.e., ${\color{purple}F}({\color{darkblack}x}) = {\color{royalblue}F_0} + {\color{darkblack}x}_1 {\color{royalblue}F_1} + \cdots + {\color{darkblack}x}_m {\color{royalblue}F_m}$


---

### 🔮 Oracle in Matrix Inequalities

The oracle only needs to:

- Perform a *row-based* Cholesky factorization such that
    ${\color{purple}F}({\color{darkblack}x}_0) = {\color{royalblue}R}^\mathsf{T} {\color{royalblue}R}$.
- Let ${\color{royalblue}A}_{:p,:p}$ denotes a submatrix
    ${\color{royalblue}A}(1:p, 1:p) \in \mathbb{R}^{p\times p}$.
- If Cholesky factorization fails at row $p$,
  - there exists a vector
        ${\color{darkblack}e}_p = (0, 0, \cdots, 0, 1)^\mathsf{T} \in \mathbb{R}^p$, such that
    - ${\color{darkblack}v} = {\color{royalblue}R}_{:p,:p}^{-1} {\color{darkblack}e}_p$, and
    - ${\color{darkblack}v}^\mathsf{T} {\color{purple}F}_{:p,:p}({\color{darkblack}x}_0) {\color{darkblack}v} < 0$.
  - The cut $({\color{darkcyan} g},{\color{green} h})$ =
        $(-{\color{darkblack}v}^\mathsf{T} \partial {\color{purple}F}_{:p,:p}({\color{darkblack}x}_0) {\color{darkblack}v}, -{\color{darkblack}v}^\mathsf{T} {\color{purple}F}_{:p,:p}({\color{darkblack}x}_0) {\color{darkblack}v})$


---

### 🐍 Python code

```python
import numpy as np
from chol_ext import *

class lmi_oracle:
    def __init__(F):
        self.F = F

	def chk_mtx(self, A, x):
        n = len(x)
        g = np.zeros(n)
        fj = -1.0
        v = 0.0
        for i in range(n):
            A += self.F[i] * x[i]
        R, p = chol_ext(A)
        if p == 0: return g, fj, R, v
        v = witness(R, p)
        fj = -np.dot(v, A[:p, :p].dot(v))
        for i in range(n):
            g[i] = -np.dot(v, self.F[i][:p, :p].dot(v))
        return g, fj, R, v
```

### 📚 Example: Matrix Norm Minimization

- Let ${\color{purple}A}({\color{darkblack}x}) = {\color{royalblue}A_0} + {\color{darkblack}x}_1 {\color{royalblue}A_1} + \cdots + {\color{darkblack}x}_m {\color{royalblue}A_m}$
- Problem $\min_{{\color{darkblack}x}} \| {\color{purple}A}({\color{darkblack}x}) \|$ can be reformulated as
 $$\begin{array}{ll}
       \text{minimize}      & {\color{royalblue}t}, \\
       \text{subject to}    & \left(
   \begin{array}{cc}
    {\color{royalblue}t}\,I   & {\color{purple}A}({\color{darkblack}x}) \\
    {\color{purple}A}^\mathsf{T}({\color{darkblack}x}) & {\color{royalblue}t}\,I
   \end{array} \right) \succeq 0,
 \end{array}$$
- Binary search on ${\color{royalblue}t}$ can be used for this problem.

### 📚 Example: Estimation of Correlation Function

$$\begin{array}{ll}
   \min_{{\color{darkmagenta}\kappa}, {\color{darkblack}p}}   & \| {\color{red}\Omega}({\color{darkblack}p}) + {\color{darkmagenta}\kappa} I - {\color{red}Y} \| \\
   \text{s. t.} & {\color{red}\Omega}({\color{darkblack}p}) \succcurlyeq 0,  {\color{darkmagenta}\kappa} \geq 0 \; .\\
 \end{array}$$

- Let ${\color{purple}\rho}({\color{brown}h}) = \sum_i^m {\color{darkblack}p}_i {\color{purple}\Psi_i}({\color{brown}h})$, where
  - ${\color{darkblack}p}_i$'s are the unknown coefficients to be fitted
  - ${\color{purple}\Psi_i}$'s are a family of basis functions.
- The covariance matrix ${\color{red}\Omega}({\color{darkblack}p})$ can be recast as:

    $${\color{red}\Omega}({\color{darkblack}p}) = {\color{darkblack}p}_1 {\color{red}F_1} + \cdots + {\color{darkblack}p}_m {\color{red}F_m}$$

    where $\{{\color{red}F_k}\}_{i,j} = {\color{purple}\Psi_k}( \| {\color{darkblack}s_j} - {\color{darkblack}s_i} \|_2)$
