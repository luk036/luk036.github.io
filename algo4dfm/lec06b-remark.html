# 👁️ Ellipsoid Method Revisited

@luk036 👨‍💻 · 2026 📅

---

### 🥚 Basic Ellipsoid Method

- An ellipsoid ${\color{lime}\mathcal{E}}({\color{green}x_c}, {\color{royalblue}P})$ is specified as a set
    $$\{{\color{green}x} \mid ({\color{green}x}-{\color{green}x_c}){\color{royalblue}P}^{-1}({\color{green}x}-{\color{green}x_c}) \leq 1 \},$$ where ${\color{green}x_c}$ is the center of the ellipsoid.

    ![ellipsoid](lec06.files/ellipsoid.svg)

### 🐍 Python code {.allowframebreaks}

```python
import numpy as np

class ell:
    def __init__(self, val, x):
        '''ell = { x | (x - xc)' * P^-1 * (x - xc) <= 1 }'''
        n = len(x)
        if np.isscalar(val):
            self.P = val * np.identity(n)
        else:
            self.P = np.diag(val)
        self.xc = np.array(x)
        self.c1 = float(n*n)/(n*n-1.0)

    def update_core(self, calc_ell, g, beta):...

    def calc_dc(self, g, beta):...
    def calc_ll(self, g, beta):...

### 🔪 Updating the ellipsoid (deep-cut)

- Calculation of minimum volume ellipsoid covering:
    $${\color{lime}\mathcal{E}} \cap \{{\color{firebrick}z} \mid {\color{royalblue}g}^\mathsf{T} ({\color{firebrick}z} - {\color{green}x_c}) + {\color{royalblue}h} \leq 0\}$$
- Let ${\color{royalblue}\tilde{g}} = {\color{royalblue}P}\,{\color{royalblue}g}$, ${\color{royalblue}\tau} = \sqrt{{\color{royalblue}g}^\mathsf{T}{\color{royalblue}\tilde{g}} }$,
    ${\color{royalblue}\alpha} = {\color{royalblue}h}/{\color{royalblue}\tau}$.
- If ${\color{royalblue}\alpha} > 1$, intersection is empty.
- If ${\color{royalblue}\alpha} < -1/{\color{royalblue}n}$ (shallow cut), no smaller ellipsoid can be found.
- Otherwise,
      $$\begin{array}{lll}
     {\color{green}x_c}^+ &=& {\color{green}x_c} - \frac{1+{\color{royalblue}n}{\color{royalblue}\alpha}}{({\color{royalblue}n}+1){\color{royalblue}\tau}} {\color{royalblue}\tilde{g}}  \\
     {\color{royalblue}P}^+ &=& \frac{{\color{royalblue}n}^2(1-{\color{royalblue}\alpha}^2)}{{\color{royalblue}n}^2 - 1}\left({\color{royalblue}P} - \frac{2{\color{royalblue}\rho}}{(1+{\color{royalblue}\alpha}){\color{royalblue}\tau}^2} {\color{royalblue}\tilde{g}}{\color{royalblue}\tilde{g}}^\mathsf{T}\right)
      \end{array}$$

---

### 🐍 Python code (updating)

```python
    def update_core(self, calc_ell, g, beta):
        Pg = self.P.dot(g)
        tsq = g.dot(Pg)
        tau = np.sqrt(tsq)
        alpha = beta/tau
        status, rho, sigma, delta = calc_ell(alpha)
        if status != 0:
            return status, tau
        self.xc -= (rho/tau) * Pg
        self.P -= (sigma/tsq) * np.outer(Pg, Pg)
        self.P *= delta
        return status, tau
```

### 🐍 Python code (deep cut)

```python
    def calc_dc(self, alpha):
        '''deep cut'''
        if alpha == 0.0:
            return self.calc_cc()
        n = len(self.xc)
        status, rho, sigma, delta = 0, 0.0, 0.0, 0.0
        if alpha > 1.:
            status = 1  # no sol'n
        elif n*alpha < -1.:
            status = 3  # no effect
        else:
            rho = (1.0+n*alpha)/(n+1)
            sigma = 2.0*rho/(1.0+alpha)
            delta = self.c1*(1.0-alpha*alpha)
        return status, rho, sigma, delta
```

### ⏸️ Parallel Cuts

- Oracle returns a pair of cuts instead of just one.

- The pair of cuts is given by ${\color{royalblue}g}$ and $({\color{royalblue}h}_1, {\color{royalblue}h}_2)$ such that:
    $$\begin{array}{l}
    {\color{royalblue}g}^\mathsf{T} ({\color{green}x} - {\color{green}x_c}) + {\color{royalblue}h}_1 \leq 0,  \\
    {\color{royalblue}g}^\mathsf{T} ({\color{green}x} - {\color{green}x_c}) + {\color{royalblue}h}_2 \geq 0,
    \end{array}$$ for all ${\color{green}x} \in \mathcal{K}$.

- Only linear inequality constraint can produce such parallel cut:
    $$ {\color{royalblue}l} \leq {\color{royalblue}a}^\mathsf{T} {\color{green}x} + {\color{royalblue}b} \leq {\color{royalblue}u}, \qquad {\color{royalblue}L} \preceq F({\color{green}x}) \preceq {\color{royalblue}U} $$

- Usually provide faster convergence.

### 📐 Updating the ellipsoid

- Let ${\color{royalblue}\tilde{g}} = {\color{royalblue}P}\,{\color{royalblue}g}$, ${\color{royalblue}\tau} = \sqrt{{\color{royalblue}g}^\mathsf{T}{\color{royalblue}\tilde{g}} }$,
    ${\color{royalblue}\alpha}_1 = {\color{royalblue}h}_1/{\color{royalblue}\tau}$, ${\color{royalblue}\alpha}_2 = {\color{royalblue}h}_2/{\color{royalblue}\tau}$.
- If ${\color{royalblue}\alpha}_2 > 1$, it reduces to deep-cut with ${\color{royalblue}\alpha} = {\color{royalblue}\alpha}_1$.
- If ${\color{royalblue}\alpha}_1 > {\color{royalblue}\alpha}_2$, intersection is empty.
- If ${\color{royalblue}\alpha}_1 {\color{royalblue}\alpha}_2 < -1/{\color{royalblue}n}$, no smaller ellipsoid can be found. Otherwise,
    $${\color{green}x_c}^+ = {\color{green}x_c} - \frac{{\color{royalblue}\rho}}{{\color{royalblue}\tau}} {\color{royalblue}\tilde{g}}, \qquad
        {\color{royalblue}P}^+ = {\color{royalblue}\delta}\left({\color{royalblue}P} - \frac{{\color{royalblue}\sigma}}{{\color{royalblue}\tau}^2} {\color{royalblue}\tilde{g}}{\color{royalblue}\tilde{g}}^\mathsf{T}\right)$$

  where
    $$\begin{array}{lll}
      {\color{royalblue}\xi} &=& \sqrt{4(1 - {\color{royalblue}\alpha}_1^2)(1 - {\color{royalblue}\alpha}_2^2) + {\color{royalblue}n}^2({\color{royalblue}\alpha}_2^2 - {\color{royalblue}\alpha}_1^2)^2}, \\
      {\color{royalblue}\sigma} &=& \frac{1}{{\color{royalblue}n}+1}({\color{royalblue}n} + \frac{2}{({\color{royalblue}\alpha}_1 + {\color{royalblue}\alpha}_2)^2}(1 - {\color{royalblue}\alpha}_1{\color{royalblue}\alpha}_2 - \frac{{\color{royalblue}\xi}}{2})), \\
      {\color{royalblue}\rho} &=& \frac{1}{2}({\color{royalblue}\alpha}_1 + {\color{royalblue}\alpha}_2) {\color{royalblue}\sigma} \\
      {\color{royalblue}\delta} &=& \frac{{\color{royalblue}n}^2}{{\color{royalblue}n}^2-1} (1 - \frac{1}{2}({\color{royalblue}\alpha}_1^2 + {\color{royalblue}\alpha}_2^2 - \frac{{\color{royalblue}\xi}}{{\color{royalblue}n}}))
    \end{array}$$

### 🐍 Python code (parallel cut)

```python
    def calc_ll(self, alpha):
        '''parallel or deep cut'''
        if np.isscalar(alpha):
            return self.calc_dc(alpha)
        # parallel cut
        a0, a1 = alpha
        if a1 >= 1.0: return self.calc_dc(a0)
        n = len(self.xc)
        status, rho, sigma, delta = 0, 0.0, 0.0, 0.0
        aprod = a0 * a1
        if a0 > a1:
            status = 1 # no sol'n
        elif n*aprod < -1.0:
            status = 3  # no effect
        else:
            asq = alpha * alpha
            asum = a0 + a1
            asqdiff = asq[1] - asq[0]
            xi = np.sqrt(4.0*(1.0-asq[0])*(1.0-asq[1]) + n*n*asqdiff*asqdiff)
            sigma = (n + (2.0*(1.0 + aprod - xi/2.0)/(asum*asum)))/(n+1)
            rho = asum * sigma/2.0
            delta = self.c1*(1.0 - (asq[0] + asq[1] - xi/n)/2.0)
        return status, rho, sigma, delta
```

### 📚 Example: FIR filter design

![img](lec06.files/fir_strctr.svg)

- The time response is:
    $${\color{firebrick}y}[{\color{royalblue}t}] = \sum_{{\color{royalblue}k}=0}^{{\color{royalblue}n}-1}{{\color{royalblue}h}[{\color{royalblue}k}]{\color{royalblue}u}[{\color{royalblue}t}-{\color{royalblue}k}]}$$

---

### 📚 Example: FIR filter design (cont'd)

- The frequency response:
    $$H({\color{royalblue}\omega}) = \sum_{{\color{royalblue}m}=0}^{{\color{royalblue}n}-1}{{\color{royalblue}h}({\color{royalblue}m})e^{-j{\color{royalblue}m}{\color{royalblue}\omega}} }$$

- The magnitude constraints on frequency domain are expressed as

    $${\color{royalblue}L}({\color{royalblue}\omega}) \leq |H({\color{royalblue}\omega})| \leq {\color{royalblue}U}({\color{royalblue}\omega}), \forall {\color{royalblue}\omega}\in(-\infty,+\infty)$$

    where ${\color{royalblue}L}(\omega)$ and ${\color{royalblue}U}(\omega)$ are the lower and
    upper (nonnegative) bounds at frequency ${\color{royalblue}\omega}$ respectively.

- The constraint is non-convex in general.

---

### 📚 Example: FIR filter design (cont'd)

- However, via *spectral factorization*, it can transform into a convex one:

    $${\color{royalblue}L}^2({\color{royalblue}\omega}) \leq R({\color{royalblue}\omega}) \leq {\color{royalblue}U}^2({\color{royalblue}\omega}), \forall {\color{royalblue}\omega}\in(0,\pi)$$

  where

  - $R({\color{royalblue}\omega})=\sum_{{\color{royalblue}i}=-1+{\color{royalblue}n}}^{{\color{royalblue}n}-1}{{\color{green}r}({\color{royalblue}t})e^{-j{\color{royalblue}\omega}{\color{royalblue}t}} }=|H({\color{royalblue}\omega})|^2$

  - ${\color{green}\mathbf{r}}=({\color{green}r}(-{\color{royalblue}n}+1),{\color{green}r}(-{\color{royalblue}n}+2),...,{\color{green}r}({\color{royalblue}n}-1))$ are the
        autocorrelation coefficients.

---

### 📚 Example: FIR filter design (cont'd)

- ${\color{green}\mathbf{r}}$ can be determined by ${\color{royalblue}\mathbf{h}}$:

    $${\color{green}r}({\color{royalblue}t}) = \sum_{{\color{royalblue}i}=-{\color{royalblue}n}+1}^{{\color{royalblue}n}-1}{{\color{royalblue}h}({\color{royalblue}i}){\color{royalblue}h}({\color{royalblue}i}+{\color{royalblue}t})}, {\color{royalblue}t}\in\mathbf{Z}.$$

    where ${\color{royalblue}h}({\color{royalblue}t})=0$ for ${\color{royalblue}t} < 0$ or ${\color{royalblue}t} > {\color{royalblue}n}-1$.

- The whole problem can be formulated as:

    $$\begin{array}{ll}
        \text{min}  & {\color{royalblue}\gamma} \\
        \text{s.t.} & {\color{royalblue}L}^2({\color{royalblue}\omega}) \leq R({\color{royalblue}\omega}) \leq {\color{royalblue}U}^2({\color{royalblue}\omega}), \; \forall {\color{royalblue}\omega} \in [0,\pi]   \\
                    & R({\color{royalblue}\omega}) > 0, \forall {\color{royalblue}\omega} \in [0,\pi]
    \end{array}$$

---

### 📚 Example: Maximum Likelihood estimation

 $$\begin{array}{ll}
      \min_{{\color{royalblue}\kappa}, {\color{royalblue}p}}   &      \log \det (\Omega({\color{royalblue}p}) + {\color{royalblue}\kappa} I) + \mathrm{Tr}((\Omega({\color{royalblue}p}) + {\color{royalblue}\kappa} I)^{-1}{\color{royalblue}Y}) \\
      \text{s.t.} & \Omega({\color{royalblue}p}) \succeq 0, {\color{royalblue}\kappa} \geq 0 \\
 \end{array}$$

 👉 Note: 1st term is concave, 2nd term is convex

- However, if there is enough samples such that ${\color{royalblue}Y}$ is a positive
    definite matrix, then the function is convex within $[0, 2{\color{royalblue}Y}]$

---

### 📚 Example: Maximum Likelihood estimation (cont'd)

- Therefore, the following problem is convex:
    $$\begin{array}{ll}
      \min_{{\color{royalblue}\kappa}, {\color{royalblue}p}}   &   \log \det V({\color{royalblue}p}) + \mathrm{Tr}(V({\color{royalblue}p})^{-1}{\color{royalblue}Y}) \\
      \text{s.t.} & \Omega({\color{royalblue}p}) + {\color{royalblue}\kappa} I = V({\color{royalblue}p}) \\
                    & 0 \preceq V({\color{royalblue}p}) \preceq 2{\color{royalblue}Y}, {\color{royalblue}\kappa} \geq 0
    \end{array}$$

# Discrete Optimization

---

### 🎯 Why Discrete Convex Programming

- Many engineering problems can be formulated as a convex/geometric
    programming, e.g. digital circuit sizing

- Yet in an ASIC design, often there is only a limited set of choices
    from the cell library. In other words, some design variables
    are discrete.

- The discrete version can be formulated as a Mixed-Integer Convex
    programming (MICP) by mapping the design variables to integers.

---

### ⚠️ What's Wrong w/ Existing Methods?

- Mostly based on relaxation.

- Then use the relaxed solution as a lower bound and use the
    branch–and–bound method for the discrete optimal solution.

  - 👉 Note: the branch-and-bound method does not utilize the convexity
        of the problem.

- What if I can only evaluate constraints on discrete data?
    Workaround: convex fitting?

---

### 🧩 Mixed-Integer Convex Programming

Consider:

$$\begin{array}{ll}
        \text{minimize}      & f_0({\color{green}x}), \\
        \text{subject to}    & f_j({\color{green}x}) \leq 0, \; \forall j=1,2,\ldots \\
                             & {\color{green}x} \in \mathbb{D}
\end{array}$$

where

- $f_0({\color{green}x})$ and $f_j({\color{green}x})$ are "convex"
- Some design variables are discrete.

---

### 🔮 Oracle Requirement

- The oracle looks for the nearby discrete solution ${\color{green}x_d}$ of ${\color{green}x_c}$
    with the cutting-plane:
    $${\color{royalblue}g}^\mathsf{T} ({\color{green}x} - {\color{green}x_d}) + {\color{royalblue}h} \leq 0, {\color{royalblue}h} \geq 0, {\color{royalblue}g} \neq 0$$

- 👉 Note: the cut may be a shallow cut.
- Suggestion: use different cuts as possible for each iteration (e.g.
    round-robin the evaluation of constraints)
