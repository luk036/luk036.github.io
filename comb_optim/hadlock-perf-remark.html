## 🧭 Part 1 — The Setup

### 🪓 Hadlock in 60 Seconds

**Planar MAX-CUT is polynomial** — reduce it to a matching problem on the planar **dual**. 🪄

.mermaid[

<pre>
graph LR
    G["Primal graph\nG = (V, E)"] --> EMB["Planar\nembedding"]
    EMB --> FACES["Faces\n(inner + outer)"]
    FACES --> DUAL["Dual graph\nG*"]
    DUAL --> ODD["Odd faces\n|f| odd → T"]
    ODD --> MWPM["Min-weight perfect\nmatching on T"]
    MWPM --> EXCL["Excluded\nprimal edges"]
    EXCL --> CUT["Max cut\nE \ excluded"]
    style G fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style FACES fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
    style DUAL fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
    style ODD fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style MWPM fill:#f8bbd0,stroke:#c2185b,stroke-width:3px
    style CUT fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>

]

> Everything hinges on **one** step: the minimum-weight perfect matching. 🎯

---

### 🧮 The Reduction, In Colour

A primal edge set is a cut **iff** the dual edges form a $T$-join, where $T$ is the set of **odd faces**:

$$ \text{MAX-CUT}(G) \;=\; \sum_{e \in E} {\color{#1565c0} w_e} \;-\; \min_{J\ \text{a } T\text{-join}} \sum_{e \in J} {\color{#bf616a} w_e} $$

and the $T$-join is a matching on the **metric closure** of $T$:

$$ \min_{M} \sum_{\{u,v\} \in M} {\color{#2e7d32} d^{*}(u,v)}, \qquad
   {\color{#2e7d32} d^{*}(u,v)} = \text{shortest path in } G^{*} $$

- $|T|$ is always **even** (handshaking: $\sum_f |f| = 2|E|$) ✅
- For a triangulation, **almost every face is odd** — so $|T| \approx 2V$ 😳

> Big $|T|$ means a big matching. That is the whole story of this talk. 🧵

---

### 📏 How We Measure

- Instances: **triangular lattices** `tri(m,m)` — every bounded face is a triangle
- Weights: random integers $1 \ldots 10$, seed 42
- Ground truth: the Python `netlistx` reference, plus brute force on tiny cases ✅

.font-sm[

| Instance | V | E | Faces | Odd faces |
|:---------|--:|--:|------:|----------:|
| tri(10,10) | 66 | 165 | 101 | 100 |
| tri(14,14) | 120 | 315 | 197 | 196 |
| tri(18,18) | 190 | 513 | 325 | 324 |

]

> The odd-face count grows like $2V$ — the matching instance is **not** small. 📈

### 🧱 Why the Matcher Is the Wall

networkx `min_weight_matching` is a **pure-Python** blossom:

$$ T_{\text{match}} \;=\; O({\color{#bf616a} k^3}), \qquad {\color{#bf616a} k} = |T| \approx 2V $$

- At $V = 120$: $k = 196$ → the inner loops run in **Python bytecode** 🐢
- It is also sensitive to the **weight distribution**, not just $k$ 🎲
- The graph is **complete**: $k^2/2 \approx 19{,}000$ edges to scan

> This is a *constant-factor* problem, not an algorithmic one — Python is simply the wrong place to run it. 🐍❌

### 📊 Old C++ vs New C++: It Was Also Wrong

While profiling, the old implementation turned out to return **suboptimal cuts**:

.font-sm[

| Instance | V | E | odd | OLD cut | NEW cut | optimum | OLD | NEW | speed-up |
|:---------|--:|--:|----:|--------:|--------:|--------:|----:|----:|---------:|
| tri(10,10) | 66 | 165 | 100 | 680 ❌ | **686** ✅ | 686 | 12.2 ms | **6.9 ms** | 1.8× |
| tri(14,14) | 120 | 315 | 196 | 1282 ❌ | **1290** ✅ | 1290 | 51.0 ms | **29.8 ms** | 1.7× |
| tri(18,18) | 190 | 513 | 324 | 2126 ❌ | **2130** ✅ | 2130 | 156.0 ms | **70.4 ms** | 2.2× |

]

> A "performance investigation" that found a **correctness bug**. 🔍

---

### 🐛 The Bug: Position vs Face ID

The distance table was indexed by **odd-face position**, but the matching weight function read it by **face id**:

```cpp
// OLD — row i holds the distance row of odd_faces[i]
dist_mat[i] = std::move(dist);
// ...but the matcher calls weight(a, b) with a, b = FACE IDS
```

.mermaid[

<pre>
graph LR
    POS["odd_faces = [0..91, 93..100]\nouter face sits at index 92"]
    POS --> SHIFT["faces after 92 are shifted\nby one position ❌"]
    POS --> OOB["dist_mat[100] with size 100\n→ out of bounds 💥"]
    SHIFT --> BAD["corrupted metric\n→ suboptimal cut"]
    OOB --> BAD
    style POS fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style SHIFT fill:#f8bbd0,stroke:#c2185b,stroke-width:3px
    style OOB fill:#f8bbd0,stroke:#c2185b,stroke-width:3px

</pre>

### 🙈 Why Nobody Noticed

The test suite only checked that the cut was **bipartite** — never that it was **optimal**:

.font-sm[

| Check | Old suite | What it missed |
|:------|:----------|:---------------|
| Cut is a subset of E | ✅ | — |
| Cut subgraph is bipartite | ✅ | — |
| Cut weight == optimum | ❌ **absent** | suboptimal answers 🐛 |
| Small hand-coded faces | ✅ | odd faces happened to be first |

]

- The old unit tests put odd faces **first**, so `odd_faces[i] == i` — the bug never fired 🎭
- The real embeddings put the outer face at index **92 / 184 / 308** — not last 🎯

> A validity test is not an optimality test. 🧪

## 🦀 Part 4 — Rust: Prototype → Working

---

### 🧟 The Rust Sibling: `netlistx-rs`

`hadlock.rs` was a **non-functional prototype** with two independent blockers. 🧱🧱

.font-sm[

| Blocker | Symptom |
|:--------|:--------|
| Matcher | bitmask DP with `size = 1 << n` — $O(2^{k})$ 💥 |
| Faces | sorted adjacency treated as an embedding 🎭 |
| Decomposition | "biconnected" was actually connected components 🔀 |
| Lookups | O(E) edge-weight scan per query 🐢 |
| Dijkstra | linear scan, re-run per matched pair 🔁 |

]

> `tsp.rs` in the *same crate* already had a correct blossom. It just wasn't used. 🙃

---

### 💥 Blocker 1: An Exponential Matcher

```rust
// OLD — size = 2^k
let size = 1 &lt;&lt; n;
let mut dp = vec![f64::INFINITY; size];
```

- tri(10,10) has $k = 100$ odd faces → $2^{100}$ states 🤯
- tri(10,10) on the 10×10 grid → $2^{160}$ 🤯🤯
- Usable only below $k \approx 25$ — the tests never went there 🫥

### 🎭 Blocker 2: The Faces Were Never Faces

A probe of the old `find_faces` against Euler's formula $F = E - V + 2$:

.font-sm[

| Graph | F found | F expected | face lengths |
|:------|--------:|-----------:|:-------------|
| triangle | 1 | 2 | `[4]` 😱 |
| square | 1 | 2 | `[5]` 😱 |
| K₄ | 2 | 4 | `[9, 5]` |
| 3×3 grid | 3 | 5 | `[9, 9, 9]` |
| wheel W₄ | 3 | 5 | `[9, 4, 6]` |

]

- The start vertex was pushed **twice** → every face length off by one → **every parity flipped** 🔄
- Dedup by **sorted vertex set** collapsed a triangle's two faces into one 🎭
- Sorted adjacency is not a planar **rotation system** at all 🚫

> A triangle with a "face" of length 4 tells you everything. 🔍

A single triangle is enough to expose the face-extraction bug.

<p align="center"><img src="./outputs/hadlock-face-bug.svg" alt="triangle face bug" /></p>

### 🗺️ The Fix: Real Planarity + Embedding

New `src/planar.rs` — the **Demoucron–Malgrange–Pertuiset** path-addition algorithm:

.mermaid[

<pre>
graph LR
    CYC["Start from a cycle\n→ embedded subgraph H"] --> FRAG["Find fragments\nof G − H"]
    FRAG --> ADM["Admissible faces\n= faces containing\nall attachments"]
    ADM -->|"none"| NONPLAN["NOT PLANAR\nreturn None ❌"]
    ADM -->|"≥1"| PICK["Pick forced fragment\nif unique, else any"]
    PICK --> PATH["Embed a path between\nattachments in that face"]
    PATH --> DONE{"H = G ?"}
    DONE -->|"no"| FRAG
    DONE -->|"yes"| FACES["Return all faces ✅"]
    style CYC fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style FRAG fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
    style ADM fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style NONPLAN fill:#f8bbd0,stroke:#c2185b,stroke-width:3px
    style PATH fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style FACES fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>

]

> Plus: real Tarjan biconnected blocks, O(1) weight map, `BinaryHeap` Dijkstra, no dead code. 🧹

### 🪤 The Subagent Detour (a Cautionary Tale)

I delegated `planar.rs` to a subagent with a spec containing a **contradiction**:

$$ {\color{#2e7d32} F = E - V + C + 1} \qquad \text{vs} \qquad {\color{#bf616a}\text{"two triangles} \Rightarrow 4 \text{ faces"}} $$

- $E - V + C + 1 = 3$, but "4 faces" assumes **per-component** concatenation → $F = E - V + 2C$ 🤔
- The agent spent **5 minutes** reasoning about the conflict and produced **nothing** 🕳️
- I fixed the convention, wrote the module myself — 615 lines, 14 tests, green ✅

> **A contradictory spec is worse than no spec.** Write the invariant down once, unambiguously. 📝

### 🧠 Key Takeaways

**Performance** ⚡
- **Profile first** — the bottleneck was 92% in one call, not where intuition pointed 🔍
- Optimising the other 8% bought **1.1×**; the matcher bought **250×** 📉
- The same algorithm in C++ is a **250×** constant factor — language still matters 🗣️
- An exponential matcher is a **cliff**, not a slope: $2^{160}$ is not "slow", it's impossible 💥

**Correctness** 🐛
- Performance work **exposes bugs** — the old C++ returned suboptimal cuts 🎭
- A **validity** test is not an **optimality** test 🧪
- Prefer a real algorithm (DMP planarity) over a plausible heuristic (sorted adjacency) 🗺️
