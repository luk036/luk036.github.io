<svg width="760" height="400" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" style="background:#fafafa;border:1px solid #d0d0d0;border-radius:6px">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2185b"/>
    </marker>
  </defs>

  <text x="16" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2e3440">Rust find_faces on a triangle: two faces collapse into one, and the parity flips</text>

  <rect x="16" y="44" width="356" height="340" fill="#ffffff" stroke="#a3be8c" stroke-width="2" rx="6"/>
  <text x="32" y="72" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">✅ Correct embedding</text>

  <polygon points="194,110 114,228 274,228" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <circle cx="194" cy="110" r="4" fill="#2e3440"/>
  <circle cx="114" cy="228" r="4" fill="#2e3440"/>
  <circle cx="274" cy="228" r="4" fill="#2e3440"/>
  <text x="194" y="100" text-anchor="middle" font-family="monospace" font-size="13" fill="#2e3440">a</text>
  <text x="100" y="246" text-anchor="middle" font-family="monospace" font-size="13" fill="#2e3440">b</text>
  <text x="288" y="246" text-anchor="middle" font-family="monospace" font-size="13" fill="#2e3440">c</text>

  <text x="32" y="272" font-family="sans-serif" font-size="13" fill="#2e3440">inner walk = [a, b, c]</text>
  <text x="356" y="272" text-anchor="end" font-family="monospace" font-size="13" font-weight="bold" fill="#2e7d32">len 3 · ODD</text>
  <text x="32" y="296" font-family="sans-serif" font-size="13" fill="#2e3440">outer walk = [a, c, b]</text>
  <text x="356" y="296" text-anchor="end" font-family="monospace" font-size="13" font-weight="bold" fill="#2e7d32">len 3 · ODD</text>

  <line x1="32" y1="312" x2="356" y2="312" stroke="#d0d0d0" stroke-width="1"/>
  <text x="32" y="336" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1565c0">2 faces, both odd → 2 terminals</text>
  <text x="32" y="360" font-family="sans-serif" font-size="13" fill="#2e3440">→ the matcher excludes the lightest edge ✅</text>

  <rect x="388" y="44" width="356" height="340" fill="#ffffff" stroke="#bf616a" stroke-width="2" rx="6"/>
  <text x="404" y="72" font-family="sans-serif" font-size="15" font-weight="bold" fill="#bf616a">❌ Old find_faces</text>

  <polygon points="566,110 486,228 646,228" fill="#fce4ec" stroke="#f4c2d0" stroke-width="1.5"/>
  <line x1="566" y1="110" x2="646" y2="228" stroke="#c2185b" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="646" y1="228" x2="486" y2="228" stroke="#c2185b" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="486" y1="228" x2="566" y2="110" stroke="#c2185b" stroke-width="2.5" marker-end="url(#arw)"/>

  <circle cx="566" cy="110" r="4" fill="#2e3440"/>
  <circle cx="486" cy="228" r="4" fill="#2e3440"/>
  <circle cx="646" cy="228" r="4" fill="#2e3440"/>
  <text x="566" y="100" text-anchor="middle" font-family="monospace" font-size="13" fill="#2e3440">a</text>
  <text x="472" y="246" text-anchor="middle" font-family="monospace" font-size="13" fill="#2e3440">b</text>
  <text x="660" y="246" text-anchor="middle" font-family="monospace" font-size="13" fill="#2e3440">c</text>

  <text x="404" y="272" font-family="sans-serif" font-size="13" fill="#2e3440">walk = a → c → b → a</text>
  <text x="404" y="294" font-family="sans-serif" font-size="13" fill="#2e3440">start vertex pushed twice</text>
  <text x="404" y="316" font-family="monospace" font-size="13" font-weight="bold" fill="#bf616a">recorded length 4 → parity ODD → EVEN</text>

  <line x1="404" y1="332" x2="728" y2="332" stroke="#d0d0d0" stroke-width="1"/>
  <text x="404" y="354" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bf616a">dedup by sorted vertex set → 1 face</text>
  <text x="404" y="376" font-family="sans-serif" font-size="13" fill="#2e3440">→ "bipartite" → returns all edges → invalid cut ❌</text>
</svg>
