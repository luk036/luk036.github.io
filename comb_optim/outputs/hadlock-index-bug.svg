<svg width="760" height="400" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" style="background:#fafafa;border:1px solid #d0d0d0;border-radius:6px">
  <text x="16" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2e3440">C++ `dist_mat`: built by odd-face position, read by face id — triangular prism, quads listed first</text>

  <rect x="16" y="44" width="356" height="340" fill="#ffffff" stroke="#5e81ac" stroke-width="2" rx="6"/>
  <text x="32" y="72" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">The instance</text>

  <polygon points="194,110 114,196 274,196" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <polygon points="194,214 114,300 274,300" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <line x1="194" y1="110" x2="194" y2="214" stroke="#4c566a" stroke-width="2"/>
  <line x1="114" y1="196" x2="114" y2="300" stroke="#4c566a" stroke-width="2"/>
  <line x1="274" y1="196" x2="274" y2="300" stroke="#4c566a" stroke-width="2"/>
  <line x1="194" y1="110" x2="274" y2="196" stroke="#4c566a" stroke-width="2"/>

  <circle cx="194" cy="110" r="3.5" fill="#2e3440"/>
  <circle cx="114" cy="196" r="3.5" fill="#2e3440"/>
  <circle cx="274" cy="196" r="3.5" fill="#2e3440"/>
  <circle cx="194" cy="214" r="3.5" fill="#2e3440"/>
  <circle cx="114" cy="300" r="3.5" fill="#2e3440"/>
  <circle cx="274" cy="300" r="3.5" fill="#2e3440"/>

  <text x="182" y="102" text-anchor="end" font-family="monospace" font-size="12" fill="#2e3440">0</text>
  <text x="104" y="190" text-anchor="end" font-family="monospace" font-size="12" fill="#2e3440">1</text>
  <text x="284" y="190" font-family="monospace" font-size="12" fill="#2e3440">2</text>
  <text x="182" y="234" text-anchor="end" font-family="monospace" font-size="12" fill="#2e3440">3</text>
  <text x="104" y="314" text-anchor="end" font-family="monospace" font-size="12" fill="#2e3440">4</text>
  <text x="284" y="314" font-family="monospace" font-size="12" fill="#2e3440">5</text>

  <rect x="32" y="330" width="10" height="10" fill="#fff9c4" stroke="#f57f17" stroke-width="1.5"/>
  <text x="50" y="340" font-family="sans-serif" font-size="12" fill="#2e3440">F3, F4 = triangles (odd)</text>
  <rect x="200" y="330" width="10" height="10" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="218" y="340" font-family="sans-serif" font-size="12" fill="#2e3440">F0–F2 = quads (even)</text>

  <rect x="388" y="44" width="356" height="340" fill="#ffffff" stroke="#bf616a" stroke-width="2" rx="6"/>
  <text x="404" y="72" font-family="sans-serif" font-size="15" font-weight="bold" fill="#bf616a">The access</text>

  <g font-family="monospace" font-size="13" fill="#2e3440">
    <text x="404" y="104">faces     = [F0, F1, F2, F3, F4]</text>
    <text x="404" y="128">parity    = [even, even, even, ODD, ODD]</text>
    <text x="404" y="152" fill="#b58900">odd_faces = [3, 4]</text>
    <text x="404" y="176" fill="#b58900">n_odd     = 2</text>
  </g>

  <line x1="404" y1="192" x2="728" y2="192" stroke="#d0d0d0" stroke-width="1"/>

  <text x="404" y="216" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e3440">dist_mat (old) — 2 rows</text>

  <rect x="420" y="228" width="270" height="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="3"/>
  <text x="432" y="246" font-family="monospace" font-size="12" fill="#2e3440">[0]  dist from face 3</text>
  <rect x="420" y="258" width="270" height="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="3"/>
  <text x="432" y="276" font-family="monospace" font-size="12" fill="#2e3440">[1]  dist from face 4</text>

  <rect x="420" y="290" width="270" height="26" fill="#fce4ec" stroke="#c2185b" stroke-width="2" stroke-dasharray="5,4" rx="3"/>
  <text x="432" y="308" font-family="monospace" font-size="12" font-weight="bold" fill="#c2185b">[3]  dist_mat[3][4]  ← requested 💥</text>

  <text x="404" y="344" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bf616a">→ out of bounds on a size-2 vector</text>
  <text x="404" y="366" font-family="monospace" font-size="12" fill="#4c566a">0xC0000005 ACCESS_VIOLATION</text>
</svg>
