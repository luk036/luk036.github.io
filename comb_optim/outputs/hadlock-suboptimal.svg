<svg width="760" height="380" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" style="background:#fafafa;border:1px solid #d0d0d0;border-radius:6px">
  <text x="16" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2e3440">Same input, three answers — 3×3 grid with diagonals (16 nodes, 33 edges, unit weights)</text>

  <rect x="16" y="44" width="292" height="320" fill="#ffffff" stroke="#5e81ac" stroke-width="2" rx="6"/>
  <text x="30" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565c0">The instance</text>

  <g stroke="#9aa5b1" stroke-width="1.5">
    <line x1="70" y1="106" x2="208" y2="106"/>
    <line x1="70" y1="152" x2="208" y2="152"/>
    <line x1="70" y1="198" x2="208" y2="198"/>
    <line x1="70" y1="244" x2="208" y2="244"/>
    <line x1="70" y1="106" x2="70" y2="244"/>
    <line x1="116" y1="106" x2="116" y2="244"/>
    <line x1="162" y1="106" x2="162" y2="244"/>
    <line x1="208" y1="106" x2="208" y2="244"/>
  </g>
  <g stroke="#f57f17" stroke-width="2">
    <line x1="70" y1="106" x2="116" y2="152"/>
    <line x1="116" y1="106" x2="162" y2="152"/>
    <line x1="162" y1="106" x2="208" y2="152"/>
    <line x1="70" y1="152" x2="116" y2="198"/>
    <line x1="116" y1="152" x2="162" y2="198"/>
    <line x1="162" y1="152" x2="208" y2="198"/>
    <line x1="70" y1="198" x2="116" y2="244"/>
    <line x1="116" y1="198" x2="162" y2="244"/>
    <line x1="162" y1="198" x2="208" y2="244"/>
  </g>
  <g fill="#2e3440">
    <circle cx="70" cy="106" r="4"/><circle cx="116" cy="106" r="4"/><circle cx="162" cy="106" r="4"/><circle cx="208" cy="106" r="4"/>
    <circle cx="70" cy="152" r="4"/><circle cx="116" cy="152" r="4"/><circle cx="162" cy="152" r="4"/><circle cx="208" cy="152" r="4"/>
    <circle cx="70" cy="198" r="4"/><circle cx="116" cy="198" r="4"/><circle cx="162" cy="198" r="4"/><circle cx="208" cy="198" r="4"/>
    <circle cx="70" cy="244" r="4"/><circle cx="116" cy="244" r="4"/><circle cx="162" cy="244" r="4"/><circle cx="208" cy="244" r="4"/>
  </g>

  <rect x="30" y="278" width="10" height="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="48" y="288" font-family="sans-serif" font-size="12" fill="#2e3440">grid edges</text>
  <rect x="150" y="278" width="10" height="10" fill="#ffffff" stroke="#f57f17" stroke-width="2"/>
  <text x="168" y="288" font-family="sans-serif" font-size="12" fill="#2e3440">diagonals</text>
  <text x="30" y="322" font-family="sans-serif" font-size="12" fill="#4c566a">9 triangles → odd faces → matching</text>
  <text x="30" y="344" font-family="sans-serif" font-size="12" fill="#4c566a">odd faces = [0..12, 14..18] · n_odd = 18</text>

  <rect x="324" y="44" width="420" height="320" fill="#ffffff" stroke="#bf616a" stroke-width="2" rx="6"/>
  <text x="340" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#bf616a">Max-cut weight returned</text>

  <g font-family="sans-serif" font-size="13" fill="#2e3440">
    <text x="480" y="112" text-anchor="end">optimum (verified)</text>
    <rect x="490" y="96" width="220" height="22" fill="#5e81ac" rx="3"/>
    <text x="700" y="112" text-anchor="end" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">24</text>

    <text x="480" y="164" text-anchor="end">new C++</text>
    <rect x="490" y="148" width="220" height="22" fill="#a3be8c" rx="3"/>
    <text x="700" y="164" text-anchor="end" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">24 ✅</text>

    <text x="480" y="216" text-anchor="end">old C++</text>
    <rect x="490" y="200" width="201" height="22" fill="#bf616a" rx="3"/>
    <text x="681" y="216" text-anchor="end" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">22 ❌</text>
  </g>

  <line x1="340" y1="242" x2="728" y2="242" stroke="#d0d0d0" stroke-width="1"/>
  <text x="340" y="268" font-family="sans-serif" font-size="13" fill="#2e3440">The old table was shifted by one after the outer face,</text>
  <text x="340" y="288" font-family="sans-serif" font-size="13" fill="#2e3440">so the matching paired the wrong faces → <tspan font-weight="bold" fill="#bf616a">2 units of cut lost</tspan>.</text>
  <text x="340" y="320" font-family="sans-serif" font-size="13" fill="#2e3440">On the prism, the same defect reads <tspan font-family="monospace" fill="#bf616a">dist_mat[3]</tspan> of a</text>
  <text x="340" y="340" font-family="sans-serif" font-size="13" fill="#2e3440">size-2 vector → <tspan font-weight="bold" fill="#bf616a">segfault</tspan> instead of a wrong answer.</text>
</svg>
