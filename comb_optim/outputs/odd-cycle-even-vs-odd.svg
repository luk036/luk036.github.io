<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Even vs. odd cycle and the odd cycle cover</title>
<rect width="940" height="430" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d7e"/></marker>
</defs>
<text x="470.0" y="34.0" font-size="21" text-anchor="middle" fill="#1b2631" font-weight="bold">Even cycles need nothing, odd cycles need one vertex</text><text x="470.0" y="58.0" font-size="13" text-anchor="middle" fill="#5d6d7e" font-weight="normal">C is an odd cycle cover iff G[V \ C] has no odd cycle, i.e. is bipartite</text><rect x="30.0" y="80.0" width="420.0" height="320.0" rx="10" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5"/><text x="48.0" y="110.0" font-size="15" text-anchor="start" fill="#1b2631" font-weight="bold">(a)  Even cycle C4 - bipartite</text><line x1="140.0" y1="180.0" x2="310.0" y2="180.0" stroke="#95a5a6" stroke-width="2.5" stroke-linecap="round"/><line x1="310.0" y1="180.0" x2="310.0" y2="320.0" stroke="#95a5a6" stroke-width="2.5" stroke-linecap="round"/><line x1="310.0" y1="320.0" x2="140.0" y2="320.0" stroke="#95a5a6" stroke-width="2.5" stroke-linecap="round"/><line x1="140.0" y1="320.0" x2="140.0" y2="180.0" stroke="#95a5a6" stroke-width="2.5" stroke-linecap="round"/><circle cx="140.0" cy="180.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="140.0" y="184.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n0</text><circle cx="310.0" cy="180.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="310.0" y="184.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n1</text><circle cx="310.0" cy="320.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="310.0" y="324.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n2</text><circle cx="140.0" cy="320.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="140.0" y="324.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n3</text><text x="225.0" y="372.0" font-size="13" text-anchor="middle" fill="#5d6d7e" font-weight="normal">2-colourable, so no odd cycle exists</text><text x="225.0" y="393.0" font-size="14" text-anchor="middle" fill="#1e8449" font-weight="bold">cover = {}   cost = 0</text><rect x="490.0" y="80.0" width="420.0" height="320.0" rx="10" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5"/><text x="508.0" y="110.0" font-size="15" text-anchor="start" fill="#1b2631" font-weight="bold">(b)  Odd cycle C3 - non-bipartite</text><line x1="700.0" y1="175.0" x2="605.0" y2="315.0" stroke="#95a5a6" stroke-width="2.5" stroke-linecap="round"/><line x1="605.0" y1="315.0" x2="795.0" y2="315.0" stroke="#95a5a6" stroke-width="2.5" stroke-linecap="round"/><line x1="795.0" y1="315.0" x2="700.0" y2="175.0" stroke="#95a5a6" stroke-width="2.5" stroke-linecap="round"/><circle cx="700.0" cy="175.0" r="19.0" fill="#f5b7b1" stroke="#c0392b" stroke-width="3.0"/><text x="700.0" y="179.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n4</text><circle cx="605.0" cy="315.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="605.0" y="319.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n5</text><circle cx="795.0" cy="315.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="795.0" y="319.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n6</text><text x="700.0" y="372.0" font-size="13" text-anchor="middle" fill="#5d6d7e" font-weight="normal">one vertex breaks the only odd cycle</text><text x="700.0" y="393.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">cover = {n4}   cost = 1</text></svg>
