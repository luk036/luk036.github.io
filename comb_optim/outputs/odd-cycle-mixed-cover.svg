<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Odd cycle cover of a mixed graph</title>
<rect width="940" height="480" fill="#ffffff"/>
<defs>
