<text x="470.0" y="34.0" font-size="21" text-anchor="middle" fill="#1b2631" font-weight="bold">The cover touches only the odd cycle</text><text x="470.0" y="58.0" font-size="13" text-anchor="middle" fill="#5d6d7e" font-weight="normal">Square n0-n3 (even) plus triangle n4-n6 (odd); the square is left untouched</text><line x1="150.0" y1="150.0" x2="300.0" y2="150.0" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="300.0" y1="150.0" x2="300.0" y2="290.0" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="300.0" y1="290.0" x2="150.0" y2="290.0" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="150.0" y1="290.0" x2="150.0" y2="150.0" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="660.0" y1="140.0" x2="560.0" y2="300.0" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round"/><line x1="560.0" y1="300.0" x2="760.0" y2="300.0" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round"/><line x1="760.0" y1="300.0" x2="660.0" y2="140.0" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round"/><circle cx="150.0" cy="150.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="150.0" y="154.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n0</text><circle cx="300.0" cy="150.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="300.0" y="154.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n1</text><circle cx="300.0" cy="290.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="300.0" y="294.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n2</text><circle cx="150.0" cy="290.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="150.0" y="294.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n3</text><circle cx="660.0" cy="140.0" r="19.0" fill="#f5b7b1" stroke="#c0392b" stroke-width="3.0"/><text x="660.0" y="144.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n4</text><circle cx="560.0" cy="300.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="560.0" y="304.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n5</text><circle cx="760.0" cy="300.0" r="19.0" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="760.0" y="304.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold">n6</text><text x="225.0" y="355.0" font-size="14" text-anchor="middle" fill="#5d6d7e" font-weight="bold">even cycle</text><text x="225.0" y="376.0" font-size="12" text-anchor="middle" fill="#98a6ad" font-weight="normal">no vertex selected</text><text x="660.0" y="355.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">odd cycle</text><text x="660.0" y="376.0" font-size="12" text-anchor="middle" fill="#98a6ad" font-weight="normal">one vertex selected</text><rect x="120.0" y="405.0" width="700.0" height="50.0" rx="8" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5"/><text x="470.0" y="436.0" font-size="15" text-anchor="middle" fill="#1b2631" font-weight="bold">min_odd_cycle_cover  -&gt;  {n4},  cost = 1</text></svg>
