<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Primal-dual violation oracle: before and after</title>
<rect width="960" height="470" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d7e"/></marker>
</defs>
<text x="480.0" y="34.0" font-size="21" text-anchor="middle" fill="#1b2631" font-weight="bold">The violation oracle dominated the runtime</text><text x="480.0" y="58.0" font-size="13" text-anchor="middle" fill="#5d6d7e" font-weight="normal">pd_cover calls the oracle about 2x|cover| times, and the old oracle restarted a full search each call</text><rect x="30.0" y="80.0" width="430.0" height="360.0" rx="10" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5"/><text x="48.0" y="110.0" font-size="15" text-anchor="start" fill="#1b2631" font-weight="bold">BEFORE - super-linear per call</text><line x1="99.6" y1="151.3" x2="196.4" y2="151.3" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><line x1="196.4" y1="151.3" x2="196.4" y2="238.7" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><line x1="196.4" y1="238.7" x2="99.6" y2="238.7" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><line x1="99.6" y1="238.7" x2="99.6" y2="151.3" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><line x1="99.6" y1="151.3" x2="196.4" y2="238.7" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><circle cx="99.6" cy="151.3" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="99.6" y="156.0" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><circle cx="196.4" cy="151.3" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="196.4" y="156.0" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><circle cx="196.4" cy="238.7" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="196.4" y="243.4" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><circle cx="99.6" cy="238.7" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="99.6" y="243.4" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><circle cx="148.0" cy="195.0" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2.0"/><text x="148.0" y="199.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><text x="340.0" y="160.0" font-size="12" text-anchor="middle" fill="#5d6d7e" font-weight="normal">5 BFS passes</text><rect x="288.0" y="175.0" width="24.0" height="24.0" rx="5" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4"/><text x="300.0" y="192.0" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">1</text><rect x="318.0" y="175.0" width="24.0" height="24.0" rx="5" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4"/><text x="330.0" y="192.0" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">2</text><rect x="348.0" y="175.0" width="24.0" height="24.0" rx="5" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4"/><text x="360.0" y="192.0" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">3</text><rect x="378.0" y="175.0" width="24.0" height="24.0" rx="5" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4"/><text x="390.0" y="192.0" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">4</text><rect x="408.0" y="175.0" width="24.0" height="24.0" rx="5" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4"/><text x="420.0" y="192.0" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">5</text><text x="245.0" y="266.0" font-size="12.5" text-anchor="middle" fill="#5d6d7e" font-weight="normal">BFS restarted from every source,</text><text x="245.0" y="288.0" font-size="12.5" text-anchor="middle" fill="#5d6d7e" font-weight="normal">topology recomputed on every call</text><rect x="50.0" y="312.0" width="390.0" height="113.0" rx="8" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.5"/><text x="245.0" y="340.0" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">cost per call:  O(V x (V + E))</text><text x="245.0" y="366.0" font-size="11.5" text-anchor="middle" fill="#5d6d7e" font-weight="normal">Python: BCC + chain decomposition, BFS per source</text><text x="245.0" y="386.0" font-size="11.5" text-anchor="middle" fill="#5d6d7e" font-weight="normal">C++: materialises every cycle, copying BFS info</text><text x="245.0" y="406.0" font-size="11.5" text-anchor="middle" fill="#5d6d7e" font-weight="normal">Rust: O(V) node-name scan per dequeued node</text><rect x="500.0" y="80.0" width="430.0" height="360.0" rx="10" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5"/><text x="518.0" y="110.0" font-size="15" text-anchor="start" fill="#1b2631" font-weight="bold">AFTER - single linear pass</text><line x1="569.2" y1="159.1" x2="670.8" y2="159.1" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><line x1="670.8" y1="159.1" x2="670.8" y2="250.9" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><line x1="670.8" y1="250.9" x2="569.2" y2="250.9" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><line x1="569.2" y1="250.9" x2="569.2" y2="159.1" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><line x1="569.2" y1="159.1" x2="670.8" y2="250.9" stroke="#95a5a6" stroke-width="2.0" stroke-linecap="round"/><circle cx="569.2" cy="159.1" r="10.66" fill="#aed6f1" stroke="#1f618d" stroke-width="2.0"/><text x="569.2" y="163.8" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><circle cx="670.8" cy="159.1" r="10.66" fill="#f9e79f" stroke="#b7950b" stroke-width="2.0"/><text x="670.8" y="163.8" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><circle cx="670.8" cy="250.9" r="10.66" fill="#aed6f1" stroke="#1f618d" stroke-width="2.0"/><text x="670.8" y="255.6" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><circle cx="569.2" cy="250.9" r="10.66" fill="#f9e79f" stroke="#b7950b" stroke-width="2.0"/><text x="569.2" y="255.6" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><circle cx="620.0" cy="205.0" r="10.66" fill="#aed6f1" stroke="#1f618d" stroke-width="2.0"/><text x="620.0" y="209.7" font-size="13.0" text-anchor="middle" fill="#1b2631" font-weight="bold"></text><line x1="700.0" y1="205.0" x2="750.0" y2="205.0" stroke="#5d6d7e" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow)"/><text x="758.0" y="195.0" font-size="12" text-anchor="start" fill="#5d6d7e" font-weight="normal">first same-colour</text><text x="758.0" y="213.0" font-size="12" text-anchor="start" fill="#5d6d7e" font-weight="normal">edge = odd cycle</text><rect x="520.0" y="300.0" width="390.0" height="122.0" rx="8" fill="#f0f9f3" stroke="#a9dfbf" stroke-width="1.5"/><text x="715.0" y="328.0" font-size="16" text-anchor="middle" fill="#1e8449" font-weight="bold">cost per call:  O(V + E)</text><text x="715.0" y="354.0" font-size="11.5" text-anchor="middle" fill="#5d6d7e" font-weight="normal">one BFS 2-colouring; a same-colour edge closes an odd cycle</text><text x="715.0" y="374.0" font-size="11.5" text-anchor="middle" fill="#5d6d7e" font-weight="normal">all three ports return the first odd cycle directly</text><text x="715.0" y="394.0" font-size="11.5" text-anchor="middle" fill="#5d6d7e" font-weight="normal">same cover size and cost, unchanged semantics</text></svg>
