## 🧭 Part 1 — The Setup

---

### 🧩 Difference Covers, Quickly

A **base quorum** ${\color{salmon}B_0} = \{a_1, \dots, a_d\}$ generates a cyclic quorum
system by shifts ${\color{salmon}B_i} = {\color{salmon}B_0} + i \pmod N$.

It works **iff** every non-zero residue is hit by a pair difference:

$$ \forall m \in \{1,\dots,N-1\},\; \exists a_u,a_v \in {\color{salmon}B_0}:\;
   a_u - a_v \equiv {\color{royalblue}m} \pmod N $$

The set ${\color{salmon}B_0}$ is a **relaxed difference cover**. Finding the smallest
${\color{royalblue}d}$ is the hard part. 🧠

> Valid inputs: $N \ge 3$, $d \ge 3$, ${\color{royalblue}N \le d(d-1)+1}$.

### 🪞 Two Symmetries, Not One

The original search only broke **rotation** symmetry (necklaces). It ignored
**reflection** — the reversal $a_i \mapsto N - a_i$. 🔁

### 🧩 The Port: `b[]` → `q[]` + `CheckRev`

`diff_cover3.cpp` already had the bracelet machinery. We ported it into the main solver. 🔧

```cpp
int CheckRev(int t_1) {
    for (int idx = a[1]; idx &lt;= t_1 / 2; ++idx) {
        if (q[idx] &lt; q[t_1 - idx]) return  1;   // prefix smaller
        if (q[idx] &gt; q[t_1 - idx]) return -1;   // reverse smaller
    }
    return 0;                                   // palindromic prefix
}
```

- `q[value]` — membership marker of the current configuration
- Skip the branch when the **reverse is lexicographically smaller** (`rev == -1`)
- `GenD` → `BraceFD`, `Gen11` → `BraceFD11`

## 🤖 Part 3 — The RL Agent That Never Learned

---

### 🕳️ The Silent Bug

`RL_mt.cpp` allocated gradients, computed a local `gradLogits`… and **threw it away**.
`update()` then subtracted **zero** from every weight. 😱

```cpp
for (size_t t = 0; t &lt; states.size(); ++t) {
    std::vector&lt;float&gt; gradLogits(N, 0.0f);      // local!
    for (int idx = 0; idx &lt; N; ++idx)
        gradLogits[idx] = returns[t] * (indicator - probs[idx]);
}                                                  // gradLogits dies here

policyNet.update(gradW1, gradB1, ...);             // gradW1.. all zero 😴
```

> The "AI" was a **fixed random policy** wearing a neural network costume. 🎭

### 📐 Real REINFORCE

We maximise the expected return with the policy-gradient theorem:

$$ \nabla_\theta J \;=\; \mathbb{E}\Big[\, {\color{#a3be8c}G_t}\,
   \nabla_\theta \log \pi_\theta(a_t \mid s_t) \,\Big] $$

For a softmax head the logit gradient is clean:

$$ \frac{\partial \log \pi(a)}{\partial z_i} \;=\; {\color{#5e81ac}\delta_{ia}} - {\color{#5e81ac}p_i}
   \quad\Longrightarrow\quad
   \frac{\partial L}{\partial z_i} \;=\; {\color{#a3be8c}G_t}\,\big(p_i - \delta_{ia}\big) $$

and weights descend ${\color{#bf616a}w \leftarrow w - \eta\,\partial L/\partial w}$. ✅

---

### 🌡️ The Entropy Bonus (and Its Sign)

To keep exploring, add an entropy bonus ${\color{#ebcb8b}\beta H}$ with
$H = -\sum_a p_a \log p_a$:

$$ \frac{\partial H}{\partial z_i} \;=\; -\,{\color{#5e81ac}p_i}\,\big(\log p_i + H\big) $$

To **maximise** $H$ under $w \leftarrow w - \eta\,\partial L/\partial w$, the loss gradient
must carry $+{\color{#ebcb8b}\beta}\,p_i(\log p_i + H)$:

$$ \frac{\partial L}{\partial z_i} \;=\;
   {\color{#a3be8c}G_t}(p_i-\delta_{ia})
   \;{\color{#a3be8c}+}\;{\color{#ebcb8b}\beta\,p_i(\log p_i + H)} $$

> `RL_mt2.cpp` and `RL2.cpp` had a **`−`** there — it *minimised* entropy and collapsed. 🕳️

### 🔁 #2a — Cache the Forward Pass

### 🧹 #2b — Reuse Per-Thread Buffers

Every episode used to allocate fresh vectors. Now they live **outside** the episode loop. 📦

```cpp
const int T = D - 1; const int IN = 2 * N;
std::vector&lt;std::vector&lt;float&gt;&gt; states(T, std::vector&lt;float&gt;(IN));
std::vector&lt;ForwardResult&gt; fwdList(T);   // activations, reused
std::vector&lt;std::vector&lt;float&gt;&gt; gradW1(HIDDEN_SIZE1, std::vector&lt;float&gt;(IN, 0.0f));
// ... once per thread, not once per episode
```

- `resize()` on an already-sized buffer is a **no-op** after the first episode ✅
- `softmax(logits, probs)` writes into a caller buffer instead of returning one

---

### 🧵 #2d — Lock-Free (Hogwild)

The update mutex serialised 10 threads. We removed it — async SGD tolerates lost updates. 🏎️

```cpp
void update(...) {          // no mutex — Hogwild async SGD
    for (row...) W1[row][col] -= LEARNING_RATE * gradW1[row][col];
}
```

## 🛡️ Part 5 — Robustness

---

### 🧱 Overflow-Safe Validation

The guard `N > d*(d-1)+1` was computed in **32-bit `int`** — it overflows for huge `d`. 💥

$$ {\color{#bf616a}d = 2\,147\,418\,113}:\quad d(d-1)+1 \text{ wraps} \;\Rightarrow\; \text{guard passes} $$

Fix (all four solvers):

```cpp
if (N &lt; 3 || D &lt; 3 || D &gt; N || N &gt; MAX_N ||
    (long long)N &gt; (long long)D * (D - 1) + 1) { usage(); return 1; }
```

- `long long` product → no wrap
- `D > N` → a cover cannot exceed the ring size
- `MAX_N` bound → keeps `int` size arithmetic safe

### 🧠 Key Takeaways

**Correctness first** 🐛
- A "learning" agent with a discarded gradient is just **random search in disguise**
- An inverted entropy sign silently **collapses** the policy — derive the sign, don't guess

**Measure the right thing** 📏
- Mean coverage looked like a regression in one seed; **solution-finding rate** told the truth
- High variance needs **many trials**, not one curve

**Optimize with evidence** ⚡
- Cache recomputation (#2a), reuse buffers (#2b), drop the lock (#2d)
- Pruning helps only where it actually fires (symmetry frontier)
