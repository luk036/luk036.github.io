# Generating Necklaces and Bracelets with Fixed Density

@luk036 👨‍💻 · 2026 📅

---

## What are Combinatorial Objects? 🤔🔢

*   Discrete structures like permutations, combinations, graphs, strings.
*   Generating lists of these objects is **immensely important** in mathematics and computer science.
*   Widely used in:
  *   Computational biology 🧬
  *   Combinatorial chemistry 🧪
  *   Operations research 📈
  *   Data mining ⛏️
  *   Calibration of colour printers (specifically bracelets) 🖨️

---

### Necklaces, Lyndon Words, and Bracelets 📿

*   These are specific types of k-ary strings (strings using an alphabet of size k).
*   **Necklace:** A **lexicographically minimal** k-ary string equivalent under **rotation**.
  *   *Example:* `0011` is a necklace from the rotation set `{0011, 0110, 1100, 1001}`.
*   **Lyndon Word:** An **aperiodic necklace** (a necklace that is its own shortest Lyndon prefix).
  *   *Example:* `0001` is a Lyndon word from the rotation set `{0001, 0010, 0100, 1000}`.
*   **Bracelet:** A **lexicographically minimal** k-ary string **symmetric under rotation and reversal**.
  *   *Example (binary):* `001100` is a bracelet because its rotations (`011000`, etc.) and reversals (`001100` reversed is `001100`) are considered, and `001100` is the smallest among them.

### What is "Fixed Density"? 🎯📊

*   A k-ary string is of **fixed density** if the **number of occurrences of symbol 0 is fixed**.
*   The sources define density ${\color{coral}d}$ as the **number of non-zero symbols**.
  *   So, a string of length ${\color{coral}n}$ with ${\color{coral}d}$ non-zero symbols has ${\color{coral}n}-{\color{coral}d}$ zeros.
*   We use notation like:
  *   ${\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})$: set of k-ary necklaces length ${\color{coral}n}$, density ${\color{coral}d}$.
  *   ${\color{salmon}P_k}({\color{coral}n}, {\color{coral}d})$: set of k-ary prenecklaces length ${\color{coral}n}$, density ${\color{coral}d}$.
  *   ${\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})$: set of k-ary bracelets length ${\color{coral}n}$, density ${\color{coral}d}$.
*   Cardinality denoted $|{\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})|$, $|{\color{salmon}P_k}({\color{coral}n}, {\color{coral}d})|$, $|{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$.

---

### Counting Fixed Density Objects 📊🧮

*   The number of necklaces with specific counts of each symbol $({\color{coral}n_0}, {\color{coral}n_1}, ..., {\color{coral}n_{k-1}})$ is given by a formula involving Euler's totient function $\phi$:

    $${\color{salmon}N_k}({\color{coral}n_0}, {\color{coral}n_1}, ..., {\color{coral}n_{k-1}}) = \frac{1}{{\color{coral}n}} \sum_{j \mid \gcd({\color{coral}n_0},...,{\color{coral}n_{k-1}})} \phi(j) \frac{({\color{coral}n}/j)!}{({\color{coral}n_0}/j)! \cdots ({\color{coral}n_{k-1}}/j)!}$$

*   The cardinality of necklaces $|{\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})|$ is:

    $$|{\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})| = \sum_{{\color{coral}n_1} + \cdots + {\color{coral}n_{k-1}} = {\color{coral}d}} {\color{salmon}N_k}({\color{coral}n}-{\color{coral}d}, {\color{coral}n_1}, \cdots, {\color{coral}n_{k-1}})$$

*   For bracelets, the cardinality is related to necklaces: $|{\color{salmon}N_k}({\color{coral}n})| \leq 2|{\color{salmon}B_k}({\color{coral}n})|$ and $|{\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})| \leq 2|{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$.

### Generating Combinatorial Objects - Background ⏳🔄

*   Algorithms exist for generating necklaces, Lyndon words, and variants.
*   Recursive frameworks like Cattell et al. are used.
*   Algorithms for **necklaces with fixed density** exist.
*   Algorithms for **necklaces with fixed content** (fixed counts of *each* symbol) exist.
*   Algorithms for generating **bracelets** exist.
  *   Lisonek modified necklace generation.
  *   Sawada developed a **Constant Amortized Time (CAT)** algorithm.

---

### What is a CAT Algorithm? ⚡⏱️

*   **CAT (Constant Amortized Time):** An algorithm where the **total number of basic operations performed is proportional to the number of objects generated**.
*   On average, **each successive object is generated in constant time**.
*   This is **extremely desirable** in generation algorithms.
*   The goal of the paper is to present a CAT algorithm for fixed density bracelets.

### Generating Fixed-Density Necklaces ⚙️📿

*   A **k-ary necklace** with **fixed density** has a fixed number of non-zero characters.

*   Example: ${\color{salmon}N}(4, 2, 3)$ (length 4, 2 non-zero chars) = {0011, 0012, 0021, 0022, 0101, 0102, 0202}.

*   Motivation: Applications in areas like hardware/software testing, combinatorial chemistry, and generating **difference covers**. 🧪💻
  *   An $({\color{coral}n}, {\color{coral}d})$ difference cover can be mapped from binary necklaces ${\color{salmon}N}({\color{coral}n}, {\color{coral}d}, 2)$.

*   Counting fixed-density necklaces is known.

*   Efficiently *generating* them was an open problem before this work. Previous algorithms were not CAT. 🚧

### Fixed-Density Necklace Algorithm (GenFix) 🎯

*   Approach: Modify existing recursive necklace algorithms.
  *   Original $\text{Gen}({\color{green}t}, {\color{firebrick}p})$ generates all prenecklaces (prefixes of necklaces).
  *   A string $\alpha$ is a prenecklace iff ${\color{green}a_{j-p}} = {\color{green}a_j}$ for ${\color{green}j}={\color{firebrick}p}+1...{\color{coral}n}$, where ${\color{firebrick}p}=\text{lyn}(\alpha)$ (length of longest Lyndon prefix).

*   **Modified Algorithm (Gen2):** Focus on prenecklaces whose last character is non-zero.
  *   Uses arrays ${\color{green}a}$ (position of non-zero char) and ${\color{green}b}$ (value of non-zero char).
  *   Recursively determines valid positions and values for the *next non-zero character*.
  *   Pseudocode $\text{Gen2}({\color{green}t}, {\color{firebrick}p})$ Figure 3.5.

---

*   **Fixed-Density Optimization (GenFix):** Add restrictions to Gen2 for fixed density ${\color{coral}d}$.
    1.  Restrict position of first non-zero character.
    2.  Restrict position of the ${\color{green}i}$-th non-zero character.
    3.  Stop recursion after placing ${\color{coral}d}-1$ non-zero characters.
    4.  Determine valid values for the ${\color{coral}d}$-th (last) non-zero character in the $\text{PrintIt}({\color{firebrick}p})$ function.

*   Pseudocode $\text{GenFix}({\color{green}t}, {\color{firebrick}p})$ Figure 3.7.

---

### Fixed-Density Necklace Analysis ⏱️📊

*   **Goal:** Prove $\text{GenFix}$ is CAT.
*   Analysis focuses on the size of the computation tree. 🌳
*   Total work is proportional to the number of nodes in the tree.
*   Each node requires constant work (excluding $\text{PrintIt}$ which is handled).
*   Need to bound the size of the computation tree relative to the number of necklaces produced.
*   Computation tree size bounded by sum of prenecklaces with specific length and density.
  *   $\text{CompTree}_k({\color{coral}n}, {\color{coral}d}) \leq \sum \sum {\color{salmon}P'}({\color{green}j}, {\color{green}i}, {\color{coral}k})$.
  *   ${\color{salmon}P'}({\color{coral}n}, {\color{coral}d}, {\color{coral}k})$ (prenecklaces of length ${\color{coral}n}$, density ${\color{coral}d}$, last char non-zero) $\leq {\color{salmon}N}({\color{coral}n}, {\color{coral}d}, {\color{coral}k}) + L({\color{coral}n}, {\color{coral}d}, {\color{coral}k})$ (Necklaces + Lyndon words).
  *   Bounds on $L({\color{coral}n}, {\color{coral}d}, {\color{coral}k})$ and ${\color{salmon}N}({\color{coral}n}, {\color{coral}d}, {\color{coral}k})$ are used.
    *   ${\color{salmon}N}({\color{coral}n}, {\color{coral}d}, {\color{coral}k}) \leq 2 L({\color{coral}n}, {\color{coral}d}, {\color{coral}k})$.
    *   $L({\color{coral}n}, {\color{coral}d}, {\color{coral}k}) \leq \frac{1}{{\color{coral}n}} \binom{{\color{coral}n}}{{\color{coral}d}} ({\color{coral}k}-1)^{{\color{coral}d}}$.

---

*   Using these bounds, the computation tree size is shown to be proportional to the number of necklaces generated.
  *   Ratio $\text{CompTree} / {\color{salmon}N}({\color{coral}n}, {\color{coral}d}, {\color{coral}k})$ is bounded by a constant.
*   **Theorem 4.7:** $\text{GenFix}$ is CAT. ✅

### The Problem: Generating Fixed Density Bracelets 🤔🔧

*   "No significant work is done to list restricted classes of bracelets" like fixed density.
*   Goal: Develop an **algorithm for lexicographic listing of bracelets with fixed density**.
*   The algorithm should work for **arbitrarily large alphabet size** (k).
*   The algorithm should generate each successive bracelet in **constant amortized time**.

---

### Basic Building Block: Generating Prenecklaces (Naive) 🏗️🔨

*   Recursive algorithms for generating prenecklaces are based on the **Fundamental Theorem of Necklaces**.
*   **Theorem 2.1:** Let $\alpha = a_1...a_{n-1} \in {\color{salmon}P_k}({\color{coral}n}-1)$ and ${\color{firebrick}p} = \text{lyn}(\alpha)$ (length of longest Lyndon prefix).
  *   The string $\alpha b$ is in ${\color{salmon}P_k}({\color{coral}n})$ **iff** $a_{n-p} \leq {\color{green}b} \leq {\color{coral}k}-1$.
  *   $\text{lyn}(\alpha b)$ is:
        1. ${\color{firebrick}p}$ if $a_{n-p} = {\color{green}b}$, or
        2. ${\color{coral}n}$ if $a_{n-p} < {\color{green}b}$.
*   This theorem tells us which character ${\color{green}b}$ can be appended to a prenecklace $\alpha$ to get a new prenecklace $\alpha b$.
*   A simple recursive algorithm $\text{Necklace}({\color{green}t}, {\color{firebrick}p})$ can list prenecklaces (and necklaces/Lyndon words with a $\text{Print}$ function check).

---

### Naive Fixed Density Bracelet Algorithm (SimpleBFD) 🚶‍♂️🐢

*   A simple modification of the necklace algorithm ($\text{SimpleBFD}({\color{green}t}, {\color{firebrick}p}, {\color{firebrick}r})$) can list fixed density bracelets.
*   It needs to ensure:
    1.  All generated prenecklaces have density ${\color{coral}d}$. (Requires checking non-zero count).
    2.  Only list bracelets.
*   Checking if a string is a bracelet usually involves comparing it to the necklace of its reversed string. This is $O({\color{coral}n})$ and **prevents a CAT algorithm**.
*   Instead, a lemma from Sawada is used:
  *   **Lemma 3.1:** A necklace $\alpha = a_1...a_n$ is a bracelet **iff**
        1. $a_{r+1}...a_n \leq a_n...a_{r+1}$ and
        2. $a_1...a_t > a_t...a_1$ for no ${\color{green}t}$,
        where ${\color{firebrick}r}$ is the length of the longest prefix equal to its reversal ($a_1...a_r = a_r...a_1$).
*   This involves comparing the current prenecklace with its reversal using $\text{CheckRev}({\color{green}t})$.

---

### $\text{CheckRev}({\color{green}t})$ Function 🤔🔁🔍

*   The $\text{CheckRev}({\color{green}t})$ function compares the prefix $a_1...a_t$ with its reversal $a_t...a_1$.
*   It returns:
  *   $1$ if $a_1...a_t < a_t...a_1$
  *   $0$ if $a_1...a_t = a_t...a_1$
  *   $-1$ if $a_1...a_t > a_t...a_1$
*   If $\text{CheckRev}({\color{green}t})$ returns $-1$, further generation from this prenecklace is stopped because it cannot be the minimal representative of a bracelet.
*   If $\text{CheckRev}({\color{green}t})$ returns $0$, the parameter ${\color{firebrick}r}$ (length of longest equal-to-reversal prefix) is updated.
*   When length ${\color{coral}n}$ is reached, $a_{r+1}...a_n$ is compared to its reversal.
*   *Issue:* This naive comparison is still **not constant time**.

---

### Towards an Efficient Algorithm (CAT) 💪⚡

*   The naive algorithm is inefficient.
*   An efficient (CAT) algorithm is presented by merging **optimizations from two existing CAT algorithms**:
    1.  Generating necklaces with fixed density.
    2.  Generating bracelets.

---

### Fixed Density Optimizations (from) ⬆️📈

*   **Optimization 1: Increase Density, Not Length:** Instead of appending one character, append characters to **increase the density by one**.
  *   Arrays ${\color{green}a}$ (positions of non-zero symbols) and ${\color{green}b}$ (values of non-zero symbols) are used.
  *   ${\color{green}t}$ = current density, ${\color{green}a_t}$ = length of current prenecklace.
  *   Determine valid position and value for the **next non-zero symbol**.
  *   Maximum position: ${\color{green}a_{t+1}} = {\color{green}a_{t+1-p}} + {\color{green}a_p}$.
  *   Minimum value: ${\color{green}b_{a_{t+1}}} = {\color{green}b_{a_{t+1-p}}}$. (Larger values also valid).
*   **Optimization 2: Density Constraints:**
  *   First non-zero symbol between ${\color{coral}n}-{\color{coral}d}+1$ and $({\color{coral}n}-1)/{\color{coral}d}+1$.
  *   ${\color{green}i}$-th non-zero symbol at or before ${\color{coral}n}-{\color{coral}d}+{\color{green}i}$-th position.
  *   Last non-zero symbol must be at ${\color{coral}n}$-th position.
  *   Stop recursive generation when density ${\color{coral}d}-1$ is reached. The last symbol (at position ${\color{coral}n}$) is handled separately.
  *   Constant time test added to determine valid values for the last non-zero symbol at position ${\color{coral}n}$.

---

### Bracelet Optimizations (from) 🔄✨

*   **Optimization 1: Limited Reverse Checks:** If a necklace $\alpha$ is of the form
     $$a...a_{i_{i+1} }...a_n, \qquad a \neq a_{i+1},$$
     only check reverse rotations starting with the same repeated symbol $a_i$.
  *   Doesn't require generating the entire necklace.
  *   Still requires $O({\color{green}t})$ work per check.
*   **Optimization 2: Incremental Reversal Check:** The final test comparing $a_{r+1}...a_n$ to its reversal can be done incrementally.
  *   Start comparison once the "middle point" $\lfloor ({\color{coral}n}-{\color{firebrick}r})/2 \rfloor + {\color{firebrick}r}$ is reached.
  *   Use an additional parameter ${\color{green}RS}$ (Reverse Status) to store intermediate results.
  *   Update ${\color{green}RS}$ based on comparing the current character $a_{t-1}$ with its corresponding character in the reversed string
        $a[n-t+2+r]$.
  *   This makes the comparison a **constant time test per recursive call**.

---

### Merging Optimizations 🤝🔀

*   Combine the fixed density (increasing density, position/value arrays ${\color{green}a}$, ${\color{green}b}$) and bracelet (limited/incremental reversal checks) optimizations.
*   Recursive scheme $\text{BraceFD}({\color{green}t}, {\color{firebrick}p}, {\color{firebrick}r}, {\color{green}RS})$.
*   Use ${\color{green}a}$ for non-zero positions, ${\color{green}b}$ for values.
*   Assume $0 < {\color{coral}d} < {\color{coral}n}$, so strings start with $0$.
*   Fixed density optimization means prenecklaces **do not end with 0**.
*   Apply limited reverse checking (Optimization 1) when the form $0^i...0^i{\color{green}b_{a_t}}$ is met. Update ${\color{firebrick}r}$ if equal, terminate if reversal is less.
*   *Challenge:* Direct merging of the incremental RS update (Optimization 2) and fixed density (increasing density by more than one) is tricky.
  *   The fixed density algorithm can append a block of zeros (${\color{green}a_t} - {\color{green}a_{t-1}} > 1$), making the incremental RS check non-constant.

---

### Merging Optimizations - Handling the RS Update 🤔💻🔄

*   The incremental RS update needs to handle cases where multiple characters are appended at once (due to adding non-zero symbol at a specific position).
*   The RS value is computed when ${\color{green}a_t} > ({\color{coral}n}-{\color{firebrick}r})/2 + {\color{firebrick}r}$.
*   If ${\color{green}a_t} - {\color{green}a_{t-1}} > 1$, comparing all characters between ${\color{green}a_{t-1}}+1$ and ${\color{green}a_t}$ takes non-constant time.
*   Only one non-zero symbol is in the block $0^{{\color{green}a_t}-{\color{green}a_{t-1}}-1}{\color{green}b_{a_t}}$.
*   RS can be computed in unit time if ${\color{green}b_{a_t}} \neq {\color{green}b_e}$, where ${\color{green}e} = {\color{coral}n} - {\color{green}a_t} + {\color{firebrick}r} + 1$.
*   If ${\color{green}b_{a_t}} = {\color{green}b_e}$, need to check the substring of zeros starting at ${\color{coral}n} - {\color{green}a_t} + {\color{firebrick}r} + 2$. Use variables ${\color{green}s_i}$ (density up to pos ${\color{green}i}$) and ${\color{green}l_i}$ (length of zero substring starting at pos ${\color{green}i}$).
*   ${\color{green}l_{e+1}} = {\color{green}a_{s_{e+1}}} - {\color{green}a_{s_e}} - 1$.
*   RS update rule based on ${\color{green}b_{a_t}}$, ${\color{green}b_e}$, ${\color{green}a}[t]-{\color{green}a}[t-1]-1$, and ${\color{green}l}[e+1]$.

---

### The Algorithm Structure (High-Level) 🏗️✨

*   Algorithm is a recursive scheme $\text{BraceFD}({\color{green}t}, {\color{firebrick}p}, {\color{firebrick}r}, {\color{green}RS})$.
*   Initialisation $\text{InitFixed}()$ sets up the calls by placing the first non-zero symbol in valid positions.
*   Generates strings belonging to ${\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})$ in lexicographic order.
*   Eliminates necklaces whose reversed rotations are less than the necklace itself.
*   **Theorem 3.1:** $\text{InitFixed}()$ lists all elements of ${\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})$ exactly once in lexicographic order.

---

### Analysis: Proving CAT ⏱️📊

*   Claim: The algorithm works in Constant Amortized Time (CAT).
*   Computation tree represents recursive calls.
*   Size of the computation tree is proportional to $|{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$. (Compared to fixed density necklace algorithm tree size proportional to $|{\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})|$ and $|{\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})| \leq 2|{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$).
*   The work done *per node* (recursive call) is mostly constant.
*   The non-constant part is the $\text{CheckRev}({\color{green}t})$ function.
*   To prove CAT, show that **total symbol comparisons by $\text{CheckRev}({\color{green}t})$ is proportional to $|{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$**.
*   The total number of prenecklaces generated by the scheme is proportional to $|{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$.
*   Each comparison in $\text{CheckRev}({\color{green}t})$ is mapped to a unique prenecklace.

---

### Analysis: The Mapping Proof (Binary Case) 📊🔢

*   Focus first on the binary case (k=2).
*   $\text{CheckRev}({\color{green}t})$ compares $b_j$ with
  *   $b_{a_t-j}$ for ${\color{green}i}+1 \leq {\color{green}j} \leq {\color{green}a_t}/2$.
  *   Stop when ${\color{green}j} > {\color{green}a_t}/2$ or
  *   $b_j \neq b_{a_t-j}$.
*   At most one *unequal* comparison per prenecklace. Cost is constant.
*   Need to bound the number of *equal* comparisons.
*   Define a mapping $f(\beta, {\color{green}j})$ for binary prenecklaces $\beta$ and indices ${\color{green}j}$ where $\beta[1...{\color{green}j}]$ equals its reversal.
  *   $f$ preserves length and content.
*   **Lemma 4.1:** $f(\beta, {\color{green}j})$ is a valid prenecklace generated by the algorithm.
*   **Lemma 4.2:** The mapping $f$ is **one-to-one** for valid $\beta$ and ${\color{green}j}$.
*   This one-to-one mapping implies the number of equal comparisons is bounded by the number of prenecklaces generated for the binary case.

---

### Analysis: The Mapping Proof (General Case k > 2) 🌐🔢

*   The binary mapping $f$ doesn't work for ${\color{coral}k} > 2$.
*   A more complex mapping $g(\beta, {\color{green}j})$ is defined for general ${\color{coral}k}$.
  *   $g$ preserves length and content.
*   **Lemma 4.3:** $g(\beta, {\color{green}j})$ is a valid prenecklace.
*   **Lemma 4.4:** The mapping $g$ is **one-to-one** for valid $\beta$ and ${\color{green}j}$.
*   This one-to-one mapping proves that the total equal comparisons across all prenecklaces is proportional to the number of prenecklaces generated.

---

### Analysis: Final Bound 📈✅

*   Let ${\color{salmon}P'_k}({\color{coral}n}, {\color{coral}d})$ be the number of prenecklaces generated by the fixed density necklace algorithm.
*   Let $C_k({\color{green}i})$ be the number of equal comparisons made by $\text{CheckRev}({\color{green}t})$ on prenecklaces of length ${\color{green}i}$.
*   Total equal comparisons: $\sum C_k({\color{green}i})$ for ${\color{green}i}=1$ to ${\color{coral}n}$.
*   Using Lemma 4.4, $\sum C_k({\color{green}i})$ for ${\color{green}i}=1$ to ${\color{coral}n}-1$ is bounded by ${\color{salmon}P'_k}({\color{coral}n}, {\color{coral}d})$.
*   From, ${\color{salmon}P'_k}({\color{coral}n}, {\color{coral}d})$ is less than $2{\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})$ for prenecklaces not ending in 0.
*   Also $C_k({\color{coral}n}) \leq 2{\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})$.
*   Total comparisons $\leq ({\color{coral}c'} + 2){\color{salmon}N_k}({\color{coral}n}, {\color{coral}d})$ where c' is a constant.
*   Since ${\color{salmon}N_k}({\color{coral}n}, {\color{coral}d}) \leq 2{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})$, Total comparisons $\leq 2({\color{coral}c'} + 2){\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})$.
*   This is ${\color{coral}c} \cdot |{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$ for some constant ${\color{coral}c}$.
*   **Theorem 4.1:** Total equal comparisons are proportional to $|{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$.
*   Since all other work is constant per generated prenecklace (and total prenecklaces is proportional to $|{\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})|$), the algorithm is **CAT**.

---

### Conclusion 🎉✨

*   Developed an **efficient scheme to generate bracelets with fixed density**.
*   Algorithm works for **arbitrary alphabet size** (k).
*   Uses sophisticated combinatorial techniques to prove it works in **Constant Amortized Time (CAT)**.
*   Takes **asymptotic linear space**.
*   Algorithm lists all elements of ${\color{salmon}B_k}({\color{coral}n}, {\color{coral}d})$ **exactly once in lexicographic order**.

---

### Future Work & Applications 🚀🔮

*   **Applications:** Explore the applications of this fixed density bracelet generation algorithm.
*   **Other restricted classes:** Develop schemes for listing other restricted classes of bracelets.
*   Generating necklaces with fixed content for the k-ary case remains an open problem.
*   Counting fixed-density prenecklaces is also an open problem.
*   The scheme has been implemented in C and is available from the authors.
