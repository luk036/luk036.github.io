## 🧭 Part 1 — The Setup

---

### 🎯 What Corr-Solver Solves

Fits a **correlation polynomial** $\Omega(p)$ to a **biased sample covariance** $Y$ — recovering the underlying spatial correlation from noisy data. 📡

$$ \min_{p} \; \log\det {\color{#5e81ac}\Omega(p)} \;+\; \operatorname{Tr}\!\bigl({\color{#5e81ac}\Omega(p)}^{-1} {\color{#bf616a}Y}\bigr)
\qquad \text{s.t.} \quad 2{\color{#bf616a}Y} \succeq {\color{#5e81ac}\Omega(p)} \succeq 0 $$

with $\Omega(p) = \sum_{k} p_k \Sigma_k$ built from basis matrices $\Sigma_k = D_1^{\circ k}$ (element-wise powers of the distance matrix). 🧮

- $n = 20$ sites, $m = 4$ coefficients, $K = 4$ basis matrices
- Constraint is a **linear matrix inequality** — solved by an **ellipsoid method** 🥚
- The objective lives **on the boundary** of the PSD cone 😬

> Small problem. The interesting part is not the size — it is *where the time goes*. 🔍

---

### 🔄 The Cutting-Plane Architecture

.mermaid[

<pre>
graph LR
    CP["cutting_plane_optim\n(ellalgo)"] --> SP["Ell\nsearch space"]
    CP --> OR["Oracle\nassess_optim"]
    OR --> L0["LMI0Oracle\nSigma x_k >= 0"]
    OR --> QM["QMIOracle\nt*I - F F^T >= 0"]
    L0 --> LD["LDLTMgr\nfactor / witness"]
    QM --> LD
    LD --> CUT["cut (g, beta)"]
    CUT --> CP
    style CP fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style OR fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style LD fill:#bf616a,stroke:#8b2c3a,stroke-width:4px,color:#ffffff
    style SP fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
</pre>

]

The oracle answers *"is $x$ feasible?"* and, if not, returns a **separating hyperplane**. 🔪

> Every iteration calls the oracle at least once. Every oracle call runs at least one **LDL^T factorization**. That is the whole story. 🎯

### 🐌 The Root Cause: A Callback Per Matrix Element

The LDL^T factorization is **lazy** — it asks for one element at a time through a Python closure:

```python
def get_elem(i, j):
    return sum(self.mat_f[k][i, j] * x[k] for k in range(n))
```

$$ \text{cost per factorization} \;=\; \underbrace{\frac{n(n+1)}{2}}_{\text{elements}} \times \underbrace{K}_{\text{Python } \texttt{sum}} \;=\; 210 \times 4 $$

- $n = 20$, $K = 4$ → each factorization makes **~120 interpreter calls** 🐍
- The matrices are **tiny**. There are no FLOPs to save — only **overhead to remove** 📦
- Measured: `get_elem` + `eval` is ${\color{#bf616a}56\%}$ of the factorization time

> The work is $O(n^3)$ flops. The *cost* is $O(n^2 K)$ **bytecode dispatches**. 🎯

Reimplement the oracles as Numba `@njit` kernels — the LDL^T, the basis assembly, the gradient. Same arithmetic order, compiled. 🔥

### 🧪 Verifying a Rewrite That Must Not Change the Answer

A faster oracle is worthless if it takes a different path. 😬

- **Kernel-level:** the compiled LDL^T matches `LDLTMgr` on `pos`/`D`/`L`/witness/`ep` over **6,000 random symmetric matrices** ✅
- **Oracle-level:** outputs agree to `1e-8` on random points ✅
- **Trajectory-level:** **0 feasibility-verdict mismatches** across **1,437** real solver-trajectory points ✅

Why the care? The QMI is evaluated **at the PSD boundary**, where the smallest pivot is $\approx 0$:

$$ d_i \;=\; A_{ii} - \sum_{k<i} L_{ik}^2 D_k \;\approx\; {\color{#bf616a}0} \quad\Longrightarrow\quad \operatorname{sign}(d_i) \text{ is decided by rounding} $$

Any reordering of the arithmetic can flip **which pivot** goes negative first → a different cut → a different trajectory. 🎲

> Correct answer, different iteration count, is *expected*. Different **answer** is not. ✅

## 🐛 Part 3 — The Bug Behind the Iterations

---

### 😳 2000 Iterations for a 4-Variable Problem

A 4-variable problem should not need 2000 cutting-plane steps.

| case | iterations | stop reason |
|:-----|-----------:|:------------|
| `lsq_corr_poly` | **2000** | `max_iters` 😬 |
| `lsq_corr_poly2` | 1089 | tolerance |
| `mle_corr_bspline` | 371 | `NoEffect` ✅ |

And the test assertion was **vacuous**:

```python
assert num_iters <= 2000   # the old code ALWAYS returned exactly 2000
```

> An assertion that cannot fail is not a test. 🧪

### 🧮 Why: An Absolute Tolerance on a Scale-Dependent Width

`bsearch` compared a **width** against an **absolute** constant:

```python
tau = (upper - lower) / 2
if tau < options.tolerance:      # tolerance = 1e-20
    return upper, niter
```

$$ \text{stop} \iff \tau < 10^{-20}, \qquad \tau \;\ge\; \operatorname{ulp}\!\bigl(\max(|{\color{#5e81ac}\text{lower}}|, |{\color{#bf616a}\text{upper}}|)\bigr) \approx {\color{#bf616a}10^{-16}} $$

The bracket converges to $t^\* = 1.4475$, not to $0$ — so $\tau$ bottoms out at $\operatorname{ulp}(1.4475) \approx 1.11 \times 10^{-16}$. 📌

$$ {\color{#bf616a}1.11 \times 10^{-16}} \;\not<\; {\color{#5e81ac}10^{-20}} \quad\Longrightarrow\quad \text{unreachable, for any realistic scale} $$

> An absolute tolerance on a scale-dependent quantity is a bug waiting for a scale. 💣

---

### ✅ The Fix: A Stall Guard

Three lines, no new options, **bit-identical result**:

```python
gamma = lower + tau
if not (lower < gamma < upper):
    return upper, niter        # the midpoint can no longer move
```

| | before | after |
|:--|-------:|------:|
| iterations | 2000 | **61** |
| objective $t$ | 1.4475055597437385 | **1.4475055597437385** ✅ |
| stop reason | `max_iters` | stall |

The guard **cannot** change the answer: it fires only when no further refinement is *representable*. 🎯

> 61 is the information-theoretic floor: $\log_2\!\bigl(939 / \operatorname{ulp}(1.4475)\bigr) \approx 62$. 📐

### 📦 Root Cause Lives in `ellalgo` → v0.8

The bug is in the **shared driver**, not in corr-solver — so it was fixed at the source. 🔧

- `ellalgo` is a separate repo; corr-solver installs it from git 🔗
- Fix landed with a **regression test that fails without the guard** (2000 vs <200) 🧪
- Released as **`ellalgo` v0.8**, then corr-solver's bound tightened `2000 → 100` 🔒

```python
# tests/test_corr_fn.py
assert num_iters <= 100    # fails against an unpatched ellalgo
```

> The vacuous assertion is now a real one — and it catches a **cross-repo** regression. 🌉

## 🪤 Part 4 — Three Traps

---

### 🙃 Trap 1: The Vectorization That Passed 300 Spot-Checks

I replaced the row-wise LDL^T with a vectorized one. It agreed on **300/300** random points. ✅

It was **wrong**: it read `L[i, :i]` *before* those entries were computed. 🐛

| | correct | "optimized" |
|:--|--------:|-----------:|
| `lsq_corr_poly` iterations | 2000 | **63** ❌ |
| `ep` (violation) | 1428922.09 | 198.25 ❌ |
| verdicts on random points | — | 300/300 agree 😬 |

The fix: the vectorized LDL^T must be **column-wise (left-looking)**, not row-wise. 🧭

> **Spot-checking random points is not validation.** Assert the *iteration count*. 🎯

---

### 💥 Trap 2: The Ellipsoid That Returns *Wrong* Answers

"Tighten the initial ellipsoid" looked like free speed. It is not. 🪤

| initial box | iterations | objective $\gamma$ |
|:--|-----------:|------------------:|
| `val[-1] = normY2**2` (current) | 1059 | **1.4475** ✅ |
| `val[-1] = normY2**2 * 1e-6` | **181** ⬅ faster! | **14961** ❌ |

The true optimum falls **outside** the shrunken box, so the solver returns the best point *inside* it — a valid-looking, **silently wrong** answer. 😱

For the MLE path, $\alpha = 0.1$ fails outright: $\gamma = \texttt{inf}$. 💀

> A speedup that changes the answer is not a speedup. It is a bug with a nice benchmark. 🚨

---

### 📉 Trap 3: Parallel Cuts — and a Claim I Had to Retract

**Parallel cuts:** `EllCalc.use_parallel_cut` is already `True`, but it only activates when the oracle returns a **pair** of betas. These oracles return **scalars**, so it never fires. Enabling it means changing oracle semantics for ~2×. **Rejected.** ❌

**A claim I published and then had to retract:** 📝

$$ \text{I claimed } \Sigma_k = D_1^k \text{ are matrix powers} \implies \text{they commute} \implies \text{shared eigenbasis} \implies O(n^2) \text{ per iteration} $$

But the code says:

```python
D = np.multiply(D, D1)     # element-wise (Hadamard) powers!
```

Hadamard powers of a symmetric matrix are symmetric — and **generally do not commute**. The shortcut does not apply. 🚫

> I filed the wrong claim in a public issue, then corrected it. Retracting beats rationalising. ✅

## ⚙️ Part 5 — C++: Same Bug, Different Physics

---

### 🐛 The Same Bug in `ellalgo-cpp` → v1.6.14

The C++ port had the **identical** defect — an absolute `tolerance` against a scale-dependent `tau`:

```cpp
auto tau = algo::half_nonnegative(upper - lower);
if (tau < options.tolerance) return {upper, niter};
// ... spins to max_iters for the same reason
```

Same guard, same proof:

| | before | after |
|:--|-------:|------:|
| iterations | 2000 | **< 200** |
| threshold found | 500.0 | 500.0 ✅ |

- Regression test **fails without the guard**: `CHECK( 2000 < 200 )` 🧪
- Released as **`ellalgo-cpp` v1.6.14**; 138 cases / 502 assertions ✅

> Interesting: corr-solver-cpp's LSQ driver uses `cutting_plane_optim`, **not** `bsearch` — so it never hit this. The bug was live for every *other* consumer. 🌍

---

### 🗑️ In C++, the Interpreter Is the Allocator

There is no bytecode to remove. The analogous overhead is **allocation churn in the hot path**:

- `MleOracle::assess_optim` allocated **five $n \times n$ buffers** per call 🗑️
- `QmiOracle::assess_feas` allocated four more, including an $O(n^2)$ scratch 📦
- `trace()` built a **vector** just to sum its own diagonal 🤦
- `norm()` built a full `a * a` **copy** 📋

And the matrix multiply walked `B` **column by column** (stride $n$) — cache-hostile and unvectorizable:

```cpp
// i-k-j order: B(t,:) and out(i,:) are contiguous → the inner loop vectorizes
for (i) for (t) { const auto a = A(i,t); for (j) out(i,j) += a * B(t,j); }
```

> Same lesson, different physics: find the per-iteration overhead, then remove it. 🎯

---

### 📉 MLE Gradient: $O(n^4) \to O(n^3)$

The gradient computed $n$ separate $n \times n$ products **per oracle call** — $O(n^4)$ overall. 😱

But the trace has a cyclic-permutation identity:

$$ g_i \;=\; \operatorname{Tr}\!\bigl(S{\color{#5e81ac}\Sigma_i}\bigr) - \operatorname{Tr}\!\bigl({\color{#5e81ac}\Sigma_i} S Y S\bigr)
\;=\; \bigl\langle\, {\color{#bf616a}S - SY S},\; {\color{#5e81ac}\Sigma_i} \,\bigr\rangle_F $$

Forming ${\color{#bf616a}V = S - SY S}$ **once** turns a per-$i$ $O(n^3)$ product into an $O(n^2)$ inner product. 🪄

### 🧹 De-duplicating the Benchmark (−230 Lines)

The benchmark contained a **verbatim copy** of the implementation. 📄📄

- Any fix in `source/lsq_corr_ell.cpp` would **not** reach the benchmark 🚫
- I was about to fix the same bug **twice** — the signal that something is wrong 🚩
- Now the benchmark declares `extern` and links the real library ✅

```lua
-- xmake.lua
add_files("benchmark/source/*.cpp")
add_files("source/*.cpp")          -- the real implementation, once
```

> If a benchmark copies the code it measures, it measures a **different program**. 🎯

### 🧠 Key Takeaways

**Performance** ⚡
- **Profile first** — 72% was one factorization, 56% of *that* was element access 🔍
- Match the fix to the physics: Python → **JIT**; C++ → **stop allocating** 🐍⚙️
- An absolute tolerance on a scale-dependent width is a **latent bug** 💣
- `2000 → 61` iterations came from **termination**, not from a better algorithm 📉

**Correctness** 🐛
- A speedup that changes the answer is a **bug with a nice benchmark** 🚨
- **Spot-checking is not validation** — assert the iteration count 🧪
- Bit-identical is a *feature*: it proves you changed the cost, not the math ✅
- Validate the invariant that matters — here, **feasibility verdicts** (0/1437 mismatches) 🎯

**Process** 🔁
- Machine state drifts **2.4×**; alternate A/B and use CPU time 📏
- If a fix must be applied **twice**, that is the bug 🚩
- Retracting a published claim beats rationalising it 📝
