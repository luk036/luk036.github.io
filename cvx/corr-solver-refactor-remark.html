## 🔍 Part 1 — Why Refactor?

---

### 📐 What corr-solver Computes

Fit a correlation model $\Omega(p) = \sum_k p_k \Sigma_k$ built from pairwise site distances:

$$ \Omega(p) \;=\; \sum_{k} {\color{#5e81ac}p_k}\,{\color{#a3be8c}\Sigma_k}, \qquad (\Sigma_k)_{ij} = \varphi_k\!\left(\lVert s_i - s_j\rVert\right) $$

.pull-left[

**LSQ** 📏 — least-squares residual

$$ \min_{p}\; \lVert {\color{#bf616a}Y} - {\color{#5e81ac}\Omega(p)} \rVert_F \quad \text{s.t.} \quad {\color{#5e81ac}\Omega(p)} \succeq 0 $$

**MLE** 📊 — Gaussian likelihood

$$ \min_{p}\; \log\det {\color{#5e81ac}\Omega(p)} + \operatorname{Tr}\!\bigl({\color{#5e81ac}\Omega(p)}^{-1}{\color{#bf616a}Y}\bigr) $$

$$ \text{s.t.}\quad 2{\color{#bf616a}Y} \succeq {\color{#5e81ac}\Omega(p)} \succeq 0 $$

]

.pull-right[

**CCP** ♻️ — convex-concave procedure

$$ \min_{\Omega}\; \operatorname{Tr}(\Omega^{-1}{\color{#bf616a}Y}) + \operatorname{Tr}\!\bigl({\color{#5e81ac}M_k}\,\Omega\bigr), \quad {\color{#5e81ac}M_k} = \Omega_k^{-1} $$

- All three solved by the **ellipsoid / cutting-plane** method ✂️
- Oracles: `LMI0`, `LMI`, `QMI` + a `GMIOracle` decorator
- Same `assess_feas` / `assess_optim` protocol everywhere 🔌

]

### 🔍 The Audit — What We Found

.font-sm[

| smell 💨 | Python 🐍 | C++ ⚙️ | Rust 🦀 |
|:--|:--:|:--:|:--:|
| **no public interface** — consumers re-declare symbols | via duck typing | `extern` in **4** files 📛 | re-implemented drivers |
| **solver cores copy-pasted** | **7** copies 😱 | 3 (fitting + 2 bins) | 2 (test + bin) |
| **scratch / objective duplicated** | 3 copies | 2 oracle classes | 2 modules |
| **magic start values** (`256`, `4`, `500`, `1e100`) | 3 sites | 3 sites | 3 sites |
| **`Arr`↔matrix conversions** | n/a | n/a | **6** copies 😱 |
| **cross-imports between experiments** | 3 hops 🔗 | n/a | n/a |
| **mutable global RNG** | `np.random.seed` | `random_seed(5)` | `thread_local!` |
| **dead / broken scripts** | `plot_models.py`, `gaussian.py` 💀 | — | — |

]

> 🚨 None of these were *bugs* — the tests passed. They were **taxes on every future change**. 💸

## 🧰 Part 2 — The Playbook

---

### 🧰 Nine Patterns, One Playbook

.font-sm[

| # | pattern 🎨 | what it fixes | where it landed |
|:--|:--|:--|:--|
| 1 | **Facade** 🏛️ | missing public API | `corr_solver.hpp`, `fitting.rs` |
| 2 | **Strategy / Protocol** 🔌 | poly vs B-spline, x-layouts | `basis`, `layouts`, `protocols` |
| 3 | **Extract Class / Template Method** 🧩 | shared MLE scratch | `MleScratch` + `optim_cut` |
| 4 | **Value Object** 📦 | sentinel `Arr{}` / `Option` | `FitResult` |
| 5 | **Abstract Factory** 🏭 | pure-Python vs Numba | `backends`, `make_backend` |
| 6 | **Factory** 🧪 | hardcoded kernels | `kernels`, `KERNELS` |
| 7 | **Decorator** 🎀 | monotone constraint | `MonoDecreasingOracle2` + `with_mono` |
| 8 | **Dependency Injection** 💉 | global RNG | `rng=` / `seeded_rng` |
| 9 | **Facade over shared helpers** 🧵 | duplicated utilities | `convert`, `ndops`, `math_utils` |

]

> ⚖️ Patterns are only worth it when they **delete duplication** or **name a hidden contract**. Otherwise they add indirection. 🚫

### 🏛️ Pattern 1 — Facade: The Missing Interface

.pull-left[

**Before** ❌ — no header, so every consumer guessed:

```text
tests       ---- extern decls ----.
benchmark   ---- extern decls ----.--> lsq_corr_ell.cpp
experiments ---- extern decls ----'     (419 lines, everything)
```

- signatures drift silently 🐛
- change a default arg → link error 💥
- oracles trapped inside a `.cpp` 🔒

]

.pull-right[

**After** ✅ — one header owns the contract:

.mermaid[

<pre>
graph LR
    T["tests"] --> H["corr_solver.hpp"]
    B["benchmark"] --> H
    E["experiments"] --> H
    H --> C["corr_solver.cpp"]
    H --> O["oracles\nhpp + cpp"]
    H --> L["layouts\nhpp + cpp"]
    H --> G["geometry + sites\ncpp"]
    style H fill:#ffccbc,stroke:#bf360c,stroke-width:3px
    style T fill:#eceff4,stroke:#4c566a,stroke-width:3px
    style B fill:#eceff4,stroke:#4c566a,stroke-width:3px
    style E fill:#eceff4,stroke:#4c566a,stroke-width:3px
    style C fill:#d5f5e3,stroke:#2e7d32,stroke-width:3px
    style O fill:#d5f5e3,stroke:#2e7d32,stroke-width:3px
    style L fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style G fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
</pre>

]

- consumers `#include`, never `extern` 📎
- **4** hand-written declaration blocks **deleted** 🧹

]

> ✍️ A facade is the cheapest pattern with the highest leverage: it turns *convention* into a *compiler-checked contract*. 🔒

### 🔌 Pattern 2 — Strategy: Basis & Layout

.pull-left[

**Two orthogonal strategies** 🧭

$$ \text{model} \;\times\; \text{variable layout} $$

- **`Basis`** — *what* the columns are
  - `PolynomialBasis` → $\varphi_k(d) = d^k$
  - `BSplineBasis` → clamped quadratic, monotone 🎀
- **`Layout`** — *which variables* the solver sees
  - `MleLayout` → plain $x \in \mathbb{R}^m$
  - `LsqAugmentedLayout` → $(x, t) \in \mathbb{R}^{m+1}$

]

.pull-right[

.mermaid[

<pre>
graph TB
    F["fit(Y, site, m, oracle, core, basis)"] --> B1["PolynomialBasis"]
    F --> B2["BSplineBasis"]
    B1 --> L["Layout\ninitial guess"]
    B2 --> L
    L --> M["MleLayout\nplain n"]
    L --> A["LsqAugmented\ncoeffs + t"]
    style F fill:#ffccbc,stroke:#bf360c,stroke-width:3px

</pre>

]

> 🧠 The augmented-variable convention was a **leaky abstraction**: every caller hardcoded `n+1` or `n`. Now it is *declared once*. 📣

### 🧩 Pattern 3 — Extract Class / Template Method

.pull-left[

**The duplicated MLE preamble** 🔁

Both MLE-family oracles did:

$$ R \leftarrow \sqrt{\Omega}, \quad S \leftarrow R^{-\top}R^{-1}, \quad SY \leftarrow S{\color{#bf616a}Y} $$

…and both ended with the *same* shrink:

```text
if f < 0:  t = value;  f = 0;  shrunk = true
```

- **2** copies in C++ 🔴
- **2** copies in Rust 🔴
- 1 copy in Python 🔴

]

.pull-right[

.mermaid[

<pre>
graph LR
    M["MleOracle"] --> S["MleScratch\nR, S, SY"]
    C["CccpMleOracle"] --> S
    M --> O["optim_cut\nt + cut"]
    C --> O
    S --> L["LDLT sqrt\ninv_upper_tri"]
    style M fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style C fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style S fill:#d5f5e3,stroke:#2e7d32,stroke-width:3px
    style O fill:#f3e5f5,stroke:#6a1b9a,stroke-width:3px
    style L fill:#eceff4,stroke:#4c566a,stroke-width:3px
</pre>

]

> 🧷 One class owns the *shared scratch*; one function owns the *best-so-far fold*. The oracles now differ **only** in their gradient. 🎯

]

### 📦 Pattern 4 — Value Object: `FitResult`

.pull-left[

**Before** ❌ — three answers, two conventions:

```python
# Python: tuple, empty array = failure
return np.poly1d(pa), num_iters, feasible

# C++: tuple, Arr{} = failure
return std::tuple&lt;Arr, size_t&gt;{Arr{}, iters}

# Rust: Option vs empty, mixed
-> (Arr, usize)      // 0-length = failure
-> (Option&lt;Arr&gt;, usize)  // None = failure
```

- failure signal is **positional** 👎
- callers write `coeffs.size() != m` 🤞

]

.pull-right[

**After** ✅ — one named shape, everywhere:

```rust
pub struct FitResult {
    pub coeffs: Arr,
    pub iters: usize,
    pub ok: bool,
}
```

```python
class FitResult(NamedTuple):
    curve: Any
    num_iters: int
    feasible: bool
```

```cpp
struct FitResult {
    Arr coeffs;
    size_t iters;
    bool ok;
};
```

- failure is **named**, not inferred 🏷️
- Python keeps tuple-unpacking via `NamedTuple` 🐍

]

> 🔎 Bonus: `ok` exposed a **latent silent failure** — the old code returned a zeros vector on failure and callers treated it as success. 🙈

### 🏭 Pattern 5 — Factory: Backends & Kernels

.pull-left[

**Backends** — same interface, two engines 🚗🚙

```python
backend = make_backend("numba")

```

- Python: `PurePythonBackend` ↔ `NumbaBackend` ⚡
- tests compare them **through the factory**, not by hand 🔬

**Kernels** — one place for the radial profiles 🧪

```python

### 🎀 Pattern 6 — Decorator: Monotone Coefficients

.pull-left[

**`MonoDecreasingOracle2`** wraps any basis oracle 🎁

```python
if cut := mono_oracle(x[:k]):
    return (g, fj), None      # monotone violated
return self.basis.assess_optim(x, t)
```

- enforces $x_1 \ge x_2 \ge \dots \ge x_k$ 📉
- trailing objective variable **left unconstrained** 🎯
- zero-cost when `n_coeff = None` ✅

**Behaviour preserved bit-for-bit:** already-entangled with the
iteration-count tests (`<= 1054`, `<= 388`) 🔒

]

.pull-right[

**But the *call sites* were duplicated** 🔁

```text
if n_coeff:  Core(MonoDecreasing(basis, n))   # once
else:        Core(basis)                       # twice
```

- Python → helper closure 🐍
- C++ → `with_mono(basis, n, core)` 🧵
- Rust → **macro** 🦀 *(static dispatch: `Mono<O>` ≠ `O`, so a plain helper cannot typecheck)*

.mermaid[

<pre>
graph LR
    CORE["core"] --> W{"n_coeff set?"}
    W -->|yes| D["MonoDecreasingOracle2"]
    W -->|no| R["raw oracle"]
    D --> B["basis oracle"]
    style CORE fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style W fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style D fill:#f3e5f5,stroke:#6a1b9a,stroke-width:3px
    style R fill:#eceff4,stroke:#4c566a,stroke-width:3px
    style B fill:#d5f5e3,stroke:#2e7d32,stroke-width:3px
</pre>

### 💉 Pattern 7 — Dependency Injection: The RNG

.pull-left[

**Before** ❌ — a global that *everyone* mutated 🌍

```python
np.random.seed(5)          # Python: global state
random_seed(5)             # C++: free function
```

```rust
thread_local! { static RNG: RefCell&lt;StdRng&gt; }   // Rust
```

- hidden coupling between generator and caller 🕸️
- tests can't run in parallel safely 🏃‍♂️🏃‍♀️
- "who last seeded?" is unanswerable 🤷

]

.pull-right[

.mermaid[

<pre>
graph LR
    G1["global RNG"] -.->|before| S1["create_2d_isotropic"]
    R1["explicit StdRng"] -->|after| S2["create_2d_isotropic_with"]
    S1 --> Y1["Y"]
    S2 --> Y2["Y\nsame stream"]
    style G1 fill:#fde2e4,stroke:#c0392b,stroke-width:3px
    style R1 fill:#d5f5e3,stroke:#2e7d32,stroke-width:3px
    style S1 fill:#eceff4,stroke:#4c566a,stroke-width:3px
    style S2 fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style Y1 fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style Y2 fill:#fff9c4,stroke:#f57f17,stroke-width:3px
</pre>

]

**After** ✅ — explicit and *byte-identical* 🔬

```python
create_2d_isotropic(site, N, rng=None)   # rng defaults to RandomState(5)
```

> 🧪 Verified: `max|Y_old − Y_new| = 0.0`. Injected RNG, same stream. 🎯

]

## ✅ Part 4 — Verification

---

### 🔬 Why Arithmetic Order Is Sacred

The QMI oracle is evaluated **at the boundary** of the positive-semidefinite cone:

$$ \operatorname{eig}_{\min}\!\bigl({\color{#5e81ac}t I} - F(x)^\top F(x)\bigr) \;\approx\; 0 $$

> The **first pivot to turn negative** is decided by rounding. 🎲

- a different summation order → a **different separating cut** ✂️
- → a different iteration count 📈
- → a different answer (by $\sim 10^{-3}$ near the boundary) 🌀

**Therefore the refactor rule was:** 🚦

```text
move code, not arithmetic
keep the association:  exp(-rate * d * d), never exp(-rate * (d*d))
```

> 😅 We *did* trip this once — a kernel factory taking $r^2$ instead of $r$ changed
> `-0.12*dd*dd` into `-0.12*(dd*dd)` and moved **every experiment row**. Caught by the golden CSVs. 🎣

---

    CPP["C++\nxmake build -a\nxmake test"] --> E

- Python: `max|Y_old − Y_new| = 0.0` 🎯

- iterates over *exactly* the same path 🛤️
- detects re-association that unit tests forgive 🕵️
- makes the refactor **reviewable in one line**: `git diff --stat` 📊

]

## 🎓 Part 5 — Lessons

---

### ✅ What Worked

.pull-left[

**1. Order of operations** 🧭

```text
audit  ->  issue with acceptance criteria  ->  implement  ->  verify
```

- the **issue** became the checklist 📋 (12 items each)
- acceptance criteria written *before* touching code ✍️

**2. Small, verifiable phases** 🪜

- Phase 1 quick wins → Phase 2 structure → Phase 3 patterns
- **build + test after every phase** 🔁
- never more than one green-to-green step in flight 🟢→🟢

**3. Delegate the boring parts** 🤖

- duplication hunts were mechanical; the *decisions* were not 🧠

]

.pull-right[

**4. Let the sibling projects cross-check** 🌍

- three ports of one algorithm = three independent reviews 🔍
- the Rust port found the C++ `inv(triangular)` bug earlier 🐛
- the same patterns ported **with idioms**, not verbatim 🔤

**5. Name the thing** 🏷️

- `FitResult`, `MleScratch`, `Layout`, `Basis` — names *are* design 🧠
- a named concept can be tested, moved, and reused ♻️

**6. Keep facades** 🏛️

- re-export old names (`corr_poly`, `construct_poly_matrix`) so
  downstream code & docs **keep compiling** 📎

]

---

### 🚫 Anti-Patterns We Avoided

.font-sm[

| ❌ anti-pattern | 😱 the trap | ✅ what we did |
|:--|:--|:--|
| **big-bang rewrite** | one branch, no green builds for days | phase per commit-range 🪜 |
| **refactor + feature** | changing behaviour *and* shape at once | behaviour frozen; only move code 🧊 |
| **"tests pass" as proof** | unit tests forgive re-association | golden CSVs + iteration bounds 🔬 |
| **patterns for their own sake** | `AbstractFactoryFactory` 🏭🏭 | every pattern deleted a duplicated site 🧹 |
| **type suppressions** | `as any`, `@ts-ignore`, raw `unsafe` | fixed the real boundary instead 🧱 |
| **touching arithmetic** | "simplify" `exp(-r*d*d)` | kept association, documented why 📝 |
| **deleting failing tests** | turn red into green the wrong way | re-baselined **deliberately**, with reason 🎯 |
| **unused `extern` drift** | signature silently diverges | one header owns the contract 📎 |

]

> 🧯 The blast radius of a refactor is proportional to how *unverified* the behaviour was. Golden outputs shrink it. 🔬

---

### ⚖️ When **Not** to Refactor

.pull-left[

**Stop signs** 🛑

- 🚧 the code is about to be **deleted** — YAGNI
- 🧪 no tests **and** no golden outputs → refactor is a gamble 🎲
- 🔬 the "ugliness" encodes **numerical** knowledge (ordering!) 🥇
- 🕰️ a spike you will throw away in a week ⏳
- 🧩 the abstraction would have **exactly one** implementation

]

.pull-right[

**Green lights** 🟢

- 🧬 the same logic appears **3+ times** and drifts 🔁
- 🔒 consumers guess a contract (`extern`, duck typing) 📎
- 🧠 a concept is **unnamed** but recurs (`Layout`, `FitResult`) 🏷️
- 🚪 an implementation detail **leaks** into every caller 💧
- ✅ you have a **cheap equivalence oracle** (tests *or* golden files) 🔭

> 🧭 *"Make the change easy, then make the easy change."* — Kent Beck ⚡

]
