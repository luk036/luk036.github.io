## Part 1: B-spline Basics 📐

---

### 🎯 Introduction

- Convex fitting: Approximating data with a convex function 🎯
- B-splines: Flexible and powerful basis functions 🧩
- Combining convexity constraints with B-spline representation ⚖️

### 📐 B-splines Basics

- Piecewise polynomial functions 🧩
- Defined by:
  - Degree of polynomials
  - Knot sequence
  - Control points
- Properties:
  - Local support
  - Smoothness
  - Easy to manipulate

### 📝 B-spline Representation

A B-spline curve is represented as:

$$ f(x) = \sum_{i=1}^n {\color{orange} c_i} \, {\color{blue} B_i(x)} $$

Where:
- ${\color{orange} c_i}$ are control points
- ${\color{blue} B_i(x)}$ are B-spline basis functions

---

### ✅ Ensuring Convexity in B-splines

A sufficient condition for convexity:

$$ {\color{orange} c_{i+1} - c_i} \geq {\color{orange} c_i - c_{i-1}} \quad \forall i$$

This ensures that the second derivative is non-negative everywhere.

## Part 2: Optimization ⚙️

---

### 🎯 Convex Fitting Problem

Given data points $(x_j, y_j)$, we want to:

Minimize: $\sum_j (f(x_j) - {\color{royalblue} y_j})^2$

Subject to:
- $f$ is convex
- $f$ is a B-spline

.mermaid[
<pre>
graph LR
    A[Data Points] --> B[Select Basis]
    B --> C[Formulate QP]
    C --> D[Solve]
    D --> E[Fitted Curve]
    style A fill:#fff3e0,stroke:#e65100,stroke-width:3px
    style B fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style C fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style D fill:#f3e5f5,stroke:#7b1fa2,stroke-width:3px
    style E fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>
]

---

### 📐 Optimization Formulation

Minimize: $\sum_j (\sum_i {\color{orange} c_i} {\color{blue} B_i(x_j)} - {\color{royalblue} y_j})^2$

Subject to:
- $c_{i+1} - c_i \geq c_i - c_{i-1}$ forall i
- Additional constraints (e.g., boundary conditions)

---

### ⚙️ Solving the Optimization Problem

- Quadratic Programming (QP) problem 📈
- Efficient solvers available (e.g., CVXOPT, MOSEK) 🚀
- Can handle large datasets and many control points ⚡

---

### 🏆 Advantages of B-spline Convex Fitting

1. Flexibility in representing complex convex shapes 🎨
2. Smoothness control 📈
3. Local control of the fit 🎯
4. Efficient computation and evaluation ⚡

- Data: Input-output pairs from a production process
- Goal: Estimate a convex production function
- Approach: Fit a convex B-spline to the data
