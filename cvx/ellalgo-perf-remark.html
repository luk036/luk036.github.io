## 🧭 Part 1 — The Setup

---

### 👁️ What Ellalgo Solves

The **ellipsoid method** (Khachiyan, 1979) solves convex feasibility / optimization
by shrinking an ellipsoid until it isolates a solution. 🎯

$$ \mathcal{E} = \{\, x \mid (x - x_c)^\top M^{-1} (x - x_c) \le \kappa \,\} $$

.mermaid[

<pre>
graph LR
    XC["Center x_c\ncurrent guess"]
    OR["Oracle\nassess(x_c)"]
    CUT["Cut\n(g, beta)"]
    UPD["Ellipsoid update\nshrink M, kappa"]
    XC -->|"x_c"| OR
    OR -->|"infeasible"| CUT
    CUT --> UPD
    UPD -->|"next iter"| XC
    OR -->|"feasible ✅"| DONE["Return x_c"]
    style XC fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style OR fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style CUT fill:#f8bbd0,stroke:#c2185b,stroke-width:3px
    style UPD fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style DONE fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
</pre>

]

> The loop runs $10^3$–$10^5$ times. Every microsecond per iteration matters. ⏱️

---

### 🧮 The Hot Equation

Each iteration performs a **rank-1 update** of the shape matrix:

$$ \tilde g = {\color{#1565c0} M}\,g, \qquad
   \omega = {\color{#1565c0} g^\top \tilde g}, \qquad
   \tau^2 = \kappa\,\omega $$

$$ x_c \;\leftarrow\; x_c - \frac{\rho}{\omega}\,{\color{#c2185b}\tilde g},
   \qquad
   M \;\leftarrow\; M - \frac{\sigma}{\omega}\,
   {\color{#c2185b}\tilde g\,\tilde g^\top},
   \qquad
   \kappa \;\leftarrow\; \delta\,\kappa $$

- $\tilde g$ is a **matrix–vector product** — the only $O(n^2)$ work per iteration 🔁
- $\rho, \sigma, \delta$ come from the cut strategy (central / deep / parallel) ✂️
- `EllStable` keeps an $LDL^\top$ factorization instead of $M$ directly 🧱

> We will see the **same allocation bug** hide behind this equation in all three ports. 🐛

### 🐌 The Offending Loop

```python
def assess_feas(self, x):
    for _ in range(self.nwpass):              # passband
        col_k = self.spectrum[self.idx1.next(), :]
        v = col_k.dot(x)                      # &lt;-- 1.6 M numpy calls!
        if v > self.up_sq:
            return col_k, (v - self.up_sq, v - self.lp_sq)
        if v < self.lp_sq:
            return -col_k, (-v + self.lp_sq, -v + self.up_sq)
    # ... then stopband, then transition band ...
```

- Each `dot` is length $N = 32$ — **pure interpreter dispatch overhead** dominates 🐢
- Three bands are scanned; the round-robin cursor rotates across calls 🔄
- The math is trivial; the *call count* is the problem

### 💡 The Insight: One gemv, Then Masks

Replace ~480 tiny dots with **one BLAS matrix–vector product** per band:

$$ v = {\color{#1565c0} A}\, x, \qquad v_i = \sum_{j} A_{ij}\, x_j $$

### 🧩 The Vectorized `assess_feas`

```python
def assess_feas(self, x):
    v1 = self.spectrum[: self.nwpass] @ x          # one gemv, passband
    over1  = v1 > self.up_sq
    under1 = v1 < self.lp_sq
    j1 = self._first_rotated(over1 | under1, self.idx1.peek_next())
    if j1 >= 0:
        self.idx1.seek(j1)                          # preserve the cursor
        col_k = self.spectrum[j1, :]
        ...
```

- `_first_rotated(mask, offset)` finds the first violation in **cyclic order**
- No index array is materialised — just a **tail slice, then head slice** 🪓
- Bands are still evaluated **lazily**: stopband is skipped if the passband violates

### 🧹 Bonus: The Ellipsoid Update Itself

Three micro-fixes inside `Ell._update_core`:

```python
_TINY = float(np.finfo(np.float64).tiny)        # hoist the constant

if not grad.any():                              # was: np.all(grad == 0.0)
    raise ValueError("Gradient cannot be a zero vector.")
...
self._mq -= (sigma / omega) * (grad_t[:, None] * grad_t)   # was: np.outer(...)
```

| Fix | Why |
|:----|:----|
| `_TINY` module constant | `np.finfo(...)` rebuilt **every call** (~1.3 µs) |
| `not grad.any()` | avoids a temporary boolean array (~10 µs) |
| `grad_t[:, None] * grad_t` | skips the `np.outer` Python wrapper |

> Each is small — but they compound across $10^4$ iterations. 🧱

## ⚙️ Part 3 — C++: Expression Temporaries

---

### 🧾 Finding 1 — valarray Expression Temporaries

`EllCore::_update_core` used valarray expression templates — **three temporaries per call**:

```cpp
this->_v = 0.0;
for (i) for (j) this->_v[i] += this->_mq(i, j) * grad[j];

const auto omega = (this->_v * grad).sum();     // temp #1
...
grad = this->_v * (result.rho / omega);         // temp #2 + copy
```

Replaced with explicit loops that write straight into the pre-allocated buffers:

```cpp
for (size_t i = 0; i != this->_n; ++i) {
    auto s = 0.0;
    for (size_t j = 0; j != this->_n; ++j) s += this->_mq(i, j) * grad[j];
    this->_v[i] = s;
}
auto omega = 0.0;
for (size_t i = 0; i != this->_n; ++i) omega += this->_v[i] * grad[i];
```

> `std::valarray` arithmetic allocates. In a hot loop, that is the whole cost. 💸

---

### 🧾 Finding 2 — A Fresh Buffer Every Iteration

The **outer** wrapper allocated a valarray on every call:

```cpp
template <typename T, typename Fn>
auto _update_core(const std::pair&lt;Arr, T&gt;& cut, Fn&& cut_strategy) -> CutStatus {
    const auto& grad = cut.first;
    std::valarray&lt;double&gt; g(this->_n);   // &lt;-- heap allocation, every iteration!
    for (size_t i = 0; i != this->_n; ++i) g[i] = grad[i];
    ...
}
```

Fix: a **pre-allocated scratch member**, matching what `EllStable` already did:

```cpp
class EllBase {
    Vec _g;   // scratch buffer for the cut gradient / center displacement
};
...
auto& g = this->_g;                 // no allocation
for (size_t i = 0; i != this->_n; ++i) g[i] = grad[i];
```

> The stable variant was already clean — the classic path had been forgotten. 😴

---

### 🧾 Finding 3 — LMI Oracle: Reuse the Cut Buffer

`lmi-solver-cpp` built a **fresh Eigen vector** on every infeasible assessment:

```cpp
// before
Vec g{x};                                     // heap alloc + copy of x
for (i) g[i] = sign * mgr.sym_quad(this->m_F[i]);
this->cut->first = std::move(g);

// after — reuse the persistent cut buffer
auto& g = this->cut->first;
g = x;                                        // reuses storage after first call
for (i) g[i] = sign * mgr.sym_quad(this->m_F[i]);
```

Also added `v = cv;` to the internal `VecConcept` so the reuse is generic. 🔧

> Three files, three allocations removed, one idea. 🎯

### 📉 The Negative Results (Equally Important)

I tried the "obvious" ports of the Python win. **None helped.**

.font-sm[

| Idea | Result | Verdict |
|:-----|:-------|:--------|
| Flatten the spectrum to contiguous storage | 15.1 → 17.6 µs | nested valarray already fastest ❌ |
| One `valarray` expression `(row * x).sum()` | 81.2 µs | allocates per row ❌ |
| Dense Eigen assembly `A -= x[k]*F[k]` | 2.1× worse (m=2), 1.29× (m=16) | lazy per-element wins ❌ |
| Eigen segment `.dot()` in LDLᵀ | 1.16× worse | scalar loop wins ❌ |

]

**Why?** In compiled code the per-row dot is already tight, and the scan
**stops at the first violation**:

$$ \underbrace{\textstyle\sum_{\text{scanned}} \|\text{row}\|}_{\text{early exit} \approx \frac{1}{2}m}
   \;<\; \underbrace{\textstyle\sum_{i=1}^{m} \|\text{row}\|}_{\text{full matvec} = m} $$

> Port the **measurement**, not the conclusion. 🔬

## 🦀 Part 4 — Rust: The Allocation Tax

---

### 🕳️ Finding 1 — `dot_mv` Allocated Every Iteration

`Ell::update_core` called `dot_mv`, which returns a **brand-new `Arr`**:

```rust
let grad_t = self.mq.dot_mv(grad);   // vec![0.0; n] — allocation per iteration!
let omega = grad.dot(&grad_t);
```

`EllStable` already pre-allocated four scratch buffers. The classic `Ell` did not. 🐛

Fix — a pre-allocated `grad_t` field plus a `dot_mv_into` that writes in place:

```rust
pub struct Ell {
    ...
    grad_t: Arr,                     // scratch, sized once
}
...
self.mq.dot_mv_into(grad, &mut self.grad_t);   // no allocation
let omega = grad.dot(&self.grad_t);
```

> This was the **single biggest win of the whole session**. 🚀

---

### 🕳️ Finding 2 — `sym_quad` Did 2× the Flops

The Rust LMI oracle summed the **full** square; C++/Python sum only the upper triangle:

```rust
// before — O(k²) with two multiplies per term
for i in start..end {
    for j in start..end {
        result += self.wit[i] * mat.at(i, j) * self.wit[j];
    }
}

// after — upper triangle + 2× off-diagonal
for i in start..end {
    let mut s = 0.0;
    for j in (i + 1)..end {
        s += mat.at(i, j) * self.wit[j];
    }
    result += self.wit[i] * (mat.at(i, i) * self.wit[i] + 2.0 * s);
}
```

> Consistency with the siblings *is* an optimization. 🤝

---

### 🕳️ Finding 3 — ndarray Views Were Expensive

`lmi-solver-rs` built two `ArrayView1`s and called `.dot()` on **1–3 element slices**:

```rust
// before
diag = get_elem(i, stop)
    - self.storage.slice(s![i, start..stop])
        .dot(&self.storage.slice(s![start..stop, stop]));

// after — a flat slice, no view objects, no bounds checks
let data = self.storage.as_slice().unwrap();
let mut s = 0.0;
for k in start..stop {
    s += data[i * n + k] * data[k * n + stop];
}
diag = get_elem(i, stop) - s;
```

The same treatment for `witness` and `sym_quad` via `as_slice()`. 🪓

> Small slices make **per-call overhead** the entire cost. 🐢

### 🧠 Key Takeaways

**Performance** ⚡
- **Profile first** — the bottleneck is rarely where you guess 🔍
- Python's wins came from **call-count**, not FLOPs 🐍
- The same bug — **per-iteration allocation** — hid in all three languages 🐛
- `EllStable` was already fast; the classic `Ell` path had been forgotten 😴
- In compiled code, **early exit can beat vectorization** 🏁
- `ndarray` / Eigen **view + dot** overhead dominates tiny slices 🪓

**Process** 🧭
- Port the **measurement**, not the conclusion 🔬
- Record **negative results** — they prevent wasted ports 📝
- Re-capture baselines honestly (`git stash` A/B); the machine lies 🌡️
- **Exact-count tests** prove behavior preservation 🎁
