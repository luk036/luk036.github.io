## 🧭 Part 1 — Two Update Strategies

---

### 🧮 Same Ellipsoid, Two Ways to Update It

Both represent $\mathcal{E} = \{\,x : (x-x_c)^\top M^{-1}(x-x_c) \le \kappa\,\}$, but update differently.

**`Ell` — direct $M$-update** (classic):
$$ \tilde g = {\color{#1565c0}M}\,g, \qquad
   \omega = g^\top \tilde g, \qquad
   M \leftarrow M - \frac{\sigma}{\omega}\,{\color{#c2185b}\tilde g \tilde g^\top} $$

**`EllStable` — factorized** $M = \kappa\,{\color{#2e7d32}L\,D\,L^\top}$:
$$ w = L^{-1}g, \quad z = D^{-1}w, \quad q = L^{-\top}z, \quad \omega = w^\top z $$
$$ x_c \leftarrow x_c - \frac{\rho}{\omega}\,q, \qquad
   ({\color{#2e7d32}L}, {\color{#2e7d32}D}) \leftarrow \text{rank-1 update} $$

> Same math, **same cuts**, different arithmetic — so the relative cost is an implementation question. 🤔

## 🔧 Part 3 — Three Fixes

---

### 🐛 Fix 1 — A Real Bug in Rust's Lowpass Case

`create_lowpass_case` used the **wrong** formulas:

```rust
// before — multiplies by PI ✗
let delta1 = 20.0 * (delta0_wpass * PI).log10();
let delta2 = 20.0 * (delta0_wstop * PI).log10();

// after — matches Python / C++ ✓
let delta1 = 20.0 * (1.0 + delta0_wpass).log10();
let delta2 = 20.0 * delta0_wstop.log10();
```

The bug **inverted the passband bounds**:
$$ {\color{#2e7d32}L^2} = 161 \;>\; {\color{#c2185b}U^2} = 0.006 \quad\Rightarrow\quad \text{cut is } \texttt{NoSoln} \Rightarrow \text{loop exits at iteration 0} $$

> The Rust lowpass **benchmark and test were vacuous** — they never ran a single iteration. 😳

### 🪓 Fix 2 — Rust `Ell`: Hoist the Slice Reborrow

The $O(n^2)$ rank-1 loop re-borrowed the matrix slice **on every element**:

```rust
// before
for j in 0..=i {
    self.mq.data_mut()[idx] -= update;              // re-borrow each time
    self.mq.data_mut()[j * n + i] = self.mq.data()[idx];
}

// after — borrow once, outside the loop
let mq = self.mq.data_mut();
let gt = self.grad_t.data();
for j in 0..=i {
    mq[idx] -= r_qg * gt[j];
    if i != j { mq[j * n + i] = mq[idx]; }
}
```

> Same arithmetic, **bit-identical** result — just no repeated slice construction. 🎯

---

### 🐍 Fix 3 — Vectorize Python `EllStable`

`_update_core` was pure-Python $O(n^2)$ loops. Now whole-slice numpy ops:

```python
# forward substitution: w = L^{-1} g
for j in range(ndim - 1):
    col = self._mq[j + 1 :, j] * self._inv_lower_g[j]
    self._mq[j, j + 1 :] = col
    self._inv_lower_g[j + 1 :] -= col

# back substitution: q = L^{-T} z
for i in range(ndim - 1, 0, -1):
    self._g_t[i - 1] -= self._mq[i:, i - 1] @ self._g_t[i:]
```

Only the **outer $O(n)$ sweep** stays in Python; the inner work is vectorized. 🚀

- The machine drifted **3×** between runs — absolute times lied, ratios didn't 📉

- A vacuous benchmark is worse than none — it hides a bug 🕳️

---

### 🧠 Key Takeaways

**Performance** ⚡
- `EllStable` is **not** universally slower — it's implementation-dependent 🔀
- 🐍 Python: interpreter loops are catastrophic ($O(n^2)$ Python vs BLAS) 🐢
- ⚙️ C++: `Ell`'s flat rank-1 update edges out the factorized path 🎯
- 🦀 Rust: a per-element slice reborrow quietly degraded `Ell` at large $n$ 🪓
- Vectorizing the inner loops flipped Python's gap from 122× to 13× 🚀

**Correctness & Process** 🧭
- Fix the **bounds before** you trust the benchmark 🐛
