# ⚔️ ellalgo vs CVXPY

### The Ellipsoid Method in Action 🥚

@luk036 👨‍💻 · 2026 📅

---

## Outline 📋

-   **Motivation** 🎯
    -   Why compare a 1979 method with a modern solver?
-   **Three Experiments** 🧪
    -   Experiment 1: Chebyshev Center 📐
    -   Experiment 2: Min-Eigenvalue LMI (EVP) 🎛️
    -   Experiment 3: FIR Lowpass Design 🎚️
-   **The Big Picture** 🖼️
    -   Python vs C++ vs CVXPY
-   **Take-aways** 💡

---

## 🎯 Motivation

---

### Two Extremes of Optimization 🏛️

.pull-left[

**CVXPY** 🚀

-   *Declarative*: you describe the problem, not the algorithm
-   Disciplined Convex Programming (DCP) rules
-   Auto-generates a standard-form problem
-   Hands off to fast interior-point solvers (CLARABEL, ECOS, SCS…)
-   *"What you solve"*, not *"how you solve it"*

]

.pull-right[

**ellalgo** 🥚

-   *Algorithmic*: you implement an **oracle**
-   The Ellipsoid method (Khachiyan, 1979) needs only:
    -   a search space, and
    -   an oracle that returns **cutting planes**
-   Polynomial-time, works with just a separation oracle
-   *"How you solve it"*, from first principles

]

---

### The Question That Started It All 🤔

-   Same problem, two very different philosophies
-   When is the **no-setup** Ellipsoid method competitive?
-   When does the **polished** CVXPY stack win?

> Solve a convex problem with both tools and measure.

-   Spoiler: the answer depends on **which language** you ask in 🐍 vs ⚙️

---

## 📐 Experiment 1: Chebyshev Center

---

### Largest Ball Inside a Polyhedron 🥎

Given a polyhedron defined by linear inequalities,

$$
{\color{steelblue}\mathcal{P}} = \left\{ \, {\color{darkblack}u} \in \mathbb{R}^{n}
\; : \; {\color{darkcyan}A}\, {\color{darkblack}u} \le {\color{green}b} \, \right\},
$$

find the **largest ball** that fits inside:

$$
\begin{array}{ll}
  \max_{{\color{darkblack}x}, \, r} \quad & r \\
  \text{s.t.} \quad & {\color{darkcyan}a}_i^{\mathsf{T}} {\color{darkblack}x} + \lVert {\color{darkcyan}a}_i \rVert_2 \, r \le {\color{green}b}_i, \quad i = 1, \dots, m .
\end{array}
$$

Design variables: $\big( {\color{darkblack}x}, r \big) \in \mathbb{R}^{n+1}$ —
here $n = 10$, so **11 design variables**, $m = 50$ random halfspaces + 20 box constraints.

---

### The Oracle 🥚

-   Every constraint is **affine** in $({\color{darkblack}x}, r)$:
  $$
  f_i({\color{darkblack}x}, r) \;=\;
  {\color{darkcyan}a}(i)^{\mathsf{T}} {\color{darkblack}x}
  + \lVert {\color{darkcyan}a}(i) \rVert_2 \, r - {\color{green}b}(i)
  $$
-   Gradient is **constant**: $\nabla f_i = \big( {\color{darkcyan}a}(i),\, \lVert {\color{darkcyan}a}(i) \rVert_2 \big)$
-   Every violated constraint gives a *perfect* cutting plane
-   Linear objective → trivial optimality cut
-   Classic example — Boyd & Vandenberghe §8.5.1 📚

---

### Same Answer, Three Paths ✅

| | CVXPY 🚀 | Python 🐍 | C++ ⚙️ |
|---|---|---|---|
| radius $r^*$ | 0.397723 | 0.397715 | 0.397715 |
| relative error | — | 2.0e-5 | 2.0e-5 |
| constraint violation | 0 | -5.8e-9 | ≤ 1e-6 |
| iterations | ~10 | 1,854 | 1,854 |

All three find the same Chebyshev center — **to five significant digits** 🎯

## 🎛️ Experiment 2: Min-Eigenvalue LMI

---

### The EVP: Minimize the Largest Eigenvalue 🎛️

Minimize the largest eigenvalue of an affine matrix pencil:

$$
\begin{array}{ll}
  \min_{{\color{darkblack}x}, \, t} \quad & t \\
  \text{s.t.} \quad & t\, {\color{darkcyan}I} - \big( {\color{darkcyan}A}_0 + \sum_i {\color{darkblack}x}_i {\color{darkcyan}A}_i \big) \succeq 0, \\
  & -1 \le {\color{darkblack}x}_i \le 1, \quad i = 1, \dots, m .
\end{array}
$$

Design variables: $({\color{darkblack}x}, t) \in \mathbb{R}^{m+1}$ — here $m = 5..20$, so **6..21 design variables** (moderate). The LMI is *affine* in $({\color{darkblack}x}, t)$, so an LDL$^T$ witness vector yields a perfect cut.

---

### The LMI Oracle: LDL$^T$ Witness 🥚

The constraint ${\color{darkcyan}B} - \sum_k {\color{darkcyan}F}_k {\color{darkblack}x}_k \succeq 0$ is checked via lazy LDL$^T$ factorization:

$$
{\color{darkcyan}B} - \sum_k {\color{darkcyan}F}_k {\color{darkblack}x}_k \;=\;
\left\{
  \begin{array}{ll}
    \text{feasible} & \text{if PSD (all pivots > 0)} \\
    \text{cut } ({\color{darkcyan}g}, {\color{green}\beta}) & \text{otherwise}
  \end{array}
\right.
$$

-   Cut gradient: ${\color{darkcyan}g}_k = {\color{green}v}^{\mathsf{T}} {\color{darkcyan}F}_k {\color{green}v}$ via the witness vector ${\color{green}v}$
-   Violation ${\color{green}\beta} > 0$ = deep cut
-   Reuse `LMIOracle` directly — no new oracle needed ✅

---

## 🎚️ Experiment 3: FIR Lowpass Design

---

### The FIR Lowpass Problem 🎚️

Design a linear-phase FIR lowpass filter (Wu–Boyd–Vandenberghe spectral factorization):

$$
\begin{array}{ll}
  \min \quad & \max_{\omega \in \text{stopband}} R(\omega) \\
  \text{s.t.} \quad & {\color{green}L}^2 \le R(\omega) \le {\color{green}U}^2, \quad \omega \in \text{passband} \\
  & R(\omega) \ge 0, \quad \forall \omega
\end{array}
$$

where $R(\omega) = {\color{darkcyan}A}(\omega) \cdot {\color{darkblack}r}$ is the squared magnitude and ${\color{darkblack}r} \in \mathbb{R}^{n}$ are autocorrelation coefficients — **n = 24..80 design variables** (moderate). Grid: $m = 15n$ frequency points (Cheney's rule of thumb).

---

### Three Implementations 🧪

.pull-left[

**CVXPY** 🚀 — same LP

```python
r = cp.Variable(n); t = cp.Variable()
prob = cp.Problem(cp.Minimize(t), [
    Ap @ r <= up_sq, Ap @ r >= lp_sq,
    As @ r <= t,     -As @ r <= t,
    A @ r >= 0,
])
prob.solve()
```

]

.pull-right[

**ellalgo** 🥚 — same oracle, 3 languages

-   Python: `LowpassOracle` + parallel cuts
-   C++: identical `LowpassOracle` (1:1 port)
-   Parallel cuts: passband $\pm$ stopband box
  ⟶ two hyperplanes at once ⚡

| language | iters (n=48) |
|---|---|
| Python | 6,690 |
| C++ | 6,693 |

]

## 🖼️ The Big Picture

---

### Why Did Python Fool Us? 🐍

-   Ellipsoid method needs $O\big(n^2 \log \tfrac{1}{\varepsilon}\big)$ iterations
  $$
  N_{\text{iters}} \approx 15\, n^2 \quad \text{(empirically)}
  $$
-   Each iteration is **~100× cheaper in C++** than in Python
-   Python's per-iteration overhead (NumPy calls, tuple building,
    interpreter dispatch) dominated the solve
-   In C++ the core loop is a few ns — the *algorithm* is the cost
-   Result: **language constant factor flips the ranking** 🎭

---

### Three Experiments, One Conclusion 🎯

| Experiment | Python verdict | C++ verdict |
|---|---|---|
| Chebyshev Center 📐 | CVXPY wins $n > 4$ | **C++ ellipsoid wins all** |
| Min-Eigenvalue LMI 🎛️ | CVXPY wins | **C++ ellipsoid wins $m \le 16$** |
| FIR Lowpass 🎚️ | CVXPY wins | **C++ ellipsoid wins all** |

-   In **Python**, interpreter overhead favors CVXPY
-   In **compiled C++**, the zero-setup Ellipsoid method wins broadly
-   CVXPY only catches up at the largest sizes, where the $\mathcal{O}(n^2)$
    iteration count finally overtakes its near-linear scaling
-   The "CVXPY wins" conclusion was **an artifact of Python's interpreter** 🐍

---

### The Fairness Caveat ⚠️

-   The Ellipsoid method still needs:
  -   a **containing initial ellipsoid** ($\kappa = \sqrt{n+1} + 1$ or box-matched)
  -   a **dimension-aware budget** $\propto n^2$
-   CVXPY needs neither — it self-scales
-   For $n \gg 80$ the $\mathcal{O}(n^2)$ iteration count will eventually
    catch up with CVXPY's near-linear scaling
-   The crossover point simply moved **far beyond** the tested range

---

---

---

### Key Takeaways 🎯

-   🥚 **Ellipsoid method**: polynomial-time, oracle-based, zero setup —
    but $\mathcal{O}(n^2)$ iterations and needs a containing ellipsoid
-   🚀 **CVXPY**: expressive, robust, millisecond solves
-   🐍 **Language matters**: Python's overhead made CVXPY look superior
-   ⚙️ **C++ port flips the result** — in all three experiments
-   📏 **One oracle recipe, three problems**: affine constraints →
    constant gradients → perfect cuts
-   🧪 Reproducible: `demo/chebyshev_center.py`, `benches/bench_lmi_evp.py`,
    `benches/bench_lowpass_cvxpy.py` + `ellalgo-cpp` benches
    (`BM_chebyshev`, `BM_lmi_evp`, `BM_lowpass_cvxpy`)
