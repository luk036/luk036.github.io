## 🥊 Part 1 — The Contest

---

### ⚖️ One Model, Two Bases

Both families build the same covariance model from the pairwise distance matrix $D$:

$$ {\color{#5e81ac}\Omega(p)} \;=\; \sum_{k=1}^{m} p_k\, {\color{#5e81ac}\Sigma_k} \;\succeq\; 0 $$

> The difference is *what* the $\Sigma_k$ are — and how stable they are to fit. 🎯

.pull-left[

**LSQ** 🟦 — Frobenius residual

$$ \min_p \; \bigl\|{\color{#bf616a}Y} - {\color{#5e81ac}\Omega(p)}\bigr\|_F \quad \text{s.t.} \quad {\color{#5e81ac}\Omega(p)} \succeq 0 $$

- No upper bound on $\Omega$ 🚫
- Targets the *shape* of $Y$ 🎯

]

.pull-right[

**MLE** 🟥 — Gaussian likelihood

$$ \min_p \; \log\det {\color{#5e81ac}\Omega(p)} + \operatorname{Tr}\!\bigl({\color{#5e81ac}\Omega(p)}^{-1}{\color{#bf616a}Y}\bigr) $$

$$ \text{s.t.} \quad 2{\color{#bf616a}Y} \succeq {\color{#5e81ac}\Omega(p)} \succeq 0 $$

- Upper bound $2Y$ is a *trust region*, not a constraint 🤔
- Solved by the same cutting-plane machinery ✅

]

---

### 🧱 The Two Families

.pull-left[

**Polynomial** 🟥 — monomials of distance

$$ \varphi_k(d) = d^{\,k}, \qquad k = 0, \dots, m-1 $$

- Global support: every basis function touches every $d$ 🌐
- Simple, universal — but highly correlated

]

.pull-right[

**B-spline** 🟩 — quadratic ($k=2$) on knots $t$

$$ K(d) \;=\; \sum_{i=1}^{m} c_i\, B_i(d), \qquad B_i \text{ local, } \sum_i B_i = 1 $$

- Local support: each $B_i$ is nonzero on $\approx 3$ knot spans 🧩
- Partition of unity, shape constraints "for free"

]

### 🔢 Conditioning: the First Skirmish

$$ \operatorname{cond}(A) \;=\; \frac{\sigma_{\max}(A)}{\sigma_{\min}(A)} \qquad A = \bigl[\operatorname{vec}(\Sigma_1) \;\cdots\; \operatorname{vec}(\Sigma_m)\bigr] $$

<p align="center">
<img src="poly-vs-bspline-remark.files/fig_cond.svg" style="width:97%" />
</p>

- **Polynomial**: $1.2\times10^{1} \to 3.5\times10^{10}$ as $m: 2 \to 10$ — nine orders of magnitude 💥
- **B-spline, old knots**: grows mildly ($40 \to 409$) — but wrong for another reason 🐛
- **B-spline, clamped**: flat at $\approx 5\text{–}7$ ✅

> Sane conditioning is *free* — it just needs the right knots. 🎯

### 📈 Who Tracks the True Kernel?

<p align="center">
<img src="poly-vs-bspline-remark.files/fig_fit.svg" style="width:97%" />
</p>

- Both families can model the kernel — accuracy is **comparable** 🤝
- Polynomial $m{=}6$: rel. err $0.042$ at $\operatorname{cond} = 1.9\times10^5$ 🟥
- B-spline $m{=}6$ (clamped, monotone): rel. err $\mathbf{0.037}$ at $\operatorname{cond} = 6.5$ 🟩
- B-spline $m{=}4$ underfits ($0.14$) — a *capacity*, not a conditioning issue 📉

> Same accuracy, **$10^{4}$× better conditioning**. The basis decides the fight. 🎯

---

### ⚠️ The Anomaly (before the fix)

| basis (m=$6$) | cond(A) | monotone fit? |
|:--|--:|:--|
| polynomial | $1.9\times10^{5}$ | not enforced 😬 |
| B-spline, **old knots** | $99$ | **no** — $268$ violations 🐛 |
| B-spline, clamped | $6.5$ | **yes** — $0$ ✅ |

- The old B-spline kernel **wiggles back up** across $[0, d_{\max}]$ 📈
- A monotone basis, fitted with a monotone constraint, yet non-monotone? 🤔

> The constraint was on the *coefficients* — but the **basis itself** was broken. 🔍

## 🐛 Part 3 — The Knot-Domain Bug

---

### 🗺️ The Basis Cannot See Its Own Data

<p align="center">
<img src="poly-vs-bspline-remark.files/fig_knots.svg" style="width:97%" />
</p>

- Uniform knots were spread over $[0,\;1.2\,\lVert \texttt{site[-1]} - \texttt{site[0]}\rVert] = [0,\;5.68]$
- The *data* spans $[0,\;10.096]$ — nearly **twice** as far 🌍
- A degree-$2$ B-spline is only *alive* on $[t_2,\;t_m]$ ≈ $[1.9,\;3.8]$

> Everything outside $[1.9, 3.8]$ is **extrapolation** — basis values are numerically meaningless there. 💀

---

### 📐 Why: the Old Knot Vector

The old knot construction used the **span of two sites**, not the data domain:

$$ t_j \;=\; j \cdot \frac{1.2\,\lVert \texttt{site[-1]} - \texttt{site[0]}\rVert}{m + k + 1}, \qquad j = 0, \dots, m+k $$

```python
# OLD generate_bspline_info
t = np.linspace(0.0, 1.2 * np.linalg.norm(site[-1] - site[0]), m + k + 1)
spls = [BSpline(t, coeff, k) for coeff in np.eye(m)]
Sigma = [spl(D) for spl in spls]   # basis evaluated on ALL of D
```

- Knots reach only $1.2 \times 4.737 = 5.68 < d_{\max} = 10.096$ 🔍
- scipy extrapolates each basis element beyond its domain — with **polynomial blow-up** 📈
- The *valid* B-spline domain $[t_k, t_m] \approx [1.9, 3.8]$ covers a **sliver** of the data 🥶

> The knots must span the **actual data domain**, not a guess scaled from two points. 🎯

---

### 🐛 The Second Bug: `x[:-1]` Off-by-One

The monotonicity wrapper stripped the *last* entry of every candidate:

```python
# OLD mono_decreasing_oracle2.assess_optim
if cut := mono_oracle(x[:-1]):        # drop the last entry ...
    g[: len(x) - 1] = cut[0]
    return (g, cut[1]), None
```

.pull-left[

**LSQ core** ✅ — correct by luck

- Candidate `x = [c_1..c_m, t]` has length $m+1$
- The trailing entry is the **objective variable**
- `x[:-1]` = exactly the coefficients 🎯

]

.pull-right[

**MLE / CCP core** ❌ — wrong

- Candidate `x = [c_1..c_m]` has length $m$
- `x[:-1]` **frees the last coefficient** $c_m$!

]

> The index arithmetic silently assumed a trailing variable that only one core has. One line, two code paths. 🚩

---

## 🪄 Part 4 — The Fix

---

### 🪄 Fix 2: Constrain Exactly the Coefficients

```python
class mono_decreasing_oracle2:
    def __init__(self, basis, n_coeff=None):
        self.n_coeff = n_coeff

    def assess_optim(self, x, t):
        n = len(x)
        k = n - 1 if self.n_coeff is None else self.n_coeff   # NEW
        if cut := mono_oracle(x[:k]):                          # x[:k], not x[:-1]
            g[:k] = cut[0]
            return (g, cut[1]), None
        return self.basis.assess_optim(x, t)
```

- `n_coeff` defaults to `len(x) - 1` — preserves the **LSQ behavior** ✅
- `corr_bspline` passes `n_coeff = m` → the **MLE/CCP** path constrains *all* coefficients ✅

> Same default for the old core; an explicit parameter for the new one. No behavior surprise. 🎯

---

### 📊 Before vs After

| metric | before 🐛 | after 🪄 |
|:--|--:|--:|
| $\operatorname{cond}(A)$, $m = 4 \dots 10$ | $40 \to 409$ | $5.1 \to 6.8$ |
| monotone violations (kernel grid) | $268\text{–}324$ | **0** |
| LSQ iterations ($m{=}4$) | $\le 1054$ | $841$ |
| MLE iterations ($m{=}4$) | $\le 388$ | $331$ |
| matrix rel. err vs true kernel ($m{=}6$) | — | $\mathbf{0.037}$ |

- Same accuracy, better conditioning, **provably monotone** fits ✅
- The old iteration bounds still pass ($841 \le 1054$, $331 \le 388$) — no test loosening needed 🤝
- Caveat: **monotone ≠ non-negative** — every fit dips slightly below zero near $d_{\max}$ ⚠️

`cccp_mle` is **basis-agnostic** — feed it polynomial or clamped B-spline $\Sigma_k$, wrap with the monotone oracle:

<p align="center">
<img src="poly-vs-bspline-remark.files/fig_cccp.svg" style="width:95%" />
</p>

---

- Polynomial: 19 rounds, $f: 32.77 \to 29.78$ = scipy reference ✅
- B-spline + monotone: 16 rounds, $f: 33.3 \to 30.31$, $\min\operatorname{eig}(\Omega) = 0.56 \succ 0$ ✅
- Every surrogate is convex → cutting-plane applies each round 🔁

> The same CCP engine now fits **monotone B-spline kernels** with a PD $\Omega$. 🪄

## 📊 Part 6 — Scaling with Sample Size N = 1..50

---

### 📈 Accuracy vs Sample Size

<p align="center">
<img src="poly-vs-bspline-remark.files/fig_nsweep_relerr.svg" style="width:97%" />
</p>

- Shaded region: rank-deficient $Y$ ($N < n = 20$) 🥶
- B-spline $m{=}4$ clamped: **best at every $N$** — local support resists noise 🟩
- At large $N$ the extra capacity ($m{=}6$) wins for both families 🚀
- Old-knot B-spline stays worse than clamped well past $N = 10$ ⚠️

---

### ⏱️ Cost & Constraints

<p align="center">
<img src="poly-vs-bspline-remark.files/fig_nsweep_iters.svg" style="width:95%" />
</p>

- Cheapest: B-spline $m{=}4$ ($802$–$970$ iters) ⏱️
- B-spline $m{=}6$ hits the $2000$-iteration cap at $N \in \{1,2\}$ — too much capacity 🚫
- Monotonicity ($1200$-point grid): clamped BS **0 of 50** $N$ violations; poly wiggles at $32$ ($m{=}4$) / $40$ ($m{=}6$) of $50$ $N$ 📈
- Old knots: $7$ of $50$ $N$ still non-monotone (incl. $N = 41$) 🐛
- $\min\operatorname{eig}(\Omega) > 0$ for **every** fit — the LMI holds across the board ✅

| 5 | $39.36 \to 26.92$ (30) | $33.34 \to 27.35$ (20) |

- CCP monotone-decreases at **every** $N$ — even rank-deficient $N = 1$ 🎯

- Rounds: BS $16$–$20$, poly $19$–$30$ — same scale as the $N = 3000$ study 🔁
- $f = \log\det\Omega + \operatorname{Tr}(\Omega^{-1}Y)$ stays finite for singular $Y$ via the trace term ✅

### 🧠 Part 8 — Key Takeaways

**Conditioning** 📐
- Polynomial bases explode: $10^{10}$ at $m = 10$ — keep $m$ small or orthogonalize 🔢
- Clamped B-splines stay at $\operatorname{cond} \approx 6$ and keep the benefit of local support 🟩

**Knots** 🪄
- The knot vector must **span the data domain** — scipy extrapolates otherwise 🐛
- Uniform knots $\ne$ clamps: repeat the end knots $k+1$ times 🎯

**Constraints** 🔍
- Index arithmetic must match the core's variable layout — one line, two code paths 🚩
- Monotone $\ne$ non-negative: check $\min\operatorname{eig}$ separately ⚠️

**Sample size** 📊
- Small $N$ favors the small local model (BS $m{=}4$); large $N$ rewards capacity ($m{=}6$) 📈
- The monotone constraint holds at **every** $N$ — and it is *needed*: free poly fits wiggle at $32$–$40$ of $50$ $N$ 🎯

**One fit for all** 🔁
- Same cutting-plane / CCP machinery serves **both bases** — the basis is a plug-in 🤝
