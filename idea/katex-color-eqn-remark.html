## Part I: Motivation 💡

---

### 🤔 The Problem: Dense Math in Slides

Slides full of uncolored equations are **hard to follow**:

$$ \text{min} \sum_{v \in V} w_v x_v \quad \text{s.t.} \quad x_u + x_v \geq 1, \ \forall (u,v) \in E $$

- ❌ Every symbol looks the same
- ❌ The audience cannot tell *sets* from *variables* from *parameters*
- ❌ "What did $x_v$ mean again?" — constant context-switching 😵
- ❌ In a 30-minute talk, every second spent decoding is a second lost

---

### 💡 The Solution: Semantic Color Coding

Assign a **stable, meaningful color** to each *role* in the math:

.pull-left[
- 🎨 **Salmon** — sets ($V$, $U$, $S$)
- 🟢 **Lime** — edges ($E$, cycles $C$, paths $P$)
- 🔵 **Royal Blue** — weights & parameters ($w$, $k$, $n$)
- 🟢 **Green** — primal variables ($x$)
- 🔥 **Firebrick** — dual variables ($y$, $z$)
]
.pull-right[
Once learned, the color **persists across slides**:

- Same symbol → same color, every time
- Structure visible at a glance
- Primal vs dual jumps out immediately
- Works like syntax highlighting for math 🧑‍💻
]

---

## Part II: Color Schemes 🎨

---

### 📐 Scheme 1: Primal-Dual (algo4dfm)

Canonical palette, derived from `algo4dfm/primal_dual.html`:

| Color | Role | Symbols |
|-------|------|---------|
| `\color{salmon}` | Vertex / site sets | ${\color{salmon}V}$, ${\color{salmon}U}$, ${\color{salmon}S}$ |
| `\color{lime}` | Edge sets / cycles / paths | ${\color{lime}E}$, ${\color{lime}C}$, ${\color{lime}P}$ |
| `\color{royalblue}` | Weights & parameters | ${\color{royalblue}w}$, ${\color{royalblue}k}$, ${\color{royalblue}n}$, ${\color{royalblue}d}$ |
| `\color{green}` | Primal variables | ${\color{green}x}$ |
| `\color{firebrick}` | Dual variables | ${\color{firebrick}y}$, ${\color{firebrick}z}$ |

Applied to: `cqs/`, `comb_optim/`, `algo4dfm/` 🎯

---

### 🛡️ Example: Vertex Cover (Primal-Dual)

**Before** — flat and dense:

$$ \text{min} \sum_{v \in V} w_v x_v \quad \text{s.t.} \quad x_u + x_v \geq 1, \ \forall (u,v) \in E $$

**After** — roles pop out instantly:

$$ \text{minimize} \sum_{v \in {\color{salmon}V}} {\color{royalblue}w}_v {\color{green}x}_v \qquad \text{s.t.} \quad {\color{green}x}_u + {\color{green}x}_v \geq 1, \ \forall (u, v) \in {\color{lime}E} $$

Dual LP — firebrick for dual variables:

$$ \text{max} \sum_{e \in {\color{lime}E}} {\color{firebrick}y}_e \qquad \text{s.t.} \quad \sum_{e \in \text{adj}(v)} {\color{firebrick}y}_e \leq {\color{royalblue}w}_v, \ \forall v \in {\color{salmon}V} $$

---

### 🌊 Scheme 2: Network Optimization (net_optim)

Derived from `net_optim/quickstart.html` — discrete exterior calculus flavor:

| Color | Role | Symbols |
|-------|------|---------|
| `\color{green}` | Flow / co-boundary | ${\color{green}x}$, ${\color{green}A}$, ${\color{green}\mathrm{d}}$ |
| `\color{blue}` | Tension / boundary | ${\color{blue}y}$, ${\color{blue}A^\mathsf{T}}$, ${\color{blue}\partial}$ |
| `\color{firebrick}` | Potential / demand | ${\color{firebrick}u}$, ${\color{firebrick}\omega}$ |
| `\color{brown}` | Vertices | ${\color{brown}v_i}$ |
| `\color{darkgreen}` | Edges | ${\color{darkgreen}e_i}$ |
| `\color{steelblue}` | Incidence ops | ${\color{steelblue}Q}$ |

Applied to: `net_optim/` 🎯

---

### 💧 Example: Flow & Tension (DEC)

**Conservation of flow** — green chains:

$$ \sum_{j} {\color{green}x}_{ij} = 0 \quad \forall \ i \quad \Longleftrightarrow \quad {\color{green}A}\,{\color{green}\tau} = 0 $$

**Cycle condition** — blue co-chains:

$$ \sum {\color{blue}y}_{ij} = 0 \quad \forall \ \text{cycle} \quad \Longleftrightarrow \quad {\color{blue}A^\mathsf{T}}\,{\color{firebrick}\omega} = 0 $$

**Stokes' theorem** — the whole story in one line:

$$ {\color{purple}\int}_{\color{lime}S} {\color{green}\mathrm{d}}\,\tilde{\color{firebrick}\omega} = {\color{purple}\oint}_{\color{blue}\partial \color{lime}S} \tilde{\color{firebrick}\omega} $$

---

### 📏 Scheme 3: Projective Geometry (projgeom)

**Dual-color scheme**: points vs lines in *opposing* roles:

| Color | Role | Symbols |
|-------|------|---------|
| `\color{salmon}` | **Points** | ${\color{salmon}p}$, ${\color{salmon}q}$, coords ${\color{salmon}(x, y, z)}$ |
| `\color{steelblue}` | **Lines** | ${\color{steelblue}l}$, ${\color{steelblue}m}$, coords ${\color{steelblue}(a, b, c)}$, ${\color{steelblue}AB}$ |
| `\color{royalblue}` | Parameters | ${\color{royalblue}\lambda}$, ${\color{royalblue}\mu}$, ${\color{royalblue}k}$, ${\color{royalblue}n}$ |
| `\color{green}` | Functions / variables | ${\color{green}T}$, ${\color{green}\tau}$ |
| `\color{firebrick}` | Special values | ${\color{firebrick}-1}$, ${\color{firebrick}\perp}$ |

Applied to: `projgeom/` 🎯

---

### 📏 Example: Projective Geometry

**Point-line duality** — salmon points, steelblue lines:

$$ \text{Dot product: } {\color{steelblue}\langle p, l \rangle} = {\color{salmon}p_x}\,{\color{steelblue}l_a} + {\color{salmon}p_y}\,{\color{steelblue}l_b} + {\color{salmon}p_z}\,{\color{steelblue}l_c} $$

**Parametrization** along a line:

$$ {\color{steelblue}\lambda p + \mu q} \quad \text{along line} \quad {\color{steelblue}pq} $$

**Cross ratio** — the projective invariant:

$$ {\color{steelblue}(A, B; C, D)} = -1 \quad \Longleftrightarrow \quad \text{harmonic division} $$

### 🤖 Delegation Strategy

Bulk colorization via parallel **visual-engineering subagents**:

.pull-left[
**Why delegate?** 🚀
- 100+ equations per file — tedious by hand
- Consistent application of a defined scheme
- Parallel batches → high throughput

**Workflow:**
1. Each task = one file + one scheme 📄
2. Agent reads the file, applies colors
3. Agent greps to verify its own work
]
.pull-right[
**Prompt essentials:** ✍️
- Exact color → symbol mapping
- "Apply edits NOW, don't stop at analysis"
- MUST NOT touch mermaid/code/scripts
- MUST preserve math content
- Verify balanced `$` delimiters
]

### ⚠️ Challenge 1: Queue Saturation

Launching too many tasks at once → **failures**:

```text
❌ Task timed out while queued (30 minutes)
❌ 31 tasks failed in a single wave
```

**Lesson learned** 📚:

- The background task queue saturates around ~20 concurrent tasks
- **Mitigation:** relaunch in batches of **≤10**
- Batch → verify → next batch 🔁
- Never fire 20+ agents blindly again 🎯

---

### ⚠️ Challenge 2: Agent No-Ops

Some agents **"completed" without editing**:

```text
❌ "Completed in 0 seconds" → zero edits applied
❌ "Completed in 7m 29s"  → file byte-identical
❌ Analysis-paralysis: reasoned but never edited
```

**Signals to watch:** 🚨
- Suspiciously fast completion (0s)
- `\color{` count unchanged after "completion"
- Elaborate analysis with no Edit tool calls

**Mitigation:** resume the session with *"APPLY THE EDITS NOW"* + explicit edit list 🔧

---

### 🛟 Fallback: The Deterministic Script

For the most stubborn files — **script it yourself**:

- Deterministic, reviewable, no hallucination 🎯
- `net_optim/lec07a.md`: **97 → 149** colored lines
- The script lives in `Temp/opencode/` for reuse 📦

### ⚖️ Before vs After

.pull-left[
**Before** 😵


$$\min \sum_{v \in V} w_v x_v \quad \text{s.t.} \quad x_u + x_v \geq 1$$

- Flat, ambiguous, dense
- Sets, weights, variables indistinguishable
- Audience decodes *every* symbol
]
.pull-right[
**After** 🎨

$$\min \sum_{v \in {\color{salmon}V}} {\color{royalblue}w}_v {\color{green}x}_v \quad \text{s.t.} \quad {\color{green}x}_u + {\color{green}x}_v \geq 1 $$

- Roles visible instantly
- Sets / weights / variables separated
- Audience *recognizes*, not decodes
- Consistent across all slides 🔁
]

---

### 🎯 Best Practices

.pull-left[
**Do color** ✅
- Sets, edges, vertices (structural roles)
- Primal vs dual variables (opposing roles)
- Parameters vs variables (value roles)
- Problem-specific dualities (points vs lines)

**Do it consistently** 🔁
- Same symbol → same color, everywhere
- One reference file per topic
]
.pull-right[
**Don't color** ❌
- Plain numbers, `min`/`max`/`log`
- `O(...)` complexity
- Code identifiers in backticks
- Mermaid blocks, scripts, HTML config
- Algorithm step sizes ($\alpha$, $\beta$) — keep them neutral

**Preserve** 📏
- Math content must not change
- Balance `$` delimiters after edits
]

---

### 🧩 KaTeX + Remark.js Gotchas

.pull-left[
**Render order is critical** ⚡
1. `renderMathInElement(textarea)` — pre-render KaTeX
2. `remark.create()` — then process markdown
3. `mermaid-init.js` — finally render diagrams

---

### 🧠 Lessons Learned

.pull-left[
**On delegation** 🤖
- Batch ≤10 tasks; queue timeouts at ~20+
- 0s completion = red flag 🚨
- Always verify with counts, not agent claims
- Resume sessions with "apply now" for no-ops

**On tooling** 🛠️
- Deterministic script beats flaky agents for *repeatable* edits
- Grep counts = cheap, objective verification
]
.pull-right[
**On design** 🎨
- One palette per topic, documented in a reference deck
- Semantic roles, not aesthetic choices
- Colors must survive *across* slides
- Leave noise (numbers, complexity) neutral

**TL;DR:** color the *structure*, not the clutter 🎯
]
