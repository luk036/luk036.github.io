> 💡 **Golden Rule:** Trade memory for CPU cycles when:
> - Input domain is **small** (e.g., 256 bytes)
> - Computation is **expensive** (e.g., sin/cos)
> - Look-ups are **frequent** (e.g., pixel processing)

$$ \color{#137333}{T_{\text{lookup}}} \ll \color{#b31412}{T_{\text{compute}}} \quad\Rightarrow\quad \text{use a LUT!} $$

### CORDIC — The Grandfather 🧮

**Coordinate Rotation Digital Computer**

.mermaid[

<pre>
%%{init: {'theme': 'base', 'themeVariables': { 'primaryColor': '#1a73e8', 'primaryTextColor': '#fff', 'primaryBorderColor': '#fff', 'lineColor': '#f8f8f8', 'secondaryColor': '#006100', 'tertiaryColor': '#fff'}}}%%

    B --> C{🔁 For i=0..n}
    C -->|Rotation| D[📐 Look-up\narctan(2⁻ⁱ)]
    D --> E[✏️ Update\nx, y]
    E --> C
    C -->|Done| F[📤 Output\nsin θ, cos θ]

    style A fill:#1a73e8,color:#fff
    style B fill:#e37400,color:#fff
    style D fill:#137333,color:#fff
    style F fill:#9334e6,color:#fff
</pre>

]

**The core recurrence** — the angle table *is* the LUT 📋:

$$ x_{i+1} = x_i - \sigma_i\, y_i\, 2^{-i}, \qquad y_{i+1} = y_i + \sigma_i\, x_i\, 2^{-i} $$

$$ \theta \;\approx\; \sum_{i=0}^{n-1} \sigma_i\; \color{#137333}{\arctan(2^{-i})} $$

**Why It's Fast:**
- ✅ Only shift, add, and table look-up — no multiply/divide hardware
- ✅ Used in FPGAs, microcontrollers, and calculators

### CORDIC `constexpr` — Code Example 📝

```cpp
// From CORDIC_Rotate_APFX project
template <int W, int I>
class CCordicRotateConstexpr {
public:
    // constexpr constructor builds ROM at compile time
    constexpr CCordicRotateConstexpr() : rom() {
        for (int i = 0; i < N_ITERATIONS; ++i) {
            // Angles computed at compile-time!
            rom[i] = atan_constexpr(2.0 ^ -i);
        }
    }

    // Rotate using compile-time generated ROM
    void rotate(ap_fixed<W, I>& x,
                ap_fixed<W, I>& y,
                const ap_fixed<W, I>& theta) {
        for (int i = 0; i < N_ITERATIONS; ++i) {
            // Fast look-up into constexpr ROM
            const auto angle = rom[i];  // No runtime computation!
            // ... rotation logic ...
        }
    }

private:
    // ROM generated ENTIRELY at compile time
    ap_fixed<W, I> rom[N_ITERATIONS];
};
```

**Why This is Revolutionary:**
- ✅ **Zero runtime initialization cost** &amp; **bit-accurate** for HW simulation
- ✅ **Clean dependencies** (no external build steps) &amp; **compile-time validation**

### CRC — Cyclic Redundancy Check 🔄

.mermaid[

<pre>
%%{init: {'theme': 'base', 'themeVariables': { 'primaryColor': '#1a73e8', 'primaryTextColor': '#fff', 'primaryBorderColor': '#fff', 'lineColor': '#f8f8f8', 'secondaryColor': '#006100', 'tertiaryColor': '#fff'}}}%%
graph LR
    A[📦 Data Stream\n1GB] --> B{⚡ Method}
    B -->|Bit-by-bit| C[🔁 8 billion XORs\n🐢 Slow]
    B -->|Byte LUT| D[📋 Table of 256\nPrecomputed CRCs]
    D --> E[💨 1 billion look-ups\n🚀 Fast]

    style A fill:#1a73e8,color:#fff
    style B fill:#e37400,color:#fff
    style C fill:#b31412,color:#fff
    style D fill:#137333,color:#fff
    style E fill:#137333,color:#fff
</pre>

]

**The 256-entry LUT** turns bit-serial work into one byte look-up:

$$ \text{crc} \leftarrow T[\;(\text{crc} \oplus b) \wedge 0\text{xFF}\;] \oplus (\text{crc} \gg 8) $$

```c
uint32_t crc_table[256];  // Precomputed table
uint32_t crc = 0xFFFFFFFF;
for (byte in data) {
    crc = crc_table[(crc ^ byte) & 0xFF] ^ (crc >> 8);
}
```

**Performance:** Processing **byte-by-byte** instead of **bit-by-bit** 🚀

cell (INV_X1) {
  pin (Y) {
    timing () {
      cell_rise(delay_template_7x7) {
        index_1 ("0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0")  # Input slew

**Bilinear interpolation** between the 4 surrounding grid points:

$$ t = (1{-}u)(1{-}v)\,t_{00} + u(1{-}v)\,t_{10} + (1{-}u)v\,t_{01} + uv\,t_{11} $$

**Without LUT:** complex differential equations → **months of runtime**  
**With LUT:** 3-5 FP operations → **minutes of runtime** 🚀

.mermaid[

**Pack two coordinates into one 32-bit key:**

$$ \text{key} = (x \ll 16) \;|\; (y \wedge 0\text{xFFFF}) $$

```cpp
// Key optimization in FastRoute
std::unordered_map<int32_t, int> coord_dedup_map;
int32_t key = (x << 16) | (y & 0xFFFF);
auto it = coord_dedup_map.find(key);
if (it != coord_dedup_map.end()) {
    idx = it->second;              // Reuse existing coordinate
} else {
    idx = coord_list.size();
    coord_dedup_map[key] = idx;    // Insert new coordinate
    coord_list.push_back({x, y});
}
```

**Performance Impact:** $\color{#b31412}{O(n^2)}$ → $\color{#137333}{O(1)}$ look-ups — hours → **minutes** 🚀
