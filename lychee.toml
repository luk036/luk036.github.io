# Link checker configuration (https://github.com/lycheeverse/lychee)
# Sites that block automated link checkers (403/400) but work in browsers.
exclude = [
  'onlinelibrary\.wiley\.com',
  'jp\.mathworks\.com',
  'www\.npmjs\.com',
  'stackoverflow\.com',
  'www\.sciencedirect\.com',
  # PlantUML server returns transient 502s.
  'www\.plantuml\.com',
]

max_retries = 2
timeout = 20
