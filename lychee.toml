# Link checker configuration (https://github.com/lycheeverse/lychee)
# Sites that block automated link checkers (403/400) but work in browsers.
exclude = [
  'onlinelibrary\.wiley\.com',
  'jp\.mathworks\.com',
  'www\.npmjs\.com',
  'stackoverflow\.com',
  'www\.sciencedirect\.com',
  # PlantUML server returns transient 502s.
  'www\.plantuml\.com',
  # cppreference serves 403 to non-browser user agents.
  'en\.cppreference\.com',
]

# Resolve root-relative links (e.g. href="/" in 404.html) against the repo root.
root_dir = '.'

max_retries = 2
timeout = 20
