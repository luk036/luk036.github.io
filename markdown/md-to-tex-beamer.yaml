#          --include-in-header=md-to-tex-preamble.tex \
#          md-to-tex-beamer.yaml md-to-tex-slides.md -o md-to-tex-slides.pdf
fontsize: 10pt
classoption:
  - serif
  - aspectratio=169
institute: Fudan University
date: \today
link-citations: true
colorlinks: true
...
