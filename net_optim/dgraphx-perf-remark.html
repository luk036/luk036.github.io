### 🎯 What digraphx Solves

.pull-left[
A family of **network-optimization** algorithms on weighted directed graphs:

- **Negative cycle detection** — Howard's policy iteration 🌀
- **Minimum cycle ratio (MCR)** — the "tightest" cycle ⚖️
- **Parametric network problems** — one scalar parameter `r` 📈
- **Min-cost flow** — cycle-canceling descent 💰

> 🧩 The presentation that follows is about **performance** — the algorithms themselves were already correct.

### 🌀 Howard's Method — The Skeleton

The negative-cycle finder is a **Template Method**: relax to a fixpoint, find cycles in the predecessor graph, yield them.

.mermaid[

<pre>
graph LR
    A["1. Relax every edge\n(Bellman-Ford pass)"] --> B{"Any d changed?"}
    B -- Yes --> C["2. Find cycles in\nthe predecessor graph"]
    C --> D{"Cycle found?"}
    D -- Yes --> E["3. Verify negative\nyield cycle 🔴"]
    D -- No --> A
    B -- No --> F["✅ No negative cycle"]
    style A fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style B fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style C fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
    style D fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style E fill:#ffccbc,stroke:#bf360c,stroke-width:3px
    style F fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px
</pre>

]

**Relaxation** is the hot loop — one triangle-inequality check per edge:

$$ {\color{#5e81ac}d[v]} \;>\; {\color{#5e81ac}d[u]} + {\color{#bf616a}w(u,v)} \quad\Longrightarrow\quad {\color{#5e81ac}d[v]} \gets {\color{#5e81ac}d[u]} + {\color{#bf616a}w(u,v)} $$

> ⚠️ The hot loop calls the **weight function** ${\color{#bf616a}w(\cdot)}$ once per edge, on **every pass**.

---

### ⚖️ Minimum Cycle Ratio — and Its Parametric Form

The **MCR** problem looks for the cycle with the smallest cost/time ratio:

$$ r^{*} \;=\; \min_{C \subseteq G} \; \frac{\sum_{e \in C} {\color{#bf616a}c(e)}}{\sum_{e \in C} {\color{#5e81ac}t(e)}} $$

Reformulate as a **parametric** problem with parameter $r$ — each edge gets a *reduced distance*:

$$ {\color{#bf616a}d_r(e)} \;=\; {\color{#bf616a}c(e)} - {\color{#b58900}r}\,{\color{#5e81ac}t(e)} $$

Then the key equivalence holds:

$$ \text{a cycle } C \text{ has ratio} < r \quad\Longleftrightarrow\quad \sum_{e \in C} {\color{#bf616a}d_r(e)} < 0 \quad (\text{negative cycle}) $$

So MCR becomes a **sequence** of negative-cycle queries at changing ratios. 🔁

---

### 🔁 The Dinkelbach / Lawler Outer Loop

.mermaid[

<pre>
graph LR
    S["Start r₀"] --> H["howard(dist, r)\nfind negative cycles"]
    H --> Q{"cycle found\nwith ratio r(C) < r?"}
    Q -- Yes --> U["r ← r(C)\n(zero_cancel)"]
    U --> H
    Q -- No --> D["✅ r = min cycle ratio"]
    style S fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style H fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style Q fill:#f9e79f,stroke:#f57f17,stroke-width:3px
    style U fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
    style D fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px
</pre>

]

Each ratio update is a Newton step; convergence is finite and fast. ✅

> 🔑 **THE INVARIANT that this whole talk hinges on:**
>
> Inside a single `howard()` call, the ratio ${\color{#b58900}r}$ is **constant**. Every edge has **one** fixed ${\color{#bf616a}d_r(e)}$.
>
> Yet the naive hot loop recomputes it on **every relaxation pass**. 😱

### ⚡ The Fix — Evaluate Each Weight Once per Call

**Before** — `get_weight` is a closure called inside the per-edge hot loop, every pass:

```python
def get_weight(e):
    return DomainType(omega.distance(ratio, e))   # Fraction(cost) - ratio * time

while not found and relax(digraph, dist, get_weight, update_ok, point_to):
    ...  # relax calls get_weight(e) for every edge, on every pass
```

**After** — flatten the graph once, evaluate each weight once, reuse across passes:

```python
edges = [(u, v, e, get_weight(e)) for u, nb in digraph.items()
                                   for v, e in nb.items()]   # ← once per call

def relax():
    for u, v, e, w in edges:            # ← pre-weighted, no recompute
        if dist[v] > dist[u] + w: ...
```

Bonus: the redundant `DomainType(omega.distance(...))` **double conversion** in the outer loop was dropped. 🧹

$$ \text{evaluations}: \; {\color{#bf616a}P_{\text{passes}} \times E} \;\longrightarrow\; {\color{#2e7d32}1 \times E} $$

### 📉 Rejected: Native Compilation (mypyc)

Measured on a typed hot loop, mypyc gave a **2.28×** (368.8 → 162.0 ms). But it does not fit here:

- ❌ The real package **fails mypyc's type check** — 15+ errors, several design-level (`int|float` vs `Domain`, `_run_loop` type-var mismatches) 🧱
- ❌ `fractions.Fraction` is **pure-Python stdlib** — mypyc compiles *your* code, not the library that dominates the profile 🐌
- ❌ It changes packaging and CI for a win that lands mostly on the *non-Fraction* path 📦

.font-sm[
| option | ceiling | fit for this code |
|:-------|--------:|:------------------|
| 🐍 Cython | high | best — can express C rationals |

> 🎯 Native tooling is a **last** resort, after the algorithmic win is banked.

## 🌍 Part 4 — Cross-Language Ports

---

### ⚙️ C++ — a Lazy Weight Cache

The Python fix could not be transcribed literally (see the eager-flatten trap). Instead: **`RelaxCached`**, a strategy that caches weights **only when they will be reused**.

.pull-left[
.mermaid[

<pre>
graph LR
    P0["pass 0\nplain loop\nno cache"] --> P1["pass 1\nrelax + build\nweights[]"]
    P1 --> P2["pass ≥ 2\nrelax using\ncached weights"]
    style P0 fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px
    style P1 fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style P2 fill:#a3be8c,stroke:#2e7d32,stroke-width:4px
</pre>

]

- **Single-pass search** → nothing is computed, nothing is allocated 🆓
- **Multi-pass search** → weights built once, reused thereafter ♻️
- Also: `find_cycle` now does **one hash probe** per node (`try_emplace` + `find`) instead of `contains` + `at` 🔍
]
.pull-right[
| benchmark | before | after |
|:----------|-------:|------:|
| single-pass, n = 20 K–200 K | — | **~1.05×** ✅ |
| single-pass, n = 500 K–1 M | — | **neutral** ✅ |
| multi-pass cache, n = 2,000 | 514 ms | **405 ms · 1.27×** ✅ |

Verified with `xmake` (`/W4 /WX`) — **78 tests / 127 assertions**. ⚙️
]

### 🦀 Rust — Compile-Time Mode Split

Rust's monomorphization inlines the weight closure, so a per-edge cache check *cost* ~5% on single-pass. The fix: make the mode a **`const` generic** so pass 0 compiles back to the original loop.

```rust
fn relax_pred_pass<const MODE: u8, ...>(...) -> bool {
    let weight = if MODE == RELAX_USE {
        cache.weights[idx]              // read cached weight
    } else {
        let value = get_weight(&w);     // compute once
        if MODE == RELAX_BUILD { cache.weights.push(value); }
        value
    };
    ...
}

match cache.pass {
    0 => relax_pred_pass::<RELAX_PLAIN, _, _, _>(...),  // byte-identical to before
    1 => relax_pred_pass::<RELAX_BUILD, _, _, _>(...),  // build while relaxing
    _ => relax_pred_pass::<RELAX_USE,   _, _, _>(...),  // reuse
}
```

- `find_cycles_in` also switched to the **`entry` API** — one probe instead of two 🔍
- Verification: `cargo test --all-features` → **57 + 6 + 20 tests**, clippy clean, fmt clean 🦀

### 📏 Why Wall Time Lies

First attempt: run the benchmark, read the number. Then run it **again** — and get a different number. 😵

<p align="center">

**The protocol that works:** 🧪
- Build **both** variants as separate binaries; run them **interleaved** in one session 🔁
- Take the **min of N**; report the spread, not a single number 📊
- Trust the **answer** — identical ratio / cycle / iteration count — most of all ✅

### 🧠 Key Takeaways

**Performance** ⚡
- **Profile first** — the bottleneck was arithmetic, not the graph algorithm 🔍
- Find the **invariant**: the ratio is fixed for a whole `howard()` call ⇒ compute weights **once** 🎯
- Match the fix to the **host language**: Python → flatten; C++ → lazy cache; Rust → const generics 🌍
- A **lazy** cache wins: zero cost for single-pass, real gains for multi-pass ♻️

**Process** 🔁
- A theoretically-better algorithm is **not** better until measured — SPFA lost by **337×** 📏
- A fix that must be applied **twice**, or that **copies the code it measures**, is a red flag 🚩
- Machine state drifts **2×**; alternate A/B and report the spread 📊

**Correctness** 🐛
- The evidence is the **unchanged answer** — same ratio, same cycle, same iteration count ✅
- *"Faster"* that changes the result is a bug with a nice benchmark 🚨
