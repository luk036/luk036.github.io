- **FM Optimization**: Snapshot/rollback, 2-pin/3-pin fast paths
- **Objective**: Minimize edge cut while satisfying balance constraints

### 🔒 Fixed Modules (`-f`) & Yosys JSON (`-i yosys`)

.pull-left[
**Fix file** — hMetis-compatible, one ID per line:

```bash
ckpttn circuit.hgr 2 5 -f fix.txt
Fixed modules: 3
```

- 🧩 Additive: merges with native fixed modules (yosys ports)
- 🔌 Plumbing: `module_fixed` set respected by `init()` in both FMPartMgr and NNPartMgr
]

.pull-right[
**Yosys JSON** — synthesis netlist input:

```bash
ckpttn netlist.json 2 5 -i yosys
```

- Maps `cells` → modules (weight 1)
- Maps `ports` → pads (weight 0, fixed)
- Maps integer net IDs → net nodes
- Auto-fixes all I/O ports
]

### ⚙️ Algorithm Core Parameters

**MLPartMgr & FMConstrMgr:**

| # | Parameter | Value | File | Role |
|---|---|---|---|---|
| — | `limitsize` | `50U` ⚡ | `MLPartMgr.hpp` | Coarsening threshold (was 7) |
| — | `bal_tol` | variable | `FMConstrMgr` | Balance tolerance |
| — | `lowerbound` | computed | `FMConstrMgr.cpp` | $\lfloor {\color{blue} total\_weight} \times \frac{2.0}{{\color{red} k}} \times {\color{orange} bal\_tol} \rfloor$ |

**Gain Calculator & Global Caps:**

| # | Parameter | Value | Meaning |
|---|---|---|---|
| — | `stack_buf_size` (Bi) | `32768` ⚡ | PMR buffer (was 8192) |
| — | `stack_buf_size` (KWay) | `65536` ⚡ | PMR buffer (was 20000) |
| — | `FM_MAX_DEGREE` | `500` ⚡ | Skip gain calcs on >500-degree nets (was 65536) |
| — | `FM_MAX_NUM_PARTITIONS` | `255` | uint8_t limit |
| — | `special_handle_2pin_nets` | `true` | Fast path for degree=2,3 nets |

### 🔮 Implicit Behaviors (Hardcoded in Control Flow)

| # | Location | Behavior |
|---|---|---|
| — | `PartMgrBase::_optimize_1pass` | `gainmax &lt; 0` → snapshot + deferred rollback |
| — | `PartMgrBase::optimize` | Loop until `cost == prev_cost` |
| — | `NNPartMgr::_optimize_1pass` | `gainmax &lt; 0` → break (no rollback) |
| — | `FMConstrMgr` ctor | $\times {\color{orange} 2.0}$ factor in balance formula |
| — | `FMGainMgr::update_move` | Degree dispatch: 2→fast, 3→fast, 4+→general |
| — | `min_cover.cpp` | `degree == 1` → self-loop detection |

**PartMgrBase vs NNPartMgr**:

.mermaid[
<pre>
graph TD
    A["gainmax &lt; 0?"] -->|"PartMgrBase"| B["📸 Snapshot\nDefer rollback"]
    A -->|"NNPartMgr"| C["❌ Break\nNo rollback"]

    B --> D["Continue until\nbucket empty"]
    C --> E["Return best so far"]

    style B fill:#2196f3,color:#fff
    style C fill:#f44336,color:#fff
</pre>
]
