## 🧭 Part 1 — The Setup

---

### 🎛️ What Is FM Partitioning?

Given a hypergraph $H=(V,E)$ and $k$ parts, minimize the **weighted cut**:

$$ \min \sum_{e \in E} {\color{#bf616a} w(e)}\,\bigl[\,e \text{ spans} > 1 \text{ part}\,\bigr] $$

.mermaid[

<pre>
graph LR
    HG["Hypergraph\nmodules + nets"]
    INIT["Initial partition"]
    FM["FM refinement\nmove vertices"]
    OUT["Optimized partition"]
    HG --> INIT
    INIT --> FM
    FM --> OUT
    style HG fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style INIT fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style FM fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style OUT fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
</pre>

]

> Fiduccia–Mattheyses: greedily move the **highest-gain** vertex, then lock it. 🔁

---

### 🔁 The Inner Move Loop

Each move touches every net incident to $v$, and every pin of that net:

$$ \text{cost per move} \;=\; \sum_{e \ni v} {\color{#5e81ac} \deg(e)} $$

```python
for net in vertex_nets[v]:            # nets of v
    for w in net_pins[net]:           # pins of net
        modify_key(w, part[w], delta) # update gain bucket
```

### 💡 The #1 Find: No-Op Key Updates

For a general net with $\ge 2$ pins in **both** parts, moving one pin changes nothing:

$$ {\color{#2e7d32} \Delta g_w} = 0 \quad \text{whenever} \quad {\color{#bf616a} |e \cap p| \ge 2} \ \ \forall p $$

Yet `modify_key` was still called for **every** neighbour:

```python
for dGw, w in zip(delta_gain, idx_vec):
    if dGw:                     # ← the one-line fix
        modify_key(w, part[w], dGw)
```

> Skipping a zero delta is a no-op in the bucket queue — so it is **free**. 🎯

### 🗃️ Caching Adjacency & Degree

Materialise the networkx views **once** per gain calculator:

```python
self.net_pins = {net: list(self.hyprgraph.ugraph[net])
                 for net in self.hyprgraph.nets}
self.net_degree = {net: len(pins) for net, pins in self.net_pins.items()}
self.vertex_nets = {v: [] for v in self.hyprgraph}
for net, pins in self.net_pins.items():
    for v in pins:
        self.vertex_nets[v].append(net)
```

> The hot loop then touches **plain lists** — no view objects, no attribute walks. 📦

---

### 🧩 Bonus: The `mywheel` Dependency

The bucket queue used `id(x) == id(y)` for identity — a **builtin call per check**:

| Function | Before | After |
|:---------|:-------|:------|
| `Dllink.is_locked` | `id(a) == id(b)` | `a is b` ✅ |
| `Dllist.is_empty` | `id(a) == id(b)` | `a is b` ✅ |
| `DllIterator.__next__` | `id(a) != id(b)` | `a is not b` ✅ |

- `builtins.id`: **4.25 M calls** → 0 🗑️
- `increase_key`: only rescan the max when needed 🎯

> A/B/B/A on ckpttnpy: **+2.7% p1, +5.6% ibm03**. 📈

### 📉 The Per-Call Allocation Tax

`update_move_general_net` returned a **fresh `std::vector` per net per move**:

```cpp
auto delta_gain = vector<int>(degree, 0);   // heap allocation!
...
return delta_gain;                          // and a copy
```

- The k-way path allocated a `vector<vector<int>>` — **many** small allocations 🐌
- Called once per net, per moved vertex, per pass

> The C++ was already fast — but not **allocation-free**. 🧾

---

### 🎯 The Fix: Reusable Buffer + Span

Keep the buffer in the calculator; return a **non-owning view**:

```cpp
auto& delta_gain = this->delta_gain_buf;   // reused across calls
delta_gain.assign(degree, 0);
...
return std::span<const int>{delta_gain.data(), degree};
```

.mermaid[

<pre>
graph LR
    OLD["new vector\nper call ❌"] --> FIX["member buffer\nreused ✅"]
    FIX --> SPAN["std::span\nview, no copy ✅"]
    style OLD fill:#f8bbd0,stroke:#c2185b,stroke-width:3px
    style FIX fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style SPAN fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>

]

> All in-tree callers use `auto` — the change stays **source-compatible**. 🔧

## 🦀 Part 4 — Rust: The Same Lesson

---

### 🦀 The `.clone()` and `.collect()` Tax

The manager cloned the shared index vector **per net per move**:

```rust
let idx_vec: Vec<_> = self.gain_calc.idx_vec().clone(); // alloc + copy
for (i, &w) in idx_vec.iter().enumerate() { ... }
```

And collected neighbours into a `Vec` **per move**:

```rust
let nbrs: Vec<_> = self.hyprgraph.neighbors(v).collect(); // alloc
```

> The borrow checker made the clone *look* necessary — it wasn't. 🧠

---

### 🔧 Borrow-Checker-Friendly Buffers

Keep a reusable buffer on the struct; index it instead of cloning:

```rust
self.nbrs_buf.clear();
self.nbrs_buf.extend(self.hyprgraph.neighbors(v));
let num_nbrs = self.nbrs_buf.len();
for i in 0..num_nbrs {
    let net = self.nbrs_buf[i];        // Copy — the borrow ends here
    ...
}
```

- **Disjoint field borrows** let `nbrs_buf` and `hyprgraph` coexist 🤝
- `update_move_init` no longer reallocates `delta_gain_v` every move ♻️

---

### 🧠 Key Takeaways

**Performance** ⚡
- **Profile first** — the bottleneck is rarely where you guess 🔍
- Eliminate **no-op work** before micro-tuning (`if dGw`) 🎯
- Python: kill wrapper frames (`MapAdapter`, networkx views) 🐍
- C++: reuse buffers, return `span` — no per-call `vector` ⚙️
- Rust: don't `.clone()` / `.collect()` what you can index 🦀
- Every change was **behavior-preserving** — verified by quality checks ✅
