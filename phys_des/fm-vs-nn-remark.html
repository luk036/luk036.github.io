## 🧭 Part 1 — Background

---

### ✂️ Hypergraph Partitioning

Partition the modules $V$ of a hypergraph into $k$ parts, minimizing the **cut** while keeping the parts **balanced**:

$$ \color{#bf616a}{\text{cut}(\Pi)} \;=\; \sum_{n \in N} \color{#88c0d0}{w(n)} \cdot \bigl[\,|\{\,p(v) : v \in n\,\}| > 1\,\bigr] $$

$$ \text{subject to} \quad \color{#a3be8c}{W_k} \;=\; \sum_{v : p(v)=k} \color{#ebcb8b}{w(v)} \;\ge\; \color{#5e81ac}{\text{lowerbound}} $$

- $\color{#88c0d0}{w(n)}$ — net weight 🪢
- $\color{#ebcb8b}{w(v)}$ — module weight ⚖️
- $\color{#5e81ac}{\text{lowerbound}}$ — balance tolerance floor 📐

> A **combinatorial** problem — NP-hard, solved by local search. 🔁

---

### 🧲 The Fiduccia–Mattheyses (FM) Algorithm

**Move a module, track the *gain*, keep the best prefix.**

$$ \color{#a3be8c}{g(v)} \;=\; \underbrace{\color{#88c0d0}{\text{ED}(v)}}_{\text{external degree}} \;-\; \underbrace{\color{#bf616a}{\text{ID}(v)}}_{\text{internal degree}} $$

- Positive gain → the move **reduces** the cut ✅
- FM also takes **negative-gain** moves to escape local minima 🕳️
- Then it **rolls back** to the best prefix seen in the pass ↩️

> Gain **buckets** pick the best move in $O(1)$. 🪣

---

### 🧱 Three Pieces of FM Sophistication

.pull-left[

**🪣 Gain buckets**
- Bounded priority queue
- $O(1)$ max / key-update

**🔒 Vertex locking**
- A module moves **once** per pass
- Prevents thrashing

]

.pull-right[

**📸 Snapshot / rollback**
- Journal of moves
- Undo back to the **best prefix**

**🧲 Negative-gain moves**
- Hill-climbing to escape local minima
- Requires the rollback safety net

> Powerful — but *three* moving parts. Can we make a **simpler** refiner? 🤔

]

## ⚡ Part 2 — The Pure Local Search

---

### ⚡ NN — the *No-Nonsense* Refiner

**Greedy hill-climbing.** Take the best move **only if it improves**, then stop.

$$ \color{#5e81ac}{g_{\max}} \;>\; 0 \quad\Longrightarrow\quad \text{apply move} \qquad\qquad \color{#bf616a}{g_{\max}} \;\le\; 0 \quad\Longrightarrow\quad \text{stop} $$

.mermaid[

<pre>
graph LR
    A["select max-gain move"] -->     B{"positive gain ?"}
    B -->|"no"| C["STOP\n(local optimum)"]
    B -->|"yes"| D["check balance"]
    D --> E["apply move\n(no lock, no snapshot)"]
    E --> A
    style A fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style C fill:#d5f5e3,stroke:#2e7d32,stroke-width:3px
    style E fill:#e8f5e9,stroke:#43a047,stroke-width:3px
</pre>

]

---

### 📉 Why NN Terminates — Monotonicity

Only **strictly improving** moves are accepted, so the cut **never increases**:

$$ \color{#5e81ac}{\text{cost}_{t+1}} \;=\; \color{#5e81ac}{\text{cost}_t} - \underbrace{\color{#a3be8c}{g_{\max}}}_{>\,0} \;<\; \color{#5e81ac}{\text{cost}_t} $$

- The cut is a **non-negative integer** 🔢
- Each move strictly decreases it → **finitely many** moves ✅
- No locking needed — an improving move can never **cycle** 🚫🔁
- No snapshot needed — we **never** want to undo an improving move ↩️❌

> Monotone descent ⇒ termination. **No safety net required.** 🎯

---

### ⚖️ FM Pass vs NN Pass

.pull-left[

**FM** 🧲 — best *prefix*

```text
while not empty:
    v, g = select_max()
    if g &lt; 0: snapshot()
    lock(v)
    apply(v); update()
rollback_to_best_prefix()
```

- accepts $g < 0$ 🕳️
- locks + journals 🔒📸

]

.pull-right[

**NN** ⚡ — greedy descent

```text
while not empty:
    v, g = select_max()
    if g &lt;= 0: break
    check_balance(v)
    apply(v); update()
```

- accepts only $g > 0$ ✅
- **no** lock, **no** journal 🚫🔒

> Same skeleton — **only the single-pass hook differs.** 🧩

]

---

## 🔧 Part 3 — The Refactor

---

### 🐍 Python: `NNPartMgr` Becomes a Pure Hook

Before — the pass carried FM-style bookkeeping:

```python
def _optimize_1pass(self, part):
    ...
    self.gain_mgr.update_move(part, move_info_v)
    self.gain_mgr.update_move_v(move_info_v, gainmax)
    self.validator.update_move(move_info_v)
    part[v] = to_part
```

After — bucket-based greedy descent, **no lock, no journal**:

```python
def _optimize_1pass(self, part):
    totalgain = 0
    while not self.gain_mgr.is_empty():
        move_info_v, gainmax = self.gain_mgr.select(part)
        if gainmax &lt;= 0:
            break
        if not self.validator.check_constraints(move_info_v):
            continue
        ...
    self.totalcost -= totalgain
```

> The class shrank from **194 → 30 lines**. 🪄

---

### 🔧 C++: Remove the Last FM Vestige

The C++ `NNPartMgr` already shared the FM skeleton — but still **locked** each move:

```cpp
if (gainmax &lt; 0) { break; }
...
this->gain_mgr.lock(move_info_v.to_part, move_info_v.v);   // ❌ FM machinery
this->gain_mgr.update_move(part, move_info_v);
```

The fix (**2 lines**):

```cpp
if (gainmax &lt;= 0) { break; }                              // ✅ non-positive
...
this->gain_mgr.update_move(part, move_info_v);            // ✅ no lock
```

- Threshold `< 0` → `<= 0` — a zero-gain move is **non-improving** 🚫
- Once unlocked, accepting $g = 0$ could **cycle** 🔁
- `FMPartMgr` / `PartMgrBase` left **untouched** 🧲

---

### 🇷 Rust: the Gain-Manager Re-Port

The Rust `PartMgr` trait was already collapsed — but the **bucket queue** was a
lazy rewrite with the FM semantics wrong. The multilevel harness exposed five
real defects:

- **Stale max**: a single `current_max`, no live-entry bookkeeping → popped keys
  popped again, and ibm03 **looped forever** 🔁
- **`modify_key`** wrote an absolute key from a delta and hit the wrong bucket
  🪣
- **`set_key`** had insert side effects (write-only in FM) ✍️
- **ML collapse to cut 0**: `update_move` used a stale `weight_cache`, so
  **balance was ignored** during refinement ⚖️
- k-way 3-pin nets lost the `weight = -weight` sign flip (C++ has it) ↩️

The fix — one commit (`#23`): `present`/`node_key` bookkeeping, additive
`modify_key`, locks cleared on init, mode-aware updates.

> Verified: **245 tests green**, clippy clean, harness completes 80 records. ✅

---

### 🌍 Cross-Port Parity — Python · C++ · Rust

| aspect | Python | C++ | Rust |
|:--|:--|:--|:--|
| Structure | `PartMgrBase` subclass | `PartMgrBase` subclass | `PartMgr` trait |
| Override point | `_optimize_1pass` | `_optimize_1pass` | `optimize_1pass` |
| Gain management | FM gain buckets 🪣 | FM gain buckets 🪣 | FM gain buckets 🪣 |
| Snapshot / rollback | none 🚫 | none 🚫 | none 🚫 |
| Per-move locking | none 🚫 | none 🚫 | none 🚫 |
| Threshold | `gainmax <= 0` | `gainmax <= 0` | `gainmax <= 0` |

> Three ports, **one** behaviour: a pure, monotone local search. 🎯

.pull-left[

**Quality** 🏆
- **FM + ML** is best everywhere
- NN flat is the **weakest** 😬
- ML lifts NN close to FM 🎯

**Speed** ⚡
- NN flat is **10–100×** faster
- Use it when the cut is secondary ⏱️

]

.pull-right[

**Structure** 🧩
- Same skeleton, **one** hook 🪝
- NN = **pure, monotone** descent 📉
- No lock, no snapshot — **simpler** 🧹

- Python · C++ · Rust now **identical** ✅
- Same thresholds, same results 📐
- Rust needed a one-commit gain re-port (#23) 🔧

### 🛡️ Data Quality Note

- One Python run (`p1`, Bi FM ML, seed 2) first recorded **3355 s** 📈
- Re-measured in isolation: **0.99 s** (same cut, 56) ✅
- Cause: the unattended background process was **starved/suspended** 😴
- ➜ a **wall-clock artifact**, not a code defect 🐛❌
- ➜ the p1 data was re-collected; medians used throughout 🛡️
- The Rust harness initially **looped forever** on ibm03 (stale bucket max) 🔁
- ➜ fixed by the gain-manager re-port `#23`; 80 records now complete ✅

> Trust medians and re-measure before believing an outlier. 🔬

---

### 🧠 Key Takeaways

**Algorithm** ⚡
- NN = a **pure local search**: only improving moves ⇒ **monotone** descent 📉
- No locking, no snapshot, no rollback — **three fewer moving parts** 🧹
- Termination is **guaranteed** by a non-negative integer objective 🔢

**Patterns** 🧩
- **Template Method** for the pass skeleton 🦴
- **Strategy** for gain / constraints 🔌
- One override ⇒ FM and NN coexist 🤝

**Empirically** 📊
- FM wins on **quality**, NN on **speed** 🏁
- **Multilevel is the equalizer** — helps NN the most 🔁
- FM + ML is the **best default** 🏆
