## 🧵 Phase 1: Strategy + Context

---

### 📏 The Metric We're Injecting

$$ d_1(P, Q) \;=\; |x_P - x_Q| \,+\, |y_P - y_Q| $$

The L1 **bisector** of two sites is the set of points equidistant under $d_1$:

$$ |x - x_1| + |y - y_1| \;=\; |x - x_2| + |y - y_2| $$

When ${\color{green}|\Delta x|} \ne {\color{red}|\Delta y|}$ this is a monotone stair-step chain. When they are **equal**, rotate by 45°:

$$ u = x + y, \quad v = x - y \;\;\Longrightarrow\;\; |\Delta x| + |\Delta y| = \max\bigl(|\Delta u|,\, |\Delta v|\bigr) $$

> All of this is exactly what the new strategy object hides. 🧵

---

### 🕳️ The Leak

```js
// mergeLine.js — BEFORE
import {isNewBisectorUpward} from './l1Metric.js';   // L1 baked in
...
goUp === isNewBisectorUpward(hopTo, sideSite, otherSite, goUp)
```

Only `findBisector` was injected. The **upward test** and the **distance** stayed hard-wired to L1.

> A strategy seam that still imports the strategy is not a seam. 🧵

---

### 🧰 One Object Carries the Whole Metric

```js
// l1Metric.js — AFTER
export function createL1Metric(width, height){
    return {
        width: width,
        height: height,
        distance: distance,                        // L1
        bisector: (a, b) => findL1Bisector(a, b, width, height),
        isUpward: isNewBisectorUpward
    };
}
```

A different metric (L∞, L2) is now **one new file**, not a cross-cutting edit.

## 🏭 Phase 2: Factory, Null Object, DRY

---

### 🧹 Three Small Fixes, One Theme

.pull-left[

**🏭 Factory consistency**

```js
// all three branches now:
let bisector = createBisector([P1, P2], up);
bisector.points = vertexes;
```

No more raw literals drifting away from the factory shape.

**🔗 DRY**

Deleted the duplicate `hopOver`; every "other site" now calls `findHopTo`.

]
.pull-right[

**🚦 Null Object**

```js
// checkForOrphans
return orphan ? orphan : null;
```

`undefined` unified to `null`, matching the rest of the pipeline.

> Small, boring, and exactly the kind of thing that rots if you skip it. 🧹

]

### 🎭 The Mapper

```js
// cell.js — the entire presentation boundary
export function toSVGPath(points){
    return "M " + points.map(p => p.join(" ")).join(" L") + " Z";
}

export function toCell(site){
    return {
        site: site.site.slice(),
        polygonPoints: site.polygonPoints.map(p => p.slice()),
        d: toSVGPath(site.polygonPoints),
        neighbors: site.neighbors.map(n => n.slice()),
        bisectors: site.bisectors.map(toBisectorDTO)
    };
}
```

`polygonizer.js` no longer knows that SVG exists. 🎨

---

### 🐛 The Golden Test Earned Its Keep

The first cut looked harmless:

```js
graph.map(site => toCell(polygonizeSite(site, metric)))   // 42/42 FAIL
```

`chainBisectorPoints` **reverses shared `bisector.points` in place**, so snapshotting a cell *during* the map captured pre-reversal order for earlier sites.

The fix — polygonize **all** sites first, then map:

```js
const cells = graph.map(site => polygonizeSite(site, metric));
return cells.map(toCell);                                  // 42/42 pass
```

> Temporal coupling, made visible. The characterization test caught it instantly. ⚡

### 🧠 Key Takeaways

.pull-left[

**Architecture** 🧩
- A pattern is "applied" only when the seam is real
- Inject the *whole* strategy, not a convenience slice
- Bundle drifting parameters into a context object
- Put the presentation adapter at the boundary

**Bugs** 🐛
- Refactoring surfaced a real ordering hazard
- Shared mutable state hides temporal coupling

]
.pull-right[

**Discipline** 🧪
- Characterization tests make refactors boring (good!)
- The golden test caught the ordering bug instantly
- Cross-language parity = one conformance corpus
- Byte-identical output is the strongest evidence

**Result** ✅
- npm 9/9, differential clean, pytest 49/49
- Same public API, same diagrams, honest internals

]
