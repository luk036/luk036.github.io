## 🔍 Part 1 — The Problem

---

### 📐 What Is a "Square" Pair?

Two sites are **square-aligned** when their coordinate differences are equal:

$$|p_x - q_x| \;=\; |p_y - q_y|$$

The L1 bisector is the set of equidistant points:

$$B_1(p,q) = \{\, x : d_1(x,p) = d_1(x,q) \,\}, \qquad d_1(p,q) = |p_x - q_x| + |p_y - q_y|$$

For a **generic** pair this is a 1-D staircase. For a square pair, it is not. 🪜

---

### 🟥 The 2-D Region

Take $p=(0,0)$, $q=(2,2)$. The equation $|x|+|y| = |x-2|+|y-2|$ holds for:

- the diagonal $x+y=2$ in the middle band, and
- **every** point of the quadrant $x \ge 2,\ y \le 0$ (both sides reduce to $x - y$)

So the bisector is a staircase **plus a whole quadrant** of equidistant points. 🟥

### 💥 Why Lee–Wong Breaks

The merge walk assumes each bisector is a **1-D curve** with a binary `up` flag:

.mermaid[
<pre>
flowchart LR
    A["square pair"] --> B["bisector has a 2-D region"]
    B --> C["no consistent 1-D curve"]
    C --> D["merge walk has nothing to follow"]
    D --> E["wrong or empty diagram"]

    style A fill:#ff9800
    style B fill:#f44336
    style C fill:#f44336
    style D fill:#c62828
    style E fill:#b71c1c
</pre>
]

---

### 💧 The Current Workaround: Nudge

`src/preprocess.js` perturbs every square pair by an epsilon before the algorithm runs:

```javascript
if(Math.abs(d[0] - e[0]) === Math.abs(d[1] - e[1])){
    d[0] = d[0] + 1e-10 * d[1];
    d[1] = d[1] + 2e-10 * d[0];
}
```

After the nudge $|dx| \ne |dy|$, so the bisector becomes a proper 1-D staircase. 🩹

---

### ⚠️ The Problem with the Nudge

.pull-left[

**Works, but...** 🩹
- Approximate, not exact
- $O(n^2)$ pairwise scan
- Only catches **exact** equality
- Direction is arbitrary

]
.pull-right[

**And it leaks** 💧
- Input integers become floats
- Returned sites are perturbed:
  `[30, 30] → [30.000000003, 30.000000006]`

> For a VLSI-style integer layout, that is **not acceptable**. 🔒

]


---

### 🔒 The Constraint

> **Integer site coordinates must stay integers.**

That rules out the nudge *and* any scheme that perturbs the input to floating point.

We need an approach that is **exact** — or at least keeps the inputs exact — while still giving the merge a well-defined bisector. 🎯

### 🎯 Option 1 — Canonical Bisector

Pick **one** fixed 1-D boundary of the 2-D region and make `up`/ordering agree.

For $p=(0,0)$, $q=(2,2)$ the two candidates are:

- diagonal $+$ horizontal ray $y=0$ (the $|dx| < |dy|$ branch)
- diagonal $+$ vertical ray $x=2$ (the $|dx| > |dy|$ branch)

### 📍 Option 1 Also Needs a Canonical Intersection Point

Two bisectors can meet in a **point**, a **segment**, or a **region**:

$$B_1 \cap B_2 \;\in\; \{\,\text{point},\ \text{segment},\ \text{region}\,\}$$

`segmentIntersection` returns `null` when `denom == 0`, which lumps **parallel** and **collinear-overlap** together:

```javascript
if (denom == 0) {
    return null;   // parallel OR collinear overlap
}
```

So a canonical bisector is not enough — an overlapping intersection is **silently dropped**, and you must also pick a **canonical point** on the overlap (e.g. the endpoint with the smallest index). 📍

---

### 🧪 Option 2 — Symbolic Perturbation

Perturb site $i$ by an **infinitesimal**, indexed so no combination cancels:

$$p_i(\varepsilon) = \bigl(x_i + \varepsilon^{2i},\; y_i + \varepsilon^{2i+1}\bigr), \qquad \varepsilon \to 0^+$$

Evaluate every predicate by its lowest-order term. For $|dx| = |dy|$:

$$|dx| > |dy| \iff \operatorname{sign}(dx)\cdot\operatorname{sign}(j-i) > 0$$

The **inputs stay integers**; only ties are resolved. 🧪

---

### 📐 Option 3 — Exact Arithmetic + Region-Aware Merge

Represent the bisector as a polyline **plus** an optional 2-D region, and extend the merge to split along it.

- Exact, keeps integers 🎯
- But the merge core assumes 1-D curves
- Effectively a rewrite of `walkMergeLine` 🔧

---

### 🔧 Option 4 — Post-Process Merge

Allow the degenerate bisector, then merge coincident cells/vertices afterwards.

- Smallest conceptual change
- Cell adjacency becomes messy
- No guarantee of consistency

### 📉 Why Minimal SoS Failed

`findL1Bisector` is only **one** of several degenerate predicates:

.mermaid[
<pre>
flowchart TD
    D["square configuration"] --> P1["findL1Bisector"]
    D --> P2["isNewBisectorUpward"]
    D --> P3["determineFirstBorderCross"]
    D --> P4["trimBisector sort"]
    D --> P5["bisectorIntersection"]

    style D fill:#ff9800
    style P1 fill:#4caf50
    style P2 fill:#f44336
    style P3 fill:#f44336
    style P4 fill:#f44336
    style P5 fill:#f44336
</pre>
]

Fixing only the bisector leaves the rest degenerate → the merge desyncs. 💥

---

### 📉 Why Canonical Failed

A per-pair canonical choice is **not globally consistent**:

- Pair A may pick the horizontal boundary, pair B the vertical
- Where two square bisectors meet, the cells can **overlap or gap**
- The nudge avoids this because a **single** perturbation makes all choices mutually consistent

> Local consistency is not enough. 🌐

---

### 📉 Why Global Perturbation Underperformed

Perturbing **all** sites (577) still lost to the square-only nudge (182):

- It touches generic cases that were previously **exact**
- The Lee–Wong core is sensitive to non-integer coordinates
- So a blanket float perturbation introduces new errors 🎯

---

The nudge's remaining 182 violations are **not square cases**.

## ✅ Part 4 — Conclusions

---

### 🧠 What We Learned

.pull-left[

**Theory** 📐
- The degeneracy is a **2-D** region, not a kink
- A canonical choice needs **global** consistency
- That consistency is exactly what SoS provides

]
.pull-right[

**Practice** 🔬
- The nudge is empirically the best of the four
- Targeted perturbation beats blanket perturbation
- Minimal SoS is not enough — every predicate must agree

]

---

### 🔒 Where the Constraint Leaves Us

| Approach | Integers kept? | Violations |
|:---------|:--------------:|-----------:|
| nudge (current) | ❌ | **182** |
| canonical (minimal) | ✅ | 2769 |
| global float perturbation | ❌ | 577 |
| **full SoS (integer)** | ✅ | **?** |

The only exact path that respects the constraint is **full symbolic perturbation**. 🧪

---

### 🚀 Next Steps

1. **Full integer-preserving SoS** 🧪
   - one `signWithTieBreak` layer
   - applied to **all seven** predicates
   - verify against the corpus oracle
2. **Or diagnose the residual 182** 🔎
   - the non-square failures may matter more
3. **Duplicates policy** 🔁
   - throw, or dedupe? (the nudge currently hides them)

### 🎯 Key Takeaways

.pull-left[

**Degeneracy** 🟥
- Square pairs hide a 2-D bisector region
- 1-D machinery cannot follow it
- The nudge perturbs it away — approximately

]
.pull-right[

**Discipline** 🧪
- Measure before you refactor
- A 42-case oracle settles arguments
- Negative results are results 📉

]
