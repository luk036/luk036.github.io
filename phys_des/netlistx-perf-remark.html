### 🔁 The Three Anti-Patterns

The same three mistakes appeared in **all three languages**: 🎯

.mermaid[

<pre>
graph TD
    P["🐌 Slow hot path"]
    P --> A["① Recompute what never changes\nrebuild BCC / ear decomposition\nevery call"]
    P --> B["② Re-scan the whole set\nreverse-delete re-checks\nall edges per candidate"]
    P --> C["③ Look up by name, not index\nnode_indices().find()\nper BFS step"]

]

- ① → **cache** what depends only on the graph 🗃️
- ② → **localize** the test to the candidate's neighbourhood 🎯
- ③ → **store indices**, not names 🧱

## 🐍 Part 2 — Python: The 99× Find

### 🐌 The TSP 2-opt Surprise

`two_opt` recomputed the **entire tour** for every candidate move:

```python
new_path = best_path[:i] + best_path[i:j][::-1] + best_path[j:]
if calculate_total_distance(new_path, G) < calculate_total_distance(best_path, G):
    best_path = new_path
```

- Each candidate is $O(n)$ to build **and** $O(n)$ to score 🐢
- $O(n^2)$ candidates per sweep → $O(n^3)$ per sweep

### 🧮 The Delta Identity

A 2-opt move removes two edges and adds two. We only need the **change**, not the whole tour:

$$ \Delta \;=\; {\color{#2e7d32} w(i{-}1,\,j{-}1)} + {\color{#2e7d32} w(i,\,j)}
   \;-\; {\color{#bf616a} w(i{-}1,\,i)} - {\color{#bf616a} w(j{-}1,\,j)} $$

.mermaid[

<pre>

    subgraph P["Before · remove"]
        A["i-1"] -->|"w1"| B1["i"]
        C["j-1"] -->|"w2"| D["j"]
    end
    subgraph N["After · add"]
        A2["i-1"] -->|"w1'"| D2["j-1"]
        B2["i"] -->|"w2'"| C2["j"]
    end

> Four edge lookups instead of an $O(n)$ sum → each sweep drops from $O(n^3)$ to $O(n^2)$. ⚡

### ✂️ Reverse-Delete: $O(k\cdot E) \to O(\deg)$

Phase 2 removed each candidate and re-ran the **full** violation scan. 🐢

$$ \text{cost} \;=\; \sum_{v \in \text{cover}} \underbrace{O(E)}_{\text{re-scan all edges}} \;=\; O(k \cdot E) $$

But removing $v$ can only expose edges **incident to $v$**:

$$ v \text{ redundant} \iff \forall u \in N(v):\; u \in \text{cover} $$

```python
def redundant(vtx: Any) -> bool:
    return all(neighbor in coverset for neighbor in ugraph[vtx])
```

- Python: `pd_cover` gained an optional `redundant` predicate
- `min_vertex_cover` passes the exact $O(\deg)$ test 🎯
- Post-processing becomes $O(E)$ total

### 🌲 Cycle Cover: One BFS per Component

The C++ `generic_bfs_cycle` ran a full BFS from **every node** and copied the whole BFS `info` dict for **every back edge**. 📋

$$ T_{\text{per search}} \;=\; O\bigl(V \cdot (V+E)\bigr) \;+\; O(V \cdot E)\text{ copies} $$

## 🦀 Part 4 — Rust: Same Lesson + a Crash

---

### 🦀 Rust `two_opt`: The Same Trap

The Rust port had the same full-recompute loop — made worse by `petgraph`'s `find_edge`. 🐢

```rust
let mut new_path = best_path[..i].to_vec();
new_path.extend(best_path[i..j].iter().rev());
new_path.extend_from_slice(&best_path[j..]);
if total_distance(&new_path, grph) &lt; total_distance(&best_path, grph) {
    best_path = new_path;
}
```

- `total_distance` calls `grph.find_edge(u, v)` — $O(\deg)$ **per hop** 🔍
- So each candidate was $O(n \cdot \deg) = O(n^2)$ on a complete graph 💥

$$ T_{\text{sweep}} \;=\; O(n^2) \cdot O(n^2) \;=\; O(n^4) $$

---

### 🧱 The Adjacency-Matrix Trick

Build an $O(1)$ weight lookup **once**, then apply the same delta identity: 🗃️

```rust
let mut w = vec![vec![f64::INFINITY; nnodes]; nnodes];
for edge_idx in grph.edge_indices() {
    let (a, b) = grph.edge_endpoints(edge_idx).unwrap();
    let (ai, bi) = (a.index(), b.index());
    w[ai][bi] = grph[edge_idx];
    w[bi][ai] = grph[edge_idx];
}
```

$$ \Delta \;=\; w_{i-1,\,j-1} + w_{i,\,j} - w_{i-1,\,i} - w_{j-1,\,j} $$

### 💥 The MWPM Crash

While benchmarking, `solve_christofides_2opt_tsp` **aborted** at $n = 100$. 💥

$$ \texttt{let size = 1} \ll k; \qquad \texttt{vec![}\,\infty\,;\; \texttt{size}\texttt{]} $$

.mermaid[

### 🩹 The Greedy Fallback

Match the C++ `xnetwork-cpp` dispatch: exact for small $k$, **greedy** beyond. 🎯

```rust
const EXACT_MWPM_MAX: usize = 18;
if k &gt; EXACT_MWPM_MAX {
    return greedy_matching(&dist, odd_nodes, k);
}
```

Greedy: sort candidate pairs by distance, take the cheapest non-conflicting pair.

$$ T_{\text{greedy}} \;=\; O(k^2 \log k) \quad \ll \quad O(2^k) $$

.mermaid[

<pre>
graph LR
    K{"k odd vertices"} -->|"k ≤ 18"| EX["exact DP\n3/2 guarantee ✅"]
    K -->|"k &gt; 18"| GR["greedy matching\nheuristic ⚠️"]
    style K fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style EX fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style GR fill:#ffe0b2,stroke:#e65100,stroke-width:3px
</pre>

]

> Trade-off: no 3/2 guarantee for large $k$ — but it **runs**. 🏃

### 🧠 Key Takeaways

**Method** 🔬
- Profile first — the bottleneck is rarely where you guess
- Cache what never changes; localize what does 🗃️
- Store indices, not names 🧱

**Cross-language** 🌍
- The same three anti-patterns in Python, C++, and Rust
- Verify a fix isn't already present before porting ✅
- Bound exponential allocations — or they abort 💥

**Discipline** 🧪
- Keep outputs bit-identical; pin them with tests
- Every "before" measurement needs a timeout ⏲️
- Speed is only real if the **tests still pass** 🎯
