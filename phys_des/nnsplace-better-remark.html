# ⚡ Making `nnsplace` Faster
### ⚖️ Without Moving a Single Cell — A Performance, Patterns & Memory Story

🛠️ `cProfile` → bit-identical refactor → design patterns → smaller RAM

@luk036 👨‍💻 · 2026 📅

---

### 📝 Abstract

We take the **fairness-centric** `nnsplace` placer from the previous talk ⚖️ and make it genuinely **fast** 🚀 — without changing a single result:

- 🔥 **4.57× less CPU** across the 30-scenario seed–grid matrix (up to ~7× on the 32×32 headline case)
- 🎯 **30 / 30 scenarios bit-identical** — same `niter`, same worst wire length, same final placement hash
- 🧩 A **Strategy** (`WireLengthModel`) and **Template Method** (`_optimize_axis`) refactor along the way
- 📉 **Memory**: −2.4 MB duplicated adjacency, and a roadmap for the rest
- 🧭 And the honest list of things we *deliberately* did **not** do (scipy, CSR, `float`…)

The whole journey is guarded by one idea: **treat the seed–grid matrix as a regression oracle** 🎯.

### 🐢 Baseline: profile of `p1.json` @ 32×32

One `NnsPlacer.run()` on the reference scenario (`p1.json`, seed 831) took **~16 s** on our machine (30.7 s on the original profile machine) — dominated by two spots:

| 🕳️ hotspot | evidence | share |
|---|---|---|
| **Howard solver loop** | `_HowardsCost.distance()` called **533 k×**; `Fraction.__new__` ≈ **1.6 M** times | ~50 % |
| **Legalization** | `minimum_weight_full_matching` rerun per window step + `calc_worst_wirelength_v` **140 k×** | ~35 % |
| `cost()` | 3.57 M calls | ~10 % |

> 🐍 Python object churn, not the algorithm, was the real cost — every `Fraction` allocates, normalizes, and reduces.

## ⚡ Part 2: Four Speedups, One Number

---

### 🔧 Suggestion #1 — Kill `Fraction` churn in `distance()`

`distance()` built **2+ `Fraction` objects per call** just to take a floor. With ${\color{royalblue} r} = {\color{red}n}/{\color{red}d}$, the whole expression collapses to one integer division:

$${\color{green}\mathrm{dist}}(e, {\color{royalblue} r}) = \Big\lfloor \tfrac{{\color{royalblue} r} - {\color{blue}c}}{{\color{green}\delta}} \Big\rfloor = \Big\lfloor \tfrac{{\color{red}n} - {\color{blue}c}\,{\color{red}d}}{{\color{green}\delta}\,{\color{red}d}} \Big\rfloor$$

```python
def distance(self, ratio, arc):
    n, d = ratio.numerator, ratio.denominator
    c = arc["cost"] * d
    return (n - c) // (self._delta * d)   # was: Fraction → Fraction → floor
```

📉 **16.0 s → 7.6 s** (~2.1×), bit-identical ✅

---

### 🔧 Suggestion #2 — Build the solver adjacency once

`apply_howard` rebuilt `{u: dict(self.ugraph[u]) for u in self.ugraph}` on **every call**, copying the whole graph — even though only the edge `"cost"` attributes ever change.

💡 The arc objects (edge attr dicts) are **shared** with the graph → build once, mutate in place:

```python
adj = self._adj
if adj is None:
    adj = {u: self.ugraph[u] for u in self.ugraph}
    self._adj = adj
```

📉 **7.6 s → 7.1 s**, bit-identical ✅

---

### 🔧 Suggestion #3 — Don't run the matching when it must fail

`LocalWindowLegalizer` grew a ±radius window and re-ran the **scipy Hungarian** at every radius. But `minimum_weight_full_matching` is *guaranteed* to raise when:

- 🪢 the graph is **disconnected** → `bipartite.sets` throws `AmbiguousSolution`
- 🪣 there are **fewer slots than modules** → unmatched modules

Both are cheap to probe, so we **gate the expensive call** and just widen the window:

```python
if nx.is_connected(B) and B.number_of_nodes() - m >= m:
    try:
        matches = bipartite.minimum_weight_full_matching(B)
        for v in lst:
            _ = matches[v]
        return matches
    except (ValueError, KeyError, nx.AmbiguousSolution):
        pass          # infeasible → widen
```

📉 **7.1 s → 6.5 s**, bit-identical ✅ (and the 100×100 retry storm shrinks a lot)

---

### 🔧 Suggestion #4 — Hoist weights, score in O(log deg)

Legalization builds an edge per **module × candidate slot**, each needing the module's worst wire length after a hypothetical move. Naively that is $O(\deg)$ rescans **per slot**.

💡 Moving ${\color{blue}v}$ only changes distances to its own neighbours, and the worst is a max of V-shaped terms — score every candidate via **prefix/suffix envelopes**:

$$F(q) = \max_j \bigl({\color{red}\delta}\,|q - a_j| + c_j\bigr)
\quad\Rightarrow\quad
\underbrace{\max_{a_j \le q} (c_j - {\color{red}\delta}a_j) + {\color{red}\delta}q}_{\text{prefix}},\;
\underbrace{\max_{a_j \ge q} (c_j + {\color{red}\delta}a_j) - {\color{red}\delta}q}_{\text{suffix}}$$

- `weight0` computed **once per module per bucket** (not once per radius) 🪣
- cached neighbor lists + `bisect` on sorted coordinates → $O(\log \deg)$ per slot

📉 **6.5 s → 2.3 s**, bit-identical ✅

### 🧪 War Stories: two traps that would have broken the oracle

**1. Self-loops are real.** 🪢 Every net creates a $v\!\to\!v$ arc, so when $v$ moves, its "self neighbour" moves too. Hoisted slot data had to exclude self-loops or every weight was wrong.

**2. Matching tie-breaking depends on insertion order.** When several full matchings share the minimum weight, `linear_sum_assignment` picks the one that comes *first in matrix order* — so we had to keep the **radius-major edge insertion order** exactly, or legalize silently changed the placement.

> 🧠 Lesson: in a numeric codebase, "equivalent" data structures are only equivalent if you also preserve **iteration order**.

## 🧩 Part 3: Structure & Memory

---

### 🧩 Design Patterns: the seams we kept

The previous refactor already used **Strategy** (`Legalizer`), **Memento** (`PlacerState`), **Adapter** (`_HowardsCost`), **Facade** (`run`). This session added two more seams:

.mermaid[
<pre>
graph TD
    N["NnsPlacer 🏛️"] --> W["WireLengthModel 🧩\ncost / worst / HPWL"]
    N --> L["Legalizer 🧩\nLocal / Global"]
    N --> H["_HowardsCost 🔌"]
    N --> A["_optimize_axis(axis) 📐"]

    style N fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#2e3440
    style W fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px,color:#2e3440
    style L fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px,color:#2e3440
    style H fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440
    style A fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440
</pre>
]

- 🧩 **Strategy — `WireLengthModel`**: the delta-scaled cost/HPWL metrics moved out of the placer (public wrappers stay) → future timing/congestion-aware models drop in
- 📐 **Template Method — `_optimize_axis(axis)`**: the x/y choreography `howard → legalize → pads` is written once

---

### 📉 Memory: share the adjacency instead of copying it

The solver's cached adjacency `_adj` shallow-copied **every per-node neighbour dict** — ~240 B per arc, ≈ 2.5 MB on `p1`. But the arc attr dicts are already shared with the graph, and the topology never changes after construction:

```python
adj = {u: dict(self.ugraph[u]) for u in self.ugraph}   # before: 2.47 MB
adj = {u: self.ugraph[u]       for u in self.ugraph}   # after:  0.09 MB
```

| structure | before | after |
|---|---|---|
| `ugraph` (networkx) | 2.9 MB | 2.9 MB |
| `_adj` (solver copy) | **2.47 MB** | **0.09 MB** 🎉 |

Bit-identical, 30/30 ✅ — the deeper memory items are tracked in issue #5 📋.

---

### 🚫 What we deliberately did NOT do (and why)

- 🐍 **Swap the matching to scipy?** — networkx 3.6 already calls `scipy.optimize.linear_sum_assignment`; measured dispatcher overhead ≈ 0. Nothing to win.
- 🗂️ **`CSRDiGraph` for the solver loop?** — measured **2.2× slower** iteration than dict adjacency (per-item generator overhead). Great for *memory*, wrong for *this* hot loop.
- 🧮 **Replace `Fraction` with `float`?** — a float variant was bit-identical on all 30 scenarios, but that is *empirical luck*, not a guarantee; the min-cycle-ratio method needs exact rationals near integer boundaries. We kept exactness.
- 🔀 **Round-robin net-fairness pass?** — explored, never converged cleanly, reverted. Fairness stays where it is provable: the min–max objective.

> 🧭 Engineering = knowing which door *not* to open.

### 🔮 Future Directions

- 🗂️ **Memory (issue #5):** flow-graph storage beyond networkx (`CSRDiGraph`), and building the legalization cost matrix **without** a transient `nx.Graph`
- 🔀 **Howard-aware I/O pads** (one pad ↔ many modules)
- ⏱️ **Timing & congestion-aware `WireLengthModel`** — the Strategy seam is ready
- 🦀 **Rust / C++ port** sharing the same 30-scenario test oracle
- 📏 Cap the per-line limit consistently for core **and** I/O ring (the `line_cap_ratio` idea from the last talk)

> Every idea above ships with the same acceptance test: **bit-identical or bust** 🎯

---

### 🏁 Conclusion

- 📊 **Profile first** — the bottleneck was `Fraction` object churn, not the algorithm.
- ⚡ Four small, behavior-preserving speedups → **4.57× less CPU** on the matrix (≈ 7× on the headline case).
- 🎯 The **30-scenario oracle** made every change safe — and caught two subtle order/self-loop traps.
- 🧩 **Strategy + Template Method** seams keep future cost models and axis policies local.
- 📉 **−2.4 MB** by sharing, not copying, the adjacency.
- 🚫 And we said **no** to scipy-wrapping, CSR-for-speed, and `float` — with measurements.

**Making software faster is easy. Keeping it *identical* is the craft.** ⚖️
