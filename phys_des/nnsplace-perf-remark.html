## 🐍 Part 2 — Python: 1.55× Without Moving a Single Cell

---

### 📊 Baseline Profile (`p1.json` @ 32×32)

833 modules · 902 nets · 81 pads. One profiled `run()` = **6.43 s**.

| Bucket | Time | Share | Hot functions |
|:-------|-----:|:-----:|:--------------|
| Howard / negative-cycle | ~2.4 s | **37 %** | `_HowardsCost.distance` (533 K), `get_weight` (533 K) |
| Legalize / matching | ~2.45 s | **38 %** | `_add_radius_edges`, `nx.Graph.add_edge` (93 K), `minimum_weight_full_matching` |
| Objective &amp; cost setup | ~0.5 s | 8 % | `apply_howard` cost loop, `worst_wirelength` |
| Everything else | ~1.0 s | 17 % | `TinyDiGraph.__getitem__`, dict iteration |

> Rule #1: **profile first** — the two hot paths are the whole story. 🔍

---

### 🐍 Suggestion #1 — The Cost Model, 533K Times

The min-cycle-ratio distance is a single integer division. With ${\color{royalblue} r} = {\color{red}n}/{\color{red}d}$ and edge cost ${\color{#2e7d32} c}$:

$$ \text{dist}(r, e) \;=\; \left\lfloor \frac{{\color{red}n} - {\color{#2e7d32} c}\,{\color{red}d}}{\delta \cdot {\color{red}d}} \right\rfloor $$

But the numerator/denominator were re-read from the `Fraction` on **every** call — 533 k times per run:

```python
def distance(self, ratio, arc):
    n, d = ratio.numerator, ratio.denominator   # 2 property reads / edge
    c = arc["cost"] * d
    return (n - c) // (self._delta * d)
```

The ratio is **constant across a whole Howard sweep** — so hoist it. 🪄

---

### ✂️ Suggestion #1 — Hoist the Ratio

Cache the numerator/denominator (and the pre-scaled denominator) on the cost object, keyed by the ratio instance:

```python
def distance(self, ratio, arc):
    if ratio is not self._ratio:          # once per sweep, not per edge
        self._ratio = ratio
        self._num = ratio.numerator
        d = ratio.denominator
        self._den = self._delta * d
        self._scale = d
    return (self._num - arc["cost"] * self._scale) // self._den
```

Micro-benchmark (2 M calls): **1.5×** on `distance()` alone. 🚀

> Exactness is untouched — still one integer floor-division, still the same result. ✅

### 🧮 Suggestion #2 — Solve the Assignment Directly

Replace the graph with a plain `{module: {slot: weight}}` map and call SciPy ourselves:

```python
def _min_weight_full_matching(lst, edges, slot_adj):
    # ... color() + set-order replication (next slide) ...
    cost = np.full((len(left), len(right)), np.inf)
    for i, v in enumerate(left):
        for s, w in edges[v].items():
            cost[i, col[s]] = w
    try:
        rows, cols = linear_sum_assignment(cost)
    except ValueError:
        return None            # infeasible -> widen the window
    return {left[u]: right[v] for u, v in zip(rows, cols)}
```

Result: **2.6×** per `legalize` call, **7×** per matching call. 💨

### 🔬 Replicating NetworkX's Matrix Order

NetworkX orders the assignment matrix by a **two-colouring** (`bipartite.sets` → `color()`), then by Python **set-iteration order**:

```python
# colour with a DFS stack (LIFO), then build sets exactly like networkx
stack = [n]; color[n] = 1
while stack:
    v = stack.pop()
    for w in (edges[v] if v in edges else slot_adj[v]):
        if w not in color:
            color[w] = 1 - color[v]
            stack.append(w)

left  = list({n for n, t in color.items() if t})       # modules
right = list({n for n, t in color.items() if not t})   # slots
```

That `{n for ...}` **set comprehension is load-bearing** — it reproduces NetworkX's hash order, so ties break identically. 🔒

### 🧊 The Domain Was the Problem

The Python reference keeps `dist` as a plain **integer** dict; only the ratio is rational:

$$ \text{relax:}\quad {\color{#1565c0} d_v} \;\leftarrow\; {\color{#1565c0} d_u} + \text{dist}(r,e), \qquad {\color{royalblue} r} \in \mathbb{Q},\; {\color{#1565c0} d_v} \in \mathbb{Z} $$

The C++ port instantiated the solver with `Domain = Ratio` — so **every relaxation step** did gcd-heavy `Fraction` arithmetic:

```cpp
MinParametricSolver<decltype(ga), Ratio, Ratio> solver{ga, omega};
//                              ratio    domain = Fraction  😬
```

> `Fraction` addition and comparison both call `_gcd(...)`. That is the tax. 💸

---

### ⚙️ Fix — An Integer Domain

Instantiate the solver with `Domain = Coord` and let the ratio stay rational:

```cpp
std::vector<Coord> dist(num_modules);          // int64, like Python's dict
for (node_t v = 0; v < num_modules; ++v) dist[v] = place[axis][v];

MinParametricSolver<decltype(ga), Ratio, Coord> solver{ga, omega};
//                              ratio    domain = int  🎉
```

The enabler — one explicit conversion on the vendored `Fraction`:

```cpp
explicit operator T() const noexcept { return _numerator / _denominator; }
```

> The parametric API still yields exact ratios; only the **distance domain** is integral. ✅

---

### 🧹 Fix — A Leaner Matching

Three constant-factor fixes in `min_weight_full_matching`:

| Change | Before | After |
|:-------|:-------|:------|
| Column-id lookup | $O(E^2)$ linear scan 🔴 | `absl::flat_hash_map`, $O(1)$ 🟢 |
| Hungarian `minv` / `used`, Kuhn `seen` | allocated per row 🔴 | hoisted, `std::fill` per row 🟢 |
| Dense cost matrix | `vector<vector<Weight>>` 🔴 | one flat row-major buffer 🟢 |

First-seen column order is **preserved**, so the Hungarian tie-break is unchanged. 🔒

Profiling one crowded 32×32 bucket revealed the real cost:

.mermaid[

<pre>

    R12 --> FB["global fallback\nadd_all_slots"]
    W --> EARLY["ring >= grid ?\nno new slot possible"]
    EARLY --> SKIP["break -> fallback"]

</pre>

]

> 50×50 succeeded on the **first** ring; 32×32 exhausted **39** failing attempts. 📉

---

### ⚙️ Fix — Stop Widening, Skip the Dense Build

Once the window spans the whole line it can gain **no** further slot, so every extra ring repeats the same infeasible assignment:

```cpp
auto matched = min_weight_full_matching(candidates);
if (matched) { this->apply_matches(lst, *matched, place, axis); return; }
if (ring >= grid) break;                 // window can no longer grow
this->add_radius_edges(lst, candidates, data, axis, ring, ring);
```

And in the matcher: run the cheap Kuhn feasibility test **before** building the dense matrix:

```cpp
if (!nnsplace_detail::has_full_matching(sparse)) return std::nullopt;
// only now pay for the dense m x n matrix
```

Both are provably no-ops when they don't help. ✅

### 🎯 Key Takeaways

1. **Measure, don't guess.** The prior deck's "nothing to win" was about the dispatcher — the cost was the **transient `nx.Graph`**. 🔍
2. **Hoist invariants out of hot callbacks.** 533 k property reads → one per sweep. ✂️
3. **Tie-breaking is semantics.** Equal-cost matchings are *not* interchangeable in a chaotic iteration. 🔒
4. **Port the *idea*, not the code.** Python's `int` dict became C++'s `Domain = Coord`. 🐍→⚙️
5. **Prove no-ops are no-ops.** `ring >= grid` and the feasibility-first reorder are provably safe. ✅
6. **Two build systems agree.** xmake + cmake, 24963 assertions. 🧱
