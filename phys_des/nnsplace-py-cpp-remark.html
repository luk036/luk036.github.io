# 📐 Porting `nnsplace` from Python to C++ 🚀

### A C++20 Port: Headers + `source/*.cpp` 🧩
### guided by the `netoptim-cpp` Reference ✨

@luk036 📌 2026

---

### 🎯 Abstract

We ported the **fairness-centric FPGA placer** `nnsplace` (Python, ~1 200 lines)
to a **C++20 library** — public headers + `source/*.cpp` — `nnsplace-cpp` 🧬,
reusing the sibling C++
stack (`digraphx-cpp`, `netlistx-cpp`, `physdes-cpp`, `fractions-cpp`) and
mirroring `netoptim-cpp` conventions. The talk tells the whole **engineering
story** 🛠️ of the session:

- Mapping the Python dependency graph onto the C++ ecosystem 🔄
- Reproducing subtle **flow-graph semantics** (self-loops, pad rules) — verified
  empirically against the Python runtime 🔬
- Implementing legalization with a **rectangular Hungarian assignment** 🎯
- Finding & fixing a real **port bug** (memento snapshot refresh) via a
  Python ⟷ C++ **parity harness** 🐛➡️✅
- Splitting the code into **headers + `source/*.cpp`** (bodies > 15 lines move
  out of the header) 🧱
- Shipping with **xmake + CMake**, doctest suites, and a git repo 📦

## 🧭 Part 1: Mission — What We Ported

---

### 📍 `nnsplace`: No-Nonsense Placement

- **Placement** assigns every module of a netlist to a grid site of the FPGA
  fabric 🧩: no overlaps 🚫, reserved DSP/SRAM column honored ⚠️, wire length
  minimized 📉.
- `nnsplace` uses a **fairness-centric** objective 🎯: minimize the
  **worst-case** wire length of any connection, not the average:

$${\color{red}\min_{\text{place}}}\ \ {\color{red}\max_{(u,v)\in E}}\ \ {\color{blue} c_x}\lvert x_u-x_v\rvert + {\color{orange} c_y}\lvert y_u-y_v\rvert$$

- This is a **min–max** problem 🧮: tractable with *Howard's algorithm*
  (parametric minimum-cost flow) plus bipartite-matching legalization.

---

### 🧬 The Python Architecture (`placement.py`)

The module is compact but dense 📄 — a full placer in one file:

```
nnsplace (Python, ~1 200 lines)
├── NnsConfig            config (grid, deltas, reserved col)
├── create_flow_graph    netlist → directed flow graph
├── NnsPlacer            the optimizer
│   ├── apply_howard     Howard / MinParametricSolver (per axis)
│   ├── legalize_*       bipartite matching (bucket by line)
│   └── choose_nearest_iopad / io_assign
└── WireLengthModel      cost, HPWL hull metrics
```

- Optimization alternates the **x axis then y axis**, then **legalizes** and
  snaps **I/O pads** onto the ring 🔄.

### 🤔 Why Port to C++?

- 📦 **C++20 with headers + `source/*.cpp`** fits the sibling library
  ecosystem — sibling repos mix header-only `INTERFACE` and compiled `STATIC`
  libraries (e.g. `netlistx-cpp`, `digraphx-cpp`) 🧩.
- ⚡ Reuse of battle-tested sibling implementations → no need to re-write
  Howard's algorithm or the JSON readers.
- 🔬 Exact integer arithmetic with `fractions::Fraction` (Python `Fraction`
  semantics) — no floating-point drift.
- 🎓 `netoptim-cpp` is the **reference**: same structure, same tooling, same
  quality bar (warnings-as-errors, doctest, xmake + CMake).

## 🏗️ Part 2: The C++ Ecosystem

---

### 🗺️ Python → C++ Mapping

| Python | C++ twin | What the placer uses |
|--------|----------|----------------------|
| `netlistx.Netlist` | `netlistx-cpp` `SimpleNetlist` | `gr`, `modules`, `nets`, `num_pads`, `get_module_weight` |
| `netlistx.read_json` | `read_json_edges` (ours) | node-link JSON reader |
| `physdes.Interval` | `recti::Interval&lt;T&gt;` | hull_length metrics |
| `digraphx.MinParametricSolver` | `digraphx-cpp` `MinParametricSolver` | Howard's algorithm |
| `digraphx.TinyDiGraph` | ❌ **does not exist** | plain adjacency + `mywheel::MapAdapter` |
| `fractions.Fraction` | `fractions-cpp` `fractions::Fraction&lt;int64_t&gt;` | exact ratios |
| `networkx` bipartite | `matching.hpp` (ours) | Hungarian assignment |

- 💡 Only **integer module ids** are needed (C++ `SimpleNetlist` is int-based).

---

### 📦 `SimpleNetlist` & The JSON Format

- `read_json_format` (netlistx-cpp) builds the *exact* bipartite layout the
  Python code assumes:

$${\color{blue}\text{modules}} : 0\ldots M-1, \qquad {\color{orange}\text{nets}}: M\ldots M+N-1, \qquad {\color{green}\text{pads}}= \text{last } P \text{ modules}$$

- ⚠️ **Format gotcha**: Python node-link JSON stores edges under `"edges"` 🧾,
  but netlistx-cpp's reader expects `"links"`. Since siblings are
  read-only 📵, we ship a tiny `read_json_edges` helper with identical
  semantics (see Part 5). 🔧

---

### 🧮 Exact Arithmetic: `fractions::Fraction`

- Howard's algorithm needs **exact ratios** (average cost of a cycle) and the
  Python code computes *integer* reduced costs with floor division:

$$
{\color{royalblue}\mathrm{distance}}(r, e)=\left\lfloor \tfrac{{\color{royalblue} n}-{\color{green} c}\,{\color{royalblue} d}}{{\color{blue}\delta}\,{\color{royalblue} d}}\right\rfloor\!,\qquad
{\color{royalblue}\mathrm{zero\_cancel}}(C)=\tfrac{\sum_{e\in C} {\color{green} c}_e}{\lvert C\rvert}
$$

- 🐛 **Latent crash found**: `fractions-cpp` overflow guards divide by
  `abs(numerator)` — a **zero-cost flow arc** (abundant, e.g. self-loops)
  triggered an integer divide-by-zero during Howard relaxation 💥.
- 🩹 No sibling repo ever feeds `Fraction` through the solver → we **vendored**
  a patched, otherwise byte-identical copy into
  `include/fractions/pyfractions.hpp` (guard routes through `_max_div`).

---

### 🎛️ `MinParametricSolver` Contract (digraphx-cpp)

- The C++ API is a faithful port of the Python `min_parametric_q` solver:

```
MinParametricAPI<Node, Edge, Ratio>
    virtual Ratio distance(const Ratio& r, const Edge& e)      // reduced cost
    virtual Ratio zero_cancel(const vector<Edge>& cycle)       // mean cycle cost

MinParametricSolver<DiGraph, Ratio, Domain>::run(
    Mapping& dist, Ratio ratio, UpdateOk update_ok)            // pair<Ratio, Cycle>
```

- 🦆 `DiGraph` is **duck-typed** container-of-containers: iterate
  `(node → (neighbour, edge))`. `Edge` = the stored *value* (we store `int`
  costs directly).
- 🧭 `dist` must be indexable by node — we use `std::vector&lt;Fraction&gt;`
  (integer-valued positions, read back via `.numerator()`).
- ✅ No `TinyDiGraph` needed in C++: `create_flow_graph` returns a plain
  adjacency; `apply_howard` wraps it in `mywheel::MapAdapter` for the solver.

### 🔗 `create_flow_graph`: Fidelity Matters

Python builds directed edges from every **ordered pair** `(v1, v2)` inside each
net, adding both directions — unless the *target* is a pad:

```
for each net:
  for v1 in net:                       # every ordered pair
    for v2 in net:
      if module_weight[v2] == 0: continue      # pad can never be a target
      add v1 → v2  and  v2 → v1
```

We verified the consequences **empirically** on the Python runtime 🔬:

- **self-loops** appear on every non-pad net member `(v, v)` 🌀
- pads connect **bidirectionally** to their net, but never self-loop
- edge set is de-duplicated & sorted per node

C++ `create_flow_graph` reproduces this exactly — the mock edge set matches
Python byte-for-byte ✔️, and the `p1` flow graph has the Python-verified
**10 249 directed edges** 🎯.

---

### ⚖️ Wire Length & HPWL (integer-exact)

The linear (delta-scaled) cost model stays **integer-exact** 🧮:

$${\color{green}\mathrm{cost}}(\ell, a)={\color{blue}\delta_a}\cdot\ell,\qquad
{\color{green}\mathrm{worst}}=\max_{(u,v)\in E}\ {\color{blue}\delta_x}\lvert\Delta x\rvert+{\color{orange}\delta_y}\lvert\Delta y\rvert$$

HPWL via hull intervals (one axis at a time) 🧊:

$${\color{orange}\mathrm{hull}}(e)=\max_{i\in e} q_i-\min_{i\in e} q_i,\qquad
{\color{orange}\mathrm{HPWL}}=\sum_{e}\Bigl({\color{blue}\mathrm{hull}_x(e)}\cdot{\color{blue}\delta_x}+{\color{orange}\mathrm{hull}_y(e)}\cdot{\color{orange}\delta_y}\Bigr)$$

---

### 🎯 Legalization = Min-Weight Assignment

- A bucket of modules sharing one perpendicular line must spread onto distinct
  slots 🃏. Scoring a lateral move of module $v$ to coordinate $q$ is done in
  $O(\log \deg)$ via sorted neighbours + prefix/suffix tables:

$${\color{blue}w}(q)=\max\Bigl({\color{blue}\delta_x} q+{\color{green}\mathrm{pref}}[t],\ \ {\color{green}\mathrm{suff}}[t]-{\color{blue}\delta_x} q\Bigr),\qquad
t=\#\{a: a\le q\}$$

- Each candidate slot gets weight ${\color{green}w_1}-{\color{green}w_0}$; the
  placer solves

$${\color{red}\min}\sum_{v} {\color{green}w}\bigl(v,\ \mathrm{slot}(v)\bigr)$$

with our **rectangular Hungarian** (dummy rows leave spare slots free,
infeasible ⇒ `nullopt`).

---

### 🔍 Legalization Strategy: Window → Fallback

.mermaid[
<pre>
flowchart TB
    L[legalize bucket] --> B[base graph: current pos, weight 0]
    B --> LW[Local window  r = 1..10]
    LW --> M{matching feasible?}
    M -- yes --> D[apply matches]
    M -- "no - widen window" --> LW2[add radius ring r]
    LW2 --> M
    M -- "no - window exhausted" --> GS[Global slots fallback]
    GS --> M2{matching feasible?}
    M2 -- yes --> D
    M2 -- no --> RAISE[RuntimeError]

    style L fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#2e3440
    style B fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440
    style LW fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440
    style GS fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440
    style D fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px,color:#2e3440
    style RAISE fill:#ffcdd2,stroke:#c62828,stroke-width:3px,color:#2e3440
</pre>
]

- Local ±radius window is the **cheap, quality-preserving** path 🪟; the global
  free-slot fallback guarantees success when the grid has capacity 🛡️
  (regression: 70 modules crowded on one line).

---

### 🔌 I/O Pad Ring Assignment

- Each pad picks the nearest of the two **opposite edges**, respecting
  per-edge capacity:

$${\color{blue} \mathrm{io\_limit}}=\Big\lceil \tfrac{\#\text{pads}}{2}\Big\rceil,\qquad
\text{position}\in\{{\color{orange}0},\,{\color{orange} \mathrm{grid}+1}\}$$

- Nearest-pad math (derived in the source comments) uses only **integer**
  arithmetic with floor division — and huge sentinels (~$10^{12}$), which is
  why coordinates are `int64_t` 📏.

### 🐛 The Bug the Parity Check Found

- **Symptom**: C++ returned `iterations = 0` everywhere — the placer never
  improved 🤔, while Python improved on every grid.
- **Root cause**: the C++ `optimize()`/`run()` snapshotted the state **once**
  at entry 🔒. Python re-creates its `PlacerState` **after every improving
  iteration**; when the next iteration stalled, Python rolled back to the
  *best improved* state — C++ rolled back to the *original* one 💥.
- **Fix** — re-snapshot in the loop:

```
worst0 = worst1
state  = snapshot(place, count)     # ← was missing
```

- ✅ After the fix the C++ placer improves on every configuration and lands on
  the **same final worst value** as Python (e.g. 32×32: 1480 = 1480) 🎯.

## 🚀 Part 5: Release & Future Work

---

### 📦 CMake — Mirroring `netoptim-cpp`

- `CMakeLists.txt` follows the netoptim-cpp blueprint 🧬:
  CPM.cmake dependencies (`INSTALL_ONLY`), fmt/spdlog handling, abseil
  resolution, `SPECIFIC_LIBS`, PackageProject install, doctest, Format.cmake.
- `NnsPlace` is a **compiled (static) target** now 📚: it PUBLIC-links
  `${SPECIFIC_LIBS}` + abseil so the `.cpp` units compile and consumers
  inherit the sibling includes 🔗 (mirrors `netlistx-cpp`).
- Sibling packages are pulled **by tag** from GitHub
  (`NetlistX` v1.1.7, `DiGraphX` v1.1.7, `Recti` v1.2.4, `MyWheel` v1.1.6,
  `Py2Cpp` v1.6.4, `XNetwork` v1.7.7) 🏷️.
- Lessons learned on Windows 🪟:
  - VS **18 2026** generator (not VS 2022 toolset) 🛠️
  - a static library target needs **`CXX_STANDARD 20`** set explicitly — MSVC
    otherwise defaults to C++17 and rejects `operator<=>` 🔧
  - abseil headers come from DiGraphX; include them via the linked targets,
    not by hand 🔗

Verified: configure → build → **ctest 100% passed** ✅

---

### 🧱 From Header-Only to Headers + `.cpp`

A later clean-up pass moved every **function body longer than 15 lines** out of
the headers into `source/*.cpp` 🗂️:

- `placement.cpp` — flow graph + the big `NnsPlacer` methods (constructor,
  `apply_howard`, `legalize`, I/O-pad logic, …)
- `matching.cpp` — Kuhn feasibility + `min_weight_full_matching`
- `readwrite.cpp` / `placement_cfg.cpp` — JSON reader, validated constructor

Rules followed:

- bodies of **≤ 15 lines stay inline** in the header (metrics, `run`/`optimize`,
  small helpers) 📏
- the **`hungarian` template** stays in the header — templates cannot move to a
  `.cpp` without explicit instantiation 🧬

Verified **before & after** — byte-identical behaviour:

```
xmake       → build ok (no warnings)      cmake build → NnsPlace.lib + exes
xmake run   → 31/31 · 19315 assertions    ctest       → 100% passed
standalone  → worst 2160 → 1480, legal=yes (unchanged)  ✅
```

1. **`"edges"` reader**: netlistx-cpp expects `"links"`; we keep a small
   `read_json_edges` in `include/nnsplace/readwrite.hpp` (Python testcases use
   networkx `"edges"`) 🧾
2. **Vendored `pyfractions.hpp`**: zero-divisor-safe overflow guards 🩹
3. **Integer module ids only** (C++ `SimpleNetlist`) 🎯
4. **RNG**: `std::mt19937` with a fixed seed; tests assert legality +
   improvement, never bit-exact worst values 🎲
