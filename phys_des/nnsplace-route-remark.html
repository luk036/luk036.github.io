## 🕳️ Part 1: The Gap

### Why Placement Needs a Router

---

### 🔁 Placement ≠ Routing

- **Placement** decides *where* modules sit; **routing** decides *how* the wires get there 🧵.

- The placer optimizes a **proxy** — the worst half-perimeter wire length ⚖️ — not the true wire layout.

### ⚖️ Recap: The Fairness-Centric Placer

- `nnsplace` minimizes the **worst** wire length of any single connection, one axis at a time:

$$
\min_{\text{placement}}\ \max_{(u,v)\in E}\ \Bigl(\; {\color{blue}c_x\lvert x_u - x_v\rvert} + {\color{orange}c_y\lvert y_u - y_v\rvert} \;\Bigr)
$$

- Engine: **Howard's algorithm** (parametric min-cost flow) 🌀 for potentials,
  **bipartite matching** for legalization 🧩, **ring assignment** for I/O pads 📍.

- Output: a *legal* grid placement — e.g. `testcases/p1.json` → **752 cells + 81 pads**,
  connected by **902 nets** (107 of them touch an I/O pad).

---

### 🌲 The physdes Global Router

`physdes` already ships a **rectilinear global router** for one net at a time:

- `GlobalRouter(source, terminals)` → builds a `GlobalRoutingTree` 🌳
- `route_simple()` / `route_with_steiners()` / `route_with_constraints()`
- **`route_with_constraints()`** is the *correct* mode for driver→sink routing: it
  bounds every **source-to-sink path** by an allowed wire length ⏱️
- **Steiner insertion** shares trunks and saves wire 📉
- `calculate_total_wirelength()` = Manhattan sum over the tree branches

## 🔀 Part 2: Routing the Solution

### From Straight Green Lines to Routing Trees

---

### 🧩 The Mapping

A **net** is a star of pins, and routing is **directional**: the *driver pin*
(output) is the **source**, the *sink pins* (inputs) are the terminals:

- **source** = the net's driver, taken from the **pin direction** stored in the
  netlist (e.g. a directed node-link JSON / a `dir` pin attribute) 🟦
- **terminals** = every other module of the net 🟥
- route with `route_with_constraints()` so each **driver → sink** path respects
  an allowed wire-length budget ⏱️

$$
{\color{green}\mathrm{route}}(a,b)\;=\; \underbrace{{\color{blue}\lvert x_a-x_b\rvert}}_{\text{horizontal run}} + \underbrace{{\color{orange}\lvert y_a-y_b\rvert}}_{\text{vertical run}}
$$

> ⚠️ **Data caveat:** `p1.json` is **undirected** — it stores no pin direction,
> so a driver is *not* recoverable from the file. The figures in this deck were
> therefore routed with an **undirected approximation** (I/O pad chosen as the
> root of pad nets, Steiner branches). The driver-aware, source→sink
> `route_with_constraints()` flow above is the correct production method; treat
> the shown wire lengths as illustrative of the *pipeline*, not of true
> directed timing.

### 🐍 Code: Route One Net (driver-aware)

```python
def route_net(members, driver, place):
    src = driver                     # output pin of the net (from pin direction)
    sinks = [m for m in members if m != src]
    router = GlobalRouter(
        Point(place[0][src], place[1][src]),          # driver is the source
        [Point(place[0][s], place[1][s]) for s in sinks],
    )
    router.route_with_constraints()  # bound every driver → sink path ⏱️
    return router.tree
```

- 🎯 Only **driver → sink** wires count — a pin-to-pin "loop" adds nothing.
- The tree is then traversed; every parent → child edge is decomposed into the
  **same L-shaped runs** used for drawing and for congestion counting ✅.
- ⚠️ `p1.json` stores no pin direction, so the figures in this deck were drawn
  from the earlier undirected *pad-rooted Steiner* variant of this driver.

---

### 📐 Orthogonal Branches

Each tree edge is emitted as axis-aligned `<line>` segments (the green style):

```
 vertical_first               horizontal_first
 parent                      parent
   │                            ──────┐
   │                                 │
   └──── child                       │
                                     │
                                 ┌───┘
                                 child
```

- 🔴 no diagonal segments — global routing is rectilinear by nature
- one net with several cells becomes a **branching tree** instead of a fan of lines

Every net is routed **independently**; the total is the sum of the tree lengths
over all **902 nets** (in grid units and in the placer's cost scale, ×40):

| 30×30 | 15,073 | 602,920 | 12.5% |
| 30×40 | 14,751 | 590,040 | 14.5% |

- 💡 Pad nets are **short** in a good placement (pads sit near their cells)
- 🧮 Tree wire length sits **3–8%** above the HPWL bound — the cost of real routing

## 🗺️ Part 3: Congestion Maps

### x · y · Combined — What the Router Reveals

---

### 🧮 The Cut / Edge Model

Count every **unit step** of every routed net on the routing lattice:

- a **horizontal** unit step on row ${\color{blue}y}$ crossing the vertical cut
  ${\color{blue}c}$ (between columns $c$ and $c{+}1$):

$$
{\color{green}h}[{\color{blue}c},\,{\color{blue}y}]\ \mathrel{+}=\ 1
$$

- a **vertical** unit step on column ${\color{blue}x}$ crossing the horizontal cut
  ${\color{orange}r}$ (between rows $r$ and $r{+}1$):

$$
{\color{green}v}[{\color{blue}x},\,{\color{orange}r}]\ \mathrel{+}=\ 1
$$

**Invariant:** the sum of all cut crossings equals the total routed wire length:

$$
{\color{royalblue}\sum h}\ +\ {\color{royalblue}\sum v}\;=\;\sum_{\text{nets}} {\color{green}\mathrm{tree\_WL}}
$$

---

### 🗺️ From Cuts to Per-Cell Maps

Each **core cell** $({\color{blue}x},{\color{blue}y})$ reports the most congested cut
**adjacent** to it:

$$
{\color{blue}\mathrm{cong}_x}(x,y) = \max\bigl(\, {\color{green}h}[x{-}1,y],\; {\color{green}h}[x,y] \,\bigr)
\qquad
{\color{orange}\mathrm{cong}_y}(x,y) = \max\bigl(\, {\color{green}v}[x,y{-}1],\; {\color{green}v}[x,y] \,\bigr)
$$

- **x-direction map** = horizontal track demand → vertical cuts ↔ cells
- **y-direction map** = vertical track demand → horizontal cuts ↔ cells
- **combined** = element-wise maximum: ${\color{red}\max}(\mathrm{cong}_x, \mathrm{cong}_y)$

Each heat map is **normalised to its own busiest cut → 100%** and painted
green 🟢 → yellow 🟡 → red 🔴.

### 🧐 Consistency Verification

The same library routine that draws also counts, so we can assert:

- ✅ `H + V == total routed wire length` on every grid (bit-exact)
- ✅ combined map == element-wise `max(x, y)`
- ✅ every SVG well-formed; **0 diagonal segments**; cells/pads byte-identical to the input figure
- ✅ pad nets included as part of the full 902-net demand (13–18% of the wire)

> 📌 **Lesson:** when figure and metric come from the *same* traversal, the
> invariant check turns the visualisation into a regression oracle 🎯.

### 📦 Library API

New public module in `nnsplace-cpp` (Doxygen-documented, ≤15-line bodies inline):

```cpp
#include <nnsplace/global_routing.hpp>

// route every net over a Placement, record runs + cut usage
auto route_all_nets(const SimpleNetlist&, const Placement&, int gx, int gy)
    -> RoutingAnalysis;          // .total_wirelength, .hsegments, .vsegments, .h, .v

// derive per-cell x / y / combined congestion grids
auto build_congestion_maps(const RoutingAnalysis&, int gx, int gy)
    -> CongestionMaps;           // .x, .y, .combined, peaks

// SVG rendering
auto make_routed_placement_svg(...) -> std::string;    // cells + orthogonal trees
auto make_congestion_map_svg(...)  -> std::string;     // green-yellow-red heat map
```

The `Point&lt;int,int&gt;` instantiations come from `physdes-cpp/source/global_router.cpp`,
which the `NnsPlace` target now compiles.

### 🧪 Internal-Consistency Tests (doctest)

```cpp
TEST_CASE("every routed unit step is counted exactly once") {
    const auto fixture = run_p1_32();                        // placer, seed 831
    const auto routing = route_all_nets(fixture.netlist, fixture.place, 32, 32);
    CHECK(routing.total_wirelength > 0);
    CHECK(routing.total_wirelength == cut_crossing_total(routing));  // H + V
}
TEST_CASE("congestion maps are consistent with the cut counts") {
    const auto maps = build_congestion_maps(routing, 32, 32);
    CHECK(maps.combined[r][c] == std::max(maps.x[r][c], maps.y[r][c]));
    CHECK(maps.peak_combined == std::max(maps.peak_x, maps.peak_y));
}
TEST_CASE("routed placement svg has one use per module and one line per branch") { ... }

## 🧭 Observations & Lessons

---

### 🧭 What We Learned

- **Router-first figures** turn a placement picture into a *physical* one:
  straight "air lines" hide the real wire demand ✈️ → 🎄.
- **Congestion is per-direction**: x and y hot spots differ (40×30: x=27 vs y=17),
  so a single scalar metric would have masked the real bottleneck 🎯.
- **Normalise per map** keeps every heat map readable, but only raw counts let you
  compare across grids — report both 📊.
- **H + V == total wire length** is a free, bit-exact invariant when the drawing
  and the counting share one traversal 🧮.
- **Reuse beats re-port**: the C++ router stayed in `physdes-cpp`; `nnsplace-cpp`
  added only the analysis/figure layer (xmake and CMake builds agree) ⚙️.

---

### 🔮 Future Directions

- 🚦 **Congestion-aware placement** — feed the peak-cut maps back as a cost
  (`line_cap_ratio`-style) so the placer spreads cells away from hot cuts.
- 🧱 **Keepout-aware routing** — the router already supports keepouts (reserved
  column 27 is a natural obstacle 🧱).
- 🔁 **Rip-up & re-route** — iteratively detour nets off the busiest cuts.
- 🪜 **3D / multi-layer** routing with via minimisation (`GlobalRoutingTree3d`).
- 🦀 **Rust/C++ cross-checks** of the same H+V invariant & figure corpus.
