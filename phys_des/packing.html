## Part 2: Packing Problems 🧩

---

### 🧩 Toy Problem (1)

.mermaid[
<pre>
graph TD
    subgraph "Cells C"
        C1((C1))
        C2((C2))
        C3((C3))
    end
    subgraph "L Elements"
        L1[L1]
        L2[L2]
        L3[L3]
    end
    subgraph "F Elements"
        F1[F1]
        F2[F2]
        F3[F3]
    end
    C1 --> L1
    C1 --> F1
    C2 --> L2
    C2 --> F2
    C3 --> L3
    C3 --> F3

    style C1 fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440
    style C2 fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440
    style C3 fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440
    style L1 fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#2e3440
    style L2 fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#2e3440
    style L3 fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#2e3440
    style F1 fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style F2 fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style F3 fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>
]

Given:

- A netlist contains ${\color{blue} n}$ L's and ${\color{orange} m}$ F's.
- A grid of C's, each of them can pick exactly one L and one F.

---

### 📝 Problem Formulation

- Weighted bipartite matching
- Edge-weight models the importance, e.g.
- connectivity
- physical distance (repacking)

Choices:

- Exact solution using a network flow algorithm
- Approximate solution using greedy or primal-dual algorithm

---

### 📚 Example

```text
  F  F  F  F  F  F  o  o  o  o  o  o  o  o  o  o

  L  L  L  L  L  L  L  L  L  L  L  L  L  L  o  o
```

---

### 🧩 Toy Problem (2)

.pull-left[
Given:

- A netlist contains ${\color{blue} n}$ L's, ${\color{orange} m}$ F's, and ${\color{green} p}$ Q's.
- A grid of C's, each of them can pick exactly one L, one F, and one Q.

Possible solution:

- Two-stage approach: pack_toy1(Q, F) pack_toy1(QF, L)
]

        F2[F] --> QF2
    end
    subgraph "Stage 2"
        QF1 --> C1[Cell]
        L1[L] --> C1

        L2[L] --> C2
    end

    style Q1 fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#2e3440

    style F1 fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px

    style L1 fill:#f3e5f5,stroke:#7b1fa2,stroke-width:3px,color:#2e3440
    style L2 fill:#f3e5f5,stroke:#7b1fa2,stroke-width:3px,color:#2e3440
    style QF1 fill:#e3f2fd,stroke:#1565c0,stroke-width:3px,color:#2e3440

### 🧩 Toy Problem (3)

Given:

- A netlist contains ${\color{blue} n}$ L's and ${\color{orange} m}$ F's.
- A grid of C's, each of them can pick exactly **two** L's and one F.

Possible solution:

- Two-stage approach: pack_toy1(F, L) pack_toy1(L, FL)

---

### 📚 Example

Step 1

```text
  F  F  F  F  F  F

  L  L  L  L  L  L  L  L  L  L  L  L  L  L
```

Step 2

```text
  FL  FL  FL  FL  FL  FL  o   o

  L   L   L   L   L   L   L   L
```
