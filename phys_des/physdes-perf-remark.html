## 🧹 Part 2 — Tier 0: Debug I/O

---

### 🐍 `ic()` in the DME Hot Path

`icecream` debug calls sat inside the merge/embed path — executed **once per tree node** during clock-tree synthesis.

```python
def nearest_point_to(self, other):
    ms = ManhattanArc.from_point(other)
    ic(self)          # ⚠️ prints to stderr, inspects frames
    ic(ms)            # ⚠️ on every call
    return self._nearest_point_to(ms)
```

- `nearest_point_to` runs per node in `_embed_tree` → ~2N debug prints per run
- `icecream` is enabled by default (no `ic.disable()` anywhere)

> **Fix:** delete the three calls, drop `icecream` from runtime deps. ✂️

---

### ⚙️🦀 Hot-Path Logging in C++ and Rust

The C++ and Rust DME do the same thing with their logging frameworks:

.pull-left[

**⚙️ C++** — `log_with_spdlog` at **info** level, and the logger is configured with `flush_on(info)` → a disk flush per event:

```cpp
log_with_spdlog(
  "Warning: Right node needs elongation...");
```

]

.pull-right[

**🦀 Rust** — `log::warn!` per internal node, enabled by the default `std` feature:

```rust
#[cfg(feature = "std")]
log::warn!(
  "Warning: Right node needs elongation...");
```

]

> **Fix:** demote to debug/trace level so the default logger filters them out. 🔇

---

### 💥 Import-Time Side Effects

Python modules were doing work *just by being imported*:

```python
# src/physdes/steiner_forest/congestion_map.py
grid = [[0, 20, 40, 80, 100], ...]
draw_congestion_map(grid, "my_congestion.svg")   # ⚠️ file write + print on import
```

- Any `import` triggered disk I/O and console output
- Made tooling and test collection surprising

> **Fix:** guard the demo under `if __name__ == "__main__":`. 🚪

## 🌲 Part 3 — Steiner Forest

---

### 🔁 The Primal-Dual Algorithm

The Steiner-forest-on-grid solver grows paths from terminals until every required pair is connected, then prunes.

.mermaid[

<pre>
graph TD
    INIT["Build grid edges\nE ≈ 2·H·W"]
    LOOP["Find min-delta\nactive edge"]
    PAY["Pay all active edges\nby min-delta"]
    ADD["Add chosen edge\nunion endpoints"]
    FEAS{"All pairs\nconnected?"}
    PRUNE["Reverse-delete\nprune redundant edges"]
    INIT --> LOOP --> PAY --> ADD --> FEAS
    FEAS -->|"no"| LOOP
    FEAS -->|"yes"| PRUNE
    style INIT fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style LOOP fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style PAY fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style ADD fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style PRUNE fill:#ffcdd2,stroke:#c62828,stroke-width:3px
</pre>

]

> Each iteration adds **at most one edge**, so the loop runs $O(|F|)$ times. 🔁

---

### 🐌 Before: Two Full Passes, Four Finds per Edge

Every iteration scanned **all** edges **twice**, and called `find` **four** times per edge:

```cpp
for (const auto& edge : edges) {
    if (uf.find(edge.node_u) == uf.find(edge.node_v)) continue;  // 2 finds
    int root_u = uf.find(edge.node_u);                           // redundant
    int root_v = uf.find(edge.node_v);                           // redundant
    ...
}
// ...then a SECOND identical pass to update `paid`
```

$$ T_{\text{main}} \;=\; O\!\left(E \cdot |F| \cdot {\color{#bf616a}\alpha}\right)
   \quad\text{with a }\; {\color{#bf616a}4\times}\; \text{find constant} $$

Plus `paid` was a **hash map** keyed by `(min, max)` tuples, and a **candidate list** was rebuilt on every improvement. 🗑️

---

### 🗑️ Before: Reverse-Delete was O(|F|²)

The pruning step rebuilt a **fresh union-find for every candidate edge**:

```cpp
for (int idx = FPruned.size() - 1; idx >= 0; --idx) {
    UnionFind tempUF(num_nodes);                 // O(N) alloc per edge
    for (int jdx = 0; jdx < F.size(); ++jdx)
        if (jdx != idx) tempUF.unionSets(F[jdx]...);   // re-union all others
    // ...connectivity check...
    if (connected) FPruned.erase(FPruned.begin() + idx);  // O(|F|) shift
}
```

$$ T_{\text{prune}} \;=\; O\!\left(|F|^2 \cdot \alpha \;+\; |F| \cdot N\right) $$

> For a 48×48 grid this dominated everything else. 🐢

---

### 💡 The Insight: Union of Pair Paths

**Key fact:** the accepted edges `F` form a *forest* — every added edge merges two distinct components.

.mermaid[

<pre>
graph TD
    A["F is a forest\n(acyclic)"]
    B["Each pair has a\nunique path in F"]
    C["Edge is needed iff it lies\non some pair's path"]
    D["F_pruned = union of\nall pair paths"]
    E["Equivalent to\nreverse-delete"]
    A --> B --> C --> D --> E
    style A fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style B fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style C fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style D fill:#f8bbd0,stroke:#c2185b,stroke-width:3px
    style E fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
</pre>

]

$$ {\color{#a3be8c}\text{union of pair paths}} \;=\; {\color{#bf616a}\text{reverse-delete result}} $$

> So mark the paths directly — no DSU rebuild at all. ✂️

---

### ✅ The Fixes (all three languages)

| Fix | 🐍 | ⚙️ | 🦀 |
|:----|:--:|:--:|:--:|
| Iterative `find` (no recursion) | ✅ | ✅ | ✅ |
| Hoist `find` 4→2 per edge | ✅ | ✅ | ✅ |
| `paid` → edge-indexed array | ✅ | ✅ | ✅ |
| Single chosen edge (no list) | ✅ | ✅ | ✅ |
| Union-of-paths pruning | ✅ | ✅ | ✅ |

```text
before:  O(E·|F|·α)  main   +  O(|F|²·α + |F|·N)  prune
after:   O(E·|F|·α)  main   +  O(|F| + paths)     prune
```

> Same output, byte-for-byte — verified by differential tests. ✅

## 🛣️ Part 4 — Routing Tree

---

### 📉 `get_tree_structure`: O(n²) → O(n)

The tree-to-string helper built a **fresh string per subtree**, then copied it into its parent:

.pull-left[

**🐍 / ⚙️ / 🦀 — before**

```text
fmt(node):
    s = indent + node
    for child:
        s += fmt(child)   # copies whole subtree
    return s              # ...again at each ancestor
```

Each node at depth $d$ is copied $d$ times:

$$ \sum_{d=0}^{n} (n-d) \;=\; {\color{#bf616a}O(n^2)} $$

]

.pull-right[

**after — one accumulator**

```text
fmt(node, out):
    out.push(indent + node)
    for child:
        fmt(child, out)
```

Written once, never copied:

$$ {\color{#a3be8c}O(n)} $$

]

> Also killed per-node `"  ".repeat(level)` / `ostringstream` allocations. 🧹

---

`_find_insertion_point` built a bounding-box `Point` + `nearest_to` object for **every edge** — thousands of throwaway allocations per insertion.

.pull-left[

**before** 🐢

distance      = possible_path.min_dist_with(point)
nearest_pt    = possible_path.nearest_to(point)  # Point
```

]

.pull-right[

**after** ⚡

```python
# scalar fast path for 2D:
# compute bbox distance + nearest point
# with integer arithmetic; only build
# Points when keepouts are present
```

]

| Python insertion | Before | After | Speedup |
|:-----------------|-------:|------:|--------:|

| n = 500 | 1577 ms | 406 ms | **3.9×** |

## 🕰️ Part 5 — DME

---

### 🔀 The DME Merge-Tree Partition

The DME builder partitioned the sink set at every recursion level.

.pull-left[

**🐍 / ⚙️ — before**

```text
build(nodes):
    keys = [key(n) for n in sub]      # pass 1
    median = sorted(keys)[mid]        # full sort
    lt = [n for n in sub if key(n) < median]   # pass 2
    eq = [n for n in sub if key(n) == median]  # pass 3
    gt = [n for n in sub if key(n) > median]   # pass 4
```

$4\times$ key evaluations and a sort **per level**:

$$ T(n) = 2T(n/2) + O(n\log n) = {\color{#bf616a}O(n\log^2 n)} $$

]

.pull-right[

**after** ⚡

```text
build(nodes):
    keys = [key(n) for n in sub]   # once
    median = sorted(keys)[mid]     # C sort
    for n, v in zip(sub, keys):    # one pass
        group(v, n)
```

Single stable partition — same tree, fewer passes. ✅

]

---

### 🔬 Quickselect: Rejected on Measurement

A pure-Python **3-way quickselect** would make selection $O(n)$:

$$ T_{\text{select}}(n) = O(n) \quad\Rightarrow\quad
   T(n) = 2T(n/2) + O(n) = {\color{#a3be8c}O(n\log n)} $$

**But** C Timsort beat it at realistic sizes:

| n | full build (with quickselect) | full build (sorted) |
|--:|------------------------------:|--------------------:|
| 256 | **0.73×** 🐌 | 1.0× |
| 1024 | 1.10× | **1.15×** ✅ |

> Lesson: **asymptotics lose to constants at small n**. Measure, then decide. 🔬

---

### 🦀 Rust Was Already Optimal

Rust's DME used `select_nth_unstable_by` **in place** with `split_at_mut` — no per-level vectors at all:

```rust
node_ids.select_nth_unstable_by(mid, |&a, &b| { ... });
let (left, right) = node_ids.split_at_mut(mid);
let l = self.build_merging_tree(left, !vertical);
let r = self.build_merging_tree(right, !vertical);
```

> The Python/C++ fix **porting target did not exist** in Rust. Don't fix what isn't broken. 🦀

| DME | Before | After |
|:----|-------:|------:|
| ⚙️ C++ DME_16 | 20.5 µs | 16.6 µs (**1.24×**) |
| ⚙️ C++ DME_64 | 84.5 µs | 69.5 µs (**1.22×**) |
| 🦀 Rust DME_16 | 15.3 µs | ~unchanged ✅ |

A mystery: **SVG files in the Python repo kept changing**. 🔍

.mermaid[

<pre>
graph TD
    RUN["run C++ tests"]
    CWD["relative SVG paths\nwritten to process cwd"]

**Root cause:** tests wrote SVGs with **relative filenames**, so they landed in whatever directory the process ran from.

| Repo | Fix |
|:-----|:----|
| 🐍 | autouse `_isolate_cwd` fixture → per-test `tmp_path` |
| ⚙️ | test `main` chdirs to `%TEMP%/recti_test_output` |
| 🦀 | test writes to `std::env::temp_dir()` |

> Diagnose from evidence: the `1000×1000` canvas matched the **C++** test, not Python's `800×600`. 🔬

### 🎓 Lessons Learned

.pull-left[

**1. Measure before optimizing** 📏
- The `ic()` calls and the O(n²) string were *invisible* without profiling
- Quickselect looked better on paper — **0.73× in practice**

**2. Asymptotics ≠ wins** ⚖️
- C Timsort beat pure-Python selection at n ≤ 1024
- Keep the constant factor honest

**3. Preserve exact output** ✅
- Differential testing vs HEAD caught everything
- A speedup that changes results is a bug

]
.pull-right[

**4. Port the idea, not the code** 🌍
- C++/Rust are value types — no per-edge heap to remove
- Rust DME was already optimal → **no change**
- Language-specific smells: `hasattr` 🐍, `std::function` ⚙️, `HashMap` 🦀

**5. Test hygiene is performance** 🧼
- Tests writing to cwd pollute and flake
- Temp dirs everywhere

**6. Track work in issues** 🎫
- GitHub issue #4 = the living checklist

]
