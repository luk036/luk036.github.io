## Part 1 — Representation 📐

---

### 🎯 Why rectilinear polygons?

- **VLSI physical design** is overwhelmingly Manhattan geometry.
- **L-shaped obstacles** must be fractured into rectangles.
- **Layout fracturing** for mask writing and DRC.
- **Integer coordinates** avoid floating-point predicates.
- Typical polygon size is small: **n &lt; 100**.
- Therefore **O(n²) algorithms are acceptable**.

> The hard part is not the asymptotics — it is keeping the representation consistent.

---

$$
I_i = (x_{i+1},\; y_i)
$$

- `S[i] = (x0, y0)`, `S[i+1] = (x1, y1)`.
- Insert `(x1, y0)`, then move vertically to `S[i+1]`.
- Do **not** use the y-first form `(x0, y1)` — it reconstructs a different polygon.

### ✅ Canonical form and `is_canonical`

A stored even-index list `S` is **canonical** when:

- every cyclic consecutive pair differs in **both** `x` and `y`;
- no stored point is duplicated.

```python
def is_canonical(S):
    if len(S) < 2:
        return True
    if len(set(S)) != len(S):
        return False
    return all(
        a[0] != b[0] and a[1] != b[1]
        for a, b in zip(S, S[1:] + S[:1])
    )
```

The same predicate exists on `RPolygon` in Python and C++.

- The canonical form is `[(2,1), (3,-3)]`.

### 🧪 Canonical regression matrix

| Input `S` | Canonical? | Why |
|:----------|:----------:|:----|
| `[(2,1), (2,0)]` | ❌ | same `x` |
| `[(2,1), (3,-3)]` | ✅ | rectangle corners |
| `[(2,1), (2,0), (3,-3)]` | ❌ | zero change in `x` |
| `[(0,0), (0,0)]` | ❌ | duplicate |
| `[(0,0), (0,1), (0,2)]` | ❌ | vertical run |
| `[(0,0), (1,0), (2,0)]` | ❌ | horizontal run |
| `[(0,0), (1,1)]` | ✅ | rectangle |

> The predicate is deliberately **structural**, not geometric.

---

### 🧭 Orientation and signed area

For a simple polygon:

$$
A = \frac{1}{2}\sum_i \left(x_i y_{i+1} - x_{i+1} y_i\right)
$$

- `A > 0`: anticlockwise; `A < 0`: clockwise.
- The even-index representation has a compact area formula too.
- Orientation drives the hull and cut branches.
- The sign is also a cheap sanity check after every cut.

1. Find the **leftmost** and **rightmost** points.
2. Partition the remaining points into two chains.
3. Sort chain 1 by `x` ascending.
4. Sort chain 2 by `x` descending.
5. Return `chain1 + chain2`.

The output is a valid even-index **ordering**, but it may not be canonical.

### 🧬 `create_xmono` and `create_ymono`

```python
def create_xmono_rpolygon(points):
    return create_mono_rpolygon(
        points,
        lambda p: (p.x, p.y),
        lambda a, b: a &lt; b,
    )

def create_ymono_rpolygon(points):
    return create_mono_rpolygon(
        points,
        lambda p: (p.y, p.x),
        lambda a, b: a &gt; b,
    )
```

- `create_xmono` returns an **anticlockwise** flag.
- `create_ymono` returns a **clockwise** flag.
- The naming is subtle; always check the sign in tests.

- **Rectilinear convex** = x-monotone **and** y-monotone.
- Implemented by walking the two chains and checking coordinate violations.

### 🧹 Hull idea: remove what breaks monotonicity

A monotone hull is the **minimal monotone polygon** containing the input.

- Walk each chain from the minimum to the maximum.
- Remove a vertex when it violates monotonicity or turns the wrong way.
- Use a **circular doubly-linked list** so removal is O(1).
- Two passes: min → max, then max → min.

---

### 🧮 Monotone hull algorithm

For the current vertex, let `p`, `c`, `n` be previous, current, next.

$$
\Delta = (y_c - y_p)(x_n - x_c)
$$

```python
for c in chain:
    if dir(c) > dir(n) or dir(p) > dir(c):
        if wrong_sign(Delta):
            remove(c)
            c = prev(c)
        else:
            c = next(c)
    else:
        c = next(c)
```

- The sign test depends on orientation (clockwise vs anticlockwise).
- The result is monotone, but may still contain collinear points.

- Same `y`: the **second** point lies on a horizontal edge → drop it.
- Same `x`: the **first** point lies on a vertical edge → drop it.
- Repeat until no adjacent pair shares an axis.
- This is exactly the fix that made the x-hull canonical.

```python
while changed and len(S) > 2:
    for i in range(len(S)):
        j = (i + 1) % len(S)
        if S[i].y == S[j].y:
            del S[j]; changed = True; break
        if S[i].x == S[j].x:
            del S[i]; changed = True; break
```

- After `create_xmono` / `create_ymono`:
  - apply the matching hull, then `assert is_canonical(hull)`.
- After every hull:
  - `assert is_canonical(C)`.
- After every cut piece:
  - `assert is_canonical(piece)` where the algorithm guarantees it.
- Area preservation is checked **in addition**, not instead.

> Area alone is necessary but not sufficient.

## Part 3 — Decomposition ✂️

---

### 🧩 Why decompose?

- L-shaped obstacles → **rectangle pieces**.
- Layout fracturing → mask-friendly rectangles.
- DRC and timing analysis often prefer rectangles.
- The guideline proposes **three steps**:

- **Explicit** 270°: a stored even-index vertex, e.g. `(2,1)`.
- **Implicit** 270°: a corner created by the x-first expansion, e.g. `(1,1)`.
- A single U-shape contains both kinds.
- Convex cut handles the shape; explicit/implicit cuts handle the corner types.

### 🔁 Recursive convex cut

```python
def cut(v1):
    v2, v3 = v1.next, v1.next.next
    if v3 == v1:                 # 2 stored points
        return [v1, v2]
    if triangle_base and v3.next == v1:   # 3 stored points
        return [v1, v2, v3]

    conc = find_concave(v1)
    if conc is None:
        return all_vertices(v1)  # already convex

    vmin, vertical = find_min_dist(conc)
    new = insert_cut(conc, vmin, vertical)
    return cut(conc) + cut(new)
```

- Each cut adds one vertex and splits the cycle.
- Recursion depth is O(n); each scan is O(n).
- Total **O(n²)** — acceptable for n &lt; 100.

### 🪓 Explicit cut: same skeleton, different corner test

- The recursion is the same; only the **concave-vertex hook** changes.
- Explicit test: direction reversal **and** the area sign.
- No 3-point monotone base case: continue until no concave vertex remains.
- This resolves **explicit 270° vertices** left by the convex cut.

```python
if vec1.x * vec2.x < 0 or vec1.y * vec2.y < 0:
    area = (curr.y - prev.y) * (next.x - curr.x)
    if area_has_wrong_sign(area):
        return curr
```

- Python: `rpolygon_cut_convex`, `rpolygon_cut_explicit`.
- C++ sibling also has `rpolygon_cut_implicit` and `rpolygon_cut_rectangle`.

---

### 🧩 Implicit cut and rectangle cut

- **Implicit 270°** corners are created by the x-first expansion.
- The implicit cut resolves those corners.
- **Rectangle cut** outputs pieces with **2 stored points**:
  - two opposite corners,
  - different `x` and different `y`,
  - each piece is trivially canonical.
- The C++ tests assert `piece.size() == 2` and `x`/`y` differences.

> Same template method: convex → explicit → implicit → rectangle.

### ⏱️ Complexity

| Step | Cost | Note |
|:-----|:-----|:-----|
| find concave vertex | O(n) | scan the cycle |
| find min-distance vertex | O(n) | Manhattan distance |
| insert cut / split | O(1) | circular linked list |
| recursion | O(n) cuts | each cut adds one vertex |
| **total** | **O(n²)** | fine for n &lt; 100 |

- Integer coordinates keep the predicates exact.
- No floating-point orientation tests.
- The linked list avoids O(n) array deletion.

### 💡 Engineering lessons

- **Representation is the contract.** Know what is stored before touching an algorithm.
- **Area is not enough.** Add a structural canonical check.
- **Collinear cleanup matters.** Even-index hulls can leave same-axis pairs.
- **Copy mutable inputs.** Python's cut mutates the working list.
- **Keep siblings aligned.** Python and C++ should pass the same tests and figures.
- **Small n changes the trade-off.** O(n²) simplicity beats O(n log n) complexity here.

---

### 🏭 Where this is used

- **L-shaped obstacles** in placement and routing.
- **Layout fracturing** for mask writing.
- **DRC-friendly** rectangle decomposition.
- **Rectilinear Steiner / routing** with obstacle keepouts.
- **Clock-tree and global-router** geometry kernels.

> The same representation and predicates appear across the physdes family.

---

### 📌 Summary

- Points → `create_mono` → monotone hull → canonical even-index → recursive cut → rectangles.
- **x-first expansion**: `(x1, y0)` is the implicit corner.
- **Canonical form**: every cyclic consecutive pair differs in both `x` and `y`; no duplicates.
- **Collinear cleanup**: same `y` drops the second point; same `x` drops the first.
- **Cut**: find concave vertex → min-distance cut → split → recurse.
- **O(n²)** is acceptable for n &lt; 100.
