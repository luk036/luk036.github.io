## Part 1 — The Symptom 🐛

---

### 📋 The bug report

```python
from physdes.point import Point
from physdes.rpolygon import rpolygon_is_convex
from physdes.rpolygon_cut import rpolygon_cut_convex

full = [Point(x, y) for x, y in [
    (0, 0), (3, 0), (3, 3), (2, 3),
    (2, 1), (1, 1), (1, 3), (0, 3),
]]

print(rpolygon_is_convex(full))               # False
print(len(rpolygon_cut_convex(full, True)))   # 1
```

- 🐛 The polygon is correctly non-convex, yet the cut returns one piece.
- ❓ Is the algorithm broken — or is the input not what we think it is?

---

### 🕵️ The first suspect

For the **expanded** 8-vertex polygon, every turn is 90°:

$$
\color{firebrick}{v_{1x}v_{2x} = 0},
\qquad
\color{firebrick}{v_{1y}v_{2y} = 0}
$$

- The direction-reversal guard never fires.
- `find_concave_point` returns `None`.
- The polygon is declared “convex” and returned whole.

That explains the symptom — but only if the expanded list is the real input.

## Part 2 — The Representation 🧩

---

### 🧠 What `RPolygon` actually stores

$$
\color{steelblue}{RPolygon} =
\{\color{steelblue}{v_0},
\color{steelblue}{v_2},
\color{steelblue}{v_4},
\ldots\}
$$

- Only **even-index vertices** are stored.
- The odd-index vertices are **implicit**.
- This is a 50% storage reduction.

$$
\color{seagreen}{v_{2i+1}} =
\begin{cases}
\color{seagreen}{(x_{2i},\; y_{2i+2})} & \text{vertical edge}\\
\color{seagreen}{(x_{2i+2},\; y_{2i})} & \text{horizontal edge}
\end{cases}
$$

### 🧩 The 2/3-node base cases were the clue

.mermaid[
<pre>
graph LR
    R["Rectangle"] --> R2["2 stored points"]
    M["Monotone / L"] --> M3["3 stored points"]
    style R fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px

- These are **not** degenerate cases.
- A 2-point rectangle expands back to four corners.
- A 3-point piece expands back to a monotone corner sequence.

---

### 🔁 What `to_polygon` reconstructs

Consecutive stored points may be diagonal. The implicit corner is inserted:

.mermaid[
<pre>
graph LR
    A["(0,0)"] -->|"stored"| B["(3,3)"]
    A --> C["(3,0)"]
    C --> B
    style A fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style B fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style C fill:#fff9c4,stroke:#f57f17,stroke-width:3px
</pre>
]

- `(0,0) → (3,3)` becomes `(0,0) → (3,0) → (3,3)`.
- The diagonal edges in the input are expected, not a bug.

### 🐍 Python: convex worked; explicit exposed a mutation bug

```python
def rpolygon_cut_impl(lst, is_anticlockwise, recur):
    lst = list(lst)          # do not mutate caller's list
    ...
```

- The cut appends new points to `lst`.
- Without the copy, calling convex first corrupted the list used by explicit.
- After the copy, both variants return **2 pieces** with total area **7**.

| Call sequence | Before | After |
|:--------------|:------:|:-----:|
| convex → explicit, same list | area 1 | area 7 |

## Part 5 — Lessons 💡

---

### 💡 What we learned

.mermaid[
<pre>
graph LR
    L1["Representation"] --> L2["Input contract"]
    L2 --> L3["Algorithm"]
    L3 --> L4["Tests"]
    style L1 fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style L2 fill:#fff9c4,stroke:#f57f17,stroke-width:3px
    style L3 fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style L4 fill:#d1c4e9,stroke:#5e35b1,stroke-width:3px
</pre>
]

- Know the representation before touching the algorithm.
- The 2/3-node base cases were the clue: even-index compression.
- A predicate that never fires on a non-representation input is a red herring.
- Copy mutable inputs; do not corrupt the caller.
- Tests must use the real representation.
- Keep sibling implementations aligned.
