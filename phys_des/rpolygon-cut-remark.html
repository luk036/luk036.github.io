# Rectilinear Polygon Decomposition

### Convex · Explicit · Implicit Cuts

<br/>

**Wai-Shing Luk**

`recti` / `physdes-cpp`

October 2026


---

### What we will cover

- **Representation** — why every other vertex is enough
- **Convex cut** — cut a polygon into orthogonally convex pieces
- **Explicit cut** — the same recursion without the monotone shortcut
- **Implicit cut** — cut at the corners that were never stored
- **Rectangle cut** — the corrected convex → slab pipeline
- **Correctness, complexity, and the tests that catch regressions**

<br/>

> A decomposition is only as good as the invariants you assert on its output.


---

### Why rectilinear decomposition?

.pull-left[


- VLSI layout is **Manhattan**: wires, cells, blockages
- Rectangles are DRC-clean and cheap to store/query
- Decomposition feeds:
  - floorplan blocks
  - routing regions
  - mask fracture
  - area / timing estimates
- Rectilinear polygons are everywhere in physical design

]

## Part 1 · Representation


---

### Rectilinear (orthogonal) polygons

.pull-left[


- Every edge is **horizontal or vertical**
- Consecutive edges are perpendicular
- Interior angles are $90^\circ$ or $270^\circ$
- The boundary has an **even** number of vertices
- Simple closed curve; no holes in this talk

]

### Even-index (compressed) storage

.pull-left[

Store **every other** vertex:

$$S_0, S_1, \ldots, S_{k-1}$$

The omitted vertex is implicit:

$$
c_i = (x_{i+1},\, y_i)
$$

- move x first, then y
- 50% fewer points than the full boundary
- consecutive stored points differ in **both** coordinates
- the full boundary is reconstructed on demand

]

### Reconstructing the boundary

.pull-left[


For each stored pair:

$$
S_i \;\longrightarrow\; (x_{i+1}, y_i) \;\longrightarrow\; S_{i+1}
$$

- First move **horizontally**, then **vertically**
- The inserted corner makes the edge rectilinear
- Do **not** use the y-first form: it reconstructs a different polygon

]

- The algorithms below return these compressed pieces directly

### When is a rectilinear polygon "convex"?

.pull-left[


Orthogonal convexity = **x-monotone** and **y-monotone**:

- every vertical line meets the polygon in one interval
- every horizontal line meets it in one interval

$$
\text{convex} \;\Longleftrightarrow\; \text{xmonotone} \land \text{ymonotone}
$$

This is **not** geometric convexity: an L-shape is convex in this sense.

]

## Part 2 · Convex cut


---

### One skeleton, three policies

Explicit and implicit share a **Template Method**; convex uses the same recipe standalone:

```cpp
recur(v):
    if 2 nodes: return rectangle            // 2 stored points
    if 3 nodes and policy allows: return monotone piece
    v = find_concave_point(...)
    if none: return whole polygon           // convex
    (v_min, vertical) = find_min_dist_point(v)
    p_new = insert_cut(v, v_min, vertical)
    return recur(left) + recur(right)
```

- **Convex** — stops at 3-node monotone pieces
- **Explicit** — no 3-node shortcut; may recurse further
- **Implicit** — finds concave corners at the *implicit* vertices


---

### Finding the cut

.pull-left[


**Concave test** — a direction reversal plus an area-sign test:

$$
(v_{1x}v_{2x} < 0)\;\lor\;(v_{1y}v_{2y} < 0)
$$

$$
(y_i-y_{i-1})(x_{i+1}-x_i) \gtrless 0
$$

**Nearest edge** — project the reflex vertex vertically and
horizontally; take the minimum distance.

**Insert** — splice a new point into the circular linked list,
then recurse on the two pieces.

]

.pull-right[

### ConvexCutPolicy

- Base cases: **2 nodes → rectangle**, **3 nodes → monotone piece**
- Concave vertex requires:
  - a direction reversal, **and**
  - the signed area test `cmp(area_diff)` (sign depends on orientation)
- Cuts from the concave vertex to the nearest edge
- Output: a partition into **orthogonally convex** pieces

<br/>

```cpp
auto area_diff = (p1.y - p0.y) * (p2.x - p1.x);
auto v1 = p1 - p0, v2 = p2 - p1;
if ((v1.x * v2.x < 0 || v1.y * v2.y < 0) && cmp(area_diff))
    return vcurr;
```

### What convex cut does **not** do

- A 3-point L-shape is returned **whole** — it is already convex
- Convexity does not imply rectangularity
- A rectangle decomposition needs a **second stage**
- This is the gap that the old `rpolygon_cut_rectangle` fell into

<br/>

> "Convex" in this library means x- and y-monotone, not "a rectangle".

<br/>

- 2-point piece → rectangle
- 3+ point piece → orthogonally convex, still to be rectangularized

## Part 3 · Explicit cut


---

### ExplicitCutPolicy

Same recursion, two differences:

| | Convex | Explicit |
|---|---|---|
| 3-node base case | yes | **no** |
| Concave test | reversal + area sign | reversal + area sign |
| Typical output | convex pieces | convex pieces |

- Without the 3-node shortcut, the policy may recurse **further**
- It inserts new vertices explicitly into the polygon
- It is still a **convex** decomposition, not a rectangle decomposition

<br/>

```cpp
template <typename T> struct ExplicitCutPolicy : ConvexCutPolicy<T> {
    static constexpr bool has_triangle_base_case = false;
};
```

## Part 4 · Implicit cut


---

### ImplicitCutPolicy

.pull-left[


The implicit cut works directly on **stored pairs**:

- corner under test: the implicit vertex (move x first)
- sign test:

$$
-(y_{i+1}-y_i)(x_{i+1}-x_i) \gtrless 0
$$

- cut from that corner to the nearest edge
- recurse first on the **nearest-edge** side, then on the new node

]

.pull-right[

```cpp
auto d = -(p2.y - p1.y) * (p2.x - p1.x);
if (cmp(d)) return vcurr;  // reflex corner
```

- No direction-reversal guard: the implicit vertex is always a 90° corner
- Only **implicit** reflex corners can be found

]

## Part 5 · Rectangle cut


---

### The corrected pipeline

```cpp
rpolygon_cut_rectangle(P):
    C = rpolygon_cut_convex(P)                  // 1. convex pieces
    out = []
    for piece in C:                             // 2. rectangularize
        out += cut_convex_into_rectangles(piece)
    return out

cut_convex_into_rectangles(piece):
    xs = sorted(unique(x-coordinates of piece))
    for each slab [xs[k], xs[k+1]]:
        ys = y of horizontal edges spanning the slab
        emit rectangle [xs[k], xs[k+1]] x [ys[0], ys[1]]
```

<br/>

- A convex piece is **x-monotone** ⇒ one rectangle per slab
- Slabs are aligned with the piece's own vertices


---

### Slab decomposition of a convex piece

.pull-left[


Take the area-9 convex piece:

- $x$-monotone ⇒ every vertical slab meets it in one interval
- Slab $[3,4]$ → height $0 \ldots 4$
- Slab $[4,5]$ → height $1 \ldots 5$
- Slab $[5,6]$ → height $1 \ldots 2$

Result: **3 rectangles**, areas $4+4+1 = 9$ ✓

]

- **Old** `implicit → explicit`: 6 pieces, including a **zero-width** `(0,2)-(0,3)`
  and a **5-point, area-14 piece** that is not a rectangle
- **New** `convex → slabs`: 7 proper rectangles, same total area 20
- Area preservation alone would have accepted the old output


---

### Why the old composition failed

1. **Wrong domain** — implicit cut was applied to a possibly non-convex polygon
2. **Blind spot** — stored reflex corners are invisible to the implicit test
3. **No rectangularization** — the explicit policy does not turn convex pieces into rectangles
4. **Degenerate output** — a zero-width 2-point piece slipped through area checks
5. **Weak invariant** — "convex pieces + area sum" does not imply "rectangles"

<br/>

> The fix is structural: convex cut first, then a slab rectangularization.


---

### Invariants and complexity

**Invariants of a correct rectangle decomposition**

- every piece is stored as **2 points** with both coordinates distinct
- pieces are **disjoint** interiors
- the sum of the piece areas equals the original area
- orientation is preserved: signed piece areas keep the input's sign

<br/>

**Cost**

- nearest-edge scan is $O(n)$ per cut; recursion depth $O(n)$
- worst case $O(n^2)$ for the cut stage
- slab stage: sort $k$ x-coordinates, scan $k$ stored edges → $O(k^2)$ per convex piece


---

### Tests that would have caught it

```cpp
const auto pieces = rpolygon_cut_rectangle<int>(P, is_anticlockwise);
REQUIRE_EQ(pieces.size(), 7U);
for (const auto& piece : pieces) {
    REQUIRE_EQ(piece.size(), 2U);            // compressed rectangle
    CHECK_NE(piece[0].xcoord(), piece[1].xcoord());
    CHECK_NE(piece[0].ycoord(), piece[1].ycoord());
    CHECK_GT(RPolygon<int>(piece).signed_area(), 0);
}
CHECK_EQ(total_area, original_area);         // necessary, not sufficient
```

- Fixture: `twelve_point_even_index_fixture()`, area 20
- Assert the **output class**, not just the area sum


---

### Takeaways

- The **compressed representation** drives every cut: stored corners vs implicit corners
- **Convex ≠ rectangle**; a second rectangularization stage is mandatory
- **Explicit** is an alternative convex decomposition, not a rectangle algorithm
- **Implicit** only sees implicit reflex corners — a real blind spot
- **Rectangle = convex cut + vertical slabs** (for x-monotone convex pieces)
- Tests must assert **2-point pieces and positive area**, not just area preservation
