### 🧩 Two ways to store the same polygon

.pull-left[
#### Full vertex list

Every corner is explicit:

```text
8 vertices
(0,0) (3,0) (3,3) (2,3)
(2,1) (1,1) (1,3) (0,3)
```

- Easy to draw
- Redundant for rectilinear cuts
- Consecutive points share an axis

]

.pull-right[
#### Even-index list

Store every other corner:

```text
4 stored points
(0,0) (3,3) (2,1) (1,3)
```

- Half the storage
- The omitted corners are implicit
- **This is what the cut functions consume**

]

### 🔁 Canonical even-index encoding

.mermaid[
<pre>
graph LR
    A["Full vertex list\n8 points"] --> B["Remove collinear"]
    B --> C["Rotate:\nfirst edge horizontal"]
    C --> D["Take every other\nvertex"]
    D --> E["Even-index\n4 stored points"]
    E --> F["x-first\nreconstruct"]
    F --> G["Full boundary"]
    classDef input fill:#88c0d0,stroke:#5e81ac,stroke-width:3px,color:#2e3440;
    classDef step fill:#ebcb8b,stroke:#d08770,stroke-width:3px,color:#2e3440;
    classDef out fill:#a3be8c,stroke:#2e7d32,stroke-width:3px,color:#2e3440;
    class A input;
    class B,C,D step;
    class E,F,G out;
</pre>
]

$$ S_i = \text{full}\left[(\text{start} + 2i) \bmod n\right] \qquad i = 0,\ldots,\frac{n}{2}-1 $$

.pull-left[
#### The rules

- Start on a vertex whose **outgoing edge is horizontal**
- Store every **other** corner
- Keep the boundary order
- Do **not** reverse the stored list
]

.pull-right[
#### The payoff

- Half the points
- Still enough to reconstruct the boundary
- Cut functions have a stable, checkable contract
]

???
⏱️ 0:05–0:06 — The start vertex matters. If you start on a vertical edge, the x-first rule reconstructs a different polygon. That is exactly the phase trap we hit.

- 2 points: opposite corners
- 3 points: consecutive points differ in both coordinates
- More points: larger orthogonally convex piece

### ✅ Representation checklist

| Check | Why it matters |
|---|---|
| At least 2 stored points | A rectangle needs two opposite corners |
| Consecutive pts differ in `x` and `y` | This is the even-index invariant |
| Stored order follows the boundary | Reversing changes orientation and shape |
| Start on a horizontal outgoing edge | x-first otherwise reconstructs a different polygon |
| x-first reconstruction is simple | The cut algorithm assumes a simple orthogonal polygon |

.mermaid[
<pre>
graph LR
    A["Full polygon"] --> B["Canonical even-index"]
    B --> C["Cut functions"]
    C --> D["Convex pieces"]
    D --> E["Pieces are even-index again"]
    classDef good fill:#a3be8c,stroke:#2e7d32,stroke-width:3px,color:#2e3440;
    classDef step fill:#88c0d0,stroke:#5e81ac,stroke-width:3px,color:#2e3440;
    class A,B,C,D,E step;
    class E good;
</pre>
]

> If `find_concave_point` never fires, check the representation before changing the concavity predicate. 🔍

???
⏱️ 0:09–0:10 — The checklist is the debugging tool. When a cut fails, first ask whether the input is canonical even-index. Only then inspect the algorithm.

### 🔍 What the algorithm actually saw

.pull-left[
#### 8-point list → 8 stored points

- The cutter treats every point as stored
- Edges are diagonal in the stored representation
- The concavity predicate looks at the wrong turns
- Result: **one non-convex piece** ❌

]

.pull-right[
#### 4-point even-index → 4 stored points

- The implicit vertices are reconstructed x-first
- The concavity predicate sees the real turns
- Result: **two convex pieces** ✅

]

$$ \text{full list} \;\ne\; \text{even-index list} $$

> Same U-shape. Different contract. Different result. 🎯

???
⏱️ 0:12–0:13 — This is the “aha” moment. The algorithm did not fail on the shape; it failed on the encoding. The 8-point list is not a valid even-index input.

## Part 3 — Standalone Cut &amp; 2-Node Split 🧹

???
⏱️ 0:20–0:29 — The fix has two parts: make the convex path standalone and split the existing 2-node piece when the cut point duplicates the target. No Policy, no new scan, no general repair pass.

---

### 🧹 Standalone convex cut (no Policy)

.pull-left[
#### Before

.font-sm[
```cpp
rpolygon_cut_convex(...)
  -> rpolygon_cut_impl<
       T, ConvexCutPolicy<T>>(...)
  -> shared Policy skeleton
```
]

- One skeleton for convex / explicit / implicit
- Convex behavior hidden in `ConvexCutPolicy`
- Hard to trace the convex path alone

]

.pull-right[
#### After

.font-sm[
```cpp
rpolygon_cut_convex(...)
  -> rpolygon_cut_convex_recur(...)
     -> find_concave_point_convex(...)
     -> find_min_dist_point_convex(...)
     -> try_degenerate_two_node_split(...)
     -> insert_cut_convex(...)
```
]

- Convex path is self-contained
- Explicit / implicit keep their Policy code
- Same scan, plus a degenerate-split hook

]

???
⏱️ 0:21–0:23 — This is a structural refactor plus a degenerate-split hook. The convex path no longer goes through Policy, while explicit and implicit keep their existing implementation.

---

### ➡️ Keep the original C++ scan

.font-sm[
```cpp
auto result = _find_min_dist_point<T>(
    lst, vcurr, vcurr->next, lst[vcurr->data]);
```
]

.pull-left[
#### Original C++

- Start at `vcurr->next`
- Stop at `vcurr`
- Half-open range tests
- Includes `vnext` and `vprev`

]

.pull-right[
#### Why it matters

- Small subpolygons still have candidates
- No empty-scan degenerate cut
- 100-point stress terminates
- 7-point fixture still works

]

$$ \text{start} = v_{\text{curr.next}} \;\longrightarrow\; \text{stop} = v_{\text{curr}} $$

???
⏱️ 0:23–0:25 — Python's inclusive scan excludes the two neighbors. On a 4-node subpolygon that leaves no candidate, and the 100-point stress hangs. The original C++ scan includes those neighbors, so it terminates.

### 🧷 Degenerate cut → 2-node split

.pull-left[
#### The 12-point case

```text
(-1,1) (0,0) (1,-1) (3,0)
(4,1) (6,2) (5,5) (4,4)
(3,2) (2,3) (1,2) (0,3)
```

- Concave vertex `(3,2)`
- Target `v_min = (1,2)`
- `p_new = (1,2) = v_min` → duplicate
- Old code appended `(1,2)` and left a non-convex piece ❌

]

.pull-right[
#### Detect and split

.font-sm[
```cpp
if (vertical && v_min->prev == vcurr->next
    && p_min.ycoord() == p_curr.ycoord()) {
    auto* first = vcurr->next;   // (2,3)
    auto* rest  = v_min->next;   // (0,3)
    const auto& first_point = lst[first->data];
    if (first_point.xcoord() != p_min.xcoord()
        && first_point.ycoord() != p_min.ycoord()) {
        first->next = first->prev = v_min;
        v_min->next = v_min->prev = first;
        vcurr->next = rest;
        rest->prev = vcurr;
    }
}
```
]

- 2-node piece: `[(2,3),(1,2)]`
- Remainder: `(3,2) → (0,3) → …`
- No `lst.emplace_back`
- Horizontal cuts use the symmetric branch

]

$$ p_{\text{new}} = p_{\min} \;\land\; \text{2-node piece valid} \;\Longrightarrow\; \text{split existing nodes} $$

???
⏱️ 0:25–0:27 — This is the new guard. When the cut point duplicates v_min, the old code appended a second copy of (1,2), leaving the remainder non-canonical. The fix splits the existing 2-node piece [(2,3),(1,2)] and connects (3,2) directly to (0,3). No (2,2) is created, and no point is appended.

### 🧠 Lessons learned

.pull-left[
#### Representation first

- Full list → even-index
- x-first is not y-first
- Start on a horizontal edge
- 2 points = rectangle, not a line

#### Fix the cut, not the output

- Keep the original algorithm
- Split the existing 2-node piece on a duplicate cut
- No new point for a collinear duplicate
- Keep raw pieces visible; do not hide them
- No assertions in the recursion

]

.pull-right[
#### Tests must obey the contract

- A fixture is an input
- Invalid fixtures hide invalid paths
- Share the same fixture across languages
- Stress tests protect the fix

#### Review checklist

- Is the input canonical even-index?
- Does the cut duplicate `v_min`?
- Is the 2-node piece non-degenerate?
- Do Python and C++ agree?

> “It works on my polygon” is not a contract. 📝

]
