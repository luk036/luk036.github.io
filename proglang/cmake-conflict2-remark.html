### Rec 3: What CPM Actually Checks 🔍

The reference presentation taught us: **read the source, don't guess.**

.font-sm[
```cmake
# CPM 0.32.0 — cpm_check_if_package_already_added
function(cpm_check_if_package_already_added CPM_ARGS_NAME CPM_ARGS_VERSION)
  if("${CPM_ARGS_NAME}" IN_LIST CPM_PACKAGES)   # ← THIS is the check
    ...
    return()
  endif()
endfunction()
```
]

**Key insight:** `set(CPM_fmt_ADDED YES)` is a **no-op** — CPM never reads it!

So the plan was: **migrate everything to the `CPM_PACKAGES` idiom** and add it to the 7 unguarded repos.

### The Guard "Fix" — My Mistake 🔥

I applied the `CPM_PACKAGES` guard everywhere:

.font-sm[
```cmake
find_package(fmt CONFIG QUIET)
if(fmt_FOUND)
  message(STATUS "Found system fmt: ${fmt_DIR}")
  if(NOT fmt IN_LIST CPM_PACKAGES)
    list(APPEND CPM_PACKAGES fmt)     # ← My "fix"
  endif()
else()

endif()

]

**It compiled everywhere... in theory.** 🤔

The reference doc warned: *"CPM_PACKAGES from parent scope might not propagate to FetchContent's subdirectory scope"* 🔴

**I treated that as a hint. It was a trap.**

## 🕳️ Part 5: Root Cause — The Shadow Variable

---

### CPM_PACKAGES is a CACHE INTERNAL Variable 📦

.font-sm[
```cmake
# CPM 0.32.0 — at the top of the file
set(CPM_PACKAGES
    ""
    CACHE INTERNAL ""          # ← CACHE INTERNAL
)

# CPMRegisterPackage — after adding a package
function(CPMRegisterPackage PACKAGE VERSION)
  list(APPEND CPM_PACKAGES ${PACKAGE})
  set(CPM_PACKAGES ${CPM_PACKAGES} CACHE INTERNAL "")   # ← updates the cache
endfunction()
```
]

**`CACHE INTERNAL` = visible everywhere, in every scope.** 🌍

So why didn't my `list(APPEND ...)` work?

---

### list(APPEND) Creates a Shadow 🪤

**The bug is subtle:**

.font-sm[
```cmake
# My code in specific.cmake (top-level scope)
if(NOT fmt IN_LIST CPM_PACKAGES)
  list(APPEND CPM_PACKAGES fmt)    # ← reads cache "", creates NORMAL var
endif()
```
]

`list(APPEND)` on a cache variable:
1. Reads the cache value → `""`
2. Creates a **NORMAL variable** `CPM_PACKAGES = [fmt]` in the current directory scope
3. The normal variable **shadows** the cache — in this scope AND all child scopes

.mermaid[
<pre>
graph TD
    A["list(APPEND CPM_PACKAGES fmt)"] --> B["Reads CACHE = empty"]
    B --> C["Creates NORMAL var\nCPM_PACKAGES = [fmt]"]
    C --> D["NORMAL var shadows CACHE\nin current + child scopes"]
    style A fill:#ff9800,color:#fff
    style B fill:#e3f2fd
    style C fill:#f44336,color:#fff
    style D fill:#f44336,color:#fff
</pre>
]

---

### Why FetchContent Breaks It 🧵

`CPMAddPackage` fetches deps via **FetchContent → add_subdirectory** — a CHILD scope.

The child scope inherits the **normal-variable shadow** `[fmt]`, NOT the cache `[fmt;Py2Cpp]`:

.mermaid[
<pre>
graph TD
    subgraph Parent["Parent Scope (specific.cmake)"]
        N1["NORMAL var: [fmt]\n(shadow, from my list(APPEND))"]
    end
    subgraph Cache["CACHE INTERNAL (global)"]
        C1["[fmt;Py2Cpp]\n(CPM registered Py2Cpp here)"]
    end
    subgraph Child["FetchContent subdirectory\n(fetched dep's specific.cmake)"]
        Q{"Py2Cpp IN_LIST\nCPM_PACKAGES?"}
    end
    N1 -->|"inherited ↓"| Q
    C1 -.->|"shadowed ✗"| Q
    Q -->|"No → recursion 💥"| R["find_package(Py2Cpp)\n→ FindPy2Cpp.cmake\n→ CPMAddPackage\n→ infinite loop"]
    style N1 fill:#f44336,color:#fff
    style C1 fill:#4caf50,color:#fff
    style Q fill:#ff9800,color:#fff
    style R fill:#f44336,color:#fff
</pre>
]

### Minimal Reproduction — Proven in 60 Seconds ⏱️

I wrote a tiny CMake test to **prove** the mechanism before touching 16 files:

.font-sm[
```cmake
# CMakeLists.txt (parent)
set(CPM_PACKAGES "" CACHE INTERNAL "")
if(NOT fmt IN_LIST CPM_PACKAGES)
  list(APPEND CPM_PACKAGES fmt)         # ← the shadow
endif()
function(CPMRegisterPackage PACKAGE VERSION)
  list(APPEND CPM_PACKAGES ${PACKAGE})
  set(CPM_PACKAGES ${CPM_PACKAGES} CACHE INTERNAL "")
endfunction()
CPMRegisterPackage(Py2Cpp v1.6.3)
add_subdirectory(sub)                    # ← child scope
```
]

.font-sm[
```cmake
# sub/CMakeLists.txt (child = FetchContent scope)
if(Py2Cpp IN_LIST CPM_PACKAGES)
  message(STATUS "Py2Cpp FOUND — GOOD")
else()
  message(STATUS "Py2Cpp NOT in list — RECURSION RISK")
endif()
```
]

---

### The Shadow Test Verdict 🧪

**`list(APPEND)` result — RECURSION CONFIRMED:**

.font-sm[
```text
-- PARENT scope CPM_PACKAGES = [fmt]
-- PARENT after register = [fmt] cache=[fmt;Py2Cpp]
--   SUB scope CPM_PACKAGES = [fmt]
--   SUB: Py2Cpp NOT in list -> RECURSION RISK   ❌
```
]

**`set(... CACHE ... FORCE)` result — CORRECT:**

.font-sm[
```text
-- PARENT scope CPM_PACKAGES = [;fmt]
-- PARENT after register = [fmt;Py2Cpp]
--   SUB scope CPM_PACKAGES = [fmt;Py2Cpp]
--   SUB: Py2Cpp FOUND in list - GOOD            ✅
```
]

**Root cause proven:** `list(APPEND)` on a `CACHE INTERNAL` var = normal-var shadow = broken across FetchContent scopes. 🎯

## ✅ Part 6: The Fix

---

### The Correct Idiom: Write the CACHE Directly 💪

.font-sm[
```cmake
# ❌ BROKEN: creates a normal-variable shadow
if(NOT fmt IN_LIST CPM_PACKAGES)
  list(APPEND CPM_PACKAGES fmt)
endif()

# ✅ CORRECT: writes the CACHE INTERNAL variable directly
if(NOT fmt IN_LIST CPM_PACKAGES)
  set(CPM_PACKAGES "${CPM_PACKAGES};fmt" CACHE INTERNAL "" FORCE)
endif()
```
]

**`FORCE`** overwrites any existing cache value. No normal variable is created — the value propagates into every FetchContent child scope. 🌍

Applied to **18 specific.cmake files** (16 with the guard + netoptim-fast + netoptim-cpp).

---

### netoptim-cpp absl Fix — Don't Mix! 🎭

Per the reference doc: *"you cannot mix `find_package` and `CPMAddPackage` for the same dependency."*

DiGraphX already CPM-adds abseil → check for the REAL target first:

.font-sm[
```cmake
# If DiGraphX already added abseil via CPM, use its REAL targets
if(TARGET absl::flat_hash_map)
  message(STATUS "Using CPM-provided abseil (from DiGraphX)")
  set(SPECIFIC_ABSEIL_LIBS absl::flat_hash_map)
else()
  find_package(absl CONFIG QUIET)     # ← only when NOT already provided
  ...
endif()
```
]

**No more IMPORTED vs REAL collision.** 🧹

## 🎯 Key Takeaways

---

### Lessons Learned 📝

1. **`list(APPEND)` on a CACHE variable is a shadow trap** 🪤
   It creates a normal variable that hides the cache from child scopes. Use `set(... CACHE INTERNAL "" FORCE)` instead.

2. **FetchContent scoping is the real enemy** 🧵
   `add_subdirectory` inherits normal vars, not your intent.

3. **Distinguish YOUR bugs from pre-existing ones** 🕵️
   Stash → revert → reconfigure. Fix your regression first, then the rest.

4. **Reference docs list failed attempts for a reason** 📖
   "Couldn't test due to scoping" was a RED FLAG, not a TODO.

5. **Prove the mechanism before mass edits** 🧪
   A 60-second minimal reproduction beats 16 broken files.

6. **Verification on 28 repos is inherently slow** ⏱️
   Budget for machine time, not just decision time.

### When `list(APPEND)` Meets `CACHE INTERNAL` 🧪

.font-sm[
```cmake
# CACHE INTERNAL — global, but shadow-able
set(MY_LIST "" CACHE INTERNAL "")

list(APPEND MY_LIST a)          # creates NORMAL var shadow = [a]
set(MY_LIST "${MY_LIST};a" CACHE INTERNAL "" FORCE)  # updates cache directly
```
]

| Operation | Parent reads | Child reads | Verdict |
|-----------|:------------:|:-----------:|:-------:|
| `list(APPEND MY_LIST a)` | `[a]` (shadow) | `[a]` (shadow) | ❌ cache hidden |
| `set(... CACHE INTERNAL "" FORCE)` | `[;a]` (cache) | `[a;b]` (cache) | ✅ propagates |

**Rule of thumb:** when in doubt, write the CACHE variable directly. 🔑
