## ❌ The Problem

---

### The CPM.cmake Workflow 📦

```cmake
# Current approach — fetch & build from source EVERY time
CPMAddPackage(
  NAME abseil-cpp
  GIT_TAG 20260107.1
  GITHUB_REPOSITORY abseil/abseil-cpp
  OPTIONS "ABSL_PROPAGATE_CXX_STD ON"
)
```

What happens:

.mermaid[
<pre>
graph LR
    A["cmake -S. -B build"] --> B["CPM Downloads\nSource Code"]
    B --> C["CMake Configures\nAbseil Targets"]
    C --> D["Compiler Compiles\n400+ Source Files"]
    D --> E["Your Project\n&nbsp;Links&nbsp;"]
    style A fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style B fill:#fff3e0,stroke:#e65100,stroke-width:3px
    style C fill:#fff3e0,stroke:#e65100,stroke-width:3px
    style D fill:#ffcdd2,stroke:#c62828,stroke-width:3px
    style E fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>
]

> **Result**: Every clean build recompiles hundreds of files. ⌛

---

### Why This Hurts 😫

| Dependency | Source Files | Build Time (1st build) |
|---|---|---|
| **abseil-cpp** | 400+ .cc files | 5–15 minutes |
| **fmt** | ~20 .cc files | 30–60 seconds |
| **spdlog** | ~15 .cc files | 30–60 seconds |
| **doctest** | header-only | ~0 (config only) |

Even with `CPM_SOURCE_CACHE`, CPM still **reconfigures and rebuilds** from source on a clean `build/` directory:

- Cache **miss** → full rebuild of all dependencies
- Cache **hit** → still reconfirms CMake targets

> The developer workflow on new clones is **painfully slow**. 🐢

---

### The "Works on My Machine" Trap 🪤

Developers on different platforms use different strategies:

.mermaid[
<pre>
graph LR
    A["Developer Clones Repo"] --> B["cmake -S. -B build"]
    B --> C["CPM Downloads & Builds\n&nbsp;Everything&nbsp;"]
    C --> D["Waits 10+ Minutes"]
    D --> E["Then Works"]

    A -. "Ubuntu User:\napt install libabsl-dev" .-> F["0 Minutes\nAlready Installed"]
    F -. "BUT: CPM doesn't\ncheck system packages!" .-> C
    style A fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style C fill:#ffcdd2,stroke:#c62828,stroke-width:3px
    style D fill:#ffcdd2,stroke:#c62828,stroke-width:3px
    style F fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>
]

CPM can use system packages — you just have to tell it! `CPM_USE_LOCAL_PACKAGES=TRUE` already exists, but the package name `abseil-cpp` doesn't match CMake's `absl` config.

## 💡 The Solution

---

### The Pattern: `find_package` → CPM Fallback 🔄

Replace unconditional `CPMAddPackage` with a two-step check:

```cmake
# Step 1: Try system package first
find_package(absl CONFIG QUIET)

if(absl_FOUND)
  message(STATUS "Found system abseil: ${absl_DIR}")
  # Use the system-installed version — zero compilation!
  set(SPECIFIC_ABSEIL_LIBS absl::flat_hash_map)
else()
  # Step 2: Fall back to CPM (same as before)
  CPMAddPackage(
    NAME abseil-cpp
    GIT_TAG 20260107.1
    GITHUB_REPOSITORY abseil/abseil-cpp
    OPTIONS "ABSL_PROPAGATE_CXX_STD ON"
  )
  set(SPECIFIC_ABSEIL_LIBS absl::flat_hash_map)
endif()
```

This one pattern applied to **fmt**, **spdlog**, **doctest**, and **abseil** across **35+ repositories**.

### Cross-Platform System Packages 🖥️

The pattern works because **every major OS** packages these libraries:

| Dependency | Ubuntu 🐧 | macOS 🍎 | Termux 📱 | Windows 🪟 |
|---|---|---|---|---|
| **abseil** | `libabsl-dev` | `brew install abseil` | `pkg install abseil-cpp` | CPM fallback |
| **fmt** | `libfmt-dev` | `brew install fmt` | `pkg install fmt` | CPM fallback |
| **spdlog** | `libspdlog-dev` | `brew install spdlog` | `pkg install spdlog` | CPM fallback |
| **doctest** | `doctest-dev` | `brew install doctest` | `pkg install doctest` | CPM fallback |

Windows doesn't have system package managers — CPM fallback handles it. ✅

### The SPDLOG_FMT_EXTERNAL Fix 🔧

**Problem**: On Windows with Conda, `find_package(fmt CONFIG)` found a system `fmt.dll`. But spdlog (built via CPM) bundles its own copy of fmt → **linker conflict**! 💥

```
error LNK2005: "void fmt::v12::vformat_to(...)"
  already defined in fmt.lib(fmt.dll)
```

**Fix**: Add `SPDLOG_FMT_EXTERNAL YES` to spdlog's CPM fallback:

.mermaid[
<pre>
graph LR
    A["System fmt\nfound by find_package"] --> B["spdlog compiled\nvia CPM"]
    B --> C{"SPDLOG_FMT_EXTERNAL\n&nbsp;set?&nbsp;"}
    C -- "No ❌" --> D["Bundled fmt + System fmt\n&nbsp;LINKER CONFLICT&nbsp;"]
    C -- "Yes ✅" --> E["External fmt (system)\n&nbsp;CLEAN LINK&nbsp;"]
    style A fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style C fill:#fff3e0,stroke:#e65100,stroke-width:3px
    style D fill:#ffcdd2,stroke:#c62828,stroke-width:3px
    style E fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>
]

Found in 3 repos that were missing this flag. ✅

### Two Project Styles 🏛️

**Style 1: CPM-based** (most repos)

.font-sm[
```cmake
# Before: always downloads
CPMAddPackage("gh:doctest/doctest#v2.5.2")

# After: checks system first
find_package(doctest CONFIG QUIET)
if(NOT doctest_FOUND)
  CPMAddPackage("gh:doctest/doctest#v2.5.2")
endif()
```
]

**Style 2: Raw header download** (simple repos like `ellalgo-simple`)

.font-sm[
```cmake
# Before: always downloads header
file(DOWNLOAD "https://.../doctest.h" "${DOCTEST_HEADER}")

# After: checks system first, creates compat target
find_package(doctest CONFIG QUIET)
if(doctest_FOUND)
  add_library(doctest INTERFACE)
  target_link_libraries(doctest INTERFACE doctest::doctest)
else()
  # download header...
endif()
```
]

### New: `test_installed` Pattern 🧪

**Problem**: When a library is installed (via `cmake --install`), how do you test that downstream consumers can `find_package()` it?

**Solution**: Add a `test_installed/CMakeLists.txt`:

.mermaid[
<pre>
graph TD
    subgraph BuildPhase["Build & Install"]
        A["cmake -S . -B build\ncmake --build build"] --> B["cmake --install build\n&nbsp;prefix=/usr/local&nbsp;"]
    end
    subgraph TestPhase["Test Installed"]
        C["cmake -S test_installed\n-B build/test_installed"] --> D["find_package(fmt REQUIRED)\nfind_package(spdlog REQUIRED)"]
        D --> E["find_package(LdsGen REQUIRED)"]
        E --> F["add_subdirectory(standalone)\n&nbsp;links against installed lib&nbsp;"]
    end
    B -.-> C
    style BuildPhase fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style TestPhase fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px
    style A fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style B fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style C fill:#fff3e0,stroke:#e65100,stroke-width:3px
    style E fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style F fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
</pre>
]

**Key**: Find transitive deps (`fmt`, `spdlog`) FIRST, then `find_package(${PROJECT_NAME} REQUIRED)`.

### `test_installed` Pattern: Reference 📄

Following `projgeom-cpp/test_installed/CMakeLists.txt`:

.font-sm[
```cmake
cmake_minimum_required(VERSION 3.14 FATAL_ERROR)

project(LdsGen LANGUAGES CXX)

include(../cmake/tools.cmake)
include(../cmake/CPM.cmake)

# Find dependencies first — LdsGenConfig.cmake references fmt::fmt etc.
find_package(fmt REQUIRED)
find_package(spdlog REQUIRED)
find_package(${PROJECT_NAME} REQUIRED)

set(SPECIFIC_LIBS fmt::fmt spdlog::spdlog)

add_subdirectory(${CMAKE_CURRENT_LIST_DIR}/../standalone ...)
```
]

**Applied to**: `lds-gen-cpp`, `lds-cpp`, `py2cpp`, `xnetwork-cpp`, `mywheel-cpp` ✅

### New: Standalone Guard Pattern 🛡️

**Problem**: Standalone executables `add_subdirectory`'d from `test_installed` would re-fetch the project via CPM instead of using the installed version.

**Solution**: Guard target creation:

.font-sm[
```cmake
# ---- Dependencies ----
# Guard: when used via add_subdirectory from test_installed,
# targets are already available
if(NOT TARGET LdsGen::LdsGen)
  include(../cmake/CPM.cmake)
  include(../cmake/specific.cmake)
endif()

if(NOT TARGET cxxopts::cxxopts)
  include(../cmake/CPM.cmake)
  CPMAddPackage(
    GITHUB_REPOSITORY jarro2783/cxxopts
    VERSION 3.2.1
    ...
  )
endif()

if(NOT TARGET LdsGen::LdsGen)
  CPMAddPackage(NAME LdsGen SOURCE_DIR ${CMAKE_CURRENT_LIST_DIR}/..)
endif()
```
]

**Direct build**: Targets don't exist → fetched normally.
**test_installed**: Targets exist → skipped, uses installed version. ✅

### CI Impact: Zero ☁️

All CI workflows were **already** caching CPM modules:

```yaml
env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

steps:
  - uses: actions/cache@v3
    with:
      path: "**/cpm_modules"
      key: ${{ hashFiles('**/*.cmake') }}
```

None of the CI workflows install system packages, so:

- `find_package(... QUIET)` **quietly fails** ❌
- CPM fallback activates with **identical behavior** to before ✅
- `CPM_SOURCE_CACHE` + `actions/cache` keep CI fast 🚀

The cache key changes (we modified `*.cmake` files), so **first CI run = cache miss** — but that's a one-time cost.

From both sessions, **one pattern** applied across 35+ repos:

```cmake

if(<pkg>_FOUND)
  message(STATUS "Found system <pkg>: ${<pkg>_DIR}")
else()

```
