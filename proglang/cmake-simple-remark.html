## ❌ The Problem

---

### The Old World: Nested CMakeLists 🗂️

Every subproject had its **own** build system:

```text
fractions-cpp/
├── CMakeLists.txt          # root
├── test/
│   └── CMakeLists.txt      # separate test build
├── standalone/
│   └── CMakeLists.txt      # separate CLI build
├── documentation/
│   └── CMakeLists.txt      # separate docs build
├── bench/
│   └── CMakeLists.txt      # separate bench build
├── examples/
│   └── CMakeLists.txt      # separate examples build
└── all/
    └── CMakeLists.txt      # "build everything" aggregator
```

**7 build entry points**, each re-declaring dependencies. 🤯

---

### The Cost of Scattered Helpers 🧩

The `cmake/` directory was a grab-bag:

| File | Purpose | Problem |
|---|---|---|
| `cmake/CPM.cmake` | CPM fetch logic | copied into **every** repo |
| `cmake/tools.cmake` | sanitizers, ccache | mostly **unused** options |
| `cmake/doctest.cmake` | doctest wiring | folded into root needed |
| `cmake/doctestAddTests.cmake` | doctest→ctest glue | vendored from upstream |
| `examples/CPM_modules/` | 3rd copy of CPM | **out of date** versions |

> The helpers were **dead weight** — most repos never used sanitizers or ccache, yet the files were copied everywhere. 📦

---

## 💡 The Solution

---

### The Pattern: Single Root CMakeLists 🌳

One file. One configure. Everything is an **option**:

```text
fractions-cpp/
├── CMakeLists.txt          # 👑 THE build file
├── test/                   # sources only (no CMake)
├── standalone/             # sources only (no CMake)
├── bench/                  # sources only (no CMake)
├── documentation/          # Doxyfile + pages only
└── test_installed/         # consumer smoke test 🆕
```

**One `cmake -B build`** replaces all 7 entry points. ✅

### Anatomy of the Root CMakeLists 🔬

```cmake
cmake_minimum_required(3.14...3.22)
project(Fractions VERSION 1.1.3 LANGUAGES CXX)

# Warnings everywhere — one helper, applied to all targets
include(cmake/tools.cmake)          # 🆕 slimmed down
add_library(Fractions ...)          # CXX_STANDARD 11

if(FRACTIONS_BUILD_TESTS)           # default ON
  add_executable(FractionsTests ...) # CXX_STANDARD 17
  enable_testing() + add_test(...)
endif()

if(FRACTIONS_BUILD_DOCS)            # default OFF
  find_package(Doxygen) → GenerateDocs
endif()
```

What used to live in 7 files now lives in **one** — gated by options. 🎯

### The `target_enable_warnings` Helper 🛡️

The single most reused function in the new layout:

```cmake
function(target_enable_warnings target_name)
  if(MSVC)
    target_compile_options(${target_name} PRIVATE
      /W4 /WX /utf-8 /permissive- /wd4819)
  else()
    target_compile_options(${target_name} PRIVATE
      -Wall -Wextra -Wpedantic -Werror)
  endif()
endfunction()
```

Applied to **every** target — library, tests, standalone, benches:

```cmake
target_enable_warnings(Fractions)
target_enable_warnings(FractionsTests)
target_enable_warnings(FractionsStandalone)
```

**Warnings are errors** on all three major compilers. 🚨

---

### System-First Dependencies 🔄

The `find_package` → CPM fallback pattern (from the CPM session):

```cmake
# Try the system package FIRST — zero compilation
find_package(fmt CONFIG QUIET)
if(NOT fmt_FOUND)
  CPMAddPackage("gh:fmtlib/fmt#12.1.0")   # fallback
endif()

find_package(spdlog CONFIG QUIET)
if(NOT spdlog_FOUND)
  CPMAddPackage("gh:gabime/spdlog#v1.17.0") # fallback
endif()
```

Ubuntu/macOS devs with packages installed **skip the fetch entirely**. 🚀

- **RapidCheck** → `RAPIDCHECK_BUILD_EXAMPLES/TESTS OFF`

### Minimal Export: `find_package(Fractions)` 📦

Keep it **minimal** — consumers get exactly what they need:

```cmake
# PackageProject.cmake @ 1.8.0 — minimal config
include(cmake/package_project.cmake)
PackageProject(
  NAME Fractions
  VERSION 1.1.3
  COMPATIBILITY SameMajorVersion
  ...
)
```

Produces the standard quartet:

```text
lib/cmake/Fractions-1.1.3/
├── FractionsConfig.cmake
├── FractionsConfigVersion.cmake
├── FractionsTargets.cmake
└── FractionsTargets-debug.cmake
```

And the generated `include/fractions/version.h` with `FRACTIONS_VERSION_*` macros. 🎁

### ellalgo-cpp: The CI Failures 🔥

Ubuntu & macOS builds were **failing** after the simplification:

.mermaid[
<pre>
graph LR
    A["CMake Simplify\n&nbsp;ellalgo-cpp&nbsp;"] --> B["Ubuntu CI ❌"]
    A --> C["macOS CI ❌"]
    B --> D["spdlog compiled-lib\n&nbsp;registry mismatch&nbsp;"]
    C --> D
    D --> E{"SPDLOG_COMPILED_LIB\n&nbsp;defined at compile?&nbsp;"}
    E -- "No ❌" --> F["Header-only registry vs\ncompiled registry diverge"]
    F --> G["duplicate logger\n&nbsp;exceptions at runtime&nbsp;"]
    style B fill:#ffcdd2,stroke:#c62828,stroke-width:3px
    style C fill:#ffcdd2,stroke:#c62828,stroke-width:3px
    style D fill:#fff3e0,stroke:#e65100,stroke-width:3px
    style F fill:#fff3e0,stroke:#e65100,stroke-width:3px
    style G fill:#ffcdd2,stroke:#c62828,stroke-width:3px
</pre>
]

The root cause was **invisible to the compiler** — no warnings, just runtime chaos. 🕵️

---

### The SPDLOG_COMPILED_LIB Fix 🔧

**Lesson**: any TU using spdlog must compile with spdlog's **own** interface definitions:

```cmake
# Before: definitions silently dropped
target_link_libraries(EllAlgo PRIVATE spdlog::spdlog)

# After: propagate the registry-enabling macros
get_target_property(SPDLOG_COMPILE_DEFS spdlog
  INTERFACE_COMPILE_DEFINITIONS)
target_compile_definitions(EllAlgo PRIVATE ${SPDLOG_COMPILE_DEFS})
```

This restores the critical macros:

```text
SPDLOG_COMPILED_LIB      # use the compiled registry
SPDLOG_FMT_EXTERNAL      # use external fmt, not bundled
```

**Without them**: header-only + compiled spdlog registries diverge → duplicate-logger exceptions on macOS. 💥

---

### The Coverage Link Fix 📊

Coverage builds failed too — **options applied to the wrong targets**:

```cmake
# Before: coverage flags on the library only
# After: compile opts on lib + exes, link opts on exes

# compile opts — lib and executables
target_compile_options(Fractions PRIVATE -O0 -g -fprofile-arcs -ftest-coverage)
target_compile_options(FractionsTests PRIVATE -O0 -g -fprofile-arcs -ftest-coverage)

# link opts — executables only
target_link_options(FractionsTests PRIVATE --coverage)
```

GCC/Clang-only (MSVC skips it). `gcovr` generates the report:

```bash
cmake -B build -DELLALGO_ENABLE_COVERAGE=1
cmake --build build --target coverage
```

Coverage is now opt-in and **platform-guarded**. ✅

### The 5 Rewritten Workflows ⚙️

All `checkout@v4`, no CPM cache — matching the sibling template:

.font-sm[
| Workflow | Jobs | Key change |
|---|---|---|
| `ubuntu.yml` | build + coverage | `ctest --test-dir build --output-on-failure`, codecov upload |
| `install.yml` | install + consumer | root build → `cmake --install` → `test_installed` |
| `windows.yml` | MSVC Release | `ctest -C Release` (multi-config!) |
| `macos.yml` | macOS Release | `-j4` build |
| `documentation.yaml` | tags `["*"]` | Doxygen + publish `./build/doxygen/html` |
]

```yaml
# The new test step — one command instead of three
- name: Test
  run: ctest --test-dir build --output-on-failure
```

No more `-S test` / `-S standalone` in CI. 🎉

### The Interface: Fully Preserved ✅

The rewrite changed the **build graph**, not the **API**:

.font-sm[
| Interface | Old (v1.1.3) | New (v1.1.4) |
|---|---|---|
| **Target name** | `Fractions::Fractions` | `Fractions::Fractions` ✅ |
| **Export config** | PackageProject `NAMESPACE Fractions` | identical ✅ |
| **Headers** | `fractions/*.hpp` | unchanged ✅ |
| **Version header** | generated `version.h` | unchanged ✅ |
| **fmt/spdlog deps** | `find_package` → CPM fallback | identical ✅ |
]

Verified by diffing the old root against the new root — **headers byte-identical**. 🎯

No source or CMake changes needed in consumers. ✅

The new root builds **everything**:

### The Consumer Opt-Out 🔧

Tell CPM to skip fractions' test suite:

```cmake
CPMAddPackage(
  NAME Fractions
  GIT_TAG v1.1.4
  GITHUB_REPOSITORY luk036/fractions-cpp
  OPTIONS "FRACTIONS_BUILD_TESTS OFF"
)
```

Applied to **both** dependents. CPM de-dupes shared deps by name, so no target conflicts. ✅

> ⚠️ Note: `FractionsStandalone` is **unconditional** in the new root — a future `FRACTIONS_BUILD_STANDALONE` option would give consumers a full off-switch.

### The DLL Gotcha (Pre-Existing) 🪟

projgeom's tests crashed with `0xC0000135` (DLL not found) — **unrelated to the change**:

| Repo | fmt/spdlog source | Runtime DLLs needed? |
|---|---|---|
| **rat-trig-cpp** | CPM builds from source (static) | No ✅ |
| **projgeom-cpp** | `find_package` → conda shared libs | `fmt.dll` / `spdlog.dll` on PATH ⚠️ |

Fix: add conda's `Library\bin` to `PATH`. CPM-built deps are static → no DLLs. 💡

### Before vs After 🏁

| Metric | Before | After |
|---|---|---|
| **CMake entry points** | 7 | **1** |
| **cmake/ helper files** | 8 | **~2** |
| **Build commands** | 4+ (`-S test`, `-S standalone`, ...) | **3** (`configure`, `build`, `ctest`) |
| **CMake lines (fractions)** | 568+ | **217** |
| **CI configure passes** | 3+ | **1** |
| **Install prefix leaks** | doctest + deps | doctest excluded ✅ |
| **Consumer test** | ❌ | `test_installed` ✅ |

**Simpler to maintain, faster to build, proven by CI.** 🚀

---

### One Simple Change 🔑

The whole session reduces to one structural decision:

```cmake
# BEFORE: add_subdirectory per concern, duplicated deps
add_subdirectory(test)
add_subdirectory(standalone)
add_subdirectory(bench)
add_subdirectory(documentation)

# AFTER: one file, options gate each concern
if(FRACTIONS_BUILD_TESTS)     # tests, on by default
endif()
if(FRACTIONS_BUILD_DOCS)      # docs, opt-in
endif()
if(FRACTIONS_BUILD_BENCHMARKS) # benches, opt-in
endif()
```

**7 commits → 2 repos → same pattern → all CI green.** ⚡

**The best build system is the one you don't have to think about.** 💡

### 7 Ways Simplification Helps AI Agents 🤖

| # | Impact | Why it matters |
|:--:|---|---|
| 1 | **Less context to load** 🧠 | 7 CMakeLists + 8 helpers → **1 root file** |
| 2 | **Single source of truth** 🎯 | Deps declared once — no "other place" to miss |
| 3 | **Uniform commands** 🛠️ | `cmake -B build` trio works in every repo |
| 4 | **Tighter feedback loops** 🚨 | `-Werror` / `/WX` = instant, machine-readable failure |
| 5 | **Explicit intent** 📐 | `if(BUILD_TESTS)` predicts effects, unlike a dir name |
| 6 | **Agent safety net** 🧪 | `test_installed` gives deterministic green/red verdict |
| 7 | **Transferable expertise** 🔄 | Learn one repo → understand all siblings |

---

### The Meta-Point 💡

**AI coding thrives on predictability.** The simplification:

- **Removed ambiguity** — duplicated deps, scattered entry points 🧹
- **Declared intent** — options instead of directory names 📐
- **Made verification cheap** — `-Werror`, `test_installed`, uniform ctest ⚡

> Normalized structure = an agent that learned one repo understands them **all**. 🔄

**Honest caveat**: `GLOB_RECURSE` needs `CONFIGURE_DEPENDS` to pick up new files, and isolated sub-builds are gone — neither has cost anything in practice. ⚠️
