## 🧐 Part 1: The Problem

---

### Polynomial Root-Finding Algorithms 📐

Two parallelizable methods in the `ginger-cpp` library:

**Bairstow's Method** — finds quadratic factors $x^2 - r x - q$ simultaneously:

$$P(x) = \prod_{i=1}^{m} (x^2 - r_i x - q_i)$$

Each root $i$:
1. Synthetic division via Horner: $P(vr_i)$ and $P'(vr_i)$
2. Suppress influence of other roots $vr_j$
3. Update via Newton step: $vr_i \leftarrow vr_i - \Delta$

**Aberth-Ehrlich Method** — finds complex roots simultaneously:

$$z_i \leftarrow z_i - \frac{P(z_i)}{P'(z_i) - \sum_{j \neq i} \frac{P(z_i)}{z_i - z_j}}$$

---

### The Parallelization Strategy 🧵

```cpp
// Each iteration: process all N roots in parallel
for (auto niter = 0U; niter != max_iters; ++niter) {
    vector<future<double>> results;
    for (auto idx = 0U; idx != num_roots; ++idx) {
        results.emplace_back(pool.enqueue([&, idx]() {
            /* compute root update for idx */
            return tol_i;
        }));
    }
    for (auto& result : results)
        tolerance = max(tolerance, result.get());
    if (tolerance &lt; options.tolerance) break;
}
```

Seems reasonable — **1 task per root, run in parallel**, right? 🤔

## 🔍 Part 2: Root Cause Analysis

---

### Killer #1: Per-Task Overhead 🗑️

Each `pool.enqueue()` does:

```cpp
auto packaged = make_shared<packaged_task<...>>(task);  // 🟢 HEAP ALLOC
{
    lock_guard<mutex> lock(queue_mutex_);                // 🔴 LOCK
    tasks_.emplace(packaged);                             // 🟢 HEAP ALLOC
}
condition_.notify_one();                                  // 🔴 SYSCALL
```

**Per-task cost: ~1-5 µs** on Windows

For degree-8 (4 roots, 6 iterations) = **24 heap allocs + 24 locks + 24 syscalls**

The actual computation for each root is ~3 µs. **Overhead equals computation!** 😱

---

### Killer #2: Coeffs Copied Per Root 📋

The `horner()` function **corrupts** the coefficients array — it does synthetic division in-place:

```cpp
// Inside per-root task:
local_coeffs = coeffs;        // copy full polynomial
auto vA = horner(local_coeffs, degree, vri);  // ⚠️ modifies local_coeffs!
```

For FIR degree-48 (49 coefficients × 8 bytes = 392 bytes):
- **Copy per root**: 24 roots × 392 bytes = 9.4 KB per iteration
- **Copy per task**: 24 copies × 6 iterations = 144 copies total

All that copying **just to throw it away** after each Horner call.

---

### Killer #3: Data Races 🏎️💥

The original MT code reads `vrs[jdx]` while other threads **write** to it:

```cpp
pool.enqueue([&, idx]() {
    // ...
    for (auto jdx = 0U; jdx &lt; num_roots; ++jdx) {
        if (jdx == idx) continue;
        const auto& vrj = vrs[jdx];     // 👈 reads from OTHER threads
        suppress_old(vA, vA1, vri, vrj);
    }
    vrs[idx] -= delta_scalar(...);       // 👈 writes own
});
```

---

### The Overhead Equation 📊

For degree-8 (4 roots, 6 iterations):

$$\text{Total} = \sum_{i=1}^{24} \left(\text{task\_overhead}_i + \text{computation}_i\right)$$

$$\text{task\_overhead} \approx 1\text{–}5\,\mu\text{s},\quad \text{computation} \approx 3\,\mu\text{s}$$

$$\text{Speedup} = \frac{\text{serial\_time}}{\text{parallel\_time}} \approx \frac{4 \times 3 \times 6}{24 \times (3 + 3)} \approx \frac{72}{144} = 0.5\textbf{x}$$

**With 22 threads, we get 0.5× speedup** — that's *negative* scaling! 📉

## 🔧 Part 3: The Fixes

---

### Fix #1: Batch Scheduling 📦

**Before**: 1 task per root = N tasks
**After**: 1 task per chunk = T tasks (T = thread count)

```cpp
const auto num_threads = min(pool_size, num_roots);
const auto chunk_size = (num_roots + num_threads - 1) / num_threads;

for (auto t = 0U; t &lt; num_threads; ++t) {
    auto start = t * chunk_size;
    auto end = min(start + chunk_size, num_roots);
    results.emplace_back(pool.enqueue([&, start, end]() {
        double max_tol = 0.0;
        for (auto idx = start; idx &lt; end; ++idx) {
            max_tol = max(max_tol, process_root(idx));
        }
        return max_tol;
    }));
}
```

### Fix #2: Jacobi Snapshot Iteration 📸

Replace **Gauss-Seidel** (read live values) with **Jacobi** (read snapshot):

```cpp
// Gauss-Seidel: reads vrs[jdx] as updated by other threads — DATA RACE ❌
// Jacobi:       reads vrs_snapshot[jdx] from previous iteration — SAFE ✅
auto vrs_snapshot = vrs;     // copy once per iteration
for (auto idx = start; idx &lt; end; ++idx) {
    const auto& vri = vrs_snapshot[idx];   // read from snapshot
    // ... compute update ...
    for (auto jdx = 0U; jdx &lt; num_roots; ++jdx) {
        if (jdx == idx) continue;
        const auto& vrj = vrs_snapshot[jdx];  // ✅ ALL read from same snapshot
        suppress_old(vA, vA1, vri, vrj);
    }
    vrs[idx] -= delta_scalar(...);   // write to live array
}
```

### Fix #3: Coeffs Copy Per Root (Bugfix!) 🐛

The `horner()` function **corrupts** the coefficients array:

```cpp
auto vA = horner(coeffs, degree, vri);
// After this call, coeffs is DESTROYED ☠️
auto vB = horner(coeffs, degree, vrj);  // 💥 Uses corrupted data!
```

**Fix**: Each root gets its own copy:

```cpp
for (auto idx = start; idx &lt; end; ++idx) {
    auto local_coeffs = coeffs;                    // ✅ fresh copy per root
    auto vA = horner(local_coeffs, degree, vri);   // ✅ local copy is safe
    auto vA1 = horner(local_coeffs, degree-2, vri);
    // ... rest of root processing ...
}
```

> The original MT code also had this bug! With 1 task = 1 root, the single use per task masked it. Batch scheduling exposed it. 😅

---

### Fix #4: Sequential Path for Small Problems 🚶

For &le; 4 roots, **skip the thread pool entirely**:

```cpp
if (num_roots <= 4) {
    // Direct sequential loop — no futures, no pool, no snapshot
    for (auto niter = 0U; niter != max_iters; ++niter) {
        auto tolerance = 0.0;
        for (auto idx = 0U; idx != num_roots; ++idx) {
            // ... same as pbairstow_even_st ...
        }
        if (tolerance &lt; options.tolerance) return {niter, true};
    }
    return {max_iters, false};
}
```

No heap allocations, no mutexes, no condition variables — **runs at ST speed** for small problems.

The parallel path is only activated when there are enough roots to amortize the overhead.

| Language | Deg8 penalty | FIR48 penalty | Threading |
|----------|-------------|---------------|-----------|
| **Rust** 🦀 | 17-22× | 1.5× | Rayon work-stealing |
| **C++ (before)** ⚡ | 23-35× | 6.2× | `thread_pool` + `std::future` |

Rayon's work-stealing is inherently more efficient than hand-rolled `std::future` per task.

### Lessons Learned 🧠

1. **Measure before optimizing** 📏 — The 23-35× slowdown was hiding in plain sight

2. **Thread pools aren't free** 💰 — Each `enqueue()` has real cost (heap + lock + syscall)

3. **Batch your tasks** 📦 — N tasks for N work items is wasteful. Use chunks!

4. **Snapshots fix races** 📸 — Jacobi iteration is trivially parallelizable

5. **Know when NOT to parallelize** 🚫 — For &le; 4 roots, sequential is optimal

6. **Let the data flow** 🔄 — `horner()` destroys its input. Design APIs that make this obvious.

> **The best optimization is knowing when to do nothing.** 🧘
