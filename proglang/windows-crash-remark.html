## 🧵 Part 3: Getting the Stack Trace

---

### AddressSanitizer to the Rescue 🛡️

No `cdb.exe` installed → used **MSVC AddressSanitizer** instead:

```bash
cmake -B build-asan \
  -DRECTI_BUILD_TESTS=ON \
  -DCMAKE_CXX_FLAGS="/fsanitize=address /Zi /EHsc"
cmake --build build-asan --target RectiTests
```

**Gotchas** ⚠️:
- `clang_rt.asan_dynamic-x86_64.dll` must be on `PATH` (lives in `VC\Tools\MSVC\...\bin\Hostx64\x64`)
- Project's `/WX` (warnings-as-errors) required `/EHsc`

---

### The Decisive Stack Trace 🎯

ASan pinned the crash to the exact line:

```text
#4 std::basic_string::basic_string(basic_string const&)   xstring:768  ← copy ctor
#5 recti::TreeNode::TreeNode(string const&, Point<int,int> const&)  dme_algorithm.hpp:84
#6 recti::DMEAlgorithm::build_merging_tree(...)           dme_algorithm.cpp:143
#7 recti::DMEAlgorithm::build_merging_tree(...)           dme_algorithm.cpp:139
#8 recti::DMEAlgorithm::build_clock_tree(...)             dme_algorithm.cpp:97
```

`memcpy` from address **0x000000000000** (size 10) while copying a `TreeNode`'s `name` —
the source `std::string` was **corrupt**. 🧨

---

### The Smoking Gun 🚬

Temporary `ofstream` logging right after the string is created:

```text
[dbg0] node_id=0 id.size=15 id.data=0000000000000000
      node_ids.size=2 vertical=1 left=2 right=1
[dbg1] pos=(50,100) tree.size=3
```

`fmt::format("n{}", 0)` — expected `"n0"` (2 chars) — returned
**`size=15, data=nullptr`**. The string was never valid from the caller's view. 🧨

---

### Isolation: fmt::format Is the Culprit 🧪

Replace `fmt::format` with plain string construction:

```cpp
// Before (crashes):
std::string id = fmt::format("n{}", node_id++);

// After (works):
std::string id = "n" + std::to_string(node_id);
```

✅ **DME test passes.** → `fmt::format` confirmed as the corruption source.

And `dumpbin /dependents` showed the Debug exe links:

```text
fmt.dll
spdlog.dll
```

...the **conda Release-built shared libraries**! 🎯

## 💡 Part 4: Root Cause

---

### The ABI Mismatch: `_ITERATOR_DEBUG_LEVEL` ⚙️

MSVC's `std::basic_string` layout **depends on the macro**:

.pull-left[
**Release** — `_ITERATOR_DEBUG_LEVEL=0`

```text
+-----------------------------+
| union _Bx { _Buf[16]        |
|             _Ptr       }    |
| size_t _Mysize              |
| size_t _Myres               |
+-----------------------------+
```
]

.pull-right[
**Debug** — `_ITERATOR_DEBUG_LEVEL=2`

```text
+-----------------------------+
| _Container_proxy* _Myproxy  |  ← extra field!
| union _Bx { _Buf[16]        |
|             _Ptr       }    |
| size_t _Mysize              |
| size_t _Myres               |
+-----------------------------+
```
]

Objects created at one level are **misread at the other** — size/pointer fields land at different offsets. 📏

---

### The Crash Chain 🧨

.mermaid[
<pre>
graph LR
    A["conda ships\nRelease-only fmt.dll\n_ITERATOR_DEBUG_LEVEL=0"] --> B["find_package(fmt)\nsilently accepts it\ninto a Debug build"]
    B --> C["Debug code reads the DLL's\nstd::string with the WRONG layout\n_ITERATOR_DEBUG_LEVEL=2"]
    C --> D["💥 SIGSEGV / terminate\non every string copy"]
    style A fill:#ebcb8b
    style B fill:#d08770
    style C fill:#bf616a
    style D fill:#bf616a
</pre>
]

Each step works "as designed" — the crash is the **unchecked interaction**. 🎯

---

### Why Debug-Only? Why Conda-Specific? 🧐

| Question | Answer |
|---|---|
| Why only Debug? | Only Debug sets `_ITERATOR_DEBUG_LEVEL=2`; Release↔Release is consistent |
| Why conda-specific? | Conda ships **Release-only** fmt/spdlog (no Debug variant, `fmt-targets-release.cmake`) |
| Why not CI? | `windows-latest` has **no conda** → CPM builds from source with matching ABI |
| Why not Linux/macOS? | No `_ITERATOR_DEBUG_LEVEL` divergence — no debug-iterator layout difference |

This is a **Windows + MSVC + conda** triple-whammy. 🎯

## 🛠️ Part 5: The Fix & The Sweep

---

### The Fix: One Guard in CMakeLists.txt 🔧

```cmake
# On MSVC, skip prebuilt system packages (e.g. conda): they are
# Release-only shared libraries whose std::string ABI (_ITERATOR_DEBUG_LEVEL=0)
# mismatches Debug builds (_ITERATOR_DEBUG_LEVEL=2), corrupting std::strings
# returned by fmt::format. Build fmt from source on MSVC so the ABI always
# matches (same as CI's windows-latest runner).
if(NOT MSVC)
  find_package(fmt CONFIG QUIET)
  if(fmt_FOUND)
    message(STATUS "Found system fmt: ${fmt_DIR}")
    set(CPM_fmt_ADDED YES)
  endif()
endif()

if(NOT fmt_FOUND)
  CPMAddPackage( ... fmt from source ... )
endif()
```

Same pattern for `spdlog`. **No application code changed** — the DME/router code was correct all along. ✅

## ⚖️ Part 6: Verdict & Lessons

---

### Who Is to Blame? 🧑‍⚖️

.mermaid[
<pre>
graph TD
    subgraph Chain["The crash chain"]
        C1["conda\nPrimary 🎯"] --> C2["CMake\nShould catch"] --> C3["MSVC\nEnabler"]
    end
    subgraph Innocent["Innocent"]
        C4["C++ standard"]
        C5["CPM"]
    end
    style C1 fill:#ebcb8b
    style C2 fill:#d08770
    style C3 fill:#bf616a
    style C4 fill:#a3be8c
    style C5 fill:#a3be8c
</pre>
]

- **conda** — primary: ships Release-only DLLs as universally usable, no signal.
- **CMake** — should catch: silently imports a Release-only target into a Debug build.
- **MSVC** — enabler: no link-time ODR diagnostic for debug-level mismatch.
- **C++ standard & CPM** — innocent. ⚖️

---

### Lessons Learned 📚

1. 🚫 **Never mix MSVC Debug code with Release-only prebuilt DLLs** that return STL objects by value — `_ITERATOR_DEBUG_LEVEL` layout differences corrupt everything.
2. 🧱 **Prefer source-built deps (CPM/FetchContent) on MSVC**, or system packages with a matching Debug variant.
3. 🛡️ **No cdb? Use MSVC ASan** (`/fsanitize=address`) — remember `clang_rt.asan_*` on `PATH`.
4. 📝 **Log to files, not stdout**, when ASan aborts the process — `ofstream` + `flush()` survives.
5. 🔎 **`git stash` baseline comparison** cleanly separates pre-existing failures from regressions.
6. 🧹 **One template → one bug across 20 repos.** Fix the pattern, sweep the fleet.
