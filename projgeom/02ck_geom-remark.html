# Cayley-Klein geometry 🌐

@luk036 👨‍💻 · 2026 📅

## Introduction 👋

---

### Key points 🔑

-   The gravitational/electromagnetic force between two objects is inversely proportional to the square of their distance. ⚡

-   Distances and angles may be powerful for oriented measures. But quadrance and spread are more energy saving for non-oriented measures. 📐

-   Euclidean Geometry is a degenerate case. 🔽

---

### Cayley-Klein Geometry 📐

-   Projective geometry can be further categorized by polarities. 🔄

-   Except for degenerate cases, $(\color{salmon}{A}^{\color{firebrick}{\perp}})^{\color{firebrick}{\perp}} = \color{salmon}{A}$ and $(\color{steelblue}{a}^{\color{firebrick}{\perp}})^{\color{firebrick}{\perp}} = \color{steelblue}{a}$ 🔁

-   A fundamental cone $\mathcal{F} = (\mathbf{A}, \mathbf{B})$ is defined by a pole/polar pair such that $[\color{salmon}{A}^{\color{firebrick}{\perp}}] = \mathbf{A} \cdot [\color{salmon}{A}]$ and $[\color{steelblue}{a}^{\color{firebrick}{\perp}}] = \mathbf{B} \cdot [\color{steelblue}{a}]$. 🧊

-   To visualize Cayley-Klein Geometry, we may project the objects onto the 2D plane. 🖥️

-   In hyperbolic geometry, the projection of the fundamental cone onto the 2D plane is a unit circle, the so-called _null circle_. The distance and angle measurement can be negative outside the null circle. ⭕

-   We can think of Euclidean geometry as a hyperbolic geometry in which the null circle is expanded toward infinity. ♾️

-   In this section, we use the vector notation $\color{salmon}{p} = [\color{salmon}{A}]$ and $\color{steelblue}{l} = [\color{steelblue}{a}]$. 📝

### 📚 Examples

-   Let $\color{salmon}{p} = [\color{salmon}{x}, \color{salmon}{y}, \color{salmon}{z}]$ and $\color{steelblue}{l} = [\color{steelblue}{a}, \color{steelblue}{b}, \color{steelblue}{c}]$

.pull-left[

-   Hyperbolic geometry: 🌄

  -   $\mathbf{A} \cdot \color{salmon}{p} \equiv [\color{salmon}{x}, \color{salmon}{y}, -\color{salmon}{z}]$
  -   $\mathbf{B} \cdot \color{steelblue}{l} \equiv [\color{steelblue}{a}, \color{steelblue}{b}, -\color{steelblue}{c}]$

-   Elliptic geometry: 🌍
  -   $\mathbf{A} \cdot \color{salmon}{p} \equiv [\color{salmon}{x}, \color{salmon}{y}, \color{salmon}{z}]$
  -   $\mathbf{B} \cdot \color{steelblue}{l} \equiv [\color{steelblue}{a}, \color{steelblue}{b}, \color{steelblue}{c}]$

]
.pull-right[

-   Euclidean geometry (degenerate conic): 📏

  -   $\mathbf{A} \cdot \color{salmon}{p} \equiv [0, 0, \color{salmon}{z}]$
  -   $\mathbf{B} \cdot \color{steelblue}{l} \equiv [\color{steelblue}{a}, \color{steelblue}{b}, 0]$

-   psuedo-Euclidean geometry (degenerate conic): ⏳
  -   $\mathbf{A} \cdot \color{salmon}{p} \equiv [0, 0, \color{salmon}{z}]$
  -   $\mathbf{B} \cdot \color{steelblue}{l} \equiv [\color{steelblue}{a}, -\color{steelblue}{b}, 0]$

]

---

### 📚 Examples (cont'd) 📖

-   Perspective view of Euclidean geometry (degenerate conic): 👓
  -   Let $\color{steelblue}{l}$ be the line of infinity.
  -   Let $\color{salmon}{p}$ and $\color{salmon}{q}$ are two complex conjugate points on $\color{steelblue}{l}$. Then
  -   $\mathbf{A} \equiv \color{steelblue}{l} \cdot \color{steelblue}{l}^{T}$ (outer product)
  -   $\mathbf{B} \equiv \color{salmon}{p} \cdot \color{salmon}{q}^{T} + \color{salmon}{q} \cdot \color{salmon}{p}^{T}$

---

### Orthogonality ⊥

-   A line $\color{steelblue}{l}$ is said to be perpendicular to a line $\color{steelblue}{m}$ if $\color{steelblue}{l}^{\color{firebrick}{\perp}}$ lies on $\color{steelblue}{m}$, i.e., $\color{steelblue}{m}^\mathsf{T} \mathbf{B} \color{steelblue}{l} = 0$. 📏

-   To find a perpendicular line of $\color{steelblue}{l}$ that passes through $\color{salmon}{p}$, join $\color{salmon}{p}$ to the pole of $\color{steelblue}{l}$, i.e., join($\color{salmon}{p}, \color{steelblue}{l}^{\color{firebrick}{\perp}}$). We call this the _altitude_ line of $\color{steelblue}{l}$. ⛰️

-   For duality, a point $\color{salmon}{p}$ is said to be perpendicular to point $\color{salmon}{q}$ if $\color{salmon}{q}^\mathsf{T} \mathbf{A} \color{salmon}{p} = 0$. ↔️

-   A similar definition can be given for altitude points. ⬆️

-   Note that Euclidean geometry does not have the concept of the perpendicular point because every $\color{salmon}{p}^{\color{firebrick}{\perp}}$ is the line of infinity. ♾️

---

### Orthocenter of triangle △

-   Theorem 1 (Orthocenter and ortholine). The altitude lines of a non-dual triangle meet at a unique point $\color{salmon}{O}$ called the _orthocenter_ of the triangle. ⚡

-   Despite the name "center", the orthocenter may be outside a triangle. 🏷️

-   Theorem 2. If the orthocenter of triangle $\{\color{salmon}{A}\color{salmon}{B}\color{salmon}{C}\}$ is $\color{salmon}{O}$, then the orthocenter of triangle $\{\color{salmon}{O}\color{salmon}{B}\color{salmon}{C}\}$ is $\color{salmon}{A}$. 🔄

### Involution 🔄

-   Involution is closely related to geometric reflection. 👥

-   The defining property of an involution $\color{green}{\tau}$ is that for every point $\color{salmon}{p}$, $\color{green}{\tau}(\color{green}{\tau}(\color{salmon}{p})) = \color{salmon}{p}$. 🔁

-   Theorem: Let $\color{green}{\tau}$ be an involution. Then

  1. there is a line $\color{steelblue}{m}$ for which $\color{green}{\tau}(\color{salmon}{p}) = \color{salmon}{p}$ for every poiny $\color{salmon}{p}$ incident with $\color{steelblue}{m}$.
  2. there is a point $\color{salmon}{o}$ for which $\color{green}{\tau}(\color{steelblue}{l}) = \color{steelblue}{l}$ for every line $\color{steelblue}{l}$ incident with $\color{salmon}{o}$.

-   We call the line $\color{steelblue}{m}$ the _mirror_ and the point $\color{salmon}{o}$ the _center_ of the involution. 🪞

-   If $\color{salmon}{o}$ is at the line of infinity (Euclidean Geometry), then we get an undistorted Euclidean line reflection on $\color{steelblue}{m}$. ♾️

-   If we choose $\color{salmon}{o} = \color{steelblue}{m}^{\color{firebrick}{\perp}}$, then the fundamental cone is invariant. 🧊

---

### Involution (cont'd) 🔄

-   Theorem: The point transformation matrix $T$ of the projective involution $\color{green}{\tau}$ with center $\color{salmon}{o}$ and mirror $\color{steelblue}{m}$ is given by
  $$ (\color{salmon}{o}^\mathsf{T} \color{steelblue}{m}) \mathrm{I} - 2 \color{salmon}{o} \color{steelblue}{m}^\mathsf{T}$$

-   In other words, $T\cdot \color{salmon}{p}$ = $(\color{salmon}{o}^\mathsf{T} \color{steelblue}{m}) \color{salmon}{p} - 2 (\color{steelblue}{m}^\mathsf{T} \color{salmon}{p}) \color{salmon}{o}$.

---

### 🐍 Python Code 💻

.font-sm.mb-xs[

```Python
from proj_geom import *

def is_perpendicular(l, m):
    return m.incident(dual(l))

def altitude(p, l):
    return p * dual(l)

def orthocenter(a1, a2, a3):
    t1 = altitude(a1, a2*a3)
    t2 = altitude(a2, a1*a3)
    return t1*t2

class reflect:
    def __init__(self, m, O):
        self.m = m
        self.O = O
        self.c = dot(m, O)

    def __call__(self, p):
        return pk_point(self.c, p, -2 * dot(self.m, p), self.O)
```

## Basic measurement 📏

---

### Quadrance and Spread for the general cases

-   Let $\color{green}{\Omega}(\color{green}{x}) = \color{green}{x} \cdot \color{green}{x}^{\color{firebrick}{\perp}}$.

-   $\color{green}{\Omega}(\color{salmon}{A}) = \color{salmon}{A} \cdot \color{salmon}{A}^{\color{firebrick}{\perp}} = [\color{salmon}{A}]^\mathsf{T} \mathbf{A} [\color{salmon}{A}]$.

-   $\color{green}{\Omega}(\color{steelblue}{a}) = \color{steelblue}{a} \cdot \color{steelblue}{a}^{\color{firebrick}{\perp}} = [\color{steelblue}{a}]^\mathsf{T} \mathbf{B} [\color{steelblue}{a}]$.

-   The **quadrance** $\color{green}{q}(\color{salmon}{A}, \color{salmon}{B})$ between points $\color{salmon}{A}$ and $\color{salmon}{B}$ is:
  $$\color{green}{q}(\color{salmon}{A}, \color{salmon}{B}) \equiv \color{green}{\Omega}(\color{steelblue}{AB}) / \color{green}{\Omega}(\color{salmon}{A}) \color{green}{\Omega}(\color{salmon}{B})$$

-   The **spread** $\color{green}{s}(\color{steelblue}{l}, \color{steelblue}{m})$ between lines $\color{steelblue}{l}$ and $\color{steelblue}{m}$ is
  $$\color{green}{s}(\color{steelblue}{l}, \color{steelblue}{m}) \equiv \color{green}{\Omega}(\color{steelblue}{lm}) / \color{green}{\Omega}(\color{steelblue}{l}) \color{green}{\Omega}(\color{steelblue}{m})$$

-   Note: they are invariant to any projective transformations. 🔄

---

### 🐍 Python Code 💻

.font-sm.mb-xs[

```python
import numpy as np
from fractions import *

def omega(l):
    return dot(l, dual(l))

def measure(a1, a2):
    omg = omega(a1*a2)
    if isinstance(omg, int):
        return Fraction(omg, omega(a1) * omega(a2))
    else:
        return omg / (omega(a1) * omega(a2))

def quadrance(a1, a2):
    return measure(a1, a2)

def spread(l1, l2):
    return measure(l1, l2)
```

### versus raditional Distance and Angle 📏📐

-   Hyperbolic: 🌄
  -   $\color{green}{q}(\color{salmon}{A}, \color{salmon}{B}) = \sinh^2(d(\color{salmon}{A}, \color{salmon}{B}))$
  -   $\color{green}{s}(\color{steelblue}{l}, \color{steelblue}{m}) = \sin^2(\theta(\color{steelblue}{l}, \color{steelblue}{m}))$

-   Elliptic: 🌍
  -   $\color{green}{q}(\color{salmon}{A}, \color{salmon}{B}) = \sin^2(d(\color{salmon}{A}, \color{salmon}{B}))$
  -   $\color{green}{s}(\color{steelblue}{l}, \color{steelblue}{m}) = \sin^2(\theta(\color{steelblue}{l}, \color{steelblue}{m}))$

-   Euclidean: 📏
  -   $\color{green}{q}(\color{salmon}{A}, \color{salmon}{B}) = d^2(\color{salmon}{A}, \color{salmon}{B})$
  -   $\color{green}{s}(\color{steelblue}{l}, \color{steelblue}{m}) = \sin^2(\theta(\color{steelblue}{l}, \color{steelblue}{m}))$

### Measure the dispersion among points on the unit sphere 🌐

.font-sm.mb-xs[
.pull-left[

The usual way:

```python
nsimplex, n = K.shape
maxd = 0
mind = 1000
for k in range(nsimplex):
  p = X[K[k,:],:]
  for i in range(n-1):
    for j in range(i+1, n):
      dot = dot(p[i,:], p[j,:])
      q = 1.0 - dot*dot
      d = arcsin(sqrt(q))
      if maxd < d:
        maxd = d
      if mind > d:
        mind = d
*dis = maxd - mind
```

]
.pull-right[

A better way:

```python
nsimplex, n = K.shape
maxd = 0
mind = 1000
for k in range(nsimplex):
  p = X[K[k,:],:]
  for i in range(n-1):
    for j in range(i+1, n):
      dot = dot(p[i,:], p[j,:])

      q = 1.0 - dot*dot
      if maxq < q:
        maxq = q
      if minq > q:
        minq = q
*dis = arcsin(sqrt(maxq)) \

### Spread law and Thales Theorem 📐

-   Spread Law
  $$\color{Green}{q_1/s_1 = q_2/s_2 = q_3/s_3}.$$

-   (Compare with the sine law in Euclidean Geometry):
  $$\color{red}{d_1/\sin \theta_1 = d_2/\sin \theta_2 = d_3/\sin \theta_3}.$$

-   Theorem (Thales): Suppose that $\{\color{salmon}{a_1} \color{salmon}{a_2} \color{salmon}{a_3}\}$ is a right triangle with $\color{green}{s_3} = 1$. Then
  $$\color{green}{s_1} = \color{green}{q_1} / \color{green}{q_3} \quad \text{and} \quad \color{green}{s_2} = \color{green}{q_2} / \color{green}{q_3}$$

-   Note: in some geometries, two lines being perpendicular does not imply they have a right angle ($\color{green}{s} = 1$). ⚠️

---

### Triangle proportions △

-   Theorem (Triangle proportions): Suppose $\color{salmon}{d}$ is a point lying on the line $\color{steelblue}{a_1 a_2}$. Define the quadrances $\color{green}{r_1} \equiv \color{green}{q}(\color{salmon}{a_1}, \color{salmon}{d})$ and $\color{green}{r_1} \equiv \color{green}{q}(\color{salmon}{a_2}, \color{salmon}{d})$, and the spreads $\color{green}{R_1} \equiv \color{green}{s}(\color{steelblue}{a_3 a_1}, \color{steelblue}{a_3 d})$ and $\color{green}{R_2} \equiv \color{green}{s}(\color{steelblue}{a_3 a_2}, \color{steelblue}{a_3 d})$. Then
  $$\color{green}{R_1}/\color{green}{R_2} = (\color{green}{s_1}/\color{green}{s_2})(\color{green}{r_1}/\color{green}{r_2}) = (\color{green}{q_1}/\color{green}{q_2})(\color{green}{r_1}/\color{green}{r_2}).$$

### Midpoint and Angle Bisector ✂️

-   There are two angle bisectors for two lines. 📐
-   In general geometries, There are also two midpoints for two points. ⚖️
-   Let $\color{salmon}{r}$ be the midpoint of $\color{salmon}{p}$ and $\color{salmon}{q}$.
-   Then $\color{salmon}{r}$ = $\sqrt{\color{green}{\Phi}(\color{salmon}{p})} \color{salmon}{q} \pm \sqrt{\color{green}{\Phi}(\color{salmon}{q})} \color{salmon}{p}$.
-   Let $\color{steelblue}{b}$ be the angle bisector of $\color{steelblue}{l}$ and $\color{steelblue}{m}$.
-   Then $\color{steelblue}{b}$ = $\sqrt{\color{green}{\Phi}(\color{steelblue}{m})} \color{steelblue}{l} \pm \sqrt{\color{green}{\Phi}(\color{steelblue}{l})} \color{steelblue}{m}$.
-   Note:
  -   The midpoint could be irrational in general. ➗
  -   The midpoint could even be complex, even both points are real. ℂ
  -   The bisectors of two lines are perpendicular. ⊥
  -   In Euclidean geometry, the other midpoint is on the line of infinity. ♾️

---

### Midpoint in Euclidean geometry 📏

-   Let $\color{steelblue}{l}$ be the line of infinity.
-   $\mathbf{A} \equiv \color{steelblue}{l} \cdot \color{steelblue}{l}^{T}$
-   $\color{green}{\Phi}(\color{salmon}{p})$ = $\color{salmon}{p}^\mathsf{T} \mathbf{A} \color{salmon}{p}$ = $(\color{salmon}{p}^\mathsf{T} \color{steelblue}{l})^2$.
-   Then, the midpoint $\color{salmon}{r}$ = $(\color{salmon}{q}^\mathsf{T} \color{steelblue}{l}) \color{salmon}{p} \pm (\color{salmon}{p}^\mathsf{T} \color{steelblue}{l}) \color{salmon}{q}$.
-   One midpoint $(\color{salmon}{q}^\mathsf{T} \color{steelblue}{l}) \color{salmon}{p} - (\color{salmon}{p}^\mathsf{T} \color{steelblue}{l}) \color{salmon}{q}$ in fact lies on $\color{steelblue}{l}$.

---

### Constructing angle bisectors using a conic 🛠️

1. For each line, construct the two tangents $({\color{steelblue}t_f^1}, {\color{steelblue}t_f^2})$ and $({\color{steelblue}t_g^1}, {\color{steelblue}t_g^2})$ of its intersection points with the fundamental conic to that conic.
2. The following lines are the two angle bisectors:
   -   join(meet($\color{steelblue}{t_f^1}, \color{steelblue}{t_g^1}$), meet($\color{steelblue}{t_f^2}, \color{steelblue}{t_g^2}$))
   -   join(meet($\color{steelblue}{t_f^1}, \color{steelblue}{t_g^2}$), meet($\color{steelblue}{t_f^2}, \color{steelblue}{t_g^1}$))

> Remark: the tangents in elliptic geometry have complex coordinates. However, the angle bisectors are real objects again. 🔄

### Angle Bisector Theorem 📚

-   Let $\color{steelblue}{a}$, $\color{steelblue}{b}$, $\color{steelblue}{c}$ be three lines, none of which is tangent to the fundamental cone.

-   Then one set of angle bisector $\color{steelblue}{m^1_{ab}}, \color{steelblue}{m^1_{bc}}, \color{steelblue}{m^1_{ac}}$ are concurrent. ⚡

-   Furthermore, the points meet($\color{steelblue}{m^2_{ab}}, \color{steelblue}{c}$_), meet($\color{steelblue}{m^2_{bc}}, \color{steelblue}{a}$_), meet($\color{steelblue}{m^2*{ac}}, \color{steelblue}{b}$*) are collinear. 📏

---

### An instance of complete angle bisector theorem 📐

![An instance of complete angle bisector theorem](figs/bisectortheorem.svg){#fig:bisectortheorem}

---

### Midpoint theorem ⚖️

-   Let $\color{salmon}{p}$, $\color{salmon}{q}$, $\color{salmon}{r}$ be three points, none of which lies on the fundamental cone.

-   Then one set of midpoints $\color{salmon}{m^1_{pq}}$_, $\color{salmon}{m^1_{qr}}$_, $\color{salmon}{m^1_{pr}}$\_ are collinear. 📏

-   Furthermore, the lines join($\color{salmon}{m^2_{pq}}, \color{salmon}{r}$_), join($\color{salmon}{m^2_{qr}}, \color{salmon}{p}$_), join($\color{salmon}{m^2*{pr}}, \color{salmon}{q}$*) meet at a point. ⚡
