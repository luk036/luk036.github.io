# 🎩 The Illusion

---

### 🎯 The Goal

We want a **printable sheet** 📄 that lies perfectly flat…

…but when you **fold it 90°** and look from *one* spot 👁️, it snaps into a **solid 3-D object** 🪑.

- ✏️ Built by *projective geometry*, not by hand
- 📏 **Exact rational arithmetic** — no floating point
- 🖨️ **A4**, sized in millimetres, printable at 100 %

> 🤯 Straight-on it looks *wrong* — at the right angle it looks *real*.

---

### 🧩 The Trick, in One Idea

> Paint every point of the object **onto the sheet** so that, from the viewer, it lies on the *same line of sight* as the real point. 👁️ ➡️ 📍

The sheet is **not one plane** — it is a right-angled **corner**:

- a **wall** 🧱 and a **floor** 🟦
- meeting at the **crease** 📏

**Fold the sheet ⇒ get the corner.** That is the whole magic. 🪄

---

---

### 🔦 One Ray, Two Shelves

Along the ray, the two plane crossings are

$$\color{teal}{t_{\text{floor}}} = \frac{V_z}{V_z - P_z}
\qquad\qquad
\color{firebrick}{t_{\text{wall}}} = \frac{V_y}{V_y - P_y}$$

The **nearer** plane is the one the eye actually sees there — so *that* is where we record the colour. ✅

Fold it back, stand at $V$: the recorded point and $\color{salmon}{P}$ are **collinear** — same sight-line. 👁️ ✨

---

### ✅ Which Plane First? — the σ test

Floor is nearer $\iff \color{teal}{t_{\text{floor}}} < \color{firebrick}{t_{\text{wall}}}$, which collapses to a *linear* test in the point $\color{salmon}{P}$:

$$\color{purple}{\sigma(P)} \;=\; \color{steelblue}{V_z}\,\color{salmon}{P_y} \;-\; \color{steelblue}{V_y}\,\color{salmon}{P_z}$$

- $\color{teal}{\sigma > 0}$ ➡️ record on the **floor** 🟦
- $\color{firebrick}{\sigma < 0}$ ➡️ record on the **wall** 🧱

Because $\sigma$ is **linear** 🔹, a convex face lies wholly on one plane *iff its vertices agree* — and any crossing is a **single line**, easy to clip. ✂️

---

### 🗺️ Unfolding the Sheets

Rotate the wall flat into the floor about the crease:

$$\text{wall } (x,\,0,\,z) \;\mapsto\; (x,\; \color{firebrick}{z})
\qquad\qquad
\text{floor } (x,\,y,\,0) \;\mapsto\; (x,\; \color{teal}{-y})$$

So $v = 0$ is the **crease**: 🧱 wall flap *above*, 🟦 floor flap *below*.

That is exactly the layout of the reference crafts — backrest up, seat down. 🪑

### 🎨 Painting Order

Occlusion is the only hard part 🧱.

- Sort faces by **squared** distance from $V$ — uses $\lVert V - c \rVert^2$, **no square roots** 🚫√
- Paint **far ➡️ near**
- Then draw the **edges** on top ✏️
- The crease is marked with a red dashed line 📏

---

### 🧮 Exact Arithmetic

Every coordinate is a `fractions.Fraction` 🧩; the projective maps come from `projgeom.projective_transform`.

```python
from fractions import Fraction as F
from projgeom import PgPoint, projective_transform

def sigma(p):                       # wall/floor classifier
    return VZ * p[1] - VY * p[2]    # <0 wall, >0 floor

def project(p):
    if sigma(p) <= 0:                # wall flap (y = 0)
        t = VY / (VY - p[1])
        return VX + t*(p[0]-VX), VZ + t*(p[2]-VZ)
    t = VZ / (VZ - p[2])            # floor flap (z = 0)
    return VX + t*(p[0]-VX), -(VY + t*(p[1]-VY))
```

> 📏 Millimetre SVG, exact rounding, **zero** floating point in the geometry.

---

### 🪞 Why It Looks Wrong Flat

Flat, the sheet looks skewed 🌀 — *that is the point*.

The distortion baked into the sheet **cancels** both the foreshortening of the fold **and** the viewing angle. 📐➕🪄

> Fold it, stand at $V$ 👁️ … and it snaps into place. 🔮

### ⚖️ The Crease Insight

The chair looks cleanest when the backrest plane sits exactly on $\sigma = 0$:

$$Y_0 \;=\; \frac{Z_s\,V_y}{V_z} \qquad\Longleftrightarrow\qquad t_{\text{wall}} = t_{\text{floor}}$$

- 🡄 move it **closer** ➡️ the crease crosses the *flat seat*
- 🡆 move it **away** ➡️ the green backrest **skews** 📐
- ⚠️ a clean backrest and “farther from the wall” are *mutually exclusive*

### 🔢 How Wide an Integer?

<p align="center">
<svg width="660" height="205" viewBox="0 0 660 205" xmlns="http://www.w3.org/2000/svg" style="background:#fafafa;border:1px solid #d0d0d0;border-radius:6px">

    <text x="64" y="148" text-anchor="end" fill="#bf616a" font-weight="bold">product ~1e15</text>
    <rect x="70" y="139" width="383" height="13" fill="#bf616a" rx="2"/>

$$|\text{num}|_{\max} \approx 6.1\times10^{7}, \qquad
\text{int32}_{\max} = 2.1\times10^{9}, \qquad
\text{int64}_{\max} = 9.2\times10^{18}$$

- ✅ **Storing** the largest coordinate fits in `int32` … but only $\sim 35\times$ under the limit
- ❌ **Computing** it multiplies $10^{7}$-scale values ➡️ products $\sim 10^{15}$ — `int32` overflows by $\sim 10^{5}$
- 🏆 **Verdict:** use $\color{darkgreen}{\text{int64}}$ — the sibling library's own choice: `fun::Frac = Fraction<std::int64_t>`

The sibling repo **`projgeom-cpp`** already ships both ingredients 🧩

```cpp
#include <projgeom/transform.hpp>
using fun::Frac;                        // Fraction<std::int64_t>

auto sigma(const Scene& s, const V3& p) -> Frac {
    return s.vz * p.y - s.vy * p.z;     // <0 wall flap, >0 floor flap
}
```

- 📁 added **`examples/fold_trick.cpp`** — one file, three objects 🪑 🍽️ 🏠
- 🔁 identical pipeline: $\color{purple}{\sigma}$ ➡️ ✂️ clip ➡️ `fun::projective_transform` ➡️ 🎨 painter ➡️ 📄 SVG

### 🐛 Gotchas Found

- 🔀 `std::sort` is **unstable** ➡️ use `std::stable_sort` to match Python's stable sort, or equal-depth faces reorder and fills repaint
- 🐞 latent bug in `fractions.hpp`: `operator/=(const Z&)` does `std::swap(_den, rhs)` on a **const** reference ➡️ `frac / int` won't compile; divide by `Frac` instead
- 🧹 removed a duplicated gable edge from `house_flat.py` (the one thing that made the house differ)

---

### 🔬 Verification

Self-check folds every sheet point back to 3-D and tests collinearity with $V$:

$$\color{steelblue}{V},\;\; \color{salmon}{P},\;\; \color{darkgreen}{Q}\quad\text{collinear ?}$$

…in two coordinate projections, using `projgeom` incidence (`dot = 0`). ✅

- 🪑 chair · 🍽️ table · 🏠 house — all **verified**
- 🧪 `flake8` clean · valid XML · **no** geometry floats

---

### 🧗 Lessons & Pitfalls

.pull-left[

- 🌀 Anamorphosis ≠ ordinary perspective
- ✂️ The crease **cuts** faces — clip, don't sample
- 📏 Exact rationals keep it crisp
- 🔢 Points at infinity ⇒ use homogeneous coords

]
.pull-right[

- 🧱 Occlusion is the hard part
- ⚖️ Alignment ⟺ the crease plane
- 👁️ **One** viewpoint only
- 🖨️ Print at 100 %, fold exactly 90°

]

---

### 🏁 Takeaways

> A flat drawing can *be* a 3-D object 🪄 — you just have to know **where to stand**. 👁️

- 📐 Two planes + a viewpoint $V$ = the whole method
- $\color{purple}{\sigma}$ is the switch: 🟦 floor or 🧱 wall
- 🧩 Exact arithmetic makes it reproducible
- 🖨️ Fold, look, enjoy 🔮
