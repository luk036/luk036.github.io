## 🧭 Part 1 — Two Libraries, One Repo

---

### 🗂️ One Repo, Three Headers

`fractions-cpp` ships **three** independent rational-number headers:

| Header | Type | Design goal |
|:-------|:-----|:------------|
| `fractions.hpp` | `Fraction&lt;T&gt;` | Lean C++-native |
| `extfractions.hpp` | `ExtFraction&lt;T&gt;` | Same, extended API |
| `pyfractions.hpp` | `Fraction&lt;T&gt;` | Python `fractions.Fraction` clone 🐍 |

> Today's match: the **C++-native** `ExtFraction` vs the **Python-compatible** `Fraction`. ⚔️

### 🔍 Where They Diverge

| Aspect | `ExtFraction` ⚡ | `Fraction` (py) 🐍 |
|:-------|:----------------|:------------------|
| Zero denominator | valid state (±∞, NaN) | `throw std::runtime_error` |
| Overflow | unchecked integer math | guard + `double` fallback |
| Compound ops | in-place | `*this = *this + other` |
| Constructor | `constexpr` | throws, non-`constexpr` |
| Equality | 2-field compare | 2-field compare |

> Python semantics cost speed — but **how much**, and **where**? 📏

## ⚔️ Part 2 — The Head-to-Head

---

### 🔬 How We Measure

- **Compiler**: g++ 15.2.0 `-O3 -DNDEBUG` ⚙️
- **Harness**: [nanobench](https://github.com/martinus/nanobench) 📊
- **`volatile` inputs** to defeat constant folding 🛡️
- **Median ns/op**, error ≤ 2.2%
- Both types are **two `int64_t`** fields — apples to apples 🍎

```cpp
template &lt;typename F&gt;
static void bench_type(Bench& b, const std::string& tag, T a, T d, T c, T e) {
    volatile T va = a, vd = d, vc = c, ve = e;
    F x(va, vd), y(vc, ve);
    b.run(tag + " add", [&]{ auto r = x + y; doNotOptimizeAway(r); });
    b.run(tag + " mul", [&]{ auto r = x * y; doNotOptimizeAway(r); });
}
```

## 🔬 Part 3 — Profiling the Guards

---

### 🛡️ The Overflow Guard

Every `py` arithmetic op checks products with an **integer division**:

$$ \text{overflow?} \quad\Longleftrightarrow\quad
   {\color{red}|a|} \;>\; \frac{{\color{#1565c0}\text{MAX}}}{{\color{red}|b|}} $$

```cpp
if (std::abs(na) &gt; std::numeric_limits&lt;T&gt;::max() / std::abs(db)
    || std::abs(da) &gt; std::numeric_limits&lt;T&gt;::max() / std::abs(nb)) {
    // use floating point as fallback
}
```

> Two `idivq` per check, up to **four** per `operator+`. 💸

---

### 🔥 Do the Guards Ever Fire?

Instrumented the fallback branch and ran a randomized workload:

| Workload | Iterations | Guard fires |
|:---------|-----------:|------------:|
| small `±1000` | 1 000 000 | **0** |
| large `1e9` | 1 000 000 | **0** |
| **total** | **2 000 000** | **0** ✅ |

> For in-range values the guards are **pure overhead**. 🎯

### 🔎 The Root Cause: `idivq`

```asm
; division-based check   → ~20-40 cycles
divcheck:
    movabsq 0x7fffffffffffffff, %rax
    cqto
    idivq   %rcx          ; ← integer divide
    cmpq    %rax, %r8
    setg    %al

; multiply-overflow check → ~2 cycles
mulcheck:
    imulq   %rdx, %rcx
    seto    %al           ; ← overflow flag
```

> Same semantics, an order of magnitude cheaper. 🏎️

---

### 🐛 A Latent Crash

The guard `MAX / std::abs(nb)` divides by **zero** when an operand's numerator is `0`:

```cpp
Fraction&lt;long long&gt; x(1, 2), z(0, 1);
auto r = x + z;          // ← MAX / 0  💥
```

| | before |
|:--|:--|
| `x + 0` | `STATUS_INTEGER_DIVIDE_BY_ZERO` (`0xC0000094`) |

> The `||` short-circuit does not save it — the first clause is `false`. 😱

## 🔧 Part 4 — The Fix

---

### 🔧 The Fix: `_mul_overflows`

Replace the division test with a **multiply-overflow intrinsic**:

```cpp
static bool _mul_overflows(T a, T b) {
#if defined(__GNUC__) || defined(__clang__)
    T result;
    return __builtin_mul_overflow(a, b, &amp;result);
#else
    if (a == 0 || b == 0) return false;      // ← fixes the crash
    T abs_a = a &lt; 0 ? -a : a, abs_b = b &lt; 0 ? -b : b;
    return abs_a &gt; std::numeric_limits&lt;T&gt;::max() / abs_b;
#endif
}
```

- Same overflow **decision** → same `double` fallback ✅
- `a == 0` short-circuits → no division by zero ✅
- **14 guard sites** replaced across `+ − × ÷ < % floor_div`

## ⚡ Part 5 — Optimizing extfractions

---

### 🔢 Rational Arithmetic Is gcd-bound

Every normalization is a `gcd`. The C++-native ops called it **one time too many**:

$$ \text{normalize}\!\left(\frac{a}{b}\right)
   = \frac{{\color{red}a}\,/\,{\color{#1565c0}g}}{{\color{red}b}\,/\,{\color{#1565c0}g}},
   \qquad {\color{#1565c0}g} = \gcd({\color{red}a}, {\color{red}b}) $$

.mermaid[

<pre>
graph LR
    ADD["operator+"]
    ADD --> A1["gcd(b, d)"]
    A1 --> A2["ctor normalize\ngcd(n, d)"]
    A2 --> A3["redundant\nnormalize"]
    style ADD fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style A1 fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style A2 fill:#c8e6c9,stroke:#2e7d32,stroke-width:3px
    style A3 fill:#f8bbd0,stroke:#c2185b,stroke-width:3px
</pre>

]

> The constructor already normalized — the extra call was pure waste. 🗑️

---

### ⚡ Three Surgical Fixes

| # | Fix | gcd count |
|:--|:----|:----------|
| 1 | drop redundant `normalize()` after the ctor | 3 → **2** |
| 2 | `+=` / `-=`: 2-gcd + `common == 1` fast path | 4 → **2** |
| 3 | `*=` / `/=` final `normalize` → `keep_denom_positive` | 3 → **2** |

```cpp
let common = gcd(self.denom, other.denom);
if common == One::one() {          // coprime: no divisions, no final gcd
    self.numer = self.numer * other.denom + self.denom * other.numer;
    self.denom *= other.denom;
    self.keep_denom_positive();
    return;
}
```

### 🧠 Key Takeaways

**Measurement** 📏
- `ext` is **1.2–3.4× faster** than `py` on almost every op
- Guards fired **0 / 2 000 000** times — pure overhead
- `idivq` → `imulq` + `seto` recovers **~20%** on small values
- Never trust a single run — use **same-process A/B** 🎯

**Correctness** ✅
- The guard hid a **division-by-zero crash** 🐛
- `_mul_overflows` fixes both the crash and the cost
- 137 / 137 tests, 0 differential mismatches
