### ⚖️ Same Name ≠ Same Contract

| Property | Fraction 🧰 | PyFraction 🐍 |
|:--|:--|:--|
| Header | `fractions.hpp` | `pyfractions.hpp` |
| `n/0` | ∞ | ❌ throws |
| `0/0` | NaN | ❌ throws |
| Default `T` | `int64_t` | `int64_t` |
| Extras | `from_raw`, `zero`, `one`, `inv` | `floor`, `ceil`, `round`, `pow` |
| Overflow | integer range | falls back to `double` |

> 🎯 Choose by **semantics** first, speed second.

### 📐 Why Exact Fractions?

Geometric predicates return a **sign**, not a magnitude:

$$ \operatorname{orient}(p,q,r) \;=\; \begin{vmatrix}
{\color{#1565c0}p_x} & {\color{#1565c0}p_y} & 1\\[2pt]
{\color{#2e7d32}q_x} & {\color{#2e7d32}q_y} & 1\\[2pt]
{\color{#bf616a}r_x} & {\color{#bf616a}r_y} & 1
\end{vmatrix} $$

- One wrong sign flips topology. 💥
- Rational coordinates are common in projective constructions. 📐
- Exact arithmetic gives the sign with **zero tolerance**. ✅

> In projgeom, correctness is binary — and fractions keep it binary. 🧷

### 🧮 The gcd Tax

$$ \gcd({\color{#1565c0}m},{\color{#2e7d32}n}) \;=\; \gcd({\color{#2e7d32}n},\, {\color{#1565c0}m} \bmod {\color{#2e7d32}n}), \qquad \gcd(m,0)=|m| $$

Every normalization, reduction and comparison eventually spends time in integer modulo.

.mermaid[

<pre>

    OP["a/b op c/d"] --> N["normalize()"]
    N --> POS["keep_denom_positive()"]

    style OP fill:#e3f2fd,stroke:#1565c0,stroke-width:3px

Construction alone is **≈ 36 ns** (g++) · **≈ 21.6 ns** (clang-cl) · **≈ 28.8 ns** (MSVC) — almost all of it gcd. 🧱

## 💥 Part 3 — Killing Template Recursion

---

### 🧨 The Problem: Template Recursion Can't Unroll

`fractions.hpp` used a **function template** for gcd:

```cpp
template <typename Mn>
CONSTEXPR14 auto gcd_recur(const Mn& m, const Mn& n) -> Mn {
    if (n == 0) return abs(m);
    return gcd_recur(n, m % n);   // recursive call on Mn
}
```

- The recursive call is **dependently typed** — the optimizer sees a call, not a self-loop. 🚫
- `pyfractions.hpp` had the same shape **inside the class template**. 🐍
- Result: the inner `%` chain never gets inlined / partially unrolled. 😴

$$ \gcd(m,n)=\gcd(n,\,m\bmod n) \quad\text{should compile to}\quad
{\color{#2e7d32}\text{idiv} \to \text{test} \to \text{idiv} \to \cdots} $$

---

### 🔨 Fix #1 — Concrete Overloads in `fractions.hpp`

Replace the template with **non-template overloads**, one per integer type:

```cpp
CONSTEXPR14 auto gcd_recur(long long _m, long long _n) -> long long {
    if (_n == 0) return abs(_m);
    return gcd_recur(_n, _m % _n);   // concrete self-call: unrollable
}

CONSTEXPR14 auto gcd(long long _m, long long _n) -> long long {
    if (_m == 0) return abs(_n);
    return gcd_recur(_m, _n);
}
```

Overload set: `unsigned long`, `long`, `unsigned int`, `int`, **`unsigned long long`**, **`long long`** 🧩

- `long long` / `unsigned long long` added so `int64_t` works on Windows/LP64. 🪟
- `template <typename T = int64_t> struct Fraction` — default now `int64_t`. ✅

---

### 🐍 Fix #2 — Move PyFred's gcd Out of the Class Template

The gcd became **free, non-template functions** in `fractions::detail`:

```cpp
namespace fractions {
    namespace detail {
        CONSTEXPR14 auto gcd_recur(long long _m, long long _n) -> long long {
            if (_n == 0) return abs(_m);
            return gcd_recur(_n, _m % _n);   // plain overload, not a template
        }
        CONSTEXPR14 auto gcd(long long _m, long long _n) -> long long {
            if (_m == 0) return abs(_n);
            return gcd_recur(_m, _n);
        }
```

- The class body now calls `detail::gcd(_numerator, _denominator)`. 📞
- No `T` in any gcd signature — nothing left to prevent unrolling. 🎯
- Kept in `detail` so it never collides with `fractions::gcd`. 🧷

## ⚡ Part 4 — Six Optimizations

---

### 1️⃣ `operator+`: Skip the Constructor gcd

```cpp
auto denom = da * right;
auto numer = right * na + left * nb;
if (common == 1) {
    return Fraction::from_raw(numer, denom);   // already reduced
}
const auto g = gcd(numer, common);              // only factors of common
return Fraction::from_raw(numer / g, denom / g);
```

$$ \frac{{\color{#1565c0}a}}{{\color{#2e7d32}b}}+\frac{{\color{#b48ead}c}}{{\color{#d08770}d}}
   =\frac{{\color{#1565c0}a}{\color{#d08770}d}+{\color{#2e7d32}b}{\color{#b48ead}c}}
          {{\color{#2e7d32}b}{\color{#d08770}d}} $$

If $\gcd(b,d)=1$, the sum is **already in lowest terms**. ✅

> 🧾 The old `operator+` ran a **second** gcd in the constructor.

---

### 2️⃣ Integer ± : Zero gcds

Because $a/b$ is canonical:

$$ \gcd({\color{#1565c0}a} \pm {\color{#bf616a}n}\,{\color{#2e7d32}b},\; {\color{#2e7d32}b})
   \;=\; \gcd({\color{#1565c0}a},{\color{#2e7d32}b}) \;=\; 1 $$

```cpp
// before: swap + reduce + swap + reduce
// after:
this->_numer += rhs * this->_denom;   // no gcd at all
```

- Overflow behaviour unchanged: the old code already formed $n \cdot b$. 🧮
- PyFraction still routes `+ int` through a full fraction add → the big outlier. 🐍

---

### 3️⃣ Scalar Multiply: One gcd, Not Two

```cpp
std::swap(this->_numer, rhs);
this->reduce();                 // gcd(rhs, denom)
this->_numer *= rhs;
this->keep_denom_positive();    // was normalize(): another gcd
```

After cross-reduction, the second gcd is **always 1**. ✅

The same idea lets PyFraction build results with its private **skip-normalize** constructor:

```cpp
Fraction(T numerator, T denominator, bool skip_normalize);
```

> 📦 `from_raw` (Simple) and `skip_normalize` (Py) are the same trick, two spellings.

---

### 4️⃣ Comparison: Two Multiplies, Zero gcds

$$ \frac{\color{#1565c0}a}{\color{#2e7d32}b} \;<\; \frac{\color{#b48ead}c}{\color{#d08770}d}
   \iff {\color{#1565c0}a}{\color{#d08770}d} \;<\; {\color{#b48ead}c}{\color{#2e7d32}b},
   \qquad {\color{#2e7d32}b},{\color{#d08770}d}>0 $$

### 5️⃣ MSVC: Replace Division-Based Overflow Checks

`_mul_overflows` used `max / |b|` — one integer division **per check**, twice per multiply.

```cpp
const unsigned long long lo = _umul128(_abs_u64(a), _abs_u64(b), &hi);
const unsigned long long limit = negative ? positive_max + 1 : positive_max;
return hi != 0 || lo > limit;
```

- `_umul128` is exact and branch-light on MSVC x64. ⚙️
- Keeps the existing `double` fallback for genuine overflow. 🛟

---

### 6️⃣ Portability: `__int128` Under `-Wpedantic -Werror`

```cpp
#if defined(__SIZEOF_INT128__)
    __extension__ typedef __int128 wide;   // GCC/Clang extension, silenced
    return static_cast<wide>(an) * bd < static_cast<wide>(bn) * ad;
#elif defined(_MSC_VER) && defined(_M_X64)
    // _umul128 sign-magnitude comparison
#else
    // legacy reduce-based path
#endif
```

- `using wide = __int128;` **fails** `-Wpedantic -Werror`. ❌
- `__extension__ typedef` is clean. ✅
- `<intrin.h>` only when `_MSC_VER && _M_X64`. 🪟

## 🎓 Part 6 — Size, Verification, Lessons

---

### 📏 Size: Lines of Code

| Header | total | code | comment | blank | size |
|--------|------:|-----:|--------:|------:|-----:|
| `fractions.hpp` 🧰 | 1545 | 497 | **937** | 111 | 54 KB |
| `extfractions.hpp` 🪶 | 1225 | 397 | 748 | 80 | 45 KB |
| `pyfractions.hpp` 🐍 | 1127 | **647** | 334 | 146 | 41 KB |

- 🐍 **PyFraction is the shortest file but the densest code** — 1.3× more executable lines than Fraction.
- 🧰 **Fraction is the longest file** — Doxygen math diagrams (Graphviz + LaTeX) dominate; 497 lines are code.
- 🔒 No public API removed; `Fraction<T = int64_t>` is additive.

> 📐 Fewer total lines ≠ less code. Compare *code* lines, not file length. 🧠

---

### 🧪 Verification Pipeline

.mermaid[

<pre>
graph TD
    T["xmake test\n137 cases · 958 assertions"] --> OK["✅"]
    A["g++ -O3 assembly\n0 calls to gcd"] --> OK
    D["bench: 3 passes\nmedian ns/op"] --> OK
    G["GCC 15.2\n-Wpedantic -Wconversion -Werror"] --> OK
    F["clang-format 22\n--dry-run --Werror"] --> OK
    style OK fill:#c8e6c9,stroke:#2e7d32,stroke-width:4px
    style T fill:#e3f2fd,stroke:#1565c0,stroke-width:3px
    style A fill:#d1c4e9,stroke:#6a1b9a,stroke-width:3px
    style D fill:#fff9c4,stroke:#f57f17,stroke-width:3px
</pre>

]

- Special cases: `0/0`, `±1/0`, negative denominators, both-negative comparisons. 🧷
- Tests untouched; public API unchanged. 🔒
- Benchmarks in one process — no cross-binary noise. 📏

---

### 🎓 Lessons

1. 🧮 **gcd is the denominator of every cost.**
2. 💥 **A recursive function template is not unrollable — overloads are.**
3. 🐍 **Moving gcd out of the class template is what made Py construction a tie.**
4. 📏 **Match optimization flags** — `-O3` vs `/O2`; clang-cl's `/O2` is cc1 `-O3`.
5. 🧪 **Fast paths must preserve NaN/∞/throw semantics.**
6. 🧷 **Don't "fix" a bug a test asserts without permission.**
7. 🧩 **Public API stability is a feature.**

$$ \text{speedup} \;=\; \frac{\text{Fraction}}{\text{PyFraction}},
   \qquad {\color{#2e7d32}\text{add large (MSVC)}}:\;
   \frac{35.92}{21.63} \approx {\color{#2e7d32}1.66\times} $$

> The best optimization is the work you can prove is redundant. ✅
