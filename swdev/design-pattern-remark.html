### 🤖 Why Design Patterns Matter More in the Age of AI

.pull-left[

**AI writes code — but who steers the architecture?** 🧭

- 🧠 **LLMs can generate**, but they need *target shapes* — patterns give the vocabulary ("Strategy", "Builder", "Visitor")
- 📐 **Code review at scale** — patterns provide a *shared vocabulary* to spot bugs ("this violates Strategy — the dispatch is wrong")
- 🔍 **Pattern-aware prompts** — "refactor this as a Strategy" produces far better code than "clean this up"
- 📄 **Documentation survives** — `@see Strategy/Oracle pattern` is more durable than prose comments

]

.pull-right[

**AI amplifies engineering discipline** 🚀

- 📏 **Patterns = guardrails** — AI-generated code respects structure when scaffolding is explicit
- 🔄 **Refactoring leverage** — knowing *what* pattern to apply redirects AI from "more code" to "right code"
- 🧩 **Composition over generation** — compose from known patterns rather than generate from scratch
- 💡 **Human judgment stays in the loop** — pattern selection is a *design decision* AI can't reliably make alone

**The paradox:** AI makes code *easier to write* but *harder to reason about* — patterns restore the reasoning 🧩

]

## 🧩 Part 2: Strategy & Policy

---

### 🎯 The Oracle Pattern

**The house style** of the optimization libraries:

- A **separation oracle** asserts a point is feasible… or returns a **cut** ✂️
- The algorithm (ellipsoid method) is **generic over the oracle**
- Swap oracles without touching the solver 🧩

**Convex feasibility problem:**

$$ \mathop{\text{find}} x \quad \text{s.t.} \quad f(x) \le 0 $$

**Convexity** guarantees a separating hyperplane exists:

$$ f(z) \ge f(x) + g(x)'(z - x) \qquad \forall\, x, z \in \text{dom}\, f $$

---

### ✂️ The Cutting-Plane Math

The affine function $g'(x - x_c) + \beta$ is called a **cut**:

$$ g'(x - x_c) + \beta \le 0 $$

.mermaid[
<pre>
graph LR
    XC["Current center x_c"] --> OR["Oracle\nassess_feas(xc)"]
    OR -->|"no cut"| F["Feasible ✓"]
    OR -->|"has cut"| CU["Cut\ng'(x-xc)+β ≤ 0"]
    CU --> UP["Update ellipsoid"]
    UP --> CH{"tsq < tol?"}
    CH -->|"No"| XC
    CH -->|"Yes"| FL["Fail ✗"]
    style OR fill:#a9cce3,stroke:#1565c0,color:#2e3440,stroke-width:3px
    style CU fill:#fadbd8,stroke:#c62828,color:#2e3440,stroke-width:3px
    style UP fill:#d4e6f1,stroke:#1565c0,color:#2e3440,stroke-width:3px

    style FL fill:#fadbd8,stroke:#c62828,color:#2e3440,stroke-width:3px
</pre>
]

**The oracle decides *where* to cut. The ellipsoid decides *how far* to shrink.** 🎯

### 💻 The Generic Algorithm (ellalgo-cpp)

```cpp
template <typename O, typename S>
    requires OracleFeas<O, typename S::ArrayType> && SearchSpace<S>
inline auto cutting_plane_feas(O& omega, S& space,
                               const Options& options = Options())
    -> std::tuple<CuttingPlaneArrayType<S>, size_t> {
    for (auto niter = 0U; niter != options.max_iters; ++niter) {
        const auto cut = omega.assess_feas(space.xc());  // 🎯 ask oracle
        if (!cut) return {space.xc(), niter};            // ✅ feasible
        const auto status = space.update_bias_cut(*cut); // 🔧 update
        if (status != CutStatus::Success
            || space.tsq() < options.tolerance)
            return {invalid_value<CuttingPlaneArrayType<S>>(), niter};
    }
    return {invalid_value<CuttingPlaneArrayType<S>>(), options.max_iters};
}
```

**One algorithm, many strategies.** The oracle is a *first-class concept* — constrained at compile time 🔒

### 🧩 Strategy via Template Parameters (ckpttn)

The partition manager is **parameterized by its strategy families**:

```cpp
template <typename Gnl, typename GainMgr, typename ConstrMgr>
class FMPartMgr : public PartMgrBase<Gnl, GainMgr, ConstrMgr> { ... };

// Swap strategies per algorithm — the same skeleton:
run_PartMgr<FMBiGainMgr<SimpleNetlist>, FMBiConstrMgr<SimpleNetlist>>(net);
run_PartMgr<FMKWayGainMgr<SimpleNetlist>, FMKWayConstrMgr<SimpleNetlist>>(net);
```

- `GainMgr` = move-selection strategy 🎯
- `ConstrMgr` = feasibility / balance strategy ⚖️

**Policy-based design:** the algorithm skeleton stays in the base; strategies are injected as template parameters 🧬

---

### 📏 Strategy with Virtual Dispatch (physdes)

```cpp
class DelayCalculator {                     // 🎯 Strategy interface
  public:
    virtual double calculate_wire_delay(int length,
                                        double load_capacitance) const = 0;
    virtual double calculate_wire_capacitance(int length) const = 0;
    virtual TappingResult calculate_tapping_point(...) const = 0;
};

class LinearDelayCalculator : public DelayCalculator { ... };  // 1️⃣
class ElmoreDelayCalculator : public DelayCalculator { ... };  // 2️⃣
```

Linear: $\text{Delay} = d_{\text{unit}} \cdot \text{length}$

Elmore: $\text{Delay} = R_{\text{wire}} \left( \dfrac{C_{\text{wire}}}{2} + C_{\text{load}} \right)$

`DMEAlgorithm` receives the strategy via `std::unique_ptr<DelayCalculator>` 🔌 — swappable at runtime

---

### ⚖️ Static vs Dynamic Strategy

.pull-left[

**Compile-time (policy / template)**

```cpp
template <class DelayCalc>
struct DMEHlpr {
    DelayCalc _c;
    void embed() {
        // ...
        _c.calc();
    }
};
struct LinearCalc { double calc(); };
struct ElmoreCalc { double calc(); };
```

✅ Zero overhead · ✅ Inlinable
❌ Fixed at compile time

]

.pull-right[

**Runtime (virtual interface)**

```cpp
class DelayCalc {
  public:
    virtual double calc() = 0;
};
struct LinearCalc : DelayCalc {
    double calc() override;
};
struct ElmoreCalc : DelayCalc {
    double calc() override;
};
```

✅ Swappable at runtime
❌ vtable indirection

]

**Rule of thumb:** `template` when the strategy is known at compile time; `virtual` when it must vary at runtime ⚖️

## 🏗️ Part 3: CRTP & Template Method

---

### 🔁 CRTP: FMGainMgr (ckpttn)

```cpp
template <typename Gnl, typename GainCalc, class Derived>
class FMGainMgr {
    Derived& self = *static_cast<Derived*>(this);  // 🔁 downcast!
    // ...shared FM gain/bucket logic in the base...
};

// The derived class passes ITSELF as a template argument:
class FMBiGainMgr
    : public FMGainMgr<Gnl, FMBiGainCalc<Gnl>, FMBiGainMgr> { ... };
```

**Why?** Static dispatch — no vtable, fully inlinable, `constexpr`-friendly — **while the base still provides shared logic** 🏗️

---

### 🔁 CRTP with Duality (projgeom)

```cpp
template <Ring _K, typename Self, typename DualType>
struct pg_object {
    using Dual = DualType;
    std::array<_K, 3> coord;

    // operator* (meet/join) returns the DUAL object type
    friend constexpr auto operator*(const Self& lhs, const Self& rhs)
        -> DualType {
        return DualType{::cross(lhs.coord, rhs.coord)};
    }
};

struct pg_point : pg_object<Z, pg_point, pg_line> { ... };
struct pg_line  : pg_object<Z, pg_line,  pg_point> { ... };
```

**Duality via CRTP:** the base knows the derived type *and its dual*, so operators can return the right type:

$$ a \times b = (a_y b_z - a_z b_y,\; a_z b_x - a_x b_z,\; a_x b_y - a_y b_x)^T $$

---

### 🦀 CRTP in Rust? — Traits + Associated Types

**No inheritance → no literal CRTP.** But `Self` + associated types replicate *everything* it gives you:

```rust
trait PgObject: Sized {
    type Dual: PgObject<Dual = Self>;   // ↔ DualType + Self template params
    fn coord(&self) -> [i64; 3];

    fn cross(&self, other: &Self) -> Self::Dual {   // returns the DUAL type
        Self::Dual::from_cross(self.coord(), other.coord())
    }
}

struct PgPoint([i64; 3]);
struct PgLine([i64; 3]);

impl PgObject for PgPoint {
    type Dual = PgLine;                 // ↔ pg_point : pg_object<Z, pg_point, pg_line>
    fn coord(&self) -> [i64; 3] { self.0 }
}
impl PgObject for PgLine {
    type Dual = PgPoint;
    fn coord(&self) -> [i64; 3] { self.0 }
}
```

---

| C++ CRTP | Rust |
|----------|------|
| `static_cast<Derived*>(this)` | `Self` — always statically known |
| Base provides shared logic | **Default trait methods** |
| `constexpr` methods | `const fn` in traits |
| Selective override | ⚠️ No stable specialization — override is all-or-nothing |

**Same zero-cost static dispatch, no vtable, monomorphized per concrete type** 🦀

---

### 🧬 Template Method: PartMgrBase (ckpttn)

**The algorithm skeleton lives in the base; derived classes fill in the steps:**

```cpp
// Base defines the FM iteration skeleton...
int PartMgrBase<Gnl, GainMgr, ConstrMgr>::_optimize_1pass(...) {
    // 1. init gains        → gain_mgr.init(part)
    // 2. loop: select move → gain_mgr.select_move(part, to_part)
    // 3. check constraints → validator(part, move, to_part)
    // 4. update gains      → gain_mgr.update_move(...)
    // 5. rollback if bad   → take_snapshot / restore_part
}

// Derived managers specialize the steps:
FMPartMgr   // Fiduccia-Mattheyses (bi / k-way)
MLPartMgr   // multi-level partitioning
NNPartMgr   // nearest-neighbor
```

**Template Method** = Strategy's inheritance-based cousin 🧬

### 🏗️ Builder: CSRGraph (digraphx-fast)

Separate **construction** from **representation**:

.pull-left[
.font-sm[
```cpp
class Builder {
  public:
    explicit Builder(size_t V) : _V(V), _adj(V) {}
    void add_edge(uint32_t u, uint32_t v, weight_t w = {}) {
        _adj[u].emplace_back(v, w);      // 📝 accumulate (O(1) append)
    }
    auto build() -> CSRGraph {           // 🏗️ compact to CSR
        CSRGraph g; g.num_nodes = _V;
        g.offsets.resize(_V + 1);
        // ...prefix-sum offsets, gather targets & weights...
        return g;
    }
};
```
]

### 📨 Command: thread_pool (xnetwork)

**Tasks as command objects** — decouple producer from executor:

.font-sm[
```cpp
class thread_pool {
    std::queue<std::function<void()>> tasks_;   // 📨 command queue
    // ...
  public:
    template <typename Fn>
    auto enqueue(Fn&& fn) -> std::future<...> {  // 📦 wrap as command
        auto task = std::make_shared<...>(std::forward<Fn>(fn));
        {
            std::lock_guard<std::mutex> lock(queue_mutex_);
            tasks_.emplace([task] { (*task)(); });
        }
        condition_.notify_one();
        return task->get_future();
    }
};
```

### 🏭 Factory Method: create_vdc (lds-cpp)

**Choose the implementation at runtime**, behind one interface:

```cpp
class HaltonN {
  public:
    // 🔧 static factory: small bases → compile-time, large → dynamic
    static auto create_vdc(unsigned long base)
        -> std::unique_ptr<VdCorputBase> {
        switch (base) {
            case 2:  return std::make_unique<VdCorputWrap<2>>();
            case 3:  return std::make_unique<VdCorputWrap<3>>();
            // ...
            default: return std::make_unique<VdCorputDynamic>(base);
        }
    }
};
```

Interface: `VdCorputBase { pop(); peek(); skip(n); reseed(s); get_index(); }`

**Bonus:** `fractions-simple` `Fraction<T>::from()` / `from_raw()` — a factory with inf/NaN semantics 🏭

### 🔍 Iterator: Decouple Traversal from Containers

**`GeneratorIterator<Generator, Value>` (lds)** — wraps sequence generators as STL iterators:

.font-sm[
```cpp
template <typename Generator, typename Value>
class GeneratorIterator {
    Generator* gen;               // 🔗 the "container" (stateful generator)
    unsigned long index;
  public:
    using iterator_category = std::input_iterator_tag;
    using value_type = Value;
    using difference_type = std::ptrdiff_t;

    auto operator*() const -> Value {   // 🔍 dereference = generate on demand
        auto temp_idx = gen->get_index();
        gen->reseed(index);
        auto value = gen->pop();
        gen->reseed(temp_idx);
        return value;
    }
    // ...operator++, operator==, operator!=...
};

// ✨ STL algorithms & range-for "just work":
VdCorput gen(2);
std::vector<double> points(gen.begin(), gen.begin() + 100);
```
]

**Why it matters in EDA:** uniform traversal over pins · nets · grid cells · timing paths — one iterator interface, many sources 🎯

## 🚫 Part 6: Absent Patterns

---

### ❌ Patterns NOT Used (and why)

| Pattern | Status | Why not? |
|---------|--------|----------|
| **Pimpl** | 🚫 absent | Header-only libraries — no ABI-hiding needed |
| **Null Object** | 🚫 absent | `std::optional` / sentinels preferred |
| **Chain of Responsibility** | 🚫 absent | Replaced by template pipelines |
| **Prototype** | ⚠️ implicit | Only `Space::copy()` in BSearchAdaptor |
| **Observer** | 🚫 absent | Logging via one `log_with_spdlog()` facade |
| **Singleton** | ⚠️ rare | One `Globals` in sphere-n; one thread_pool |

**Honesty slide:** knowing what a portfolio *doesn't* use tells you as much as what it does 🤓

---

### ⚖️ Design Decisions & Trade-offs

.pull-left[

**constexpr vs Thread-Safety** 🎲

| | lds-cpp | lds-gen-cpp |
|---|---|---|
| pop() | `constexpr` | runtime |
| count | plain | `std::atomic` |
| thread-safe | ❌ | ✅ |

A **deliberate fork**, documented in AGENTS.md 📄

]

.pull-right[

**Header-only vs Pimpl** 📦

- ✅ Zero build-order pain (CPM-friendly)
- ✅ Full inlining → speed
- ❌ No ABI boundary, longer compiles

**Why no Pimpl?** These libraries are *shipped as source* — the pattern's main benefit (ABI stability) is irrelevant here 🚫

**Rule:** choose the **cheapest abstraction** that still expresses the intent 🎯

**virtual vs template** 🎭
- virtual → runtime swaps (`DelayCalculator`)
- template → zero-cost, compile-time (oracles)
- CRTP → static dispatch + shared base logic

]


---

### 🔑 Key Takeaways

**1️⃣ Strategy/Policy is the house style** — oracles, `PartMgrBase<Gnl, GainMgr, ConstrMgr>`, `DelayCalculator` 🧩

**2️⃣ Templates over virtuals** — C++20 concepts (`OracleFeas`, `SearchSpace`) make strategies first-class 🏗️

**3️⃣ CRTP = free static polymorphism** — shared logic, no vtable: `FMGainMgr`, `pg_object` 🔁

**4️⃣ Structural patterns shine in data libraries** — CSR Builder, MidTree Composite, BSearchAdaptor 🔌

**5️⃣ Memento enables backtracking algorithms** — FM partitioning rollback 💾

**6️⃣ Know what you don't use** — no Pimpl / Null Object: *header-only + `std::optional`* is the philosophy 🚫

### 🧩 EDA Use Cases for Design Patterns (2/2)

.pull-left[

**Flyweight — Technology Cell Library** 🏭

Millions of **cell instances** share a few thousand **cell masters**:

- 🧬 **Intrinsic (shared) state** — geometry, timing arcs, power, pin layout (the *master*)
- 📍 **Extrinsic (per-instance) state** — location, orientation, net connections
- 💾 **Memory win** — masters stored once, instances reference them
- 🔁 AKA the **Master/Instance** pattern — the backbone of every place & route tool

**The takeaway:** this portfolio is a *living catalog* of EDA design patterns — the same patterns power industrial tools like OpenROAD, OpenSTA & yosys 🔧

]
