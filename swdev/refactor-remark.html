### 🎯 Why Refactor with Design Patterns?

.pull-left[

**Patterns give code a shape** 🧩

- 🏷️ **Shared vocabulary** — "this is a Factory Method" communicates intent in one word
- 🔍 **Spot duplication** — knowing the pattern reveals the *smell* that needs fixing
- 🧠 **AI-friendly** — "refactor as a Builder" beats "clean this up" every time
- 📖 **Self-documenting** — `_create_node` tells you how nodes come into existence

]

.pull-right[

**But patterns are not magic** ⚠️

- 🚫 **Don't force them** — a Visitor for a 30-line tree is over-engineering
- 🎯 **Match the idiom** — Rust's `..Default::default()` already *is* a builder
- ⚖️ **YAGNI** — refactor real duplication, not hypothetical futures
- ✅ **Verify behavior** — 12,000+ assertions must still pass after the rewrites

]

## 🏭 Part 1 — Factory Method (physdes)

---

### 🏭 The Smell: Node Creation Scattered Everywhere

In `GlobalRoutingTree`, **5 different methods** hand-rolled the same dance:

```cpp
// insert_steiner_node
std::string steiner_id = "steiner_" + std::to_string(this->next_steiner_id++);
this->_arena.emplace_back(steiner_id, NodeType::Steiner, point);
RoutingNode* node = &this->_arena.back();
this->nodes[steiner_id] = node;

// insert_terminal_node   → same, with "terminal_" prefix
// insert_node_on_branch  → if/else on enum to pick prefix
// _insert_terminal_impl  → both terminal AND steiner
// constructor            → hard-coded "source"
```

- 🔁 ID generation + counter + arena + map registration, repeated 5×
- 🐛 `insert_node_on_branch` had a latent bug: empty ID if given `NodeType::Source`

---

### 🏭 The Fix: One Factory Method

```cpp
// C++
RoutingNode<IntPoint>* GlobalRoutingTree<IntPoint>::_create_node(
    NodeType type, const IntPoint& pt) {
    std::string id;
    switch (type) {
        case NodeType::Steiner: id = "steiner_" + std::to_string(next_steiner_id++); break;
        case NodeType::Terminal: id = "terminal_" + std::to_string(next_terminal_id++); break;
        case NodeType::Source:   id = "source"; break;
    }
    _arena.emplace_back(id, type, pt);
    RoutingNode* node = &_arena.back();
    nodes[id] = node;
    return node;
}
```

All 5 call sites collapse to: `this->_create_node(NodeType::Steiner, point);` 🎯

---

### 🏭 Same Pattern, Three Idioms

.pull-left[

**C++** — private method, pointer return:

.font-sm[
```cpp
auto _create_node(NodeType type, const IntPoint& pt)
    -> RoutingNode<IntPoint>*;
```
]

**Rust** — private method, index return:

.font-sm[
```rust
fn _create_node(&mut self, node_type: NodeType, pt: Point) -> usize {
    let id = match node_type {
        NodeType::Steiner => { let s = format!("steiner_{}", self.next_steiner_id);
                               self.next_steiner_id += 1; s }
        NodeType::Terminal => { /* ... */ }
        NodeType::Source   => "source".to_string(),
    };
    self.add_node(RoutingNode::new(&id, node_type, pt))
}
```
]

]

.pull-right[

**Python** — method returning the node object:

.font-sm[
```python
def _create_node(self, node_type, pt):
    if node_type == NodeType.Steiner:
        node_id = f"steiner_{self.next_steiner_id}"
        self.next_steiner_id += 1
    elif node_type == NodeType.Terminal:
        node_id = f"terminal_{self.next_terminal_id}"
        self.next_terminal_id += 1
    else:  # Source
        node_id = "source"
    node = RoutingNode(node_id, node_type, pt)
    self.nodes[node_id] = node
    return node
```
]
**One factory, zero duplication, three languages.** 🌐

]

---

### 🏭 Subtle Behaviors We Had to Preserve

Python taught us the factory isn't a *mechanical* extraction:

- ⚠️ **`insert_terminal_node`** — the node must NOT be registered before
  `_find_nearest_node` runs, or it becomes its own nearest neighbor (distance 0)
  → reordered: *resolve parent first, then create*
- ⚠️ **`insert_node_on_branch`** — a test asserted it raises `ValueError` for
  `NodeType.Source` → kept the guard in front of the factory

**Lesson:** patterns remove duplication, not contracts. Tests are the safety net. 🧪

## 🧰 Part 2 — Builder Pattern (physdes)

---

### 🧰 The Smell: Telescoping Constructor

```python
# Python — 8 positional parameters with defaults
class ClockTreeVisualizer:
    def __init__(self, margin=50, node_radius=8, wire_width=2,
                 sink_color="#4CAF50", internal_color="#2196F3",
                 root_color="#F44336", wire_color="#666666",
                 text_color="#333333"):
        ...
```

- 🤯 Call sites like `ClockTreeVisualizer(60, 10, 3, "#2E7D32", ...)` — what is `60`?
- ➕ Adding a 9th option touches every call site
- 📖 Hard to read, hard to extend, hard to review

---

### 🧰 The Fix: Fluent Builder

.font-sm[
```python
# Python
viz = (ClockTreeVisualizer.builder()
       .margin(60)
       .node_radius(10)
       .wire_width(3)
       .sink_color("#2E7D32")
       .build())
```

```cpp
// C++ — same intent
auto viz = ClockTreeVisualizer::Builder()
               .margin(60)
               .node_radius(10)
               .wire_width(3)
               .build();
```

```rust
// Rust — same intent
let viz = ClockTreeVisualizer::builder()
    .margin(60)
    .node_radius(10)
    .wire_width(3)
    .build();
```
]

Self-documenting: each option is *named* at the call site. ✨

---

### 🧰 Language Idioms for the Builder

.pull-left[

**C++** — private ctor, nested Builder:

```cpp
class ClockTreeVisualizer {
  public:
    class Builder { /* setters + build() */ };
  private:
    friend class Builder;
    ClockTreeVisualizer(int margin, ...);  // private
};
```

Forces every customization through the Builder. 🔒

**Python** — builder is a *classmethod*:

```python
@classmethod
def builder(cls):
    return ClockTreeVisualizerBuilder()
```

]

.pull-right[

**Rust** — the *honest* note 🦀:

Rust already had the idiomatic answer:

```rust
let viz = ClockTreeVisualizer {
    margin: 40,
    node_radius: 6,
    ..Default::default()   // struct-update syntax
};
```

We added a real `ClockTreeVisualizerBuilder` anyway for **parity with the siblings** — but Rust's native ergonomics make it optional.

**Lesson:** sometimes the pattern is *already the language*. 🎯

]

---

### 🧰 Tests Guard the Builder

Every language got builder tests:

```
✅ Builder Configuration      — custom values reach the output
✅ Builder Defaults Match     — builder().build() == default ctor
✅ Builder Is Fluent          — setters return self/builder
```

Plus a **doctest** in the Python class docstring (runs under pytest):

```
>>> viz = ClockTreeVisualizerBuilder().margin(10).node_radius(5).build()
>>> viz.margin
10
```

**Patterns without tests are just opinions.** 🧪

## 🏗️ Part 3 — Template Method (physdes)

---

### 🏗️ The Smell: Three Near-Identical Decomposers

`rpolygon_cut` splits a rectilinear polygon into convex pieces —
**three variants** (convex / explicit / implicit) shared ~80% of their code:

```
base cases ──► find concave point ──► min-dist scan ──► re-wire ──► recurse ──► merge
     │                │                    │             │            │
     │           ✓ differs              ✓ differs      ✓ differs    ✓ differs
     │          (3 variants)           (2 variants)   (2 variants) (2 variants)
     │
     └── convex had a 3-node base case; explicit/implicit didn't
```

Only the *hooks* differed — the **skeleton was identical**. 🕸️

---

### 🏗️ The Fix: Extract the Skeleton, Inject the Hooks

.pull-left[

**Before — 3× ~80-line recursive functions**:

.font-sm[
```
rpolygon_cut_convex_recur    295 duplicated lines
rpolygon_cut_explicit_recur
rpolygon_cut_implicit_recur
```
]

]

.pull-right[

**After — one skeleton + policy hooks**:

.font-sm[
```
rpolygon_cut_recur_impl   ← Template Method
  ├── ConvexCutPolicy     ← find_concave_point + triangle base case
  ├── ExplicitCutPolicy   ← find_concave_point only
  └── ImplicitCutPolicy   ← different scan + rewiring + target
```
]

]

**Net −82 lines** in the C++ file. 📉

**Python version** — same idea, function-parameter style:

```python
def rpolygon_cut_recur(v1, lst, is_anticlockwise, rdll,
                       find_concave_point, has_triangle_base_case):
    # ... shared skeleton ...
    vcurr = find_concave_point(v1, ...)   # ← hook

def rpolygon_cut_convex_recur(...):
    return rpolygon_cut_recur(..., _find_convex_concave_point, True)

def rpolygon_cut_explicit_recur(...):
    return rpolygon_cut_recur(..., _find_explicit_concave_point, False)
```

---

---

### 🏗️ Behavioral Equivalence — the Hard Part

The C++ refactor looked trivial but had **four hidden contracts**:

| Difference | How preserved |
|------------|---------------|
| 🔺 Convex's 3-node triangle base case | `has_triangle_base_case = true` flag |
| 🎯 Implicit recurses on `v_min`, not `vcurr` | `first_target` hook |
| 📏 Implicit scans from a corner point | `find_min_dist_point` hook |
| 🔁 Implicit's different list rewiring | `insert_cut` hook |

**Result:** all **701 assertions** still passed with zero behavioral drift. ✅

### 🧮 Template Method — State / Computation Separation

Every generator fused two concerns into `pop()`:

- 🧮 **the computation** — "what is the value at index *n*?"
- 🔢 **the state** — "how far have I advanced?"

```
pop()  → count += 1;  compute(count)
peek() →            compute(count + 1)      ← same loop, duplicated

after:   pop()  = value_at(++count)
         peek() = value_at(count + 1)       ← consistent BY CONSTRUCTION
```

Because `value_at` is pure, the components inside composites become
stateless calculators. ✅

### 🧮 C++ — Template Method via CRTP

.font-sm[
```cpp
// lds-gen-cpp — the protocol lives once in the base
template <typename Derived, typename Value>
class GeneratorBase {
  public:
    auto pop() -> Value {
        auto n = count_.fetch_add(1, std::memory_order_relaxed) + 1;
        return derived().value_at(n);                  // ← hook
    }
    auto peek() -> Value {
        return derived().value_at(count_.load(std::memory_order_relaxed) + 1);
    }
    // skip / reseed / get_index …
  protected:
    std::atomic<unsigned long> count_{0};   // state lives here
  private:
    auto derived() -> Derived& { return static_cast<Derived&>(*this); }
};

class Halton : public GeneratorIterable<Halton, std::array<double, 2>> {
    VdCorput vdc0, vdc1;
  public:
    auto value_at(unsigned long n) const -> std::array<double, 2> {
        return {vdc0.value_at(n), vdc1.value_at(n)};   // ← the ONLY thing left
    }
};
```
]

`lds-cpp` uses a plain `unsigned long` (constexpr priority); `lds-gen-cpp` uses
`std::atomic` (thread-safe priority). Same skeleton. 🧱

---

### 🦀 Rust — a Trait with Default Methods

.font-sm[
```rust
// lds-rs — the Generator trait (Template Method)
pub trait Generator {
    type Value;
    fn counter(&self) -> &AtomicU64;
    fn value_at(&self, n: u64) -> Self::Value;      // ← hook

    fn pop(&mut self) -> Self::Value {
        let n = self.counter().fetch_add(1, Ordering::Relaxed) + 1;
        self.value_at(n)
    }
    fn peek(&self) -> Self::Value {
        self.value_at(self.counter().load(Ordering::Relaxed) + 1)
    }
    // advance / get_index / reseed defaults …
}
```
]

A `macro_rules!` keeps the protocol methods **inherent**, so the public API
is unchanged (no trait import needed to call `pop()`):

.font-sm[
```rust
impl_generator_protocol!(Halton, [f64; 2]);   // pop/peek/advance/… + Iterator
```
]

> ⚠️ Rust trait methods are *not* automatically inherent — that is why the
> macro exists. Public API preservation drives the design. 🦀

---

### 🐍 Python — a Generic Base Class

```python
# lds-gen — GeneratorBase[T] (Template Method)
class GeneratorBase(Generic[T]):
    def pop(self) -> T:
        with self._count_lock:
            self._count += 1
            return self.value_at(self._count)      # ← hook

    def value_at(self, n: int) -> T:
        raise NotImplementedError

    # __iter__ / __next__ / pop_batch / iter_batch …

class Halton(GeneratorBase[List[float]]):
    def value_at(self, n: int) -> List[float]:
        return [self.vdc0.value_at(n), self.vdc1.value_at(n)]
```

- `T` is the value type — `float`, `List[float]`, `int`, …
- All 7 classes shed ~25 lines of identical boilerplate each 📉

### 🔢 Shared Digit Core — One Loop, Four Languages

The radical inverse is the heart of every generator:

$$
\phi_b(n) = \sum_{k=0}^{m} d_k \, b^{-k-1}
$$

Every `VdCorput::pop()` *and* `peek()` inlined the same base-`b` digit loop.
Extract it once:

.font-sm[
```cpp
template <typename T, typename Table>
constexpr auto vdc_digit_sum(unsigned long n, unsigned long base,
                             const Table& weights) -> T {
    T reslt{};
    std::size_t idx = 0;
    while (n != 0) {
        const auto remainder = n % base;
        n /= base;
        reslt += static_cast<T>(remainder) * weights[idx++];
    }
    return reslt;
}
```
]

- 🦀 **Rust** — generic over `f64`/`u64` via a small `DigitValue` trait
  (`f64` has no `From<u64>` — lossy)
- 🐍 **Python** — the existing `vdc()` (float) plus a brand-new public `vdc_i()` (int)

Three implementations of the same loop became **one**. 🔁 → 1️⃣

---

### 📜 The Formal Contract — Contract as Code

Each language now *enforces* the protocol at compile time:

```cpp
// C++20 — the concept (lds-cpp / lds-gen-cpp)
template <typename G, typename V>
concept SequenceGenerator = requires(G g, unsigned long n) {
    { g.pop() } -> std::convertible_to<V>;
    { g.peek() } -> std::convertible_to<V>;
    g.skip(n);
    g.reseed(n);
    { g.get_index() } -> std::convertible_to<unsigned long>;
};

static_assert(SequenceGenerator<VdCorput, double>);   // compile-time check
```

- 🦀 **Rust** — the `Generator` trait *is* the contract
- 🐍 **Python** — `GeneratorBase[Generic[T]]` + type hints
- ⚙️ **lds-gen-cpp** — the same concept also holds for the runtime
  `VdCorputBase` / `HaltonN` — both families interchangeable

### 🛡️ Thread Safety & Where the Counter Lives

The same pattern is *language-shaped*:

.mermaid[
<pre>
graph TD
    subgraph CPP["🧱 C++ — counter lives in the base"]
        B1["GeneratorBase\ncount_ member · inherited by all"]
    end
    subgraph RS["🦀 Rust — traits can't hold data"]
        R1["count: AtomicU64\nfield per struct"]
        R2["counter() accessor hook"]
    end
    B1 --> SAME["1 atomic per generator\nsame semantics"]
    R1 --> SAME
    style CPP fill:#c8e6c9,stroke:#2e7d32,color:#2e3440,stroke-width:3px
    style RS fill:#e3f2fd,stroke:#1565c0,color:#2e3440,stroke-width:3px
    style SAME fill:#ffe0b2,stroke:#e65100,color:#2e3440,stroke-width:3px
</pre>
]

Centralizing the counter made composite `pop()` **atomic as a point**:
`Halton.pop() = value_at(++count)` — ONE atomic claim, always a valid point. ✅

- 🐍 **lds-gen** — every generator now lock-guarded → **all thread-safe**
- 🧱 **lds-cpp** — plain `unsigned long` on purpose: `constexpr` beats
  thread-safety there (a documented design trade-off)

### 🛡️ Do the LDS Dependents Break?

We audited every consumer before touching a header:

| Dependent | Consumes | Impact |
|-----------|----------|--------|
| 🍵 **ginger-cpp** | `lds-cpp` (CPM v1.2.5) | Uses only `VdCorput::pop()` (constexpr) + `TWO_PI` → **safe, recompile only** |
| 🧱 **physdes-cpp** | `lds-gen-cpp` (not lds-cpp!) | **Unaffected** — no transitive dependency |
| 🔮 **sphere-n-cpp** | `lds-gen-cpp` | **Unaffected** |

Only **one** of the three "dependents" actually depends on lds-cpp.
**Know your dependency graph before you refactor.** 🗺️

## 🎯 Part 6 — Lessons Learned

---

### 🎯 What Refactoring *Really* Means

.pull-left[

**Do refactor:** ✅

- 🏭 Real duplication (5× node creation)
- 🧰 Telescoping constructors
- 🏗️ ~80% identical algorithm skeletons
- 📚 When siblings share the same patterns

**Don't force it:** 🚫

- 🦀 Rust's struct-update syntax already *is* a builder
- 🧩 A Visitor framework for a 30-line internal tree
- 🗿 Splitting a cohesive 500-line value type
- 🔮 Hypothetical future needs (YAGNI)

]

.pull-right[

**Process that made it safe:** 🛡️

1. 🔍 **Map the smells** — explore agents + code review
2. 🎯 **Name the target pattern** before touching code
3. 🧪 **Baseline tests** before any edit
4. 🔒 **Preserve contracts** — hidden ordering, error guards
5. ✅ **Re-run every gate** — build, lint, format, doc, test
6. 🧱 **Atomic commits** — one pattern per commit

]

---

### 🎯 Key Takeaways

- 🧩 **Design patterns are refactoring targets** — recognize the smell, name the pattern, apply it
- 🌐 **Polyglot refactoring** keeps sibling projects structurally consistent, making cross-language maintenance easier
- 🦀 **Match the idiom** — the same pattern looks different in C++, Rust, and Python
- 🧪 **Tests are the safety net** — 12,000+ assertions across the repos never blinked
- 🤖 **AI amplification** — telling an agent "apply the Builder pattern" yields far better output than "clean this up"
- 📉 **Less code, same behavior** — hundreds of duplicated lines removed, zero behavioral drift
