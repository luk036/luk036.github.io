## 🏗️ Part 1 — Template Method: the Howard skeleton

---

### 📊 The Smell: Two Finders, Six Copy-Pasted Methods

`NegCycleFinder` (predecessor only) and `NegCycleFinderQ` (pred **and** succ + `update_ok` gate) share almost everything:

```
find_cycle      — DFS cycle detection in the point-to map
relax / relax_pred — Bellman-Ford one-pass relaxation
cycle_list      — reconstruct a cycle from the point-to map
is_negative     — triangle-inequality check
howard / howard_pred / howard_succ — the policy-iteration loop
```

- 💣 `relax` vs `relax_pred` differ by **one line** — the `update_ok(dist[v], distance)` gate
- 💣 `cycle_list` / `is_negative` are **byte-for-byte identical**
- 📉 Same skeleton in 3 languages → the smell triples

---

### 🏗️ The Fix: one Template-Method skeleton

The loop is the same everywhere — only the *relaxation* and the *negativity check* vary:

```
while not found and relax(dist, get_weight):
    for vtx in find_cycle(digraph, point_to):
        assert is_negative(vtx, dist, get_weight)   # optional
        yield cycle_list(vtx, point_to)
```

.mermaid[
<pre>
graph TD
    H["🔄 Howard skeleton\nrelax → find_cycle → check → yield"] --> R1["🚶 relax_pred\nBellman-Ford fwd"]
    H --> R2["🏃 relax_succ\nreverse"]
    H --> C["✅ is_negative\noptional check"]
    style H fill:#e8eaf6,stroke:#283593,color:#2e3440,stroke-width:3px
    style R1 fill:#c8e6c9,stroke:#2e7d32,color:#2e3440,stroke-width:3px

</pre>
]

- 🎯 Extract the loop once, inject the relax strategy and the check hook
- ✅ Public methods keep their exact signatures — they become thin wrappers

### 🧮 C++: `digraph_detail.hpp`

The shared internals live in one header (the Adapter + Template-Method layer), mirroring the sibling libraries:

          typename PointTo, typename UpdateOk>
auto relax_pred(const DiGraph& digraph, Mapping& dist, GetWeight&& get_weight,
                PointTo& pred, UpdateOk&& update_ok) -> bool { /* … */ }

// howard_search — Template Method skeleton
template <typename DiGraph, typename Mapping, typename GetWeight,
          typename PointTo, typename Relax, typename Check>
auto howard_search(const DiGraph& digraph, Mapping& dist, GetWeight get_weight,
                   PointTo& point_to, Relax relax, Check check)
    -> py::Generator<typename graph_traits<DiGraph>::Cycle> { /* … */ }

---

### 🧮 C++: the finders become thin wrappers

```cpp
template <typename Mapping, typename Callable>
auto howard(Mapping& dist, Callable get_weight) -> py::Generator<Cycle> {
    auto relax = [this](Mapping& d, auto& gw) {
        return digraph_detail::relax_pred(this->_digraph, d, gw, this->_pred,
                                          [](const auto&, const auto&) { return true; });
    };
    auto check = [this](const auto& vtx, const auto& d, auto& gw) {
        assert(digraph_detail::is_negative(vtx, d, gw, this->_pred));
    };
    return digraph_detail::howard_search(this->_digraph, dist, std::move(get_weight),
                                         this->_pred, std::move(relax), std::move(check));
}
```

- `NegCycleFinder` 313 → 130 lines; `NegCycleFinderQ` 270 → 130 lines
- 📉 The 3 duplicated `howard*` loops + `_find_cycle` / `_cycle_list` / `_relax*` are gone

### 🦀 Rust: shared cores + `Gen` skeleton

Rust needs explicit lifetimes and a `Generator` (genawaiter). The cores live in `lib.rs`:

```rust
pub(crate) fn relax_pred_core<G, F, U>(
    graph: &G,
    dist: &mut HashMap<G::Node, G::Weight>,
    get_weight: &F,
    update_ok: &U,                       // generic — monomorphized per call site
    pred: &mut HashMap<G::Node, (G::Node, G::Weight)>,
) -> bool { /* … */ }

#[allow(clippy::type_complexity)]
pub(crate) fn howard_search<'b, G, F, R, C>(
    graph: &'b G, dist: &'b mut HashMap<G::Node, G::Weight>,
    get_weight: F,
    point_to: &'b mut HashMap<G::Node, (G::Node, G::Weight)>,
    relax: R, check: C,                  // the gate is baked INTO relax
) -> Gen<Vec<G::Weight>, (), Pin<Box<dyn Future<Output = ()> + 'b>>> { /* … */ }
```

- 🎯 The 3 duplicate `Gen::new(Box::pin(async …))` loops collapse to **one** skeleton
- ✅ Borrow-safe: the point-to map is passed as a parameter, not captured

---

### 🦀 Rust: why the gate is baked into `relax`

An earlier draft passed `update_ok` through the skeleton as a **trait object** — a `&dyn Fn` called **once per edge** in the relaxation hot loop:

```rust
// ✗ first draft — erased gate, virtual call per edge
R: Fn(&mut dist, &F, &dyn Fn(&W, &W) -> bool, &mut point_to) -> bool
```

That traded one virtual call per relaxed edge for the dedup — measurable on large graphs. **Reverted**: the gate now lives *inside* the `relax` closure, so `relax_pred_core` stays generic (`U`) and the call is statically dispatched:

```rust
let graph = self.graph;               // Copy — capture the ref, not `self`
let relax = move |d: &mut dist, w: &F, p: &mut point_to| {
    crate::relax_pred_core(graph, d, w, &update_ok, p)   // U = concrete closure type
};
crate::howard_search(self.graph, dist, get_weight, &mut self.pred, relax, check)
```

- ✅ Same skeleton, same public API — but the per-edge gate call is monomorphized again
- 💡 Lesson: keep the *hot-loop* strategy generic; erase types only outside the per-element path

### 🐍 Python: `_cycle_base.py`

No templates, no lifetimes — module-level functions serve as the shared cores:

.font-sm[
```python
def relax_pred(digraph, dist, get_weight, update_ok, pred) -> bool:
    changed = False
    for utx, neighbors in digraph.items():
        for vtx, edge in neighbors.items():
            distance = dist[utx] + get_weight(edge)
            if dist[vtx] > distance and update_ok(dist[vtx], distance):
                dist[vtx] = distance
                pred[vtx] = (utx, edge)
                changed = True
    return changed

def howard_search(digraph, dist, get_weight, update_ok,
                  point_to, direction, verify=True):
    point_to.clear()
    found = False
    relax = relax_pred if direction == "pred" else relax_succ
    while not found and relax(digraph, dist, get_weight, update_ok, point_to):
        for vtx in find_cycle(digraph, point_to):
            if verify:
                assert is_negative(point_to, vtx, dist, get_weight)
            found = True
            yield cycle_list(point_to, vtx)
```
]

- 📉 `neg_cycle.py` 325 → 222 lines; `neg_cycle_q.py` 406 → 328 lines

## 🏃 Part 2 — Strategy: relaxation &amp; parametric loops

---

### 🏃 Relaxation as Strategy

The `update_ok` gate and the **direction** (pred vs succ) are the *varying parts* — extracted as strategies:

.font-sm[
| Variant | Relaxation | Gate |
|---------|-----------|------|
| `NegCycleFinder.relax` | pred | always `True` |
| `NegCycleFinderQ.relax_pred` | pred | user `update_ok(old, new)` |
| `NegCycleFinderQ.relax_succ` | succ | user `update_ok(old, new)` |
]

```python
# Python — unconstrained relax = constrained relax with the shared always-true gate
# (module-level constant, NOT a fresh lambda per call — same rationale as the Rust revert)
def _always_true(old, new):
    return True

def relax(self, dist, get_weight):
    return _relax_pred(self.digraph, dist, get_weight, _always_true, self.pred)
```

- 🎯 One implementation of the relaxation math, three behaviors
- ✅ Same shape in C++ (`relax_pred` + lambda) and Rust (generic `U` gate, statically dispatched)

---

### 🎯 Parametric loop: one skeleton

`MaxParametricSolver.run` and `MinParametricSolver.run` are the **same loop** — only the comparison direction and the direction alternation differ:

```
get_weight  = λ e : DomainType(omega.distance(ratio, e))
ratio_best  = ratio ; cycle_best = [] ; reverse = True
while True:
    cycles = ncf.howard* (dist, get_weight[, update_ok])
    for c_i in cycles:
        r_i = omega.zero_cancel(c_i)
        if better(ratio_best, r_i):  ratio_best, cycle_best = r_i, c_i
    if not improved(ratio_best): break
    ratio, cycle, reverse = ratio_best, cycle_best, not reverse
return ratio, cycle
```

- 🎯 Extract into `_parametric_base._run_loop(minimize, alternate_direction, pick_one_only)`
- ✅ `MaxParametricSolver` → `minimize=True`; `MinParametricSolver` → `minimize=False, alternate_direction=True`
- 📉 `parametric.py` −37, `min_parametric_q.py` −57 lines

---

### 🎯 Python: `MinParametricAPI` was a duplicate

The two abstract interfaces were **textually identical** — two copies of `distance()` / `zero_cancel()`:

```python
class ParametricAPI(Generic[Node, Arc, Ratio]):        # parametric.py
    @abstractmethod
    def distance(self, ratio, edge) -> Ratio: ...
    @abstractmethod
    def zero_cancel(self, cycle) -> Ratio: ...

class MinParametricAPI(ParametricAPI[Node, Arc, Ratio]):  # min_parametric_q.py — was a copy
    ...  # now inherits instead of re-declaring
```

- ✅ One interface, one source of truth — subclasses plug in as Strategies
- 🔒 Class name and module path unchanged → public API intact

### 🏭 Callback adapters: free functions → class solvers

The C++/Rust free functions (`max_parametric`, `min_parametric`) used to **re-implement the loop**. Now they build a callback adapter and delegate:

```cpp
// digraph_detail.hpp — Strategy adapter
template <typename Ratio, typename Edge, typename Cycle, typename Domain,
          typename Fn1, typename Fn2>
class CallbackParametricAPI {
    Fn1 _distance; Fn2 _zero_cancel;
public:
    auto distance(Ratio& r, const Edge& e) const -> Domain {
        return static_cast<Domain>(_distance(r, e));
    }
    auto zero_cancel(const Cycle& c) const { return _zero_cancel(c); }
};

// parametric.hpp — the free function is now a 3-line Facade
template <typename DiGraph, typename T, typename Fn1, typename Fn2, typename Mapping, typename D>
auto max_parametric(const DiGraph& digraph, T& r_opt, Fn1 distance, Fn2 zero_cancel,
                    Mapping& dist, D domain) {
    digraph_detail::CallbackParametricAPI<…> omega{…};
    auto solver = MaxParametricSolver<DiGraph, decltype(omega)>(digraph, omega);
    return solver.run(r_opt, dist, domain);
}
```

### 🐍 netoptim: formalize the oracle contract

The edge-oracle was an informal `oracle: Any` with a latent bug — `Ratio` had no `update()`:

```python
# _typing.py — the Strategy contract, now explicit
class EdgeOracle(Protocol):
    def eval(self, edge: Any, x: Any) -> Any: ...
    def grad(self, edge: Any, x: Any) -> Any: ...
    def update(self, t: Any) -> None: ...

# optscaling_oracle.py — Ratio now satisfies the Protocol
def update(self, t: Any) -> None:
    """No-op hook: matrix scaling has no best-so-far parameter."""
    pass
```

- ✅ `Cut` alias consolidated into `_typing.py` (was defined in both modules + tests)
- 🔒 `NetworkOracle.update()` no longer risks an `AttributeError` on an `OptScalingOracle`

## 📚 Lessons Learned

---

### 📚 Lessons Learned

**Patterns that carried across languages** 🧩

- 🎯 **Template Method** — the Howard loop: one skeleton, injected relax + check
- 🏃 **Strategy** — `update_ok` gate, pred/succ direction, minimize flag
- 🏭 **Adapter** — `graph_traits` / `_get_key` / `_get_val` / `flow_value`
- 🏭 **Facade** — free functions + callback adapters → class solvers
- 🗂️ **Dedup** — `Paths`/`DijkstraResult`, `GraphJSON`, duplicate tests

**Language idioms matter** 🗺
- Rust: `&dyn Fn` gates, `Gen` + lifetime-heavy signatures, type-inference fixes
- Python: module-level cores, closures as strategies, Protocol for the oracle
- C++: templated cores + `py::Generator` coroutine skeleton

---

**What actually helped** 💡

- 🔒 **"Keep the public API unchanged"** — forces honest refactors; external consumer (`netoptim`) proves it
- 🧪 **Run the consumer's suite** — not just your own
- 🏗 **Baseline before, gate after** — every repo green at every step
- 📦 **Release the dependency chain in order** — py2cpp must exist before xnetwork can pin it
- 🛠 **Know your network** — SSH rewrite for CPM when HTTPS is blocked
- ⚡ **Keep the hot loop statically dispatched** — a `&dyn Fn` gate was reverted; the strategy is generic, the *per-edge call* is not erased (Python: module-level gate constant, not a per-call lambda)

**The takeaway** 🎯
- Find the *one* thing that varies (direction, gate, comparison, storage)
- Extract it into a skeleton + injected strategy
- Keep every public signature byte-for-byte compatible
